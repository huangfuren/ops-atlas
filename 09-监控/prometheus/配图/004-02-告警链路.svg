<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>告警链路：谁判断，谁发送</title>
  <desc>上半为 Prometheus 进程（蓝色），规则求值后进入 pending，持续满足 for 之后变为 firing（琥珀色）。下半为 Alertmanager 进程（紫色），其内部依次完成去重、分组、抑制与静默、路由，之后投递到接收端（青色）。</desc>

  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A458"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C8ACB"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6BAF95"/>
    </marker>
    <marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A7BAE"/>
    </marker>
  </defs>

  <rect width="680" height="310" fill="#FFFFFF"/>
  <text x="40" y="28" font-size="13" font-weight="500" fill="#2B2A27">告警链路：谁判断，谁发送</text>
  <text x="150" y="52" font-size="9.5" font-weight="500" fill="#1F4468">Prometheus：只判断要不要发</text>

  <g stroke-width="1">
    <rect x="40" y="64" width="120" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
    <rect x="186" y="64" width="110" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <rect x="322" y="64" width="110" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
  </g>
  <g font-size="11" font-weight="500" text-anchor="middle">
    <text x="100" y="83" fill="#1F4468">规则求值</text>
    <text x="241" y="83" fill="#7A4A12">pending</text>
    <text x="377" y="83" fill="#7A4A12">firing</text>
  </g>
  <g fill="#5A6570" font-size="8.5" text-anchor="middle">
    <text x="100" y="99">每 evaluation_interval</text>
    <text x="241" y="99">持续满足 for</text>
    <text x="377" y="99">推送到 AM</text>
  </g>

  <g stroke="#D9A458" stroke-width="1" marker-end="url(#m1)">
    <line x1="160" y1="86" x2="184" y2="86"/>
    <line x1="296" y1="86" x2="320" y2="86"/>
  </g>

  <path d="M432,86 L480,86 L480,124 L95,124 L95,162" fill="none" stroke="#9C8ACB" stroke-width="1" marker-end="url(#m2)"/>
  <text x="300" y="140" font-size="9" font-weight="500" fill="#46337A" text-anchor="middle">POST /api/v2/alerts</text>

  <text x="150" y="158" font-size="9.5" font-weight="500" fill="#46337A">Alertmanager：决定发给谁、发几次</text>

  <!-- Alertmanager 是一个进程，下面四步都在它内部 -->
  <rect x="40" y="168" width="520" height="76" rx="3" fill="#F3F0FB" stroke="#B7A8DC" stroke-width="1"/>
  <text x="52" y="184" font-size="10.5" font-weight="500" fill="#46337A">Alertmanager 进程</text>

  <g stroke-width="0.9" fill="#FFFFFF" stroke="#C7BAE4">
    <rect x="52" y="194" width="106" height="42" rx="2"/>
    <rect x="182" y="194" width="106" height="42" rx="2"/>
    <rect x="312" y="194" width="106" height="42" rx="2"/>
    <rect x="442" y="194" width="106" height="42" rx="2"/>
  </g>
  <g font-size="10.5" font-weight="500" fill="#2B2A27" text-anchor="middle">
    <text x="105" y="211">去重</text>
    <text x="235" y="211">分组</text>
    <text x="365" y="211">抑制 / 静默</text>
    <text x="495" y="211">路由</text>
  </g>
  <g fill="#6B5C8E" font-size="8" text-anchor="middle">
    <text x="105" y="225">多副本只留一份</text>
    <text x="235" y="225">同组并成一条</text>
    <text x="365" y="225">压掉连带告警</text>
    <text x="495" y="225">按 label 匹配</text>
  </g>

  <g stroke="#8A7BAE" stroke-width="1" marker-end="url(#m4)">
    <line x1="158" y1="215" x2="180" y2="215"/>
    <line x1="288" y1="215" x2="310" y2="215"/>
    <line x1="418" y1="215" x2="440" y2="215"/>
  </g>
  <line x1="560" y1="215" x2="574" y2="215" stroke="#6BAF95" stroke-width="1" marker-end="url(#m3)"/>

  <rect x="576" y="194" width="72" height="42" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="612" y="211" font-size="10.5" font-weight="500" fill="#173D30" text-anchor="middle">接收端</text>
  <text x="612" y="225" font-size="7" fill="#3F6B5C" text-anchor="middle">webhook / 邮件</text>

  <rect x="40" y="252" width="600" height="44" rx="3" fill="#F4F2EC" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="56" y="271" font-size="9.5" fill="#4A4945">分组逻辑不要写进规则。规则里的 for 与 AM 的 group_wait 会串联，最坏情况首条通知被推迟 for + group_wait。</text>
  <text x="56" y="287" font-size="9.5" fill="#4A4945">去重压的是「同一告警被多个副本各推一遍」，抑制压的是「根因响了就连带项一起静音」——两者不同层，别混用。</text>
</svg>
