<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>四种指标类型的形态差异</title>
  <desc>Counter 单调递增，Gauge 上下起伏，Histogram 是分桶累计计数，Summary 是客户端算好的若干分位线。四者用四种颜色区分，颜色在其余各图中保持一致。</desc>

  <rect width="680" height="340" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="13" font-weight="500" fill="#2B2A27">四种指标类型：长什么样，决定怎么查</text>

  <!-- Counter -->
  <rect x="40" y="50" width="290" height="118" rx="3" fill="#F7FCFA" stroke="#6BAF95" stroke-width="1"/>
  <text x="56" y="72" font-size="11.5" font-weight="500" fill="#173D30">Counter 计数器</text>
  <text x="56" y="88" font-size="9" fill="#4F7264">只增不减，归零即进程重启；用 rate() 看斜率</text>
  <path d="M56,142 L104,142 L104,134 L152,134 L152,122 L200,122 L200,112 L248,112 L248,102 L314,102"
        fill="none" stroke="#3F7F66" stroke-width="1.6"/>
  <line x1="56" y1="152" x2="314" y2="152" stroke="#CFE8DE" stroke-width="1"/>

  <!-- Gauge -->
  <rect x="350" y="50" width="290" height="118" rx="3" fill="#F6FAFD" stroke="#7FA6D0" stroke-width="1"/>
  <text x="366" y="72" font-size="11.5" font-weight="500" fill="#1F4468">Gauge 瞬时值</text>
  <text x="366" y="88" font-size="9" fill="#5A7590">可增可减；直接取值或 avg_over_time()</text>
  <path d="M366,132 L400,114 L430,130 L460,106 L492,124 L524,110 L560,126 L600,114 L624,120"
        fill="none" stroke="#5285B4" stroke-width="1.6"/>
  <line x1="366" y1="152" x2="624" y2="152" stroke="#D3E0F0" stroke-width="1"/>

  <!-- Histogram -->
  <rect x="40" y="184" width="290" height="122" rx="3" fill="#FAF8FD" stroke="#9C8ACB" stroke-width="1"/>
  <text x="56" y="206" font-size="11.5" font-weight="500" fill="#46337A">Histogram 直方图</text>
  <text x="56" y="222" font-size="9" fill="#6B5C8E">累计计数，带 le 标签；柱高是该桶的累计值</text>
  <g fill="#E4DBF4" stroke="#9C8ACB" stroke-width="0.9">
    <rect x="60" y="268" width="34" height="12"/>
    <rect x="110" y="260" width="34" height="20"/>
    <rect x="160" y="252" width="34" height="28"/>
    <rect x="210" y="244" width="34" height="36"/>
    <rect x="260" y="236" width="34" height="44"/>
  </g>
  <line x1="56" y1="280" x2="314" y2="280" stroke="#D8CEEE" stroke-width="1"/>
  <g font-size="8" fill="#8A8880" text-anchor="middle">
    <text x="77" y="294">0.1</text>
    <text x="127" y="294">0.5</text>
    <text x="177" y="294">1</text>
    <text x="227" y="294">5</text>
    <text x="277" y="294">+Inf</text>
  </g>

  <!-- Summary -->
  <rect x="350" y="184" width="290" height="122" rx="3" fill="#FEFBF4" stroke="#D9A458" stroke-width="1"/>
  <text x="366" y="206" font-size="11.5" font-weight="500" fill="#7A4A12">Summary 摘要</text>
  <text x="366" y="222" font-size="9" fill="#8A6B3C">分位在客户端算好；多实例求和无意义</text>
  <g stroke="#C08A3E" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M400,244 L424,232 L448,250 L472,236 L496,254 L520,238 L544,248 L568,230 L592,246 L624,236"/>
    <path d="M400,258 L424,250 L448,262 L472,252 L496,264 L520,254 L544,262 L568,248 L592,260 L624,252" stroke-opacity="0.72"/>
    <path d="M400,272 L424,268 L448,274 L472,266 L496,276 L520,270 L544,278 L568,266 L592,274 L624,270" stroke-opacity="0.5"/>
  </g>
  <g font-size="8.5" fill="#8A6B3C" text-anchor="end">
    <text x="394" y="245">p99</text>
    <text x="394" y="259">p90</text>
    <text x="394" y="273">p50</text>
  </g>

  <text x="40" y="328" font-size="9" fill="#9A9791">图仅示意形态差异，纵轴不代表同一量纲。选型不确定时优先 Histogram：它是唯一能跨实例合并后再算分位的类型。</text>
</svg>
