<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" height="372" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>一条告警从触达到收到通知的时间轴</title>
  <desc>上行是 Prometheus 的规则状态：0 秒首次求值为真进入 pending，60 秒满足 for，因规则 interval 为 15 秒，实际转 firing 落在 60~75 秒之间。下行是 Alertmanager 的通知投递：firing 之后才启动 group_wait 30 秒，因此收到通知最快 90 秒、最坏 105 秒。底部说明恢复方向的时间语义：告警立即消失，但 resolved 通知受 group_interval 约束。</desc>

  <rect width="680" height="372" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="13" font-weight="500" fill="#2B2A27">一条告警从触达到收到通知的时间轴</text>
  <text x="640" y="30" font-size="9" fill="#8C8980" text-anchor="end">口径：for 1m · group_wait 30s · 规则 interval 15s</text>

  <!-- 行标题 -->
  <text x="24" y="106" font-size="10.5" font-weight="500" fill="#2B2A27">Prometheus</text>
  <text x="24" y="121" font-size="9" fill="#8C8980">规则状态</text>
  <text x="24" y="168" font-size="10.5" font-weight="500" fill="#2B2A27">Alertmanager</text>
  <text x="24" y="183" font-size="9" fill="#8C8980">通知投递</text>

  <!-- 上行：pending -->
  <rect x="104" y="88" width="225.8" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="0.8"/>
  <text x="112" y="107" font-size="11.5" font-weight="500" fill="#7A4A12">pending</text>
  <text x="112" y="123" font-size="9.5" fill="#7A4A12">首次为真即进入，未满 for 不发通知</text>

  <!-- 上行：for 判定抖动区 -->
  <rect x="329.8" y="88" width="56.4" height="44" rx="3" fill="#FEF8EE" stroke="#D9A458" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="358" y="110" font-size="10" font-weight="500" fill="#7A4A12" text-anchor="middle">±15s</text>
  <text x="358" y="124" font-size="9" fill="#A9803F" text-anchor="middle">抖动</text>

  <!-- 上行：firing -->
  <rect x="386.2" y="88" width="225.8" height="44" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="0.8"/>
  <text x="393" y="107" font-size="11.5" font-weight="500" fill="#8C3A32">firing</text>
  <text x="393" y="123" font-size="9.5" fill="#8C3A32">转为 firing，同时 POST 给 Alertmanager</text>

  <!-- 下行：空档 -->
  <text x="112" y="172" font-size="9.5" fill="#A9A69C">通知链路尚未启动：Alertmanager 还没收到任何告警</text>

  <!-- 下行：group_wait -->
  <rect x="386.2" y="150" width="112.9" height="44" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="0.8"/>
  <text x="392" y="169" font-size="10.5" font-weight="500" fill="#46337A">group_wait 30s</text>
  <text x="392" y="185" font-size="9.5" fill="#46337A">凑齐同组再发出</text>

  <!-- 下行：投递点 -->
  <circle cx="499.1" cy="172" r="5" fill="#9C8ACB"/>
  <text x="509" y="168" font-size="10" font-weight="500" fill="#46337A">收到 POST</text>
  <text x="509" y="182" font-size="9.5" fill="#8C8980">演练成功</text>

  <!-- 连接线 -->
  <line x1="386.2" y1="132" x2="386.2" y2="150" stroke="#C9C4B6" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- 时间轴 -->
  <line x1="104" y1="210" x2="612" y2="210" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="612" y="204" font-size="9" fill="#8C8980" text-anchor="end">秒</text>

  <line x1="104" y1="206" x2="104" y2="214" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="104" y="228" font-size="9" fill="#8C8980" text-anchor="middle">0</text>

  <line x1="216.9" y1="206" x2="216.9" y2="214" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="216.9" y="228" font-size="9" fill="#8C8980" text-anchor="middle">30</text>

  <line x1="329.8" y1="206" x2="329.8" y2="214" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="329.8" y="228" font-size="9" fill="#8C8980" text-anchor="middle">60</text>

  <line x1="386.2" y1="206" x2="386.2" y2="214" stroke="#D9A458" stroke-width="0.8"/>
  <text x="386.2" y="228" font-size="9" fill="#A9803F" text-anchor="middle">75</text>

  <line x1="499.1" y1="204" x2="499.1" y2="216" stroke="#9C8ACB" stroke-width="1"/>
  <text x="499.1" y="228" font-size="9" font-weight="500" fill="#46337A" text-anchor="middle">105</text>

  <line x1="555.6" y1="206" x2="555.6" y2="214" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="555.6" y="228" font-size="9" fill="#8C8980" text-anchor="middle">120</text>

  <!-- 说明 -->
  <text x="40" y="254" font-size="9.5" fill="#6B6A65">最快 90s（60 + 30），最坏 105s（75 + 30）。那 15s 的差来自规则 interval：</text>
  <text x="40" y="270" font-size="9.5" fill="#6B6A65">for: 1m 保证的是「满 1 分钟后第一次求值才转 firing」，不是精确 60 秒；interval 越粗，抖动越大。</text>

  <line x1="40" y1="288" x2="640" y2="288" stroke="#DCD9CE" stroke-width="0.8"/>

  <!-- 恢复方向 -->
  <rect x="24" y="300" width="632" height="60" rx="4" fill="#F4F2EC" stroke="#E2DED1" stroke-width="0.8"/>
  <text x="36" y="318" font-size="10" font-weight="500" fill="#2B2A27">恢复方向（时间另起，与前段无累加关系）</text>
  <text x="36" y="336" font-size="9.5" fill="#6B6A65">告警消失：规则变假后的下一轮求值，在 Status → Alerts 里立即不再显示。</text>
  <text x="36" y="352" font-size="9.5" fill="#6B6A65">恢复通知：受 group_interval 约束，演练 30s 后到、生产常见 5m —— 这就是「故障已恢复但群里消息还挂着」的原因。</text>
</svg>
