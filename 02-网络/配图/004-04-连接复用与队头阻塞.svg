<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440">
  <title>连接复用、队头阻塞与版本演进</title>
  <desc>上半部分对比短连接与长连接的建连次数，下半部分用三条泳道对比 HTTP/1.1 串行、HTTP/2 多路复用与 HTTP/3 独立流在丢包时的表现，底部为四个版本的演进。</desc>
  <rect width="680" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="ar4h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B6A65"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C08A3E" stroke-width="1.2"/>
    </pattern>
  </defs>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="40" y="28" font-size="13" font-weight="600" fill="#2C2C2A">连接复用与队头阻塞：为什么要升级版本</text>
    <text x="640" y="28" font-size="9" fill="#8A8880" text-anchor="end">4.5</text>

    <text x="40" y="58" font-size="10.5" font-weight="600" fill="#2C2C2A">同样的三个请求，建连次数不同</text>
    <text x="640" y="58" font-size="8.5" fill="#8A8880" text-anchor="end">HTTP/1.0 默认短连接，HTTP/1.1 默认长连接</text>

    <text x="40" y="105" font-size="9.5" font-weight="600" fill="#4A4945">短连接</text>
    <g stroke-width="0.8">
      <rect x="108" y="86" width="62" height="32" fill="#FAEEDA" stroke="#C08A3E"/>
      <rect x="170" y="86" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="284" y="86" width="62" height="32" fill="#FAEEDA" stroke="#C08A3E"/>
      <rect x="346" y="86" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="460" y="86" width="62" height="32" fill="#FAEEDA" stroke="#C08A3E"/>
      <rect x="522" y="86" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
    </g>
    <g font-size="7.5" fill="#7A4A12" text-anchor="middle">
      <text x="139" y="105">建连</text>
      <text x="315" y="105">建连</text>
      <text x="491" y="105">建连</text>
    </g>
    <g font-size="8" fill="#14584A" text-anchor="middle">
      <text x="227" y="105">请求 1</text>
      <text x="403" y="105">请求 2</text>
      <text x="579" y="105">请求 3</text>
    </g>

    <text x="40" y="153" font-size="9.5" font-weight="600" fill="#4A4945">长连接</text>
    <g stroke-width="0.8">
      <rect x="108" y="134" width="62" height="32" fill="#FAEEDA" stroke="#C08A3E"/>
      <rect x="170" y="134" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="284" y="134" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="398" y="134" width="114" height="32" fill="#E1F5EE" stroke="#9CCDBC"/>
    </g>
    <text x="139" y="153" font-size="7.5" fill="#7A4A12" text-anchor="middle">建连</text>
    <g font-size="8" fill="#14584A" text-anchor="middle">
      <text x="227" y="153">请求 1</text>
      <text x="341" y="153">请求 2</text>
      <text x="455" y="153">请求 3</text>
    </g>
    <rect x="516" y="134" width="120" height="32" rx="3" fill="none" stroke="#C08A3E" stroke-width="0.8" stroke-dasharray="4 3"/>
    <text x="576" y="153" font-size="8" fill="#7A4A12" text-anchor="middle">省下 2 次建连</text>

    <text x="40" y="204" font-size="10.5" font-weight="600" fill="#2C2C2A">队头阻塞：一条连接上的三个请求</text>
    <text x="640" y="204" font-size="8.5" fill="#8A8880" text-anchor="end">横轴＝时间</text>

    <text x="40" y="234" font-size="9.5" font-weight="600" fill="#4A4945">HTTP/1.1 串行</text>
    <rect x="40" y="244" width="190" height="32" rx="2" fill="#F8F6F1" stroke="#C9C6BC" stroke-width="0.8"/>
    <rect x="40" y="244" width="100" height="32" fill="#FAEEDA" stroke="#C08A3E" stroke-width="0.8"/>
    <rect x="140" y="244" width="45" height="32" fill="#E1F5EE" stroke="#9CCDBC" stroke-width="0.8"/>
    <rect x="185" y="244" width="45" height="32" fill="#E1F5EE" stroke="#9CCDBC" stroke-width="0.8"/>
    <text x="90" y="264" font-size="7.5" fill="#7A4A12" text-anchor="middle">请求 1（慢）</text>
    <text x="162" y="264" font-size="7.5" fill="#14584A" text-anchor="middle">2</text>
    <text x="207" y="264" font-size="7.5" fill="#14584A" text-anchor="middle">3</text>
    <text x="40" y="296" font-size="8.5" fill="#6B6A65">请求 1 慢，后面的全部排队</text>

    <text x="250" y="234" font-size="9.5" font-weight="600" fill="#4A4945">HTTP/2 多路复用</text>
    <rect x="250" y="244" width="190" height="50" rx="2" fill="none" stroke="#C9C6BC" stroke-width="0.8"/>
    <g stroke-width="0.8">
      <rect x="252" y="246" width="108" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="360" y="246" width="45" height="14" fill="url(#hatch)" stroke="#C08A3E"/>
      <rect x="405" y="246" width="33" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="252" y="262" width="108" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="360" y="262" width="45" height="14" fill="url(#hatch)" stroke="#C08A3E"/>
      <rect x="405" y="262" width="33" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="252" y="278" width="108" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="360" y="278" width="45" height="14" fill="url(#hatch)" stroke="#C08A3E"/>
      <rect x="405" y="278" width="33" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
    </g>
    <text x="250" y="308" font-size="8.5" fill="#6B6A65">应用层不再排队；但 TCP 丢一个包，</text>
    <text x="250" y="321" font-size="8.5" fill="#6B6A65">三条流一起停（斜纹），重传后才继续</text>

    <text x="460" y="234" font-size="9.5" font-weight="600" fill="#4A4945">HTTP/3（QUIC）</text>
    <rect x="460" y="244" width="190" height="50" rx="2" fill="none" stroke="#C9C6BC" stroke-width="0.8"/>
    <g stroke-width="0.8">
      <rect x="462" y="246" width="186" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="462" y="262" width="78" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="540" y="262" width="30" height="14" fill="url(#hatch)" stroke="#C08A3E"/>
      <rect x="570" y="262" width="78" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
      <rect x="462" y="278" width="150" height="14" fill="#E1F5EE" stroke="#9CCDBC"/>
    </g>
    <text x="460" y="308" font-size="8.5" fill="#6B6A65">流之间独立，丢包只影响那一条流</text>
    <text x="460" y="321" font-size="8.5" fill="#6B6A65">（前提：防火墙放行 UDP 443）</text>

    <text x="40" y="352" font-size="9" fill="#8A8880">版本演进</text>
    <g stroke-width="0.8">
      <rect x="40" y="358" width="140" height="42" rx="3" fill="#F8F6F1" stroke="#C9C6BC"/>
      <rect x="190" y="358" width="140" height="42" rx="3" fill="#F8F6F1" stroke="#C9C6BC"/>
      <rect x="340" y="358" width="140" height="42" rx="3" fill="#F8F6F1" stroke="#C9C6BC"/>
      <rect x="490" y="358" width="140" height="42" rx="3" fill="#E1F5EE" stroke="#9CCDBC"/>
    </g>
    <g font-size="10.5" font-weight="600" fill="#2C2C2A">
      <text x="52" y="376">1.0</text>
      <text x="202" y="376">1.1</text>
      <text x="352" y="376">2</text>
      <text x="502" y="376">3</text>
    </g>
    <g font-size="8" fill="#6B6A65">
      <text x="52" y="391">每个请求一条连接</text>
      <text x="202" y="391">长连接；管道化很少启用</text>
      <text x="352" y="391">多路复用、头部压缩</text>
      <text x="502" y="391">QUIC，流独立，需 UDP 443</text>
    </g>

    <text x="40" y="426" font-size="9.5" fill="#6B6A65">1.1 解决不了应用层队头阻塞；2 解决了应用层，却把问题推给了 TCP；3 才真正把流拆开。</text>
  </g>
</svg>
