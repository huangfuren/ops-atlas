<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 350" width="680" height="350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img">
<title>跨网段：帧头逐跳重写，IP 头端到端不变</title>
<desc>A 主机 192.168.1.10 访问 10.1.1.20 时经过网关。每一跳帧头的源与目的 MAC 都会改写，而 IP 头的源与目的地址全程保持不变。</desc>
<rect width="680" height="350" fill="#FFFFFF"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="40" width="150" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="115" y="58" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">A 主机 192.168.1.10</text>
<line x1="190" y1="58" x2="257" y2="58" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="265" y="40" width="150" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="58" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">网关 192.168.1.1</text>
<line x1="415" y1="58" x2="482" y2="58" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="490" y="40" width="150" height="36" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="565" y="58" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B 主机 10.1.1.20</text>

<line x1="40" y1="96" x2="640" y2="96" stroke="#D3D1C7" stroke-width="0.5"/>

<text x="52" y="120" font-size="11" fill="#888780">字段</text>
<text x="322" y="120" font-size="11" fill="#888780" text-anchor="middle">第一跳：A → 网关</text>
<text x="535" y="120" font-size="11" fill="#888780" text-anchor="middle">第二跳：网关 → B</text>

<rect x="40" y="132" width="174" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="52" y="149" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">帧 · 目的 MAC</text>
<text x="52" y="164" font-size="11" fill="#854F0B" dominant-baseline="central">逐跳重写</text>
<rect x="220" y="132" width="204" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="322" y="151" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">网关的 MAC</text>
<rect x="430" y="132" width="210" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="535" y="151" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">B 的 MAC</text>

<rect x="40" y="176" width="174" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="52" y="193" font-size="12" font-weight="500" fill="#412402" dominant-baseline="central">帧 · 源 MAC</text>
<text x="52" y="208" font-size="11" fill="#854F0B" dominant-baseline="central">逐跳重写</text>
<rect x="220" y="176" width="204" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="322" y="195" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">A 的 MAC</text>
<rect x="430" y="176" width="210" height="38" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="535" y="195" font-size="11" fill="#412402" text-anchor="middle" dominant-baseline="central">网关的 MAC</text>

<rect x="40" y="220" width="174" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52" y="237" font-size="12" font-weight="500" fill="#04342C" dominant-baseline="central">IP · 目的 IP</text>
<text x="52" y="252" font-size="11" fill="#0F6E56" dominant-baseline="central">全程不变</text>
<rect x="220" y="220" width="204" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="322" y="239" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">10.1.1.20</text>
<rect x="430" y="220" width="210" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="239" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">10.1.1.20</text>

<rect x="40" y="264" width="174" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52" y="281" font-size="12" font-weight="500" fill="#04342C" dominant-baseline="central">IP · 源 IP</text>
<text x="52" y="296" font-size="11" fill="#0F6E56" dominant-baseline="central">全程不变</text>
<rect x="220" y="264" width="204" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="322" y="283" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">192.168.1.10</text>
<rect x="430" y="264" width="210" height="38" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="283" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">192.168.1.10</text>

<text x="40" y="330" font-size="11" fill="#888780">MAC 只描述当前一段链路，每过一跳重写；IP 描述起点到终点，全程不变</text>
</svg>
