<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" width="680" height="404" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>systemd 作为 PID 1 的组织方式与 target 的四层降级关系</title>
  <desc>上半部分说明 systemd 怎么工作：内核最后 exec 的 /sbin/init 就是 systemd，它因此永远是 PID 1；它按 unit 的依赖关系并行拉起服务。unit 有六种后缀，最常用的是 service、socket、target。下半部分是 target 的四层降级：graphical 依赖 multi-user，而 rescue、emergency 是从 normal 降下去时 isolate 的独立目标，越往里被拉起的服务越少。graphical 与 multi-user 是正常态，rescue 与 emergency 是降级态，后者才是救命的入口。嵌套只表示服务集合收窄，不表示 target 定义上的依赖包含。</desc>

  <rect width="680" height="404" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">systemd：PID 1 按依赖把系统拉起来</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">target 就是一组 unit</text>

  <defs>
    <marker id="arrBlue3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- ============ 上半：内核到 unit ============ -->
  <rect x="40" y="52" width="150" height="42" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="52" y="70" font-size="9.5" font-weight="600" fill="#1D5A45">内核 vmlinuz</text>
  <text x="52" y="85" font-size="8" fill="#1D5A45">最后一步 exec /sbin/init</text>

  <line x1="192" y1="73" x2="216" y2="73" stroke="#6BAF95" stroke-width="1.2" marker-end="url(#arrBlue3)"/>

  <rect x="220" y="52" width="172" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="232" y="70" font-size="10.5" font-weight="600" fill="#1F4468">systemd　PID 1</text>
  <text x="232" y="85" font-size="8" fill="#1F4468">永远是 1 号，因为内核直接 exec 它</text>

  <rect x="404" y="52" width="244" height="42" rx="3" fill="#FAF9F5" stroke="#E8E6DE" stroke-width="1"/>
  <text x="416" y="68" font-size="8.4" fill="#4A4945">收养孤儿、转发信号、全退才关机</text>
  <text x="416" y="82" font-size="8.4" fill="#4A4945">所以它杀不掉，也不该杀</text>

  <!-- 总线 -->
  <line x1="86" y1="104" x2="591" y2="104" stroke="#7FA6D0" stroke-width="1"/>
  <line x1="306" y1="94" x2="306" y2="104" stroke="#7FA6D0" stroke-width="1"/>

  <!-- 六个 unit 框 -->
  <line x1="86" y1="104" x2="86" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="40" y="112" width="91" height="38" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="85.5" y="128" font-size="8.8" font-weight="600" fill="#1F4468" text-anchor="middle">.service</text>
  <text x="85.5" y="142" font-size="7.8" fill="#4A4945" text-anchor="middle">一条守护进程</text>

  <line x1="187" y1="104" x2="187" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="141" y="112" width="91" height="38" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="186.5" y="128" font-size="8.8" font-weight="600" fill="#1F4468" text-anchor="middle">.socket</text>
  <text x="186.5" y="142" font-size="7.8" fill="#4A4945" text-anchor="middle">按需唤醒</text>

  <line x1="288" y1="104" x2="288" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="242" y="112" width="91" height="38" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="287.5" y="128" font-size="8.8" font-weight="600" fill="#46337A" text-anchor="middle">.target</text>
  <text x="287.5" y="142" font-size="7.8" fill="#46337A" text-anchor="middle">一组 unit</text>

  <line x1="389" y1="104" x2="389" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="343" y="112" width="91" height="38" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="388.5" y="128" font-size="8.8" font-weight="600" fill="#1F4468" text-anchor="middle">.timer</text>
  <text x="388.5" y="142" font-size="7.8" fill="#4A4945" text-anchor="middle">cron 的替代</text>

  <line x1="490" y1="104" x2="490" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="444" y="112" width="91" height="38" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="489.5" y="128" font-size="8.8" font-weight="600" fill="#1F4468" text-anchor="middle">.mount</text>
  <text x="489.5" y="142" font-size="7.8" fill="#4A4945" text-anchor="middle">挂载点</text>

  <line x1="591" y1="104" x2="591" y2="112" stroke="#7FA6D0" stroke-width="0.8"/>
  <rect x="545" y="112" width="91" height="38" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="590.5" y="128" font-size="8.8" font-weight="600" fill="#1F4468" text-anchor="middle">.path</text>
  <text x="590.5" y="142" font-size="7.8" fill="#4A4945" text-anchor="middle">监视文件变化</text>

  <!-- ============ 下半：target 嵌套 ============ -->
  <text x="40" y="172" font-size="10.5" font-weight="600" fill="#2B2A27">target 四层降级：越往里，被拉起的服务越少</text>

  <rect x="40" y="184" width="600" height="156" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="52" y="200" font-size="9" font-weight="600" fill="#1F4468">graphical.target</text>
  <text x="158" y="200" font-size="8.6" fill="#4A4945">旧级别 5 · 图形界面，服务器一般不用</text>

  <rect x="64" y="210" width="552" height="120" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="76" y="226" font-size="9" font-weight="600" fill="#1F4468">multi-user.target</text>
  <text x="190" y="226" font-size="8.6" fill="#1F4468">旧级别 3 · 服务器默认目标</text>

  <rect x="88" y="236" width="528" height="84" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="100" y="252" font-size="9" font-weight="600" fill="#7A4A12">rescue.target</text>
  <text x="186" y="252" font-size="8.6" fill="#7A4A12">旧级别 1 / s · 挂全部文件系统，起基本服务</text>

  <rect x="112" y="262" width="504" height="48" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="124" y="278" font-size="9" font-weight="600" fill="#7A322B">emergency.target</text>
  <text x="228" y="278" font-size="8.6" fill="#7A322B">只挂根分区且只读</text>
  <text x="124" y="294" font-size="8.4" fill="#7A322B">几乎不起任何服务，连日志都可能不落盘 —— 最后一道门</text>

  <text x="32" y="360" font-size="9" fill="#8C8980">systemctl isolate xxx 立刻切过去，会停掉不在这条链上的服务；set-default 只改下次开机。</text>
  <text x="32" y="374" font-size="9" fill="#8C8980">真正救命的是后两层：rescue 挂全盘能改配置，emergency 只读但最不容易继续崩。</text>
  <text x="32" y="392" font-size="8.6" fill="#7A322B">注意：嵌套只表示「服务集合收窄」，不是依赖包含 —— rescue / emergency 与 multi-user 是并列的，isolate 过去会停掉后者的服务。</text>
</svg>
