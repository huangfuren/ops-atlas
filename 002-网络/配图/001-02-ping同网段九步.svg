<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 520" width="680" height="520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img">
<title>ping 同网段的九步交互</title>
<desc>A 主机 192.168.1.10 与 B 主机 192.168.1.20 处于同一网段，经交换机完成构造报文、查路由、ARP 解析、封装帧、查表转发与应答的九个步骤。</desc>
<rect width="680" height="520" fill="#FFFFFF"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="120" y1="64" x2="120" y2="500" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="340" y1="64" x2="340" y2="500" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>
<line x1="560" y1="64" x2="560" y2="500" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 4"/>

<rect x="40" y="20" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="38" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">A 主机</text>
<text x="120" y="55" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">192.168.1.10 · aa:aa</text>

<rect x="260" y="20" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="38" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">交换机</text>
<text x="340" y="55" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">P3 入 · 查表转发</text>

<rect x="480" y="20" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="560" y="38" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">B 主机</text>
<text x="560" y="55" font-size="11" fill="#085041" text-anchor="middle" dominant-baseline="central">192.168.1.20 · bb:bb</text>

<line x1="120" y1="100" x2="130" y2="100" stroke="#888780" stroke-width="0.5"/>
<rect x="130" y="87" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="100" font-size="11" fill="#444441" dominant-baseline="central">① 构造 ICMP 请求，Type=8</text>

<line x1="120" y1="142" x2="130" y2="142" stroke="#888780" stroke-width="0.5"/>
<rect x="130" y="129" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="142" font-size="11" fill="#444441" dominant-baseline="central">② 封装 IP 头，TTL=64</text>

<line x1="120" y1="184" x2="130" y2="184" stroke="#888780" stroke-width="0.5"/>
<rect x="130" y="171" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="184" font-size="11" fill="#444441" dominant-baseline="central">③ 查路由：本网段直连</text>

<text x="340" y="223" font-size="11" fill="#444441" text-anchor="middle">④ ARP 广播：Who has 192.168.1.20?</text>
<line x1="120" y1="232" x2="552" y2="232" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="340" y="269" font-size="11" fill="#444441" text-anchor="middle">⑤ 单播应答：192.168.1.20 is at bb:bb</text>
<line x1="560" y1="278" x2="128" y2="278" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>

<line x1="120" y1="322" x2="130" y2="322" stroke="#888780" stroke-width="0.5"/>
<rect x="130" y="309" width="200" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="140" y="322" font-size="11" fill="#444441" dominant-baseline="central">⑥ 封以太网帧，目的 MAC=bb:bb</text>

<text x="340" y="359" font-size="11" fill="#444441" text-anchor="middle">⑦ 请求帧经交换机转发</text>
<line x1="120" y1="368" x2="552" y2="368" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="348" y="378" width="180" height="26" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="356" y="391" font-size="11" fill="#412402" dominant-baseline="central">查 MAC 表：bb:bb → P5</text>

<line x1="552" y1="420" x2="560" y2="420" stroke="#888780" stroke-width="0.5"/>
<rect x="360" y="407" width="192" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="368" y="420" font-size="11" fill="#444441" dominant-baseline="central">⑧ 解包，回 Type=0</text>

<text x="340" y="457" font-size="11" fill="#444441" text-anchor="middle">⑨ 收到 Reply，算 RTT</text>
<line x1="560" y1="466" x2="128" y2="466" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>

<text x="40" y="512" font-size="11" fill="#888780">虚线为时间轴，自上而下；绿色箭头为跨设备报文，灰框为设备本地动作</text>
</svg>
