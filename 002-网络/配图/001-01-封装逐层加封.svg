<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 350" width="680" height="350" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" role="img">
<title>封装：每往下一层，加一个信封</title>
<desc>从应用层到链路层逐层添加头部：TCP 头 20 字节、IP 头 20 字节、以太网帧头 14 字节与帧尾 FCS 4 字节。各段宽度按字节数等比绘制。</desc>
<rect width="680" height="350" fill="#FFFFFF"/>

<text x="40" y="58" font-size="13" font-weight="500" fill="#444441">应用层</text>
<text x="40" y="75" font-size="11" fill="#888780">原始数据</text>
<rect x="170" y="62" width="150" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="245" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">HTTP 数据</text>

<text x="40" y="126" font-size="13" font-weight="500" fill="#444441">传输层</text>
<text x="40" y="143" font-size="11" fill="#0F6E56">加 TCP 头 20B</text>
<rect x="170" y="130" width="100" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="148" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">TCP 头 20B</text>
<rect x="270" y="130" width="150" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="345" y="148" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">HTTP 数据</text>

<text x="40" y="194" font-size="13" font-weight="500" fill="#444441">网络层</text>
<text x="40" y="211" font-size="11" fill="#0F6E56">加 IP 头 20B</text>
<rect x="170" y="198" width="100" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="216" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">IP 头 20B</text>
<rect x="270" y="198" width="100" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="320" y="216" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TCP 头 20B</text>
<rect x="370" y="198" width="150" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="445" y="216" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">HTTP 数据</text>

<text x="40" y="262" font-size="13" font-weight="500" fill="#444441">链路层</text>
<text x="40" y="279" font-size="11" fill="#0F6E56">加帧头 14B + FCS 4B</text>
<rect x="170" y="266" width="70" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="205" y="284" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">帧头 14B</text>
<rect x="240" y="266" width="100" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="290" y="284" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">IP 头 20B</text>
<rect x="340" y="266" width="100" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="390" y="284" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TCP 头 20B</text>
<rect x="440" y="266" width="134" height="36" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="507" y="284" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">HTTP 数据</text>
<rect x="574" y="266" width="36" height="36" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="592" y="284" font-size="11" fill="#04342C" text-anchor="middle" dominant-baseline="central">FCS</text>

<text x="40" y="328" font-size="11" fill="#888780">宽度按字节数等比绘制（1B ≈ 5px），HTTP 数据长度仅示意</text>
<rect x="470" y="318" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="488" y="328" font-size="11" fill="#5F5E5A">本层新增</text>
<rect x="560" y="318" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="578" y="328" font-size="11" fill="#5F5E5A">已有内容</text>
</svg>
