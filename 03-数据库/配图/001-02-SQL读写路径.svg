<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 840" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1460" height="840" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#1b5e20">一条 SQL 的完整路径：读与写</text>
  <text x="40" y="72" font-size="12" fill="#616161">来源：《001 MySQL 架构与基础》§1.2 一条 SQL 的完整路径 · 右列写路径即 §1.5.4 的两阶段提交</text>
  <text x="40" y="92" font-size="11.5" fill="#78909c">读法：左列是读请求自上而下的 7 个环节；右列把第 6 步展开，写请求在每个环节落一种日志，右侧标签标明该步骤属于哪一层。</text>

  <!-- 左列：读路径 -->
  <text x="40" y="124" font-size="13" font-weight="bold" fill="#0d47a1">① 读路径：一条 SELECT 经过的 7 个环节</text>

  <rect x="40" y="138" width="660" height="72" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="70" cy="174" r="13" fill="#1565c0"/>
  <text x="70" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="94" y="168" font-size="13" font-weight="bold" fill="#0d2f5c">连接层</text>
  <text x="94" y="190" font-size="10.5" fill="#37474f">TCP 握手 → 认证（用户名 / 密码 / host）→ 分配线程</text>
  <rect x="604" y="148" width="76" height="22" rx="11" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="642" y="163" font-size="9.5" fill="#0d47a1" text-anchor="middle">连接层</text>

  <line x1="70" y1="211" x2="70" y2="227" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="230" width="660" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="70" cy="266" r="13" fill="#2e7d32"/>
  <text x="70" y="271" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="94" y="260" font-size="13" font-weight="bold" fill="#123314">解析器</text>
  <text x="94" y="282" font-size="10.5" fill="#37474f">词法分析拆出关键字、表名、列名；语法分析生成语法树</text>
  <rect x="604" y="240" width="76" height="22" rx="11" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="642" y="255" font-size="9.5" fill="#1b5e20" text-anchor="middle">Server 层</text>

  <line x1="70" y1="303" x2="70" y2="319" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="322" width="660" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="70" cy="358" r="13" fill="#2e7d32"/>
  <text x="70" y="363" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="94" y="352" font-size="13" font-weight="bold" fill="#123314">预处理器</text>
  <text x="94" y="374" font-size="10.5" fill="#37474f">校验表与列是否存在，把 * 展开为具体字段，再校验权限</text>
  <rect x="604" y="332" width="76" height="22" rx="11" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="642" y="347" font-size="9.5" fill="#1b5e20" text-anchor="middle">Server 层</text>

  <line x1="70" y1="395" x2="70" y2="411" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="414" width="660" height="72" rx="8" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <circle cx="70" cy="450" r="13" fill="#1b5e20"/>
  <text x="70" y="455" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="94" y="444" font-size="13" font-weight="bold" fill="#123314">优化器 ★</text>
  <text x="94" y="466" font-size="10.5" fill="#1b3d1e">决定用哪个索引、JOIN 顺序、是否改写；产出执行计划，即 EXPLAIN 看到的东西</text>
  <rect x="604" y="424" width="76" height="22" rx="11" fill="#ffffff" stroke="#1b5e20" stroke-width="1"/>
  <text x="642" y="439" font-size="9.5" fill="#1b5e20" text-anchor="middle">Server 层</text>

  <line x1="70" y1="487" x2="70" y2="503" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="506" width="660" height="72" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="70" cy="542" r="13" fill="#2e7d32"/>
  <text x="70" y="547" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="94" y="536" font-size="13" font-weight="bold" fill="#123314">执行器</text>
  <text x="94" y="558" font-size="10.5" fill="#37474f">按执行计划调用存储引擎接口（Handler API），逐行取记录</text>
  <rect x="604" y="516" width="76" height="22" rx="11" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="642" y="531" font-size="9.5" fill="#1b5e20" text-anchor="middle">Server 层</text>

  <line x1="70" y1="579" x2="70" y2="595" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="598" width="660" height="72" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="70" cy="634" r="13" fill="#5e35b1"/>
  <text x="70" y="639" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="94" y="628" font-size="13" font-weight="bold" fill="#311b92">InnoDB（存储引擎）</text>
  <text x="94" y="650" font-size="10.5" fill="#37474f">查缓冲池 → 未命中则从磁盘读 16KB 页 → 页内 B+ 树定位到行</text>
  <rect x="604" y="608" width="76" height="22" rx="11" fill="#ffffff" stroke="#5e35b1" stroke-width="1"/>
  <text x="642" y="623" font-size="9.5" fill="#311b92" text-anchor="middle">引擎层</text>

  <line x1="70" y1="671" x2="70" y2="687" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="690" width="660" height="72" rx="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <circle cx="70" cy="726" r="13" fill="#9e9e9e"/>
  <text x="70" y="731" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
  <text x="94" y="720" font-size="13" font-weight="bold" fill="#424242">返回结果集</text>
  <text x="94" y="742" font-size="10.5" fill="#37474f">逐行发送给客户端；此后连接释放或归还连接池</text>
  <rect x="604" y="700" width="76" height="22" rx="11" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="642" y="715" font-size="9.5" fill="#616161" text-anchor="middle">Server 层</text>

  <!-- 右列：写路径 -->
  <text x="760" y="124" font-size="13" font-weight="bold" fill="#5e35b1">② 写路径：第 6 步展开，一次提交落三种日志</text>

  <rect x="760" y="138" width="660" height="76" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="790" cy="176" r="13" fill="#5e35b1"/>
  <text x="790" y="181" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="814" y="170" font-size="13" font-weight="bold" fill="#311b92">改缓冲池中的数据页</text>
  <text x="814" y="193" font-size="10.5" fill="#37474f">在内存里改，页变成脏页；此刻磁盘上还是旧值</text>
  <rect x="1324" y="150" width="76" height="22" rx="11" fill="#ffffff" stroke="#5e35b1" stroke-width="1"/>
  <text x="1362" y="165" font-size="9.5" fill="#311b92" text-anchor="middle">InnoDB</text>

  <line x1="790" y1="215" x2="790" y2="231" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="234" width="660" height="76" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="790" cy="272" r="13" fill="#5e35b1"/>
  <text x="790" y="277" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="814" y="266" font-size="13" font-weight="bold" fill="#311b92">写 undo log</text>
  <text x="814" y="289" font-size="10.5" fill="#37474f">记录修改前的旧值，供回滚与 MVCC 读旧版本</text>
  <rect x="1324" y="246" width="76" height="22" rx="11" fill="#ffffff" stroke="#5e35b1" stroke-width="1"/>
  <text x="1362" y="261" font-size="9.5" fill="#311b92" text-anchor="middle">InnoDB</text>

  <line x1="790" y1="311" x2="790" y2="327" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="330" width="660" height="76" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="790" cy="368" r="13" fill="#5e35b1"/>
  <text x="790" y="373" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="814" y="362" font-size="13" font-weight="bold" fill="#311b92">写 redo log，标记 prepare</text>
  <text x="814" y="385" font-size="10.5" fill="#37474f">物理页变更，崩溃恢复的依据；已落盘但事务尚未提交</text>
  <rect x="1324" y="342" width="76" height="22" rx="11" fill="#ffffff" stroke="#5e35b1" stroke-width="1"/>
  <text x="1362" y="357" font-size="9.5" fill="#311b92" text-anchor="middle">InnoDB</text>

  <line x1="790" y1="407" x2="790" y2="423" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="426" width="660" height="76" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="790" cy="464" r="13" fill="#2e7d32"/>
  <text x="790" y="469" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="814" y="458" font-size="13" font-weight="bold" fill="#123314">写 binlog</text>
  <text x="814" y="481" font-size="10.5" fill="#37474f">逻辑变更，主从复制、时间点恢复、误删找回都靠它</text>
  <rect x="1324" y="438" width="76" height="22" rx="11" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="1362" y="453" font-size="9.5" fill="#1b5e20" text-anchor="middle">Server 层</text>

  <line x1="790" y1="503" x2="790" y2="519" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="522" width="660" height="76" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="790" cy="560" r="13" fill="#5e35b1"/>
  <text x="790" y="565" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="814" y="554" font-size="13" font-weight="bold" fill="#311b92">redo log 改为 commit</text>
  <text x="814" y="577" font-size="10.5" fill="#37474f">事务对上层可见，两阶段提交结束</text>
  <rect x="1324" y="534" width="76" height="22" rx="11" fill="#ffffff" stroke="#5e35b1" stroke-width="1"/>
  <text x="1362" y="549" font-size="9.5" fill="#311b92" text-anchor="middle">InnoDB</text>

  <!-- 右列小结 -->
  <rect x="760" y="622" width="660" height="112" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="778" y="648" font-size="12" font-weight="bold" fill="#bf360c">为什么顺序不能交换</text>
  <text x="778" y="672" font-size="10.5" fill="#5d4700">① 崩溃恢复时先看 binlog：完整则提交，不完整则回滚 —— 这是两阶段提交的全部目的。</text>
  <text x="778" y="692" font-size="10.5" fill="#5d4700">② 只有一个目标：主库与从库的数据一致，不出现从库多写或少写。</text>
  <text x="778" y="712" font-size="10.5" fill="#5d4700">③ 因此生产上 innodb_flush_log_at_trx_commit 与 sync_binlog 必须同为 1（§1.6.2）。</text>

  <!-- 图例 -->
  <rect x="40" y="780" width="1380" height="40" rx="8" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="60" y="792" width="16" height="12" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="86" y="802" font-size="12" fill="#37474f">连接层</text>
  <rect x="405" y="792" width="16" height="12" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="431" y="802" font-size="12" fill="#37474f">Server 层（解析 / 预处理 / 优化 / 执行 / binlog）</text>
  <rect x="750" y="792" width="16" height="12" rx="3" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.2"/>
  <text x="776" y="802" font-size="12" fill="#37474f">存储引擎层（InnoDB：undo / redo）</text>
  <rect x="1095" y="792" width="16" height="12" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.2"/>
  <text x="1121" y="802" font-size="12" fill="#37474f">结果返回</text>
</svg>
