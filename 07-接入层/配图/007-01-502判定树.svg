<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>502 判定树：error log 三句原话对应三种病因</title>
  <desc>502 表示 Nginx 到后端的链路出问题。error log 里的三句原话直接对应三种病因：Connection refused 是后端进程没起或端口不对，用 ss 查监听；Connection timed out 是防火墙或路由不通，查安全组；upstream prematurely closed 是后端接了单但进程崩了，查应用日志与 OOM。第四种形态是后端返回畸形响应，调 proxy_buffer_size。</desc>

  <rect width="680" height="420" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">502 判定树：error log 的三句原话</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">原话在，病因就在三种里</text>

  <defs>
    <marker id="c7Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- 根 -->
  <rect x="240" y="50" width="200" height="38" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="340" y="67" font-size="9.5" font-weight="600" fill="#7A4A12" text-anchor="middle">全站 / 部分请求 502</text>
  <text x="340" y="82" font-size="7.6" fill="#7A4A12" text-anchor="middle">第一动作：tail -100 error.log</text>

  <!-- 三分支线 -->
  <line x1="340" y1="88" x2="340" y2="106" stroke="#7FA6D0" stroke-width="1.2"/>
  <line x1="122" y1="106" x2="558" y2="106" stroke="#7FA6D0" stroke-width="1.2"/>
  <line x1="122" y1="106" x2="122" y2="124" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c7Blue)"/>
  <line x1="340" y1="106" x2="340" y2="124" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c7Blue)"/>
  <line x1="558" y1="106" x2="558" y2="124" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c7Blue)"/>

  <!-- 分支 1 -->
  <rect x="40" y="128" width="164" height="130" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="122" y="148" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">connect() failed</text>
  <text x="122" y="162" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">(111: Connection refused)</text>
  <line x1="52" y1="172" x2="192" y2="172" stroke="#D2948C" stroke-width="0.6"/>
  <text x="52" y="190" font-size="7.8" fill="#7A322B">病因：后端进程没起</text>
  <text x="52" y="206" font-size="7.8" fill="#7A322B">或端口写错</text>
  <text x="52" y="226" font-size="7.8" font-weight="600" fill="#1D5A45">动作：上后端</text>
  <text x="52" y="242" font-size="7.8" fill="#1D5A45">ss -tlnp | grep 端口</text>

  <!-- 分支 2 -->
  <rect x="258" y="128" width="164" height="130" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="340" y="148" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">connect() failed</text>
  <text x="340" y="162" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">(110: Connection timed out)</text>
  <line x1="270" y1="172" x2="410" y2="172" stroke="#D2948C" stroke-width="0.6"/>
  <text x="270" y="190" font-size="7.8" fill="#7A322B">病因：网络不通——</text>
  <text x="270" y="206" font-size="7.8" fill="#7A322B">防火墙 / 安全组 / 路由</text>
  <text x="270" y="226" font-size="7.8" font-weight="600" fill="#1D5A45">动作：查安全组</text>
  <text x="270" y="242" font-size="7.8" fill="#1D5A45">「网络」007 §7.8 判定法</text>

  <!-- 分支 3 -->
  <rect x="476" y="128" width="164" height="130" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="558" y="148" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">upstream prematurely</text>
  <text x="558" y="162" font-size="8" font-weight="600" fill="#7A322B" text-anchor="middle">closed connection</text>
  <line x1="488" y1="172" x2="628" y2="172" stroke="#D2948C" stroke-width="0.6"/>
  <text x="488" y="190" font-size="7.8" fill="#7A322B">病因：接了单但进程崩</text>
  <text x="488" y="206" font-size="7.8" fill="#7A322B">——发布窗口或 OOM</text>
  <text x="488" y="226" font-size="7.8" font-weight="600" fill="#1D5A45">动作：应用日志 +</text>
  <text x="488" y="242" font-size="7.8" fill="#1D5A45">OOMKilled 检查（容器 009）</text>

  <!-- 第四形态 -->
  <rect x="40" y="278" width="604" height="44" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="54" y="296" font-size="8.4" font-weight="600" fill="#4A4945">第四形态：error log 干净 + 后端返回畸形响应（头超大 / 协议错）</text>
  <text x="54" y="312" font-size="7.8" fill="#4A4945">动作：调 proxy_buffer_size（002 §2.6），并查后端为什么产出非法响应</text>

  <rect x="40" y="334" width="604" height="34" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="54" y="355" font-size="8.4" fill="#7A4A12">高频窗口：后端重启（发布时）与内存峰值（OOM 被杀）——前者用优雅发布消除，后者是容量问题</text>

  <text x="32" y="396" font-size="9" fill="#8C8980">502 不是应用报错——应用活着但返回 500，那是后端自己的事；502 永远指「Nginx 到后端」这一段。取证总纲见 007 §7.1。</text>
</svg>
