<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>内存与磁盘水位：RabbitMQ 阻塞生产者的两道闸</title>
  <desc>生产者发布消息进入 RabbitMQ，消息堆积在队列消耗内存与磁盘。两道自保闸：内存水位约物理内存的比例，磁盘空闲低于限制，任一触发都会阻塞生产者连接——阻塞是流控不是故障，消费不受影响。处置顺序是归因堆积、扩消费、必要时评估参数，只调高水位等于把报警器调哑。</desc>

  <rect width="680" height="340" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">水位两道闸：阻塞生产者是流控，不是丢消息</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">消费不受影响</text>

  <defs>
    <marker id="m1bBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="m1bRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>

  <!-- 生产者 -->
  <rect x="40" y="60" width="130" height="44" rx="21" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.4"/>
  <text x="105" y="86" font-size="8.6" font-weight="600" fill="#37474F" text-anchor="middle">生产者</text>

  <line x1="170" y1="82" x2="216" y2="82" stroke="#7FA6D0" stroke-width="1.4" marker-end="url(#m1bBlue)"/>
  <text x="193" y="74" font-size="7" fill="#8C8980" text-anchor="middle">publish</text>

  <!-- broker -->
  <rect x="220" y="48" width="250" height="120" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="345" y="70" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">RabbitMQ broker</text>
  <text x="345" y="90" font-size="7.6" fill="#1F4468" text-anchor="middle">队列积压 · 消息索引</text>
  <text x="345" y="106" font-size="7.6" fill="#1F4468" text-anchor="middle">内存占用 ↑ · 磁盘写入 ↑</text>
  <text x="345" y="128" font-size="7.4" font-weight="600" fill="#7A322B" text-anchor="middle">消费跟不上 → 资源持续涨</text>

  <!-- 两道闸 -->
  <line x1="470" y1="78" x2="516" y2="78" stroke="#D9A458" stroke-width="1.2" marker-end="url(#m1bRed)"/>
  <line x1="470" y1="120" x2="516" y2="120" stroke="#D9A458" stroke-width="1.2" marker-end="url(#m1bRed)"/>

  <rect x="520" y="56" width="124" height="42" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="582" y="74" font-size="8.2" font-weight="600" fill="#7A4A12" text-anchor="middle">闸 ① 内存水位</text>
  <text x="582" y="89" font-size="7" fill="#7A4A12" text-anchor="middle">约 0.6 × RAM（按版本）</text>

  <rect x="520" y="112" width="124" height="42" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="582" y="130" font-size="8.2" font-weight="600" fill="#7A4A12" text-anchor="middle">闸 ② 磁盘空闲</text>
  <text x="582" y="145" font-size="7" fill="#7A4A12" text-anchor="middle">低于 limit（默认 50MB）</text>

  <!-- 阻塞 -->
  <line x1="345" y1="168" x2="345" y2="196" stroke="#D2948C" stroke-width="1.2" marker-end="url(#m1bRed)"/>
  <text x="353" y="188" font-size="7.2" fill="#7A322B">任一超限</text>

  <rect x="220" y="200" width="250" height="48" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1.2"/>
  <text x="345" y="220" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">阻塞生产者（连接 blocking）</text>
  <text x="345" y="237" font-size="7.2" fill="#7A322B" text-anchor="middle">流控而非故障——消费者不受影响</text>

  <!-- 处置 -->
  <rect x="480" y="196" width="164" height="56" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1.2"/>
  <text x="562" y="216" font-size="8.2" font-weight="600" fill="#1D5A45" text-anchor="middle">正确处置三步</text>
  <text x="562" y="232" font-size="7.2" fill="#1D5A45" text-anchor="middle">① 归因堆积（003 §3.3）</text>
  <text x="562" y="246" font-size="7.2" fill="#1D5A45" text-anchor="middle">② 扩消费 → 水位自动回落</text>

  <rect x="40" y="272" width="604" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="291" font-size="8.2" fill="#7A4A12">只调高水位不清堆积 = 把报警器调哑——alarm 解除后自动恢复，但根因在消费能力（001 §1.5）</text>

  <text x="32" y="326" font-size="9" fill="#8C8980">指标接入：Prometheus 插件暴露内存/磁盘/连接 blocking/队列深度——alarm 状态进「监控」册告警（001 §1.7）。</text>
</svg>
