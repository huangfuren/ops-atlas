<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>两大模型对照与消息旅程：丢失与重复发生的位置</title>
  <desc>上半部分对照两种模型：RabbitMQ 是消息代理，消息按路由投递、消费确认后删除；Kafka 是分布式日志，消息追加进分区、消费只移动指针、到期才清理。下半部分是四段通用旅程：发送、存储复制、投递、确认——丢失只可能发生在发送、存储、确认三个环节，重复只可能发生在投递与确认环节。结论：至少一次是默认语义，消费端幂等是标配。</desc>

  <rect width="680" height="420" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">两大模型与消息旅程：丢、重发生的位置</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">两种思想，不是竞品</text>

  <defs>
    <marker id="m0Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- RabbitMQ 模型 -->
  <text x="40" y="58" font-size="9" font-weight="600" fill="#1F4468">RabbitMQ · 消息代理：投递确认后删除</text>
  <rect x="40" y="66" width="130" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="105" y="84" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">生产者</text>
  <text x="105" y="100" font-size="7" fill="#8C8980" text-anchor="middle">发到 exchange</text>
  <rect x="190" y="66" width="170" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="275" y="84" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">exchange → queue</text>
  <text x="275" y="100" font-size="7" fill="#8C8980" text-anchor="middle">路由 · 排队 · 消费确认后删除</text>
  <rect x="380" y="66" width="130" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="445" y="84" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">消费者</text>
  <text x="445" y="100" font-size="7" fill="#8C8980" text-anchor="middle">ack / 重复投递</text>
  <rect x="530" y="66" width="114" height="42" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="587" y="84" font-size="8.4" font-weight="600" fill="#4A4945" text-anchor="middle">单条状态</text>
  <text x="587" y="100" font-size="7" fill="#8C8980" text-anchor="middle">在不在队列里</text>
  <line x1="170" y1="87" x2="186" y2="87" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>
  <line x1="360" y1="87" x2="376" y2="87" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>
  <line x1="510" y1="87" x2="526" y2="87" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>

  <!-- Kafka 模型 -->
  <text x="40" y="136" font-size="9" font-weight="600" fill="#1F4468">Kafka · 分布式日志：消费移指针，到期才清</text>
  <rect x="40" y="144" width="130" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="105" y="162" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">生产者</text>
  <text x="105" y="178" font-size="7" fill="#8C8980" text-anchor="middle">按 key 选分区</text>
  <rect x="190" y="144" width="170" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="275" y="162" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">partition 追加写</text>
  <text x="275" y="178" font-size="7" fill="#8C8980" text-anchor="middle">分区内有序 · 保留期</text>
  <rect x="380" y="144" width="130" height="42" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="445" y="162" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">消费者组</text>
  <text x="445" y="178" font-size="7" fill="#8C8980" text-anchor="middle">移动 offset 指针</text>
  <rect x="530" y="144" width="114" height="42" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="587" y="162" font-size="8.4" font-weight="600" fill="#4A4945" text-anchor="middle">分区健康</text>
  <text x="587" y="178" font-size="7" fill="#8C8980" text-anchor="middle">ISR · lag</text>
  <line x1="170" y1="165" x2="186" y2="165" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>
  <line x1="360" y1="165" x2="376" y2="165" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>
  <line x1="510" y1="165" x2="526" y2="165" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#m0Blue)"/>

  <line x1="32" y1="204" x2="648" y2="204" stroke="#EDEAE2" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 旅程 -->
  <text x="40" y="228" font-size="9.5" font-weight="600" fill="#4A4945">通用旅程四段：丢、重发生的位置</text>

  <rect x="40" y="240" width="130" height="76" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="105" y="262" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">① 发送</text>
  <text x="105" y="280" font-size="7.4" fill="#7A322B" text-anchor="middle">丢：fire-and-forget</text>
  <text x="105" y="296" font-size="7.4" fill="#7A322B" text-anchor="middle">无确认/无重试</text>

  <rect x="186" y="240" width="130" height="76" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="251" y="262" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">② 存储/复制</text>
  <text x="251" y="280" font-size="7.4" fill="#7A322B" text-anchor="middle">丢：未持久化/未复制</text>
  <text x="251" y="296" font-size="7.4" fill="#7A322B" text-anchor="middle">单副本即宕机丢</text>

  <rect x="332" y="240" width="130" height="76" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="397" y="262" font-size="8.6" font-weight="600" fill="#7A4A12" text-anchor="middle">③ 投递</text>
  <text x="397" y="280" font-size="7.4" fill="#7A4A12" text-anchor="middle">重：投了消费者没确认</text>
  <text x="397" y="296" font-size="7.4" fill="#7A4A12" text-anchor="middle">→ 重投（at-least-once）</text>

  <rect x="478" y="240" width="130" height="76" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="543" y="262" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">④ 确认</text>
  <text x="543" y="280" font-size="7.4" fill="#7A322B" text-anchor="middle">丢：先提交后处理</text>
  <text x="543" y="296" font-size="7.4" fill="#7A322B" text-anchor="middle">重：处理完再提交</text>

  <rect x="620" y="240" width="24" height="76" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="632" y="282" font-size="7.4" font-weight="600" fill="#1D5A45" text-anchor="middle" transform="rotate(90 632 282)">完成</text>

  <rect x="40" y="330" width="604" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="349" font-size="8.2" fill="#7A4A12">结论：丢失可能 = ①②④　重复可能 = ③④　——所以「至少一次 + 消费端幂等」是默认约定（003 §3.2）</text>

  <text x="32" y="390" font-size="9" fill="#8C8980">运维关注点随模型不同：RabbitMQ 盯单条消息状态与水位（001 §1.5），Kafka 盯分区健康与消费 lag（002 §2.6）。</text>
  <text x="32" y="408" font-size="9" fill="#8C8980">选型口诀：任务可靠交付选 RabbitMQ；事件流多方消费、需要回放选 Kafka——共存常见（000 §0.2）。</text>
</svg>
