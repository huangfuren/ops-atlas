<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>应急响应的角色与升级链：IC 指挥不亲手修</title>
  <desc>上半部分是三个应急角色：指挥官负责决策与分派但绝不亲手修，沟通负责人定期向内外播报，领域专家接到明确任务后动手并汇报。下半部分是升级链：一级值班十五分钟无进展升级二级并加领域专家，三十分钟无进展或影响扩大升级工程负责人接管指挥，重大业务影响升级管理层提供资源支持。每一级都有截止时间。</desc>

  <rect width="680" height="400" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">应急角色与升级链：大故障的分水岭</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">IC 不亲手修</text>

  <defs>
    <marker id="s2Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- 三角色 -->
  <text x="40" y="56" font-size="9.5" font-weight="600" fill="#4A4945">三个角色（可兼任，但 IC 与动手者必须分开）</text>

  <rect x="40" y="66" width="193" height="92" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="136" y="88" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">IC · 应急指挥</text>
  <text x="136" y="106" font-size="7.6" fill="#1F4468" text-anchor="middle">决策优先级 · 分派任务</text>
  <text x="136" y="122" font-size="7.6" fill="#1F4468" text-anchor="middle">宣布状态（排查/定位/恢复）</text>
  <text x="136" y="142" font-size="7.4" font-weight="600" fill="#7A322B" text-anchor="middle">铁律：不亲手修</text>

  <rect x="245" y="66" width="193" height="92" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="341" y="88" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">CL · 沟通负责</text>
  <text x="341" y="106" font-size="7.6" fill="#1F4468" text-anchor="middle">对内：定期播报进展</text>
  <text x="341" y="122" font-size="7.6" fill="#1F4468" text-anchor="middle">对外：按影响面公告</text>
  <text x="341" y="142" font-size="7.4" fill="#8C8980" text-anchor="middle">无进展也播：「仍在排查」</text>

  <rect x="450" y="66" width="193" height="92" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="546" y="88" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">COM · 领域专家</text>
  <text x="546" y="106" font-size="7.6" fill="#1F4468" text-anchor="middle">接明确任务动手</text>
  <text x="546" y="122" font-size="7.6" fill="#1F4468" text-anchor="middle">完成后向 IC 汇报</text>
  <text x="546" y="142" font-size="7.4" fill="#8C8980" text-anchor="middle">DB / 网络 / 某服务……</text>

  <!-- 升级链 -->
  <text x="40" y="192" font-size="9.5" font-weight="600" fill="#4A4945">升级链：每一级有截止时间</text>

  <rect x="40" y="204" width="140" height="44" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="110" y="222" font-size="8.4" font-weight="600" fill="#4A4945" text-anchor="middle">① on-call primary</text>
  <text x="110" y="238" font-size="7.2" fill="#8C8980" text-anchor="middle">确认 · 初步处置</text>

  <line x1="180" y1="226" x2="204" y2="226" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#s2Blue)"/>
  <text x="192" y="218" font-size="6.8" fill="#7A322B" text-anchor="middle">15min</text>

  <rect x="208" y="204" width="140" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="278" y="222" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">② secondary + 专家</text>
  <text x="278" y="238" font-size="7.2" fill="#8C8980" text-anchor="middle">加人 · 分头取证</text>

  <line x1="348" y1="226" x2="372" y2="226" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#s2Blue)"/>
  <text x="360" y="218" font-size="6.8" fill="#7A322B" text-anchor="middle">30min</text>

  <rect x="376" y="204" width="140" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="446" y="222" font-size="8.4" font-weight="600" fill="#7A4A12" text-anchor="middle">③ 工程负责人</text>
  <text x="446" y="238" font-size="7.2" fill="#7A4A12" text-anchor="middle">接管正式 IC 指挥</text>

  <line x1="516" y1="226" x2="540" y2="226" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#s2Blue)"/>
  <text x="528" y="218" font-size="6.8" fill="#7A322B" text-anchor="middle">重大</text>

  <rect x="544" y="204" width="100" height="44" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="594" y="222" font-size="8.4" font-weight="600" fill="#7A322B" text-anchor="middle">④ 管理层</text>
  <text x="594" y="238" font-size="7.2" fill="#7A322B" text-anchor="middle">资源 · 对外公告</text>

  <!-- 纪律 -->
  <rect x="40" y="266" width="604" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="286" font-size="8.4" font-weight="600" fill="#7A4A12">决策权预先约定：回滚底线、停不停服务——写进发布检查单与决策矩阵（「CICD」007 §7.9），故障现场不辩论权力</text>
  <text x="52" y="302" font-size="7.8" fill="#7A4A12">管理层进故障群的角色是资源支持，不是指挥——指挥权始终在 IC 手里（复盘时检验这条是否成立）</text>

  <text x="32" y="344" font-size="9" fill="#8C8980">runbook 生命周期：告警创建时同步写（告警消息里放链接），复盘的新处置动作回写，告警删除时同删——过时的 runbook 比没有更危险。</text>
  <text x="32" y="364" font-size="9" fill="#8C8980">度量：MTTA（确认时长）与 MTTR（恢复时长，R 的口径团队约定）按月看趋势——恶化时拆解：发现慢 / 决策慢 / 修复慢。</text>
  <text x="32" y="384" font-size="9" fill="#8C8980">已建立的 TCP 连接类细节与 VIP 漂移类故障见「接入层」008；告警技术配置见「监控」04。</text>
</svg>
