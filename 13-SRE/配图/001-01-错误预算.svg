<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>错误预算：从 SLO 到预算政策告警的完整机制</title>
  <desc>机制四段：SLO 99.9% 配 28 天滚动窗口，错误预算换算约 43 分钟；burn rate 是当前错误率除以允许错误率的倍数，14 倍速意味着约两天烧完预算；双窗口告警一小时窗口乘五分钟窗口都超过十四点四就紧急响应，六小时窗口超过六开工单；预算余额决定发布政策，充足正常迭代，烧完冻结非必要发布。特批可以存在但要记录在案。</desc>

  <rect width="680" height="400" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">错误预算：从承诺到告警到仲裁</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">算术替代争论</text>

  <defs>
    <marker id="s1Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- ① SLO -->
  <rect x="40" y="52" width="180" height="64" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="130" y="74" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">① SLO：99.9% / 28 天</text>
  <text x="130" y="92" font-size="7.4" fill="#4A4945" text-anchor="middle">滚动窗口，非自然月</text>
  <text x="130" y="108" font-size="7.2" fill="#8C8980" text-anchor="middle">起步值 = 现状略好</text>

  <line x1="220" y1="84" x2="250" y2="84" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#s1Blue)"/>

  <!-- ② 预算 -->
  <rect x="254" y="52" width="180" height="64" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="344" y="74" font-size="9" font-weight="600" fill="#7A4A12" text-anchor="middle">② 错误预算 = 1 − SLO</text>
  <text x="344" y="92" font-size="8.6" font-weight="600" fill="#7A4A12" text-anchor="middle">0.1% × 30 天 ≈ 43 分钟</text>
  <text x="344" y="108" font-size="7.2" fill="#8C8980" text-anchor="middle">允许不完美的额度</text>

  <line x1="434" y1="84" x2="464" y2="84" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#s1Blue)"/>

  <!-- ③ burn rate -->
  <rect x="468" y="52" width="176" height="64" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="556" y="74" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">③ burn rate 消耗速率</text>
  <text x="556" y="92" font-size="7.6" fill="#1F4468" text-anchor="middle">当前错误率 ÷ 允许错误率</text>
  <text x="556" y="108" font-size="7.2" fill="#8C8980" text-anchor="middle">=1 恰好用满 / =14 两天烧完</text>

  <!-- ④ 双窗口告警 -->
  <rect x="40" y="136" width="300" height="70" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1.2"/>
  <text x="54" y="158" font-size="8.8" font-weight="600" fill="#7A322B">紧急 page：1h 窗 burn ≥ 14.4 且 5m 同超</text>
  <text x="54" y="176" font-size="7.6" fill="#7A322B">≈ 2 天烧完 28 天预算 → 立即响应</text>
  <text x="54" y="194" font-size="7.2" fill="#8C8980">双窗口同时超：既快又持续，排除毛刺</text>

  <rect x="356" y="136" width="288" height="70" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="370" y="158" font-size="8.8" font-weight="600" fill="#7A4A12">重要工单：6h 窗 burn ≥ 6</text>
  <text x="370" y="176" font-size="7.6" fill="#7A4A12">≈ 7 天烧完预算 → 当天处理</text>
  <text x="370" y="194" font-size="7.2" fill="#8C8980">慢烧：不 page，但必须有人认领</text>

  <!-- 预算政策 -->
  <text x="40" y="234" font-size="9.5" font-weight="600" fill="#4A4945">预算余额 → 发布政策（团队负责人签过字）</text>
  <rect x="40" y="244" width="193" height="54" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="136" y="264" font-size="8.4" font-weight="600" fill="#1D5A45" text-anchor="middle">&lt; 50% 已用</text>
  <text x="136" y="282" font-size="7.4" fill="#1D5A45" text-anchor="middle">正常迭代发布</text>
  <rect x="245" y="244" width="193" height="54" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="341" y="264" font-size="8.4" font-weight="600" fill="#7A4A12" text-anchor="middle">&gt; 80% 已用</text>
  <text x="341" y="282" font-size="7.4" fill="#7A4A12" text-anchor="middle">发布需评审 · 优先修可靠性</text>
  <rect x="450" y="244" width="193" height="54" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1.2"/>
  <text x="546" y="264" font-size="8.4" font-weight="600" fill="#7A322B" text-anchor="middle">烧完 100%</text>
  <text x="546" y="282" font-size="7.4" fill="#7A322B" text-anchor="middle">冻结非必要发布</text>

  <rect x="40" y="312" width="604" height="30" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="331" font-size="8" fill="#4A4945">特批通道：负责人书面豁免并记录在案——特批三次以上说明 SLO 定得不合理，回 1.2 重新校准</text>

  <text x="32" y="372" font-size="9" fill="#8C8980">SLA 比 SLO 松一个档（99.5%）——内部目标是外部合同的安全垫；SLO 的数据源是「监控」册的指标体系。</text>
  <text x="32" y="392" font-size="9" fill="#8C8980">起步纪律：每服务 1–2 个 SLO（可用性 + 延迟），度量诚实先行——假装可靠比不可靠更危险。</text>
</svg>
