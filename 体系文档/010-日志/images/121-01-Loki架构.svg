<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1200" height="840" fill="#ffffff"/>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0d47a1">Loki 架构：标签是唯一的索引</text>
  <text x="1160" y="42" font-size="12" fill="#616161" text-anchor="end">先圈标签，再扫正文</text>

  <rect x="40" y="70" width="1120" height="230" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="100" font-size="14" font-weight="bold" fill="#0d47a1">主链路：采集打标签 → Loki 只索引标签 → Grafana 查询</text>

  <rect x="60" y="116" width="300" height="158" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="148" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Promtail / Alloy</text>
  <text x="210" y="180" font-size="12" fill="#0d2f5c" text-anchor="middle">抓文件 · 解析行</text>
  <text x="210" y="208" font-size="12" fill="#0d2f5c" text-anchor="middle">提取标签 · push</text>
  <text x="210" y="244" font-size="11" fill="#37474f" text-anchor="middle">Alloy 是 Promtail 的继任者</text>

  <rect x="450" y="116" width="300" height="158" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="600" y="148" font-size="15" font-weight="bold" fill="#5d4700" text-anchor="middle">Loki ★</text>
  <text x="600" y="180" font-size="12" fill="#5d4700" text-anchor="middle">索引：只有标签（低基数）</text>
  <text x="600" y="208" font-size="12" fill="#5d4700" text-anchor="middle">正文：压缩成 chunk 顺序存</text>
  <text x="600" y="244" font-size="11" fill="#7f3f00" text-anchor="middle">单二进制起步 · 对象存储友好</text>

  <rect x="840" y="116" width="300" height="158" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="990" y="148" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">Grafana</text>
  <text x="990" y="180" font-size="12" fill="#1b5e20" text-anchor="middle">Explore 查询 · LogQL</text>
  <text x="990" y="208" font-size="12" fill="#1b5e20" text-anchor="middle">仪表盘 · 告警</text>
  <text x="990" y="244" font-size="11" fill="#2e5230" text-anchor="middle">指标 + 日志同屏</text>

  <line x1="364" y1="195" x2="444" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="404" y="184" font-size="11" fill="#0d47a1" text-anchor="middle">push</text>
  <line x1="754" y1="195" x2="834" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="794" y="184" font-size="11" fill="#0d47a1" text-anchor="middle">LogQL</text>

  <!-- 标签设计对照 -->
  <rect x="40" y="322" width="1120" height="200" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="352" font-size="14" font-weight="bold" fill="#c62828">标签设计的命门：基数</text>

  <rect x="60" y="368" width="540" height="134" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="398" font-size="13" font-weight="bold" fill="#1b5e20">好标签（低基数 · 查询必用 · 稳定）</text>
  <text x="80" y="432" font-size="12" fill="#123314">env（个位数）· service（几十到几百）</text>
  <text x="80" y="462" font-size="12" fill="#123314">pod（随副本数，先想清楚查询模式再决定）</text>
  <text x="80" y="490" font-size="11" fill="#2e5230">取值数量可控 → 生成的流数量可控</text>

  <rect x="620" y="368" width="520" height="134" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="640" y="398" font-size="13" font-weight="bold" fill="#7f0000">禁止进标签（高基数）</text>
  <text x="640" y="432" font-size="12" fill="#7f0000">user_id · trace_id · url · 请求参数</text>
  <text x="640" y="462" font-size="12" fill="#7f0000">每个取值生成一条流 → 索引内存爆炸</text>
  <text x="640" y="490" font-size="11" fill="#7f0000">这些字段只能留在正文里搜</text>

  <!-- LogQL 示例 -->
  <rect x="40" y="542" width="1120" height="150" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="572" font-size="14" font-weight="bold" fill="#0d47a1">LogQL 示例：选择器必写</text>
  <rect x="60" y="588" width="1080" height="52" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="80" y="620" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">{service="myapp", env="prod"} |= "timeout" != "healthcheck"</text>
  <text x="60" y="666" font-size="11.5" fill="#37474f">选择器圈定流（必写）→ 行过滤正文 → 统计管道 sum by (service) (rate(...[5m]))</text>

  <!-- 取舍 -->
  <rect x="40" y="712" width="1120" height="90" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="60" y="742" font-size="12" font-weight="bold" fill="#5d4700">与 ES 的取舍（121 §4.6）</text>
  <text x="60" y="770" font-size="11.5" fill="#5d4037">全文检索强 = ES；成本敏感 + 已用 Grafana + 日志结构化 = Loki——先试跑一个业务再定</text>
  <text x="60" y="790" font-size="11" fill="#5d4037">Loki 的保留与压缩机制见 121 §4.7，与 112 的 ILM 对照</text>

  <!-- 图例 -->
  <rect x="40" y="818" width="1120" height="22" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="823" width="14" height="10" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="84" y="832" font-size="10" fill="#37474f">采集</text>
  <rect x="180" y="823" width="14" height="10" rx="2" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="204" y="832" font-size="10" fill="#37474f">核心</text>
  <rect x="300" y="823" width="14" height="10" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="324" y="832" font-size="10" fill="#37474f">消费 / 正例</text>
  <rect x="460" y="823" width="14" height="10" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="484" y="832" font-size="10" fill="#37474f">风险 / 反例</text>
  <text x="660" y="832" font-size="10" fill="#37474f">蓝箭头 = 数据流；标签先圈范围，正文才进扫描</text>
</svg>
