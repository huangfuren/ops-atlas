<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="1200" height="840" fill="#ffffff"/>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="40" y="42" font-size="20" font-weight="bold" fill="#0d47a1">四段取证：先定位断在哪一段</text>
  <text x="1160" y="42" font-size="12" fill="#616161" text-anchor="end">从 ① 顺序往下，不跳段</text>

  <rect x="40" y="70" width="1120" height="600" rx="12" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>

  <!-- ① 产生 -->
  <rect x="60" y="96" width="1080" height="126" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="80" y="128" font-size="15" font-weight="bold" fill="#37474f">① 产生 —— 应用还在打日志吗？</text>
  <text x="80" y="158" font-size="12" fill="#37474f">验证：docker logs 容器 / tail 原始文件 / journalctl -u 服务</text>
  <text x="80" y="188" font-size="11.5" fill="#7f0000">源头没有 → 找应用（回「容器」114 的 stdout 纪律）</text>
  <text x="930" y="210" font-size="11" fill="#616161" text-anchor="end">源头断了别往下游查</text>

  <line x1="600" y1="222" x2="600" y2="248" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ② 采集 -->
  <rect x="60" y="252" width="1080" height="126" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="284" font-size="15" font-weight="bold" fill="#0d2f5c">② 采集 —— 采集器活着、偏移在动吗？</text>
  <text x="80" y="314" font-size="12" fill="#0d2f5c">filebeat test output → registry 的 offset 在不在动 → journalctl -u filebeat 找 ERROR</text>
  <text x="80" y="344" font-size="11.5" fill="#7f0000">断了：凭据 / 权限 / 429 限流（124 §6.2）</text>
  <text x="930" y="366" font-size="11" fill="#616161" text-anchor="end">最常见断点之一</text>

  <line x1="600" y1="378" x2="600" y2="404" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ③ 存储 -->
  <rect x="60" y="408" width="1080" height="126" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="440" font-size="15" font-weight="bold" fill="#0d2f5c">③ 存储 —— 数据到了 ES 吗？</text>
  <text x="80" y="470" font-size="12" fill="#0d2f5c">GET _cat/allocation（水位）→ GET logs-*/_search 不带时间直接查（绕过界面）</text>
  <text x="80" y="500" font-size="11.5" fill="#7f0000">只读锁 / red / 429 → 124 §6.3</text>
  <text x="930" y="522" font-size="11" fill="#616161" text-anchor="end">人们总先怀疑这一段</text>

  <line x1="600" y1="534" x2="600" y2="560" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ④ 查询 -->
  <rect x="60" y="564" width="1080" height="90" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="80" y="596" font-size="15" font-weight="bold" fill="#5d4700">④ 查询 —— 数据在，是查询层的问题</text>
  <text x="80" y="626" font-size="12" fill="#5d4700">时间窗 → 数据视图的 @timestamp → 字段 text/keyword 类型 → 查询语法（113；五类查不到因见 124 §6.4）</text>
  <text x="930" y="646" font-size="11" fill="#616161" text-anchor="end">最常见断点之二</text>

  <!-- 经验分布 -->
  <rect x="40" y="690" width="1120" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="714" font-size="12" font-weight="bold" fill="#bf360c">经验分布：多数工单断在 ② 采集静默失败 与 ④ 查询姿势</text>
  <text x="60" y="740" font-size="11.5" fill="#7f3f00">人们总是先怀疑 ③ 存储，这就是跳段的代价——按顺序走，每段都有明确验证动作</text>
  <text x="60" y="766" font-size="11" fill="#5d4037">排障纪律与「网络」131、「容器」125 同源：先分段，再动手</text>

  <!-- 图例 -->
  <rect x="40" y="786" width="1120" height="42" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="799" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="92" y="810" font-size="12" fill="#37474f">① 产生（外部源头）</text>
  <rect x="300" y="799" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="332" y="810" font-size="12" fill="#37474f">②③ 采集 / 存储</text>
  <rect x="560" y="799" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="592" y="810" font-size="12" fill="#37474f">④ 查询（高发断点）</text>
  <text x="850" y="810" font-size="12" fill="#37474f">蓝箭头 = 取证推进顺序</text>
</svg>
