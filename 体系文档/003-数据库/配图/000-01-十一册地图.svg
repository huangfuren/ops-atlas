<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>数据库板块十一册地图：版图选型 → MySQL 主线 → 扩展</title>
  <desc>数据库板块十一册分三列：左列版图与选型是 000 全貌（你在这里）和 010 数据库选型；中列 MySQL 主线八册是架构、SQL、索引、事务锁、备份、主从高可用、性能诊断、日常运维；右列扩展是 009 其他数据库与 00 术语表。底部提示只有时间读两篇就读索引与备份。</desc>

  <rect width="680" height="460" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">数据库板块十一册地图</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">000 全貌 · 配图</text>

  <defs>
    <marker id="d0Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- 左列：版图与选型 -->
  <rect x="30" y="56" width="200" height="296" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="130" y="76" font-size="8.6" font-weight="600" fill="#8C8980" text-anchor="middle">版图与选型</text>
  <rect x="44" y="86" width="172" height="62" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
