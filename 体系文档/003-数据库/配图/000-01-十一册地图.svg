  <text x="130" y="122" font-size="7.2" fill="#4A4945" text-anchor="middle">板块地图 · 概念直觉</text>
  <text x="130" y="136" font-size="7.2" fill="#4A4945" text-anchor="middle">掌握到什么程度 · 误解</text>
  <line x1="130" y1="148" x2="130" y2="162" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#d0Blue)"/>
  <rect x="44" y="166" width="172" height="100" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="130" y="186" font-size="9" font-weight="600" fill="#7A4A12" text-anchor="middle">010 数据库选型</text>
  <text x="130" y="204" font-size="7.2" fill="#7A4A12" text-anchor="middle">六类版图与撞墙逻辑</text>
  <text x="130" y="218" font-size="7.2" fill="#7A4A12" text-anchor="middle">关系型五大家族 · 国产库三真相</text>
  <text x="130" y="232" font-size="7.2" fill="#7A4A12" text-anchor="middle">信创六约束 · 迁移九翻车点</text>
  <text x="130" y="246" font-size="7.2" fill="#7A4A12" text-anchor="middle">横向对照 · 云责任边界</text>
  <line x1="230" y1="120" x2="248" y2="120" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#d0Blue)"/>
  <text x="239" y="112" font-size="7" fill="#8C8980" text-anchor="middle">进主线</text>

  <!-- 中列：MySQL 主线 -->
  <rect x="250" y="56" width="252" height="296" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="376" y="76" font-size="8.6" font-weight="600" fill="#8C8980" text-anchor="middle">MySQL 主线 001~008</text>
  <rect x="262" y="84" width="116" height="58" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
