  <text x="320" y="166" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">003 索引与执行计划</text>
  <text x="320" y="182" font-size="6.8" fill="#4A4945" text-anchor="middle">B+ 树 · EXPLAIN</text>
  <text x="320" y="195" font-size="6.8" fill="#4A4945" text-anchor="middle">原理 ★</text>
  <rect x="384" y="148" width="116" height="58" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="442" y="166" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">004 事务锁 MVCC</text>
  <text x="442" y="182" font-size="6.8" fill="#4A4945" text-anchor="middle">隔离级别 · 死锁</text>
  <text x="442" y="195" font-size="6.8" fill="#4A4945" text-anchor="middle">原理</text>
  <rect x="262" y="212" width="116" height="58" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="320" y="230" font-size="8.4" font-weight="600" fill="#1D5A45" text-anchor="middle">005 备份恢复</text>
  <text x="320" y="246" font-size="6.8" fill="#1D5A45" text-anchor="middle">XtraBackup · 演练</text>
  <text x="320" y="259" font-size="6.8" fill="#1D5A45" text-anchor="middle">数据安全 ★</text>
  <rect x="384" y="212" width="116" height="58" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="442" y="230" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">006 主从与高可用</text>
  <text x="442" y="246" font-size="6.8" fill="#4A4945" text-anchor="middle">复制三线程 · MGR</text>
  <text x="442" y="259" font-size="6.8" fill="#4A4945" text-anchor="middle">高可用</text>
  <rect x="262" y="276" width="116" height="58" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="320" y="294" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">007 性能诊断</text>
  <text x="320" y="310" font-size="6.8" fill="#4A4945" text-anchor="middle">pt-query-digest</text>
  <text x="320" y="323" font-size="6.8" fill="#4A4945" text-anchor="middle">运营</text>
  <rect x="384" y="276" width="116" height="58" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="442" y="294" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">008 日常运维</text>
  <text x="442" y="310" font-size="6.8" fill="#4A4945" text-anchor="middle">巡检 · 故障剧本</text>
  <text x="442" y="323" font-size="6.8" fill="#4A4945" text-anchor="middle">运营</text>

  <!-- 右列：扩展 -->
  <rect x="520" y="56" width="130" height="296" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="585" y="76" font-size="8.6" font-weight="600" fill="#8C8980" text-anchor="middle">扩展与工具</text>
  <line x1="502" y1="210" x2="518" y2="140" stroke="#7FA6D0" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#d0Blue)"/>
  <text x="512" y="180" font-size="6.8" fill="#8C8980">换库时</text>
  <rect x="532" y="86" width="106" height="110" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="585" y="106" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">009 其他数据库</text>
  <text x="585" y="122" font-size="6.8" fill="#4A4945" text-anchor="middle">PG 十二差异</text>
  <text x="585" y="136" font-size="6.8" fill="#4A4945" text-anchor="middle">Redis 运维差异</text>
  <text x="585" y="150" font-size="6.8" fill="#4A4945" text-anchor="middle">MongoDB</text>
  <text x="585" y="170" font-size="6.8" fill="#4A4945" text-anchor="middle">Redis 深入 → 014 板块</text>
  <rect x="532" y="210" width="106" height="100" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="585" y="230" font-size="8.4" font-weight="600" fill="#2B2A27" text-anchor="middle">00 术语表</text>
  <text x="585" y="246" font-size="6.8" fill="#4A4945" text-anchor="middle">106 术语中英对照</text>
  <text x="585" y="260" font-size="6.8" fill="#4A4945" text-anchor="middle">缩写 · 16 对易混</text>
  <text x="585" y="274" font-size="6.8" fill="#4A4945" text-anchor="middle">19 条症状反查</text>

  <rect x="30" y="372" width="620" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="42" y="392" font-size="7.8" font-weight="600" fill="#7A4A12">★ 只有时间读两篇：003 索引与执行计划 + 005 备份恢复——前者解决 80% 性能问题，后者决定救不救得回来</text>

  <text x="32" y="426" font-size="8.6" fill="#8C8980">主线 MySQL 8.0；PG / Redis / MongoDB 运维差异在 009；选型撞墙逻辑在 010 §1；备份方法论在 Linux 010。</text>
