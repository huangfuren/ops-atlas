<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727.06" viewBox="0 0 1200 727.06" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>一条 SQL 的完整路径：读与写</title>
  <desc>左列是 SELECT 自上而下的七个环节，右列把第六步展开为一次提交落三种日志的两阶段提交过程。</desc>
  <rect x="0" y="0" width="680" height="412" fill="#ffffff"/>

  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">一条 SQL 的完整路径：读与写</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">对应 001 §1.2 · 右列即 §1.5.4</text>
  <text x="32" y="48" font-size="9" fill="#4A4945">左列是 SELECT 自上而下的 7 个环节；右列把第 6 步展开，写请求每步落一种日志。</text>

  <text x="16" y="80" font-size="9.5" font-weight="600" fill="#1F4468">① 读路径：一条 SELECT 经过的 7 个环节</text>
  <text x="348" y="80" font-size="9.5" font-weight="600" fill="#7A4A12">② 写路径：第 6 步展开，一次提交落三种日志</text>

  <circle cx="28" cy="109" r="8" fill="#CFCCC2"/>
  <text x="28" y="112" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="46" y="112" font-size="8.5" font-weight="600" fill="#2B2A27">连接层</text>
  <text x="324" y="112" font-size="7" fill="#8C8980" text-anchor="end">连接层</text>
  <text x="46" y="127" font-size="7" fill="#4A4945">TCP 握手 → 认证（用户名 / 密码 / host）→ 分配线程</text>

  <circle cx="28" cy="147" r="8" fill="#7FA6D0"/>
  <text x="28" y="150" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <text x="46" y="150" font-size="8.5" font-weight="600" fill="#1F4468">解析器</text>
  <text x="324" y="150" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="46" y="165" font-size="7" fill="#4A4945">词法拆出关键字、表名、列名；语法分析生成语法树</text>

  <circle cx="28" cy="185" r="8" fill="#7FA6D0"/>
  <text x="28" y="188" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <text x="46" y="188" font-size="8.5" font-weight="600" fill="#1F4468">预处理器</text>
  <text x="324" y="188" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="46" y="203" font-size="7" fill="#4A4945">校验表与列是否存在，把 * 展开为字段，再校验权限</text>

  <circle cx="28" cy="223" r="8" fill="#D9A458"/>
  <text x="28" y="226" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
  <text x="46" y="226" font-size="8.5" font-weight="600" fill="#7A4A12">优化器 ★</text>
  <text x="324" y="226" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="46" y="241" font-size="7" fill="#7A4A12">选哪个索引、定 JOIN 顺序，产出执行计划（即 EXPLAIN）</text>

  <circle cx="28" cy="261" r="8" fill="#7FA6D0"/>
  <text x="28" y="264" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
  <text x="46" y="264" font-size="8.5" font-weight="600" fill="#1F4468">执行器</text>
  <text x="324" y="264" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="46" y="279" font-size="7" fill="#4A4945">按执行计划调用存储引擎接口（Handler API），逐行取记录</text>

  <circle cx="28" cy="299" r="8" fill="#9C8ACB"/>
  <text x="28" y="302" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
  <text x="46" y="302" font-size="8.5" font-weight="600" fill="#46337A">InnoDB（存储引擎）</text>
  <text x="324" y="302" font-size="7" fill="#8C8980" text-anchor="end">引擎层</text>
  <text x="46" y="317" font-size="7" fill="#4A4945">查缓冲池 → 未命中则读 16KB 页 → 页内 B+ 树定位到行</text>

  <circle cx="28" cy="337" r="8" fill="#D9A458"/>
  <text x="28" y="340" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
  <text x="46" y="340" font-size="8.5" font-weight="600" fill="#7A4A12">返回结果集</text>
  <text x="324" y="340" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="46" y="355" font-size="7" fill="#4A4945">逐行发送给客户端；此后连接释放或归还连接池</text>

  <circle cx="360" cy="109" r="8" fill="#9C8ACB"/>
  <text x="360" y="112" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="378" y="112" font-size="8.5" font-weight="600" fill="#46337A">改缓冲池中的数据页</text>
  <text x="656" y="112" font-size="7" fill="#8C8980" text-anchor="end">InnoDB</text>
  <text x="378" y="127" font-size="7" fill="#4A4945">在内存里改，页变成脏页；此刻磁盘上还是旧值</text>

  <circle cx="360" cy="147" r="8" fill="#9C8ACB"/>
  <text x="360" y="150" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <text x="378" y="150" font-size="8.5" font-weight="600" fill="#46337A">写 undo log</text>
  <text x="656" y="150" font-size="7" fill="#8C8980" text-anchor="end">InnoDB</text>
  <text x="378" y="165" font-size="7" fill="#4A4945">记录修改前的旧值，供回滚与 MVCC 读旧版本</text>

  <circle cx="360" cy="185" r="8" fill="#9C8ACB"/>
  <text x="360" y="188" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <text x="378" y="188" font-size="8.5" font-weight="600" fill="#46337A">写 redo log，标记 prepare</text>
  <text x="656" y="188" font-size="7" fill="#8C8980" text-anchor="end">InnoDB</text>
  <text x="378" y="203" font-size="7" fill="#4A4945">物理页变更，崩溃恢复的依据；已落盘但未提交</text>

  <circle cx="360" cy="223" r="8" fill="#7FA6D0"/>
  <text x="360" y="226" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
  <text x="378" y="226" font-size="8.5" font-weight="600" fill="#1F4468">写 binlog</text>
  <text x="656" y="226" font-size="7" fill="#8C8980" text-anchor="end">Server 层</text>
  <text x="378" y="241" font-size="7" fill="#4A4945">逻辑变更，主从复制、时间点恢复、误删找回靠它</text>

  <circle cx="360" cy="261" r="8" fill="#D9A458"/>
  <text x="360" y="264" font-size="7.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
  <text x="378" y="264" font-size="8.5" font-weight="600" fill="#7A4A12">redo log 改为 commit</text>
  <text x="656" y="264" font-size="7" fill="#8C8980" text-anchor="end">InnoDB</text>
  <text x="378" y="279" font-size="7" fill="#4A4945">事务对上层可见，两阶段提交结束</text>

  <rect x="348" y="296" width="316" height="88" rx="4" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="360" y="314" font-size="9" font-weight="600" fill="#7A4A12">为什么 3 与 5 的顺序不能交换</text>
  <text x="360" y="332" font-size="7" fill="#4A4945">① 崩溃恢复先看 binlog：完整则提交，不完整则回滚</text>
  <text x="360" y="350" font-size="7" fill="#4A4945">② 唯一目标：主库与从库数据一致，不出现多写或少写</text>
  <text x="360" y="368" font-size="7" fill="#4A4945">③ 生产上 flush_log_at_trx_commit 与 sync_binlog 同为 1</text>

  <rect x="16" y="396" width="14" height="10" rx="2" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="36" y="405" font-size="7.5" fill="#4A4945">连接层</text>
  <rect x="120" y="396" width="14" height="10" rx="2" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="140" y="405" font-size="7.5" fill="#4A4945">Server 层</text>
  <rect x="240" y="396" width="14" height="10" rx="2" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="260" y="405" font-size="7.5" fill="#4A4945">存储引擎层（InnoDB）</text>
  <rect x="420" y="396" width="14" height="10" rx="2" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="440" y="405" font-size="7.5" fill="#4A4945">关键点 / 结果返回</text>

  </g>
</svg>
