<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822.35" viewBox="0 0 1200 822.35" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>数据库 6 大类与 24 个常用产品</title>
  <desc>六行版图：关系型 OLTP 拆成主流四家与国产六家；缓存与键值挡在读前面；文档型主流只有 MongoDB；分析型 MPP 服务报表与大屏；检索与时序覆盖日志与指标；HTAP 兼具交易与分析。</desc>
  <rect x="0" y="0" width="680" height="466" fill="#ffffff"/>

  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">数据库 6 大类 · 24 个常用产品</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">6 大类 · 24 个产品</text>
  <text x="32" y="48" font-size="9" fill="#4A4945">读法：一行 = 一个类别，每个胶囊 = 该类下一个常用产品；胶囊数量即生态规模。</text>

  <rect x="16" y="58" width="648" height="64" rx="5" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <circle cx="34" cy="76" r="11" fill="#1F4468"/>
  <text x="34" y="80" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
  <text x="52" y="74" font-size="9.5" font-weight="600" fill="#1F4468">关系型 OLTP</text>
  <text x="52" y="88" font-size="7.5" fill="#8C8980">业务主库</text>
  <text x="156" y="77.5" font-size="7.5" fill="#8C8980">主流</text>
  <rect x="180" y="64" width="46" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="203" y="77.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">MySQL</text>
  <rect x="232" y="64" width="72" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="268" y="77.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">PostgreSQL</text>
  <rect x="310" y="64" width="52" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="336" y="77.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">Oracle</text>
  <rect x="368" y="64" width="72" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="404" y="77.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">SQL Server</text>
  <text x="156" y="103.5" font-size="7.5" fill="#8C8980">国产</text>
  <rect x="180" y="90" width="40" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="200" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">达梦</text>
  <rect x="226" y="90" width="54" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="253" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">人大金仓</text>
  <rect x="286" y="90" width="68" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="320" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">openGauss</text>
  <rect x="360" y="90" width="58" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="389" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">GaussDB</text>
  <rect x="424" y="90" width="48" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="448" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">TDSQL</text>
  <rect x="478" y="90" width="62" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="509" y="103.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">GBase 8a</text>

  <rect x="16" y="130" width="648" height="44" rx="5" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1.2"/>
  <circle cx="34" cy="152" r="11" fill="#46337A"/>
  <text x="34" y="156" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
  <text x="52" y="150" font-size="9.5" font-weight="600" fill="#46337A">缓存 / 键值</text>
  <text x="52" y="164" font-size="7.5" fill="#8C8980">挡在读前面</text>
  <rect x="156" y="142" width="46" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="179" y="155.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">Redis</text>
  <rect x="208" y="142" width="42" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="229" y="155.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">etcd</text>

  <rect x="16" y="182" width="648" height="44" rx="5" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1.2"/>
  <circle cx="34" cy="204" r="11" fill="#4A4945"/>
  <text x="34" y="208" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
  <text x="52" y="202" font-size="9.5" font-weight="600" fill="#2B2A27">文档型</text>
  <text x="52" y="216" font-size="7.5" fill="#8C8980">无固定表结构</text>
  <rect x="156" y="194" width="58" height="20" rx="10" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="185" y="207.5" font-size="8.5" font-weight="600" fill="#2B2A27" text-anchor="middle">MongoDB</text>
  <text x="222" y="207.5" font-size="7.5" fill="#8C8980">主流基本只有这一个</text>

  <rect x="16" y="234" width="648" height="44" rx="5" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <circle cx="34" cy="256" r="11" fill="#1F4468"/>
  <text x="34" y="260" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
  <text x="52" y="254" font-size="9.5" font-weight="600" fill="#1F4468">分析型 MPP</text>
  <text x="52" y="268" font-size="7.5" fill="#8C8980">报表与大屏</text>
  <rect x="156" y="246" width="70" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="191" y="259.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">ClickHouse</text>
  <rect x="232" y="246" width="46" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="255" y="259.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">Doris</text>
  <rect x="284" y="246" width="66" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="317" y="259.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">StarRocks</text>
  <rect x="356" y="246" width="66" height="20" rx="10" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="389" y="259.5" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">Greenplum</text>

  <rect x="16" y="286" width="648" height="44" rx="5" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1.2"/>
  <circle cx="34" cy="308" r="11" fill="#46337A"/>
  <text x="34" y="312" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
  <text x="52" y="306" font-size="9.5" font-weight="600" fill="#46337A">检索与时序</text>
  <text x="52" y="320" font-size="7.5" fill="#8C8980">日志与指标</text>
  <rect x="156" y="298" width="88" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="200" y="311.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">Elasticsearch</text>
  <rect x="250" y="298" width="60" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="280" y="311.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">InfluxDB</text>
  <rect x="316" y="298" width="60" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="346" y="311.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">TDengine</text>
  <rect x="382" y="298" width="100" height="20" rx="10" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="432" y="311.5" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">VictoriaMetrics</text>

  <rect x="16" y="338" width="648" height="44" rx="5" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <circle cx="34" cy="360" r="11" fill="#7A4A12"/>
  <text x="34" y="364" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
  <text x="52" y="358" font-size="9.5" font-weight="600" fill="#7A4A12">HTAP</text>
  <text x="52" y="372" font-size="7.5" fill="#8C8980">交易分析一体</text>
  <rect x="156" y="350" width="42" height="20" rx="10" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="177" y="363.5" font-size="8.5" font-weight="600" fill="#7A4A12" text-anchor="middle">TiDB</text>
  <rect x="204" y="350" width="66" height="20" rx="10" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="237" y="363.5" font-size="8.5" font-weight="600" fill="#7A4A12" text-anchor="middle">OceanBase</text>
  <rect x="276" y="350" width="58" height="20" rx="10" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="305" y="363.5" font-size="8.5" font-weight="600" fill="#7A4A12" text-anchor="middle">PolarDB</text>

  <rect x="16" y="390" width="648" height="64" rx="4" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="28" y="410" font-size="8" fill="#4A4945">关系型拆「主流 / 国产」两组：国产库的运维经验不能直接从 MySQL 迁移，得先看它属于哪一派。</text>
  <text x="28" y="430" font-size="8" fill="#4A4945">OceanBase / PolarDB / TiDB 兼具交易与分析能力，故归 HTAP；只当交易库用时，按关系型对待即可。</text>
  <text x="28" y="446" font-size="7.5" fill="#8C8980">选型细节见 010 数据库选型；各家运维差异见 009 其他数据库。</text>

  </g>
</svg>
