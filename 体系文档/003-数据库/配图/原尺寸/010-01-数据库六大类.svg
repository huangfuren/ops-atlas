<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <title>数据库 6 大类与 24 个常用产品</title>
  <desc>六行版图：关系型 OLTP 是业务主库，拆成主流四家与国产六家；缓存与键值挡在读前面；文档型主流基本只有 MongoDB；分析型 MPP 服务报表与大屏；检索与时序覆盖日志与指标；HTAP 同时具备交易与分析能力。底部备注解释关系型为何拆两组、以及 TiDB、OceanBase、PolarDB 为何归入 HTAP。</desc>
  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="44" y="54" font-size="22" font-weight="bold" fill="#1b5e20">数据库 6 大类 · 24 个常用产品</text>
  <text x="44" y="84" font-size="12.5" fill="#546e7a">读法：一行 = 一个类别；每个胶囊 = 该类下的一个常用产品。产品数量即生态规模。</text>

  <!-- ① 关系型 OLTP -->
  <rect x="44" y="110" width="1112" height="120" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="78" cy="148" r="14" fill="#2e7d32"/>
  <text x="78" y="153" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="102" y="144" font-size="16" font-weight="bold" fill="#1b5e20">关系型 OLTP</text>
  <text x="102" y="168" font-size="11" fill="#546e7a">业务主库</text>
  <text x="320" y="146" font-size="11" fill="#78909c">主流</text>
  <rect x="352" y="122" width="60" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="382" y="145" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">MySQL</text>
  <rect x="424" y="122" width="96" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="472" y="145" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">PostgreSQL</text>
  <rect x="532" y="122" width="68" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="566" y="145" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">Oracle</text>
  <rect x="612" y="122" width="96" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="660" y="145" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">SQL Server</text>
  <text x="320" y="194" font-size="11" fill="#78909c">国产</text>
  <rect x="352" y="170" width="50" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="377" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">达梦</text>
  <rect x="414" y="170" width="76" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="452" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">人大金仓</text>
  <rect x="502" y="170" width="90" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="547" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">openGauss</text>
  <rect x="604" y="170" width="76" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="642" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">GaussDB</text>
  <rect x="692" y="170" width="60" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="722" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">TDSQL</text>
  <rect x="764" y="170" width="82" height="36" rx="18" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.2"/>
  <text x="805" y="193" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">GBase 8a</text>

  <!-- ② 缓存 / 键值 -->
  <rect x="44" y="246" width="1112" height="88" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="78" cy="282" r="14" fill="#1565c0"/>
  <text x="78" y="287" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="102" y="278" font-size="16" font-weight="bold" fill="#0d47a1">缓存 / 键值</text>
  <text x="102" y="302" font-size="11" fill="#546e7a">挡在读前面</text>
  <rect x="320" y="270" width="60" height="40" rx="20" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="350" y="295" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Redis</text>
  <rect x="392" y="270" width="54" height="40" rx="20" fill="#ffffff" stroke="#90caf9" stroke-width="1.2"/>
  <text x="419" y="295" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">etcd</text>

  <!-- ③ 文档型 -->
  <rect x="44" y="350" width="1112" height="88" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="78" cy="386" r="14" fill="#5e35b1"/>
  <text x="78" y="391" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="102" y="382" font-size="16" font-weight="bold" fill="#311b92">文档型</text>
  <text x="102" y="406" font-size="11" fill="#546e7a">无固定表结构</text>
  <rect x="320" y="374" width="76" height="40" rx="20" fill="#ffffff" stroke="#b39ddb" stroke-width="1.2"/>
  <text x="358" y="399" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">MongoDB</text>
  <text x="412" y="399" font-size="11" fill="#78909c">主流基本只有这一个</text>

  <!-- ④ 分析型 MPP -->
  <rect x="44" y="454" width="1112" height="88" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <circle cx="78" cy="490" r="14" fill="#f9a825"/>
  <text x="78" y="495" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="102" y="486" font-size="16" font-weight="bold" fill="#5d4700">分析型 MPP</text>
  <text x="102" y="510" font-size="11" fill="#546e7a">报表与大屏</text>
  <rect x="320" y="478" width="96" height="40" rx="20" fill="#ffffff" stroke="#ffe082" stroke-width="1.2"/>
  <text x="368" y="503" font-size="13" font-weight="bold" fill="#5d4700" text-anchor="middle">ClickHouse</text>
  <rect x="428" y="478" width="60" height="40" rx="20" fill="#ffffff" stroke="#ffe082" stroke-width="1.2"/>
  <text x="458" y="503" font-size="13" font-weight="bold" fill="#5d4700" text-anchor="middle">Doris</text>
  <rect x="500" y="478" width="90" height="40" rx="20" fill="#ffffff" stroke="#ffe082" stroke-width="1.2"/>
  <text x="545" y="503" font-size="13" font-weight="bold" fill="#5d4700" text-anchor="middle">StarRocks</text>
  <rect x="602" y="478" width="90" height="40" rx="20" fill="#ffffff" stroke="#ffe082" stroke-width="1.2"/>
  <text x="647" y="503" font-size="13" font-weight="bold" fill="#5d4700" text-anchor="middle">Greenplum</text>

  <!-- ⑤ 检索与时序 -->
  <rect x="44" y="558" width="1112" height="88" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <circle cx="78" cy="594" r="14" fill="#607d8b"/>
  <text x="78" y="599" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="102" y="590" font-size="16" font-weight="bold" fill="#37474f">检索与时序</text>
  <text x="102" y="614" font-size="11" fill="#546e7a">日志与指标</text>
  <rect x="320" y="582" width="118" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="379" y="607" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">Elasticsearch</text>
  <rect x="450" y="582" width="82" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="491" y="607" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">InfluxDB</text>
  <rect x="544" y="582" width="82" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="585" y="607" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">TDengine</text>
  <rect x="638" y="582" width="132" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
  <text x="704" y="607" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">VictoriaMetrics</text>

  <!-- ⑥ HTAP -->
  <rect x="44" y="662" width="1112" height="88" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="78" cy="698" r="14" fill="#e65100"/>
  <text x="78" y="703" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="102" y="694" font-size="16" font-weight="bold" fill="#7f3f00">HTAP</text>
  <text x="102" y="718" font-size="11" fill="#546e7a">交易分析一体</text>
  <rect x="320" y="686" width="54" height="40" rx="20" fill="#ffffff" stroke="#ffcc80" stroke-width="1.2"/>
  <text x="347" y="711" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">TiDB</text>
  <rect x="386" y="686" width="90" height="40" rx="20" fill="#ffffff" stroke="#ffcc80" stroke-width="1.2"/>
  <text x="431" y="711" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">OceanBase</text>
  <rect x="488" y="686" width="76" height="40" rx="20" fill="#ffffff" stroke="#ffcc80" stroke-width="1.2"/>
  <text x="526" y="711" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">PolarDB</text>

  <!-- 底部备注 -->
  <rect x="44" y="766" width="1112" height="64" rx="10" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.2"/>
  <text x="64" y="792" font-size="12" fill="#5d4700">关系型一行拆成「主流 / 国产」两组，是因为国产库的运维经验不能直接从 MySQL 迁移过来，得看它属于哪一派。</text>
  <text x="64" y="814" font-size="12" fill="#5d4700">OceanBase、PolarDB、TiDB 同时具备交易与分析能力，故归 HTAP；若只当交易库用，按关系型对待即可。</text>
</svg>
