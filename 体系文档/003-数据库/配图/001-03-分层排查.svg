<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>MySQL 分层排查：症状 → 查哪里 → 具体命令</title>
  <desc>四层由外向内：连接层、Server 层、存储引擎层同属 mysqld 进程，物理层是进程外的磁盘文件。每层右侧给出该层的典型症状与排查命令。</desc>
  <rect x="0" y="0" width="680" height="478" fill="#ffffff"/>

  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">MySQL 分层排查：症状 → 查哪里 → 具体命令</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">对应 001 §1.1 · §1.3 · §1.4 · §1.7</text>
  <text x="32" y="48" font-size="9" fill="#4A4945">由外向内，每层只调下一层不越级；每层右侧是该层在运维视角下的典型症状与命令。</text>

  <rect x="16" y="56" width="648" height="24" rx="12" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="28" y="71" font-size="8.5" font-weight="600" fill="#2B2A27">客户端<tspan font-weight="normal" font-size="8" fill="#4A4945">　应用服务 / mysql 命令行 / GUI 工具 / 连接池　→ TCP 3306　→ mysqld 服务进程（① ② ③ 同属一个进程）</tspan></text>

  <rect x="16" y="88" width="648" height="68" rx="4" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1.2"/>
  <text x="26" y="104" font-size="9.5" font-weight="600" fill="#2B2A27">① 连接层</text>
  <text x="656" y="104" font-size="7" fill="#8C8980" text-anchor="end">只做接入：连接生命周期与身份认证</text>
  <rect x="26" y="112" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="68" y="128" font-size="8" font-weight="600" fill="#2B2A27" text-anchor="middle">连接管理</text>
  <text x="68" y="142" font-size="6.5" fill="#4A4945" text-anchor="middle">每条连接一线程</text>
  <rect x="116" y="112" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="158" y="128" font-size="8" font-weight="600" fill="#2B2A27" text-anchor="middle">身份认证</text>
  <text x="158" y="142" font-size="6.5" fill="#4A4945" text-anchor="middle">用户名 · 密码 · host</text>
  <rect x="206" y="112" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="248" y="128" font-size="8" font-weight="600" fill="#2B2A27" text-anchor="middle">权限校验</text>
  <text x="248" y="142" font-size="6.5" fill="#4A4945" text-anchor="middle">库表级 ACL</text>
  <rect x="296" y="112" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="338" y="128" font-size="8" font-weight="600" fill="#2B2A27" text-anchor="middle">线程分配</text>
  <text x="338" y="142" font-size="6.5" fill="#4A4945" text-anchor="middle">线程池（可选）</text>
  <rect x="392" y="112" width="264" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="402" y="126" font-size="7" fill="#7A322B">连接数打满 · 认证失败 · 连接被拒</text>
  <text x="402" y="141" font-size="6.5" font-family="Consolas, Menlo, monospace" fill="#1F4468">SHOW FULL PROCESSLIST · @@max_connections</text>

  <rect x="16" y="166" width="648" height="68" rx="4" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="26" y="182" font-size="9.5" font-weight="600" fill="#1F4468">② Server 层（SQL 层）</text>
  <text x="656" y="182" font-size="7" fill="#8C8980" text-anchor="end">只做逻辑：把 SQL 变成可执行的计划</text>
  <rect x="26" y="190" width="84" height="36" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="68" y="206" font-size="8" font-weight="600" fill="#1F4468" text-anchor="middle">解析器</text>
  <text x="68" y="220" font-size="6.5" fill="#4A4945" text-anchor="middle">词法 + 语法分析</text>
  <rect x="116" y="190" width="84" height="36" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="158" y="206" font-size="8" font-weight="600" fill="#1F4468" text-anchor="middle">预处理器</text>
  <text x="158" y="220" font-size="6.5" fill="#4A4945" text-anchor="middle">校验表列 · 展开 *</text>
  <rect x="206" y="190" width="84" height="36" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.3"/>
  <text x="248" y="206" font-size="8" font-weight="600" fill="#7A4A12" text-anchor="middle">优化器 ★</text>
  <text x="248" y="220" font-size="6.5" fill="#7A4A12" text-anchor="middle">选索引 · 定 JOIN</text>
  <rect x="296" y="190" width="84" height="36" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="338" y="206" font-size="8" font-weight="600" fill="#1F4468" text-anchor="middle">执行器</text>
  <text x="338" y="220" font-size="6.5" fill="#4A4945" text-anchor="middle">按计划调引擎接口</text>
  <rect x="392" y="190" width="264" height="36" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="402" y="204" font-size="7" fill="#7A322B">执行计划选错 · 函数报错 · 权限不足（90% 慢查询在此定性）</text>
  <text x="402" y="219" font-size="6.5" font-family="Consolas, Menlo, monospace" fill="#1F4468">EXPLAIN · SHOW GRANTS · PROCESSLIST</text>

  <rect x="16" y="244" width="648" height="68" rx="4" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1.2"/>
  <text x="26" y="260" font-size="9.5" font-weight="600" fill="#46337A">③ 存储引擎层（可插拔）</text>
  <text x="656" y="260" font-size="7" fill="#8C8980" text-anchor="end">只做物理：页 · 索引 · 事务 · 锁</text>
  <rect x="26" y="268" width="84" height="36" rx="3" fill="#ffffff" stroke="#46337A" stroke-width="1.3"/>
  <text x="68" y="284" font-size="8" font-weight="600" fill="#46337A" text-anchor="middle">InnoDB</text>
  <text x="68" y="298" font-size="6.5" fill="#4A4945" text-anchor="middle">默认 · 事务 · 行锁</text>
  <rect x="116" y="268" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="158" y="284" font-size="8" font-weight="600" fill="#4A4945" text-anchor="middle">MyISAM</text>
  <text x="158" y="298" font-size="6.5" fill="#8C8980" text-anchor="middle">无事务 · 只有表锁</text>
  <rect x="206" y="268" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="248" y="284" font-size="8" font-weight="600" fill="#4A4945" text-anchor="middle">Memory</text>
  <text x="248" y="298" font-size="6.5" fill="#8C8980" text-anchor="middle">内存表 · 重启即失</text>
  <rect x="296" y="268" width="84" height="36" rx="3" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="338" y="284" font-size="8" font-weight="600" fill="#46337A" text-anchor="middle">InnoDB 内部</text>
  <text x="338" y="298" font-size="6.5" fill="#4A4945" text-anchor="middle">缓冲池 · B+树 · MVCC</text>
  <rect x="392" y="268" width="264" height="36" rx="3" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="402" y="282" font-size="7" fill="#7A322B">锁等待 · 死锁 · 命中率低 · 磁盘 IO 高</text>
  <text x="402" y="297" font-size="6.5" font-family="Consolas, Menlo, monospace" fill="#46337A">SHOW ENGINE INNODB STATUS · GLOBAL STATUS</text>

  <rect x="16" y="322" width="648" height="68" rx="4" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="26" y="338" font-size="9.5" font-weight="600" fill="#7A4A12">④ 物理层：磁盘文件</text>
  <text x="656" y="338" font-size="7" fill="#8C8980" text-anchor="end">只做持久：所有变更最终落到这里（datadir）</text>
  <rect x="26" y="346" width="84" height="36" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="68" y="362" font-size="6.5" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">your_db/*.ibd</text>
  <text x="68" y="376" font-size="6.5" fill="#4A4945" text-anchor="middle">表数据与索引</text>
  <rect x="116" y="346" width="84" height="36" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="158" y="362" font-size="6.5" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">ibdata1 / redo</text>
  <text x="158" y="376" font-size="6.5" fill="#4A4945" text-anchor="middle">系统表空间 · redo</text>
  <rect x="206" y="346" width="84" height="36" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="248" y="362" font-size="6.5" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">binlog.000001</text>
  <text x="248" y="376" font-size="6.5" fill="#4A4945" text-anchor="middle">变更 · 复制 · 恢复</text>
  <rect x="296" y="346" width="84" height="36" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="338" y="362" font-size="6.5" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#4A4945" text-anchor="middle">error · slow.log</text>
  <text x="338" y="376" font-size="6.5" fill="#8C8980" text-anchor="middle">诊断日志</text>
  <rect x="392" y="346" width="264" height="36" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="402" y="360" font-size="7" fill="#7A322B">磁盘满 · binlog 堆积 · undo 膨胀</text>
  <text x="402" y="375" font-size="6.5" font-family="Consolas, Menlo, monospace" fill="#7A4A12">du -sh /var/lib/mysql · PURGE BINARY LOGS</text>

  <rect x="16" y="400" width="648" height="58" rx="4" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="26" y="414" font-size="8" font-weight="600" fill="#2B2A27">结构要点</text>
  <text x="26" y="427" font-size="7" fill="#4A4945">① 三层同属一个 mysqld 进程，磁盘在进程之外；存储引擎可插拔是 MySQL 与其他库的结构性差异。</text>
  <text x="26" y="440" font-size="7" fill="#4A4945">② 一次写跨两层落三种日志：undo / redo 在 InnoDB，binlog 在 Server 层，靠两阶段提交保证主从一致。</text>
  <text x="26" y="453" font-size="7" fill="#4A4945">③ 三层调优入口不重叠：连接层看配额，Server 层看选路（EXPLAIN），引擎层看内存（buffer pool）。</text>

  <text x="16" y="470" font-size="6.5" fill="#8C8980">注：命令需在对应实例上执行；SHOW ENGINE INNODB STATUS 输出较长，先看 TRANSACTIONS 段。</text>
</svg>
