<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>MySQL 主从复制：三个线程接力完成一次数据同步</title>
  <desc>业务写 binlog 由主库 dump 线程发出，经网络到从库 IO 线程落 relay log，再由 SQL 线程重放。延迟只可能出在主库 dump、网络、从库 SQL 重放三段之一。</desc>
  <rect x="0" y="0" width="680" height="364" fill="#ffffff"/>
  <defs>
    <marker id="a6Grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CFCCC2"/>
    </marker>
    <marker id="a6Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">MySQL 主从复制：三个线程接力</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">依据 MySQL 8.0 复制机制 · 对应 006 §1</text>
  <text x="32" y="48" font-size="9" fill="#4A4945">业务写 binlog → ① dump 发出 → 网络 → ② IO 落 relay log → ③ SQL 重放 → 从库数据</text>

  <rect x="16" y="56" width="300" height="136" rx="5" fill="#E4EEF9" fill-opacity="0.5" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="26" y="74" font-size="11" font-weight="600" fill="#1F4468">主库 Master</text>
  <text x="26" y="88" font-size="8" fill="#8C8980">产生 binlog 的一方</text>

  <rect x="24" y="96" width="89" height="76" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="68" y="120" font-size="8.5" font-weight="600" fill="#2B2A27" text-anchor="middle">业务写入</text>
  <text x="68" y="138" font-size="7.5" fill="#4A4945" text-anchor="middle">INSERT/UPDATE</text>
  <text x="68" y="154" font-size="7.5" fill="#8C8980" text-anchor="middle">产生变更事件</text>

  <rect x="121" y="96" width="89" height="76" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="165" y="120" font-size="8.5" font-weight="600" fill="#2B2A27" text-anchor="middle">binlog</text>
  <text x="165" y="138" font-size="7.5" fill="#4A4945" text-anchor="middle">二进制日志</text>
  <text x="165" y="154" font-size="7.5" fill="#8C8980" text-anchor="middle">按事务顺序追加</text>

  <rect x="218" y="96" width="89" height="76" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="262" y="118" font-size="8.5" font-weight="600" fill="#1F4468" text-anchor="middle">① Binlog Dump</text>
  <text x="262" y="136" font-size="7.5" fill="#1F4468" text-anchor="middle">读 binlog 发走</text>
  <text x="262" y="154" font-size="7.5" fill="#7A322B" text-anchor="middle">慢 = 主库压力大</text>

  <line x1="316" y1="134" x2="360" y2="134" stroke="#7FA6D0" stroke-width="1.6" marker-end="url(#a6Blue)"/>
  <text x="338" y="126" font-size="7.5" font-weight="600" fill="#1F4468" text-anchor="middle">网络</text>
  <text x="338" y="150" font-size="7" fill="#7A322B" text-anchor="middle">慢=带宽</text>

  <rect x="364" y="56" width="300" height="136" rx="5" fill="#ECE7F7" fill-opacity="0.45" stroke="#9C8ACB" stroke-width="1.2"/>
  <text x="374" y="74" font-size="11" font-weight="600" fill="#46337A">从库 Slave</text>
  <text x="374" y="88" font-size="8" fill="#8C8980">重放 binlog 的一方</text>

  <rect x="372" y="96" width="65" height="76" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1.2"/>
  <text x="404" y="118" font-size="8.5" font-weight="600" fill="#46337A" text-anchor="middle">② IO Thread</text>
  <text x="404" y="136" font-size="7.5" fill="#46337A" text-anchor="middle">接收并落盘</text>
  <text x="404" y="154" font-size="7.5" fill="#8C8980" text-anchor="middle">通常不是瓶颈</text>

  <rect x="445" y="96" width="65" height="76" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="477" y="118" font-size="8.5" font-weight="600" fill="#2B2A27" text-anchor="middle">relay log</text>
  <text x="477" y="136" font-size="7.5" fill="#4A4945" text-anchor="middle">中继日志</text>
  <text x="477" y="154" font-size="7.5" fill="#8C8980" text-anchor="middle">等 ③ 重放</text>

  <rect x="518" y="96" width="65" height="76" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="550" y="118" font-size="8.5" font-weight="600" fill="#7A4A12" text-anchor="middle">③ SQL Thread</text>
  <text x="550" y="136" font-size="7.5" fill="#7A4A12" text-anchor="middle">重放 SQL</text>
  <text x="550" y="154" font-size="7.5" fill="#7A4A12" text-anchor="middle">★ 最常见瓶颈</text>

  <rect x="591" y="96" width="65" height="76" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="623" y="118" font-size="8.5" font-weight="600" fill="#2B2A27" text-anchor="middle">从库数据</text>
  <text x="623" y="136" font-size="7.5" fill="#4A4945" text-anchor="middle">与主库一致</text>
  <text x="623" y="154" font-size="7.5" fill="#8C8980" text-anchor="middle">异步：有延迟</text>

  <rect x="16" y="208" width="648" height="94" rx="4" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="28" y="230" font-size="10.5" font-weight="600" fill="#7A4A12">延迟只可能出在三段中的一段——主库 dump、网络、从库 SQL 重放</text>
  <text x="28" y="252" font-size="8.5" fill="#4A4945">① 慢 = 主库压力大　｜　网络慢 = 带宽或 RTT　｜　③ 慢 = 从库性能不够或有大事务</text>
  <text x="28" y="272" font-size="8.5" fill="#4A4945">② IO 线程只搬字节、不执行 SQL，几乎从不成为瓶颈——排查时可以直接跳过它</text>
  <text x="28" y="290" font-size="8" fill="#8C8980">注：异步复制下从库天然落后主库一个网络往返；半同步只保证「至少一个从库收到」，不保证已重放。</text>

  <rect x="20" y="320" width="14" height="10" rx="2" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="40" y="329" font-size="8" fill="#4A4945">数据 / 日志载体</text>
  <rect x="160" y="320" width="14" height="10" rx="2" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="180" y="329" font-size="8" fill="#4A4945">主库侧线程</text>
  <rect x="290" y="320" width="14" height="10" rx="2" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="310" y="329" font-size="8" fill="#4A4945">从库侧线程</text>
  <rect x="420" y="320" width="14" height="10" rx="2" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="440" y="329" font-size="8" fill="#4A4945">已知瓶颈点</text>
  <text x="540" y="329" font-size="8" fill="#7A322B">红字 = 延迟来源</text>
</svg>
