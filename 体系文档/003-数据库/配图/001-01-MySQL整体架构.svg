<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="952.94" viewBox="0 0 1200 952.94" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>MySQL 架构：三层服务 + 物理层</title>
  <desc>自上而下四层：连接层、Server 层、存储引擎层同处一个 mysqld 进程内，物理层是进程之外的磁盘文件。</desc>
  <rect x="0" y="0" width="680" height="540" fill="#ffffff"/>
  <defs>
    <marker id="a1Blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a1Purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9C8ACB"/>
    </marker>
    <marker id="a1Amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9A458"/>
    </marker>
  </defs>

  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">MySQL 架构：三层服务 + 物理层</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">① ② ③ 在进程内 · ④ 在进程外</text>
  <text x="32" y="48" font-size="9" fill="#4A4945">自上而下：接入 → 逻辑 → 物理 → 持久；每层只调下一层，不越级。</text>

  <rect x="20" y="62" width="640" height="28" rx="14" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="30" y="80" font-size="10" font-weight="600" fill="#2B2A27">客户端<tspan font-weight="normal" font-size="9" fill="#4A4945">　应用服务 · mysql CLI · GUI 工具 · 连接池</tspan></text>

  <line x1="340" y1="90" x2="340" y2="108" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a1Blue)"/>
  <text x="348" y="104" font-size="8" fill="#1F4468">TCP 3306</text>

  <rect x="20" y="112" width="640" height="294" rx="6" fill="#FCFCFA" stroke="#EDEAE2" stroke-width="1"/>
  <text x="28" y="124" font-size="8" fill="#8C8980">mysqld 服务进程</text>

  <rect x="28" y="128" width="624" height="78" rx="4" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="38" y="144" font-size="11" font-weight="600" fill="#1F4468">① 连接层</text>
  <text x="644" y="144" font-size="8" fill="#8C8980" text-anchor="end">接入与认证：连接数 · 账号 · 权限</text>

  <rect x="36" y="154" width="196" height="42" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="134" y="172" font-size="10" font-weight="600" fill="#1F4468" text-anchor="middle">连接管理</text>
  <text x="134" y="188" font-size="8" fill="#4A4945" text-anchor="middle">一连接一线程</text>
  <rect x="242" y="154" width="196" height="42" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="340" y="172" font-size="10" font-weight="600" fill="#1F4468" text-anchor="middle">身份认证</text>
  <text x="340" y="188" font-size="8" fill="#4A4945" text-anchor="middle">用户名 · 密码 · host</text>
  <rect x="448" y="154" width="196" height="42" rx="3" fill="#ffffff" stroke="#7FA6D0" stroke-width="1"/>
  <text x="546" y="172" font-size="10" font-weight="600" fill="#1F4468" text-anchor="middle">权限校验</text>
  <text x="546" y="188" font-size="8" fill="#4A4945" text-anchor="middle">库表级 ACL</text>

  <line x1="340" y1="206" x2="340" y2="220" stroke="#9C8ACB" stroke-width="1.2" marker-end="url(#a1Purple)"/>

  <rect x="28" y="222" width="624" height="78" rx="4" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1.2"/>
  <text x="38" y="238" font-size="11" font-weight="600" fill="#46337A">② Server 层</text>
  <text x="644" y="238" font-size="8" fill="#8C8980" text-anchor="end">把 SQL 变成可执行计划</text>

  <rect x="37" y="248" width="147" height="42" rx="3" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="111" y="266" font-size="10" font-weight="600" fill="#46337A" text-anchor="middle">解析器</text>
  <text x="111" y="282" font-size="8" fill="#4A4945" text-anchor="middle">词法 + 语法分析</text>
  <rect x="190" y="248" width="147" height="42" rx="3" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="264" y="266" font-size="10" font-weight="600" fill="#46337A" text-anchor="middle">预处理器</text>
  <text x="264" y="282" font-size="8" fill="#4A4945" text-anchor="middle">校验表列 · 展开 · 授权</text>
  <rect x="343" y="248" width="147" height="42" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="417" y="266" font-size="10" font-weight="600" fill="#7A4A12" text-anchor="middle">优化器 ★</text>
  <text x="417" y="282" font-size="8" fill="#7A4A12" text-anchor="middle">选索引 · JOIN 顺序</text>
  <rect x="496" y="248" width="147" height="42" rx="3" fill="#ffffff" stroke="#9C8ACB" stroke-width="1"/>
  <text x="570" y="266" font-size="10" font-weight="600" fill="#46337A" text-anchor="middle">执行器</text>
  <text x="570" y="282" font-size="8" fill="#4A4945" text-anchor="middle">按计划调引擎</text>

  <line x1="340" y1="300" x2="340" y2="318" stroke="#9C8ACB" stroke-width="1.2" marker-end="url(#a1Purple)"/>
  <text x="348" y="314" font-size="8" fill="#46337A">Handler API</text>

  <rect x="28" y="320" width="624" height="78" rx="4" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1.2"/>
  <text x="38" y="336" font-size="11" font-weight="600" fill="#2B2A27">③ 存储引擎层</text>
  <text x="644" y="336" font-size="8" fill="#8C8980" text-anchor="end">可插拔：页 · 索引 · 事务 · 锁</text>

  <rect x="36" y="346" width="196" height="42" rx="3" fill="#ECE7F7" stroke="#46337A" stroke-width="1.4"/>
  <text x="134" y="364" font-size="10" font-weight="600" fill="#46337A" text-anchor="middle">InnoDB</text>
  <text x="134" y="380" font-size="8" fill="#4A4945" text-anchor="middle">默认引擎 · 事务 · 行锁 · 崩溃恢复</text>
  <rect x="242" y="346" width="196" height="42" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="340" y="364" font-size="10" font-weight="600" fill="#4A4945" text-anchor="middle">MyISAM</text>
  <text x="340" y="380" font-size="8" fill="#8C8980" text-anchor="middle">无事务 · 只有表锁</text>
  <rect x="448" y="346" width="196" height="42" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="546" y="364" font-size="10" font-weight="600" fill="#4A4945" text-anchor="middle">Memory</text>
  <text x="546" y="380" font-size="8" fill="#8C8980" text-anchor="middle">内存表 · 重启即失</text>

  <line x1="340" y1="398" x2="340" y2="420" stroke="#D9A458" stroke-width="1.2" marker-end="url(#a1Amber)"/>
  <text x="348" y="414" font-size="8" fill="#7A4A12">读 16KB 数据页 / 刷脏页</text>

  <rect x="20" y="430" width="640" height="78" rx="4" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="30" y="446" font-size="11" font-weight="600" fill="#7A4A12">④ 物理层：磁盘文件</text>
  <text x="652" y="446" font-size="8" fill="#8C8980" text-anchor="end">所有变更最终落在这里（datadir）</text>

  <rect x="37" y="456" width="147" height="42" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="111" y="474" font-size="9" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">your_db/*.ibd</text>
  <text x="111" y="490" font-size="8" fill="#4A4945" text-anchor="middle">表数据与索引</text>
  <rect x="190" y="456" width="147" height="42" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="264" y="474" font-size="8.5" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">ibdata1 / ib_logfile0</text>
  <text x="264" y="490" font-size="8" fill="#4A4945" text-anchor="middle">系统表空间 · redo 日志</text>
  <rect x="343" y="456" width="147" height="42" rx="3" fill="#ffffff" stroke="#D9A458" stroke-width="1"/>
  <text x="417" y="474" font-size="9" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#7A4A12" text-anchor="middle">binlog.000001</text>
  <text x="417" y="490" font-size="8" fill="#4A4945" text-anchor="middle">变更 · 主从 · 恢复</text>
  <rect x="496" y="456" width="147" height="42" rx="3" fill="#ffffff" stroke="#CFCCC2" stroke-width="1"/>
  <text x="570" y="474" font-size="9" font-family="Consolas, Menlo, monospace" font-weight="600" fill="#4A4945" text-anchor="middle">error · slow.log</text>
  <text x="570" y="490" font-size="8" fill="#8C8980" text-anchor="middle">诊断日志</text>

  <text x="32" y="528" font-size="9" fill="#4A4945">调优入口各看一层：连接层看配额（max_connections）· Server 层看选路（EXPLAIN）· 引擎层看内存（buffer pool）。</text>

  </g>
</svg>
