<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1005"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>MySQL 整体架构：三层服务加物理层</title>
  <desc>客户端经 TCP 3306 进入 mysqld，依次穿过连接层、Server 层、存储引擎层，三层同属一个进程；物理层是进程之外的磁盘文件。每层只调下一层，不越级。优化器是全图关键点，MyISAM 与 Memory 标灰表示本板块不用。</desc>

  <!-- 坐标表：画布 1200x1005 | 客户端胶囊 350,92 500x52 | mysqld 30,184 1140x452 |
       图层 x=46 w=1112：① y=214 / ② y=354 / ③ y=494，各 h=126，卡片 y=层y+38 h=72 |
       四卡行 w=260 x=62/334/606/878；三卡行 w=350 x=62/425/788 |
       ④ 物理层 30,672 1140x128，卡片 y=712 | 结论 822 h=76 | 图例 914 h=65 -->

  <rect x="0" y="0" width="1200" height="1005" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#1b5e20">MySQL 架构：三层服务 + 物理层</text>
  <text x="30" y="68" font-size="12" fill="#616161">前三层是同一个 mysqld 进程内部的划分，第四层在进程之外；每层只调下一层，不越级（MySQL 8.0 / InnoDB）</text>

  <!-- 客户端 -->
  <rect x="350" y="92" width="500" height="52" rx="26" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="600" y="125" font-size="17" font-weight="bold" fill="#37474f" text-anchor="middle">👤 客户端：应用服务 / mysql CLI / 连接池</text>
  <line x1="600" y1="148" x2="600" y2="176" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="168" font-size="11" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">TCP 3306</text>

  <!-- mysqld 进程边界 -->
  <rect x="30" y="184" width="1140" height="452" rx="12"
        fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="46" y="208" font-size="12" fill="#4e6b50">mysqld 单进程：①②③ 都在这里，④ 不在</text>

  <!-- ① 连接层 -->
  <rect x="46" y="214" width="1108" height="126" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="62" y="242" font-size="17" font-weight="bold" fill="#0d47a1">① 连接层</text>
  <text x="1138" y="242" font-size="11.5" fill="#616161" text-anchor="end">只做接入：连接生命周期与身份认证</text>

  <rect x="62" y="252" width="350" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <g>
    <text x="237" y="281" font-size="15" text-anchor="middle" font-weight="bold" fill="#0d2f5c">连接管理</text>
    <text x="237" y="303" font-size="11.5" text-anchor="middle" fill="#37474f">一连接一线程 · 上限 max_connections</text>
  </g>
  <rect x="425" y="252" width="350" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <g>
    <text x="600" y="281" font-size="15" text-anchor="middle" font-weight="bold" fill="#0d2f5c">身份认证</text>
    <text x="600" y="303" font-size="11.5" text-anchor="middle" fill="#37474f">用户名 / 密码 / host，失败先看这里</text>
  </g>
  <rect x="788" y="252" width="350" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <g>
    <text x="963" y="281" font-size="15" text-anchor="middle" font-weight="bold" fill="#0d2f5c">线程分配</text>
    <text x="963" y="303" font-size="11.5" text-anchor="middle" fill="#37474f">Too many connections 出在这一层</text>
  </g>

  <!-- ② Server 层 -->
  <rect x="46" y="354" width="1108" height="126" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="62" y="382" font-size="17" font-weight="bold" fill="#1b5e20">② Server 层</text>
  <text x="1138" y="382" font-size="11.5" fill="#616161" text-anchor="end">只做逻辑：把 SQL 变成可执行的执行计划</text>

  <rect x="62" y="392" width="260" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <g>
    <text x="192" y="421" font-size="15" text-anchor="middle" font-weight="bold" fill="#123314">解析器</text>
    <text x="192" y="443" font-size="11.5" text-anchor="middle" fill="#37474f">词法 + 语法分析</text>
  </g>
  <rect x="334" y="392" width="260" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <g>
    <text x="464" y="421" font-size="15" text-anchor="middle" font-weight="bold" fill="#123314">预处理器</text>
    <text x="464" y="443" font-size="11.5" text-anchor="middle" fill="#37474f">校验表列 · 展开 * · 授权</text>
  </g>
  <rect x="606" y="392" width="260" height="72" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <g>
    <text x="736" y="421" font-size="15" text-anchor="middle" font-weight="bold" fill="#7f3f00">优化器 ★</text>
    <text x="736" y="443" font-size="11.5" text-anchor="middle" fill="#7f3f00">选索引 · 定 JOIN 顺序</text>
  </g>
  <rect x="878" y="392" width="260" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <g>
    <text x="1008" y="421" font-size="15" text-anchor="middle" font-weight="bold" fill="#123314">执行器</text>
    <text x="1008" y="443" font-size="11.5" text-anchor="middle" fill="#37474f">按执行计划调引擎</text>
  </g>
  <line x1="600" y1="340" x2="600" y2="352" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="480" x2="600" y2="492" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ③ 存储引擎层 -->
  <rect x="46" y="494" width="1108" height="126" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="62" y="522" font-size="17" font-weight="bold" fill="#311b92">③ 存储引擎层</text>
  <text x="1138" y="522" font-size="11.5" fill="#616161" text-anchor="end">可插拔：页 · 索引 · 事务 · 锁，实际只有 InnoDB 在用</text>

  <rect x="62" y="532" width="350" height="72" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <g>
    <text x="237" y="561" font-size="15" text-anchor="middle" font-weight="bold" fill="#311b92">InnoDB</text>
    <text x="237" y="583" font-size="11.5" text-anchor="middle" fill="#37474f">事务 · 行锁 · 崩溃恢复</text>
  </g>
  <rect x="425" y="532" width="350" height="72" rx="4" fill="#f5f5f5" stroke="#bdbdbd"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g>
    <text x="600" y="561" font-size="15" text-anchor="middle" font-weight="bold" fill="#616161">MyISAM</text>
    <text x="600" y="583" font-size="11.5" text-anchor="middle" fill="#757575">无事务 · 只有表锁（不用）</text>
  </g>
  <rect x="788" y="532" width="350" height="72" rx="4" fill="#f5f5f5" stroke="#bdbdbd"
        stroke-width="1" stroke-dasharray="4 3"/>
  <g>
    <text x="963" y="561" font-size="15" text-anchor="middle" font-weight="bold" fill="#616161">Memory</text>
    <text x="963" y="583" font-size="11.5" text-anchor="middle" fill="#757575">内存表 · 重启即失（不用）</text>
  </g>

  <!-- 进程边界 → 物理层 -->
  <line x1="600" y1="636" x2="600" y2="666" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="658" font-size="11" fill="#616161">读 16KB 数据页 · 刷脏页</text>

  <!-- ④ 物理层 -->
  <rect x="30" y="672" width="1140" height="128" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="700" font-size="17" font-weight="bold" fill="#8d6e00">④ 物理层：磁盘文件</text>
  <text x="1154" y="700" font-size="11.5" fill="#616161" text-anchor="end">进程之外：所有变更最终落到 datadir</text>

  <rect x="62" y="712" width="260" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <g>
    <text x="192" y="741" font-size="13" text-anchor="middle" font-weight="bold" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">your_db/*.ibd</text>
    <text x="192" y="763" font-size="11.5" text-anchor="middle" fill="#5d4700">表数据与索引</text>
  </g>
  <rect x="334" y="712" width="260" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <g>
    <text x="464" y="741" font-size="13" text-anchor="middle" font-weight="bold" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">ibdata1 · redo</text>
    <text x="464" y="763" font-size="11.5" text-anchor="middle" fill="#5d4700">系统表空间 · redo 日志</text>
  </g>
  <rect x="606" y="712" width="260" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <g>
    <text x="736" y="741" font-size="13" text-anchor="middle" font-weight="bold" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">binlog.000001</text>
    <text x="736" y="763" font-size="11.5" text-anchor="middle" fill="#5d4700">变更 · 复制 · 恢复</text>
  </g>
  <rect x="878" y="712" width="260" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <g>
    <text x="1008" y="741" font-size="13" text-anchor="middle" font-weight="bold" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">error · slow.log</text>
    <text x="1008" y="763" font-size="11.5" text-anchor="middle" fill="#5d4700">诊断日志</text>
  </g>

  <!-- 结论 -->
  <rect x="30" y="822" width="1140" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="46" y="848" font-size="15" font-weight="bold" fill="#bf360c">★ 每层只调下一层，不越级；出问题先按层定位，再换层看</text>
  <text x="46" y="872" font-size="12.5" fill="#5d4037">· 连接层看配额（max_connections）、Server 层看选路（EXPLAIN）、引擎层看内存（buffer pool）——三层调优入口不重叠</text>
  <text x="46" y="891" font-size="12.5" fill="#5d4037">· 一次写要落三种日志：undo / redo 在 InnoDB，binlog 在 Server 层，靠两阶段提交保证主从一致</text>

  <!-- 图例 -->
  <rect x="30" y="914" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="929" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="72" y="940" font-size="12" fill="#37474f">接入 / 认证</text>
  <rect x="227" y="929" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="259" y="940" font-size="12" fill="#37474f">Server 层组件</text>
  <rect x="413" y="929" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="445" y="940" font-size="12" fill="#37474f">关键节点 ★</text>
  <rect x="600" y="929" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="632" y="940" font-size="12" fill="#37474f">默认存储引擎</text>
  <rect x="787" y="929" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="819" y="940" font-size="12" fill="#37474f">磁盘文件</text>
  <rect x="973" y="929" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd"
        stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1005" y="940" font-size="12" fill="#37474f">存在但不选用</text>
</svg>
