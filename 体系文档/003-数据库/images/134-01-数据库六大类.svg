<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 939"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>数据库 6 大类与 24 个常用产品</title>
  <desc>六行版图：关系型 OLTP 拆主流四家与国产六家；缓存与键值挡在读前面；文档型主流只有 MongoDB；分析型 MPP 供报表与大屏；检索与时序覆盖日志与指标；HTAP 兼具交易与分析。橙色的 MySQL 是本板块主线，紫色是国产生态。</desc>

  <!-- 坐标表：画布 1200x939 | 行容器 x=30 w=1140 | 行1 y=100 h=124（主流 y=128 / 国产 y=170）|
       行2 y=238 / 行3 y=336 / 行4 y=434 / 行5 y=532 / 行6 y=630，各 h=84 |
       类别列 x=46 | 胶囊 x=250 起，间距 10，h=32 rx=16 | 结论 738 h=92 | 图例 850 h=65 -->

  <rect x="0" y="0" width="1200" height="939" fill="#ffffff"/>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#1b5e20">数据库 6 大类 · 24 个常用产品</text>
  <text x="30" y="68" font-size="12" fill="#616161">一行一个类别，一个胶囊一个产品；胶囊数量即生态规模。这一张是版图，不是推荐清单</text>

  <!-- ① 关系型 OLTP -->
  <rect x="30" y="100" width="1140" height="124" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="140" font-size="15" font-weight="bold" fill="#1b5e20">① 关系型 OLTP</text>
  <text x="46" y="164" font-size="11" fill="#616161">业务主库</text>
  <text x="46" y="186" font-size="11" fill="#616161">运维主战场</text>
  <text x="196" y="151" font-size="11" fill="#616161">主流</text>
  <text x="196" y="193" font-size="11" fill="#616161">国产</text>

  <rect x="413" y="128" width="58" height="32" rx="16" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="442" y="149" font-size="11.5" font-weight="bold" fill="#7f3f00" text-anchor="middle">MySQL</text>
  <rect x="495" y="128" width="90" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="540" y="149" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">PostgreSQL</text>
  <rect x="609" y="128" width="64" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="641" y="149" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">Oracle</text>
  <rect x="697" y="128" width="90" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="742" y="149" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">SQL Server</text>

  <rect x="355.5" y="170" width="49" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="380" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">达梦</text>
  <rect x="420.5" y="170" width="72" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="456.5" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">人大金仓</text>
  <rect x="508.5" y="170" width="83" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="550" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">openGauss</text>
  <rect x="607.5" y="170" width="70" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="642.5" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">GaussDB</text>
  <rect x="693.5" y="170" width="58" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="722.5" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">TDSQL</text>
  <rect x="767.5" y="170" width="77" height="32" rx="16" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="806" y="191" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">GBase 8a</text>
  <text x="860" y="191" font-size="11" fill="#616161">国产库不是一套经验，先看它属于哪一派</text>

  <!-- ② 缓存 / 键值 -->
  <rect x="30" y="238" width="1140" height="84" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="272" font-size="15" font-weight="bold" fill="#1b5e20">② 缓存 / 键值</text>
  <text x="46" y="294" font-size="11" fill="#616161">挡在读前面</text>
  <rect x="250" y="264" width="58" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="279" y="285" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">Redis</text>
  <rect x="318" y="264" width="47" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="341" y="285" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">etcd</text>
  <text x="385" y="285" font-size="11" fill="#616161">不算数据库，但读流量的第一道闸门；Redis 深入见 014 板块</text>

  <!-- ③ 文档型 -->
  <rect x="30" y="336" width="1140" height="84" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="370" font-size="15" font-weight="bold" fill="#1b5e20">③ 文档型</text>
  <text x="46" y="392" font-size="11" fill="#616161">无固定表结构</text>
  <rect x="250" y="362" width="70" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="285" y="383" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">MongoDB</text>
  <text x="338" y="383" font-size="11" fill="#616161">主流基本只有这一个，运维差异见 133</text>

  <!-- ④ 分析型 MPP -->
  <rect x="30" y="434" width="1140" height="84" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="468" font-size="15" font-weight="bold" fill="#1b5e20">④ 分析型 MPP</text>
  <text x="46" y="490" font-size="11" fill="#616161">报表与大屏</text>
  <rect x="250" y="460" width="89" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="294" y="481" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">ClickHouse</text>
  <rect x="349" y="460" width="58" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="378" y="481" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">Doris</text>
  <rect x="417" y="460" width="83" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="458" y="481" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">StarRocks</text>
  <rect x="510" y="460" width="83" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="551" y="481" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">Greenplum</text>
  <text x="608" y="481" font-size="11" fill="#616161">列存 + 并行，适合全表聚合，不适合单行事务</text>

  <!-- ⑤ 检索与时序 -->
  <rect x="30" y="532" width="1140" height="84" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="566" font-size="15" font-weight="bold" fill="#1b5e20">⑤ 检索与时序</text>
  <text x="46" y="588" font-size="11" fill="#616161">日志与指标</text>
  <rect x="250" y="558" width="108" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="304" y="579" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">Elasticsearch</text>
  <rect x="368" y="558" width="77" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="406" y="579" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">InfluxDB</text>
  <rect x="455" y="558" width="77" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="493" y="579" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">TDengine</text>
  <rect x="542" y="558" width="121" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="602" y="579" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">VictoriaMetrics</text>
  <text x="678" y="579" font-size="11" fill="#616161">写多读少、按时间过期，和业务库的调优思路相反</text>

  <!-- ⑥ HTAP -->
  <rect x="30" y="630" width="1140" height="84" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="46" y="664" font-size="15" font-weight="bold" fill="#1b5e20">⑥ HTAP</text>
  <text x="46" y="686" font-size="11" fill="#616161">交易分析一体</text>
  <rect x="250" y="656" width="51" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="275" y="677" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">TiDB</text>
  <rect x="311" y="656" width="83" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="352" y="677" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">OceanBase</text>
  <rect x="404" y="656" width="70" height="32" rx="16" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="439" y="677" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">PolarDB</text>
  <text x="490" y="677" font-size="11" fill="#616161">三者都兼具交易与分析；只当交易库用时，按关系型对待即可</text>

  <!-- 结论 -->
  <rect x="30" y="738" width="1140" height="92" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="46" y="766" font-size="15" font-weight="bold" fill="#bf360c">★ 先定属于哪一类，再在类里挑产品；跨类比较没有意义</text>
  <text x="46" y="792" font-size="12.5" fill="#5d4037">· 关系型拆「主流 / 国产」两组：国产库不是一套经验，得先看它属于哪一派（PG 系 / MySQL 系 / Oracle 系）</text>
  <text x="46" y="813" font-size="12.5" fill="#5d4037">· 版图细节与撞墙逻辑在 134 §1-§2 与 §6-§8，各家运维差异在 133；这张图只负责让你知道「还有哪些类别」</text>

  <!-- 图例 -->
  <rect x="30" y="850" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="865" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="72" y="876" font-size="12" fill="#37474f">常用产品（按类归档）</text>
  <rect x="413" y="865" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="445" y="876" font-size="12" fill="#37474f">本板块主线：MySQL ★</text>
  <rect x="787" y="865" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="819" y="876" font-size="12" fill="#37474f">国产 / 信创生态</text>
</svg>
