<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 875"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>数据库板块十一册地图：导览、主线、数据保护、运维与生态</title>
  <desc>四行自上而下是阅读顺序：第一行导览与附录 3 册加术语表；第二行 110-MySQL 主线 4 册，是按一条 SQL 生命周期排列的 111 架构、112 SQL、113 索引、114 事务；第三行 120-数据保护 2 册，备份挂在落盘之后、复制挂在 binlog 之上；第四行 130-运维与生态 4 册，诊断、剧本、换库、选型。113 与 121 加粗标绿，是时间只够读两篇时的推荐组合。</desc>

  <!-- 坐标表：画布 1960x875 | 行容器 x=60 w=1840 h=110 | 行1 y=110 / 行2 y=254 / 行3 y=398 / 行4 y=542 | 行间距 34 |
       行间箭头 x=980，线 224~248 / 368~392 / 512~536 | 卡片 y=行y+15 h=80：4 册行 x=270 w=380 gap=30（270/680/1090/1500）；
       2 册行 x=270 w=785 gap=40（270/1095）| 结论块 y=676 h=86 | 图例 y=786 h=65 -->

  <rect x="0" y="0" width="1960" height="875" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <!-- ========== 标题 ========== -->
  <text x="60" y="52" font-size="20" font-weight="bold" fill="#0f172a">数据库十一册地图：先看地图，再进模块</text>
  <text x="60" y="84" font-size="12" fill="#616161">四行自上而下是阅读顺序，① → ② → ③ → ④ 即先读谁后读谁。★ = 时间只够读两篇时读这两册</text>

  <!-- ========== ① 导览与附录 ========== -->
  <rect x="60" y="110" width="1840" height="110" rx="12"
        fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="152" font-size="17" font-weight="bold" fill="#37474f">① 导览与附录</text>
  <text x="80" y="178" font-size="11" fill="#4e6b50">4 册 · 先看全局再进模块</text>
  <text x="80" y="200" font-size="11" fill="#4e6b50">190 只查不读</text>

  <rect x="270" y="125" width="380" height="80" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="288" y="149" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">001</text>
  <text x="332" y="149" font-size="15" font-weight="bold" fill="#0d2f5c">数据库全貌</text>
  <text x="288" y="173" font-size="11.5" fill="#37474f">十一册分工 · 学习路径</text>
  <text x="288" y="191" font-size="11" fill="#37474f">概念直觉 · 常见误解</text>

  <rect x="680" y="125" width="380" height="80" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="698" y="149" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">002</text>
  <text x="742" y="149" font-size="15" font-weight="bold" fill="#0d2f5c">数据保护方法论</text>
  <text x="698" y="173" font-size="11.5" fill="#37474f">RPO / RTO · 3-2-1 原则</text>
  <text x="698" y="191" font-size="11" fill="#37474f">备份与一致性判断的领域方法</text>

  <rect x="1090" y="125" width="380" height="80" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1108" y="149" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">003</text>
  <text x="1152" y="149" font-size="15" font-weight="bold" fill="#0d2f5c">数据库全景图 ★</text>
  <text x="1108" y="173" font-size="11.5" fill="#37474f">这张图 · 你在这里</text>
  <text x="1108" y="191" font-size="11" fill="#37474f">图例与阅读路线</text>

  <rect x="1500" y="125" width="380" height="80" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="1518" y="149" font-size="13" font-weight="bold" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">190</text>
  <text x="1562" y="149" font-size="15" font-weight="bold" fill="#5d4700">术语表</text>
  <text x="1518" y="173" font-size="11.5" fill="#5d4700">106 术语 · 15 缩写</text>
  <text x="1518" y="191" font-size="11" fill="#5d4700">16 对易混 · 19 条症状反查</text>

  <!-- 行1 → 行2 -->
  <line x1="980" y1="224" x2="980" y2="248" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ========== ② 110-MySQL 主线 ========== -->
  <rect x="60" y="254" width="1840" height="110" rx="12"
        fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="296" font-size="17" font-weight="bold" fill="#1b5e20">② 110-MySQL 主线</text>
  <text x="80" y="322" font-size="11" fill="#4e6b50">4 册 · 一条 SQL 的生命周期</text>
  <text x="80" y="344" font-size="11" fill="#4e6b50">进来 → 写对 → 查得快</text>

  <rect x="270" y="269" width="380" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="288" y="293" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">111</text>
  <text x="332" y="293" font-size="15" font-weight="bold" fill="#123314">架构与基础</text>
  <text x="288" y="317" font-size="11.5" fill="#37474f">三层架构 · InnoDB · 六种日志</text>
  <text x="288" y="335" font-size="11" fill="#2e5230">一条 SQL 从进来到落盘经过什么</text>

  <line x1="654" y1="309" x2="674" y2="309" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="680" y="269" width="380" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="698" y="293" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">112</text>
  <text x="742" y="293" font-size="15" font-weight="bold" fill="#123314">SQL 与数据类型</text>
  <text x="698" y="317" font-size="11.5" fill="#37474f">四个基本语句 · 危险操作姿势</text>
  <text x="698" y="335" font-size="11" fill="#2e5230">改数据前先想后果与回滚</text>

  <line x1="1064" y1="309" x2="1084" y2="309" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1090" y="269" width="380" height="80" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <text x="1108" y="293" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">113</text>
  <text x="1152" y="293" font-size="15" font-weight="bold" fill="#123314">索引与执行计划 ★</text>
  <text x="1108" y="317" font-size="11.5" fill="#37474f">B+ 树 · 最左前缀 · 失效八种</text>
  <text x="1108" y="335" font-size="11" fill="#2e5230">查询为什么慢，索引为什么没用</text>

  <line x1="1474" y1="309" x2="1494" y2="309" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="1500" y="269" width="380" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1518" y="293" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">114</text>
  <text x="1562" y="293" font-size="15" font-weight="bold" fill="#123314">事务锁与 MVCC</text>
  <text x="1518" y="317" font-size="11.5" fill="#37474f">隔离级别 · 锁兼容 · 死锁</text>
  <text x="1518" y="335" font-size="11" fill="#2e5230">并发为什么互相卡</text>

  <!-- 行2 → 行3 -->
  <line x1="980" y1="368" x2="980" y2="392" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="996" y="385" font-size="11" fill="#616161">外挂接：备份在落盘之后，复制在 binlog 之上</text>

  <!-- ========== ③ 120-数据保护 ========== -->
  <rect x="60" y="398" width="1840" height="110" rx="12"
        fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="440" font-size="17" font-weight="bold" fill="#1b5e20">③ 120-数据保护</text>
  <text x="80" y="466" font-size="11" fill="#4e6b50">2 册 · 出事救得回来</text>
  <text x="80" y="488" font-size="11" fill="#4e6b50">挂了顶得上，不改动主线</text>

  <rect x="270" y="413" width="785" height="80" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <text x="288" y="437" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">121</text>
  <text x="332" y="437" font-size="15" font-weight="bold" fill="#123314">备份恢复与数据迁移 ★</text>
  <text x="288" y="461" font-size="11.5" fill="#37474f">mysqldump · XtraBackup · binlog 时间点恢复</text>
  <text x="288" y="479" font-size="11" fill="#2e5230">误删怎么找回，换机器怎么搬</text>
  <text x="1037" y="461" font-size="10" fill="#616161" text-anchor="end">演练才叫备份，没演练只是备份文件</text>

  <rect x="1095" y="413" width="785" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1113" y="437" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">122</text>
  <text x="1157" y="437" font-size="15" font-weight="bold" fill="#123314">主从复制与高可用</text>
  <text x="1113" y="461" font-size="11.5" fill="#37474f">三个线程 · 异步 / 半同步 / MGR</text>
  <text x="1113" y="479" font-size="11" fill="#2e5230">延迟六大原因 · 切换 · 读写分离</text>
  <text x="1862" y="461" font-size="10" fill="#616161" text-anchor="end">延迟只可能出在 dump、网络、重放三段之一</text>

  <!-- 行3 → 行4 -->
  <line x1="980" y1="512" x2="980" y2="536" stroke="#607d8b" stroke-width="2"
