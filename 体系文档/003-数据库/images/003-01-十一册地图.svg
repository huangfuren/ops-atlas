  <text x="332" y="581" font-size="15" font-weight="bold" fill="#123314">性能诊断与优化</text>
  <text x="288" y="605" font-size="11.5" fill="#37474f">诊断顺序 · pt-query-digest</text>
  <text x="288" y="623" font-size="11" fill="#2e5230">从「慢」到根因的完整路径</text>

  <rect x="680" y="557" width="380" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="698" y="581" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">132</text>
  <text x="742" y="581" font-size="15" font-weight="bold" fill="#123314">日常运维与故障处理</text>
  <text x="698" y="605" font-size="11.5" fill="#37474f">巡检 · 变更规范 · 十个剧本</text>
  <text x="698" y="623" font-size="11" fill="#2e5230">日常做什么，出事按什么顺序</text>

  <rect x="1090" y="557" width="380" height="80" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1108" y="581" font-size="13" font-weight="bold" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">133</text>
  <text x="1152" y="581" font-size="15" font-weight="bold" fill="#311b92">其他数据库</text>
  <text x="1108" y="605" font-size="11.5" fill="#311b92">PG 十二差异 · VACUUM · Redis</text>
  <text x="1108" y="623" font-size="11" fill="#311b92">换了库，哪些经验能平移</text>

  <rect x="1500" y="557" width="380" height="80" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="1518" y="581" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">134</text>
  <text x="1562" y="581" font-size="15" font-weight="bold" fill="#7f3f00">数据库选型 ★</text>
  <text x="1518" y="605" font-size="11.5" fill="#7f3f00">六类版图 · 信创六约束</text>
  <text x="1518" y="623" font-size="11" fill="#7f3f00">该用什么库，换库怎么不死人</text>

  <!-- ========== 结论块 ========== -->
  <rect x="60" y="676" width="1840" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="704" font-size="15" font-weight="bold" fill="#bf360c">★ 时间只够读两篇：113 索引与执行计划 + 121 备份恢复与数据迁移</text>
  <text x="80" y="728" font-size="12.5" fill="#5d4037">· 113 解决 80% 的慢查询；121 决定出事之后救不救得回来</text>
  <text x="80" y="749" font-size="12.5" fill="#5d4037">· 主线四册按 111 → 112 → 113 → 114 顺序读，跳读会缺上下文</text>
  <text x="1000" y="728" font-size="12.5" fill="#5d4037">· 其余按需查：诊断 131、故障 132、换库 133、选型 134、查词 190</text>
  <text x="1000" y="749" font-size="12.5" fill="#5d4037">· 换库前先读 134 与 133：国产库经验不能直接从 MySQL 平移</text>

