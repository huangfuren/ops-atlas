<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 765"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>一条 SQL 的完整路径：前五步相同，第 6 步分叉</title>
  <desc>前五步是 连接层 → 解析器 → 预处理器 → 优化器 → 执行器，产出执行计划；之后分叉：读路径只在 InnoDB 内部查缓冲池、页内定位、逐行返回，不写日志；写路径改缓冲池页、写 undo、redo 标 prepare、写 binlog、redo 改 commit，两阶段提交保证主从一致。</desc>

  <!-- 坐标表：画布 1200x765 | 前五步卡片 y=112 h=64 w=204 gap=30（30/264/498/732/966）|
       分叉条 30,192 1140x48 | 读卡 y=300 h=88 w=273 gap=16（30/319/608/897）|
       写卡 y=432 h=88 w=216 gap=15（30/261/492/723/954）| 结论 548 h=104 | 图例 676 h=65 -->

  <rect x="0" y="0" width="1200" height="765" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#0d47a1">一条 SQL 的完整路径：读与写</text>
  <text x="30" y="68" font-size="12" fill="#616161">前五步完全一样；第 6 步分叉——读只查缓冲池，写要落 undo / redo / binlog 三种日志（MySQL 8.0 / InnoDB）</text>
  <text x="30" y="100" font-size="11.5" fill="#616161">前五步：Server 层把一条 SQL 变成执行计划，每层只调下一层</text>

  <!-- 前五步 -->
  <rect x="30" y="112" width="204" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="132" y="139" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">① 连接层</text>
  <text x="132" y="161" font-size="11" fill="#37474f" text-anchor="middle">TCP · 认证 · 分配线程</text>

  <line x1="236" y1="144" x2="260" y2="144" stroke="#607d8b" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="264" y="112" width="204" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="366" y="139" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">② 解析器</text>
  <text x="366" y="161" font-size="11" fill="#37474f" text-anchor="middle">词法 · 语法树</text>

  <line x1="470" y1="144" x2="494" y2="144" stroke="#607d8b" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="498" y="112" width="204" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="139" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">③ 预处理器</text>
  <text x="600" y="161" font-size="11" fill="#37474f" text-anchor="middle">校验 · 展开 * · 授权</text>

  <line x1="704" y1="144" x2="728" y2="144" stroke="#607d8b" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="732" y="112" width="204" height="64" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="834" y="139" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">④ 优化器 ★</text>
  <text x="834" y="161" font-size="11" fill="#7f3f00" text-anchor="middle">选索引 · 定 JOIN 顺序</text>

  <line x1="938" y1="144" x2="962" y2="144" stroke="#607d8b" stroke-width="2" marker-end="url(#arrowSm)"/>

  <rect x="966" y="112" width="204" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1068" y="139" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">⑤ 执行器</text>
  <text x="1068" y="161" font-size="11" fill="#37474f" text-anchor="middle">按执行计划调引擎</text>

  <!-- 分叉条 -->
  <rect x="30" y="192" width="1140" height="48" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="46" y="222" font-size="13" font-weight="bold" fill="#8d6e00">第 6 步分叉：执行器把同一份执行计划交给 InnoDB，接下来走哪条路，取决于这条 SQL 要不要改数据</text>

  <!-- 读路径 -->
  <text x="30" y="288" font-size="17" font-weight="bold" fill="#0d47a1">读路径：命中缓冲池就返回，全程不写日志</text>
  <text x="1170" y="288" font-size="11.5" fill="#616161" text-anchor="end">以 SELECT 为例 · 4 步</text>

  <rect x="30" y="300" width="273" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="46" y="330" font-size="15" font-weight="bold" fill="#311b92">① 查 Buffer Pool</text>
  <text x="46" y="353" font-size="11.5" fill="#37474f">内存里有没有这一页</text>
  <text x="46" y="373" font-size="11" fill="#311b92">命中率低 = 缓冲池太小</text>

  <rect x="319" y="300" width="273" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="335" y="330" font-size="15" font-weight="bold" fill="#311b92">② 页内定位到行</text>
  <text x="335" y="353" font-size="11.5" fill="#37474f">按页目录二分 + 链表扫描</text>
  <text x="335" y="373" font-size="11" fill="#311b92">走的索引对不对看 EXPLAIN</text>

  <rect x="608" y="300" width="273" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="624" y="330" font-size="15" font-weight="bold" fill="#311b92">③ 未命中：读 16KB 页</text>
  <text x="624" y="353" font-size="11.5" fill="#37474f">从磁盘读进缓冲池，回到上一步</text>
  <text x="624" y="373" font-size="11" fill="#311b92">磁盘 IO 高 = 命中率掉了</text>

  <rect x="897" y="300" width="273" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="913" y="330" font-size="15" font-weight="bold" fill="#311b92">④ 逐行返回结果集</text>
  <text x="913" y="353" font-size="11.5" fill="#37474f">边取边发，不在服务端攒全量</text>
  <text x="913" y="373" font-size="11" fill="#311b92">深翻页慢在这一步</text>

  <!-- 写路径 -->
  <text x="30" y="420" font-size="17" font-weight="bold" fill="#311b92">写路径：一次提交落三种日志，两阶段提交</text>
  <text x="1170" y="420" font-size="11.5" fill="#616161" text-anchor="end">INSERT / UPDATE / DELETE · 5 步</text>

  <rect x="30" y="432" width="216" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="44" y="462" font-size="13" font-weight="bold" fill="#311b92">① 改缓冲池页</text>
  <text x="44" y="483" font-size="11.5" fill="#37474f">页变脏，磁盘还是旧值</text>
  <text x="44" y="502" font-size="11" fill="#311b92">先在内存里改</text>


  <rect x="261" y="432" width="216" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="275" y="462" font-size="13" font-weight="bold" fill="#311b92">② 写 undo log</text>
  <text x="275" y="483" font-size="11.5" fill="#37474f">记旧值：回滚 + MVCC</text>
  <text x="275" y="502" font-size="11" fill="#311b92">undo 膨胀 = 长事务</text>


  <rect x="492" y="432" width="216" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="506" y="462" font-size="13" font-weight="bold" fill="#311b92">③ redo 标 prepare ★</text>
  <text x="506" y="483" font-size="11.5" fill="#37474f">物理变更，已落盘未提交</text>
  <text x="506" y="502" font-size="11" fill="#311b92">崩溃恢复看这一步</text>


  <rect x="723" y="432" width="216" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="737" y="462" font-size="13" font-weight="bold" fill="#311b92">④ 写 binlog</text>
  <text x="737" y="483" font-size="11.5" fill="#37474f">逻辑变更：复制 · PITR</text>
  <text x="737" y="502" font-size="11" fill="#311b92">误删找回靠它</text>


  <rect x="954" y="432" width="216" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="968" y="462" font-size="13" font-weight="bold" fill="#311b92">⑤ redo 改 commit ★</text>
  <text x="968" y="483" font-size="11.5" fill="#37474f">事务对上层可见，提交结束</text>
  <text x="968" y="502" font-size="11" fill="#311b92">★ 与上一步不可交换</text>

  <!-- 结论 -->
  <rect x="30" y="548" width="1140" height="104" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="46" y="576" font-size="15" font-weight="bold" fill="#bf360c">★ redo 的 prepare 与 commit 之间夹着 binlog，这个顺序不能换</text>
  <text x="46" y="602" font-size="12.5" fill="#5d4037">· 崩溃恢复先看 binlog：binlog 完整就把 redo 提交，不完整就回滚——两个都落一半时以 binlog 为准</text>
  <text x="46" y="623" font-size="12.5" fill="#5d4037">· 唯一目标：主库与从库数据一致，不多写也不漏写；顺序反了就会一边有一边没有</text>
  <text x="46" y="644" font-size="12.5" fill="#5d4037">· 生产上 innodb_flush_log_at_trx_commit 与 sync_binlog 同为 1，才敢说「提交了就不丢」</text>

  <!-- 图例 -->
  <rect x="30" y="676" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="691" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="72" y="702" font-size="12" fill="#37474f">连接层</text>
  <rect x="264" y="691" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="296" y="702" font-size="12" fill="#37474f">Server 层步骤</text>
  <rect x="488" y="691" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="520" y="702" font-size="12" fill="#37474f">关键节点 ★</text>
  <rect x="712" y="691" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="744" y="702" font-size="12" fill="#37474f">InnoDB 内部动作</text>
  <rect x="936" y="691" width="22" height="14" rx="3" fill="#fff8e1" stroke="#ef6c00" stroke-width="1"/>
  <text x="968" y="702" font-size="12" fill="#37474f">分叉说明</text>
</svg>
