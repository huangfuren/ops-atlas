<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 885"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>MySQL 分层排查：症状 → 查哪一层 → 敲什么命令</title>
  <desc>四行由外向内：连接层、Server 层、存储引擎层、物理层。左边是层与该层职责，中间是该层的典型症状，右边是具体命令。前三层同属一个 mysqld 进程，物理层在进程之外，因此第四行用系统层命令。</desc>

  <!-- 坐标表：画布 1200x875 | 列分隔线 x=326 / x=690 | 行容器 x=30 w=1140 h=124 |
       行1 y=108 / 行2 y=244 / 行3 y=380 / 行4 y=516 | 左块 42,+12 272x100 | 结论 660 h=104 | 图例 784 h=65 -->

  <rect x="0" y="0" width="1200" height="885" fill="#ffffff"/>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#1b5e20">MySQL 分层排查：症状 → 查哪一层 → 敲什么命令</text>
  <text x="30" y="68" font-size="12" fill="#616161">由外向内四层，每层只调下一层不越级；先按症状定位到层，再敲右列命令（命令在对应实例上执行）</text>

  <!-- 列头 -->
  <text x="42" y="96" font-size="11.5" font-weight="bold" fill="#616161">层 · 该层负责什么</text>
  <text x="336" y="96" font-size="11.5" font-weight="bold" fill="#616161">症状：先判断是哪一层</text>
  <text x="700" y="96" font-size="11.5" font-weight="bold" fill="#616161">查什么 · 敲什么命令</text>

  <!-- ① 连接层 -->
  <rect x="30" y="108" width="1140" height="124" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="42" y="120" width="272" height="100" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="152" font-size="17" font-weight="bold" fill="#0d2f5c">① 连接层</text>
  <text x="58" y="176" font-size="11" fill="#0d2f5c">连接生命周期 · 身份认证</text>
  <text x="58" y="198" font-size="11" fill="#0d2f5c">认的是「你是谁」，不碰 SQL</text>
  <line x1="326" y1="116" x2="326" y2="224" stroke="#cfd8dc" stroke-width="1"/>
  <text x="336" y="144" font-size="12.5" fill="#c62828">连接数打满 · 认证失败 · 连接被拒</text>
  <text x="336" y="166" font-size="11" fill="#37474f">报错关键词：Too many connections、Access denied</text>
  <text x="336" y="188" font-size="11" fill="#616161">先看是不是连接池没回收，再看配额</text>
  <line x1="690" y1="116" x2="690" y2="224" stroke="#cfd8dc" stroke-width="1"/>
  <text x="700" y="144" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">SHOW FULL PROCESSLIST;</text>
  <text x="700" y="166" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">SELECT @@max_connections;</text>
  <text x="700" y="188" font-size="11" fill="#616161">看 Sleep 连接堆积，还是某个账号连不上</text>

  <!-- ② Server 层 -->
  <rect x="30" y="244" width="1140" height="124" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="42" y="256" width="272" height="100" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="58" y="288" font-size="17" font-weight="bold" fill="#1b5e20">② Server 层</text>
  <text x="58" y="312" font-size="11" fill="#123314">SQL → 执行计划</text>
  <text x="58" y="334" font-size="11" fill="#123314">不管数据在哪，只管怎么取</text>
  <line x1="326" y1="252" x2="326" y2="360" stroke="#cfd8dc" stroke-width="1"/>
  <text x="336" y="280" font-size="12.5" fill="#c62828">执行计划选错 · 函数报错 · 权限不足</text>
  <text x="336" y="302" font-size="11" fill="#37474f">90% 的慢查询在这一层定性：不是机器慢，是走错索引</text>
  <text x="336" y="324" font-size="11" fill="#616161">函数报错与权限不足也先在这里排除</text>
  <line x1="690" y1="252" x2="690" y2="360" stroke="#cfd8dc" stroke-width="1"/>
  <text x="700" y="280" font-size="11.5" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">EXPLAIN SELECT ...;</text>
  <text x="700" y="302" font-size="11.5" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">SHOW GRANTS;  SHOW PROCESSLIST;</text>
  <text x="700" y="324" font-size="11" fill="#616161">重点看 type（ALL 就是全表扫）与 rows</text>

  <!-- ③ 存储引擎层 -->
  <rect x="30" y="380" width="1140" height="124" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="42" y="392" width="272" height="100" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="58" y="424" font-size="17" font-weight="bold" fill="#311b92">③ 存储引擎层</text>
  <text x="58" y="448" font-size="11" fill="#311b92">页 · 索引 · 事务 · 锁</text>
  <text x="58" y="470" font-size="11" fill="#311b92">真正读盘、加锁、保证一致</text>
  <line x1="326" y1="388" x2="326" y2="496" stroke="#cfd8dc" stroke-width="1"/>
  <text x="336" y="416" font-size="12.5" fill="#c62828">锁等待 · 死锁 · 命中率低 · 磁盘 IO 高</text>
  <text x="336" y="438" font-size="11" fill="#37474f">长事务与 MDL 阻塞也在这一层暴露</text>
  <text x="336" y="460" font-size="11" fill="#616161">先看 TRANSACTIONS 段，再看死锁段</text>
  <line x1="690" y1="388" x2="690" y2="496" stroke="#cfd8dc" stroke-width="1"/>
  <text x="700" y="416" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">SHOW ENGINE INNODB STATUS\G</text>
  <text x="700" y="438" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">SHOW GLOBAL STATUS LIKE 'Innodb%';</text>
  <text x="700" y="460" font-size="11" fill="#616161">输出很长，按段读：TRANSACTIONS → DEADLOCK</text>

  <!-- ④ 物理层 -->
  <rect x="30" y="516" width="1140" height="124" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="42" y="528" width="272" height="100" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="58" y="560" font-size="17" font-weight="bold" fill="#8d6e00">④ 物理层</text>
  <text x="58" y="584" font-size="11" fill="#5d4700">datadir 下的文件</text>
  <text x="58" y="606" font-size="11" fill="#5d4700">进程之外，用系统层命令查</text>
  <line x1="326" y1="524" x2="326" y2="632" stroke="#cfd8dc" stroke-width="1"/>
  <text x="336" y="552" font-size="12.5" fill="#c62828">磁盘满 · binlog 堆积 · undo 膨胀</text>
  <text x="336" y="574" font-size="11" fill="#37474f">文件损坏或误删，先看 error.log 再谈恢复</text>
  <text x="336" y="596" font-size="11" fill="#616161">写不进去时，先确认是空间还是权限</text>
  <line x1="690" y1="524" x2="690" y2="632" stroke="#cfd8dc" stroke-width="1"/>
  <text x="700" y="552" font-size="11.5" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">du -sh /var/lib/mysql</text>
  <text x="700" y="574" font-size="11.5" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">SHOW BINARY LOGS;</text>
  <text x="700" y="596" font-size="11.5" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">PURGE BINARY LOGS TO 'xxx';</text>

  <!-- 结论 -->
  <rect x="30" y="660" width="1140" height="116" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="46" y="688" font-size="15" font-weight="bold" fill="#bf360c">★ 三层的调优入口不重叠，跨层猜就是浪费时间</text>
  <text x="46" y="714" font-size="12.5" fill="#5d4037">· 连接层看配额（max_connections）、Server 层看选路（EXPLAIN）、引擎层看内存（buffer pool）</text>
  <text x="46" y="735" font-size="12.5" fill="#5d4037">· 一次写跨两层落三种日志：undo / redo 在 InnoDB，binlog 在 Server 层，靠两阶段提交保证主从一致</text>
  <text x="46" y="756" font-size="12.5" fill="#5d4037">· ①②③ 同属一个 mysqld 进程，④ 在进程之外——所以第四行敲的是 du 而不是 SQL</text>

  <!-- 图例 -->
  <rect x="30" y="796" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="811" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="72" y="822" font-size="12" fill="#37474f">① 连接层（接入）</text>
  <rect x="320" y="811" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="352" y="822" font-size="12" fill="#37474f">② Server 层（逻辑）</text>
  <rect x="600" y="811" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="632" y="822" font-size="12" fill="#37474f">③ 存储引擎层（物理执行）</text>
  <rect x="880" y="811" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="912" y="822" font-size="12" fill="#37474f">④ 物理层（磁盘文件）</text>
</svg>
