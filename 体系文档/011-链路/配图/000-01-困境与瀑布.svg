<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 758.82" width="1200" height="758.82" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>跨服务调用的困境与链路瀑布图</title>
  <desc>上半部分是没有链路的困境：三台机器各看各的日志，同一个请求无法确认、耗时无法拼对。下半部分是有链路后的瀑布图：一个 trace_id 串起网关、订单、支付、MySQL 的 span，父子嵌套一目了然，耗时分布与空隙直接可见。</desc>

  <rect width="680" height="430" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">跨服务调用：从"各看各的"到一张瀑布图</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">下单偶发 8 秒</text>

  <!-- 上：困境 -->
  <text x="40" y="56" font-size="9.5" font-weight="600" fill="#7A322B">✗ 没有链路：三台机器各看各的</text>
  <rect x="40" y="66" width="190" height="66" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="84" font-size="7.8" font-weight="600" fill="#4A4945">网关日志</text>
  <text x="52" y="98" font-size="7.2" fill="#8C8980">10:00:00.100 收到 POST /orders</text>
  <text x="52" y="112" font-size="7.2" fill="#8C8980">10:00:00.105 转发完成</text>
  <rect x="245" y="66" width="190" height="66" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="257" y="84" font-size="7.8" font-weight="600" fill="#4A4945">订单服务日志</text>
  <text x="257" y="98" font-size="7.2" fill="#8C8980">10:00:00.110 收到，调支付…</text>
  <text x="257" y="112" font-size="7.2" fill="#8C8980">10:00:08.000 返回</text>
  <rect x="450" y="66" width="194" height="66" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="462" y="84" font-size="7.8" font-weight="600" fill="#4A4945">支付服务日志</text>
  <text x="462" y="98" font-size="7.2" fill="#8C8980">10:00:07.900 才收到？</text>
  <text x="462" y="112" font-size="7.2" fill="#8C8980">中间 7.8 秒发生了什么？</text>

  <text x="40" y="150" font-size="8" fill="#7A322B">三问无解：是同一次请求吗？8 秒花在哪一跳？库存服务是不是根本没打日志？</text>

  <line x1="32" y1="164" x2="648" y2="164" stroke="#EDEAE2" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- 下：瀑布 -->
  <text x="40" y="186" font-size="9.5" font-weight="600" fill="#1D5A45">✓ 有链路：trace 瀑布图（trace_id: 4bf92f35…4736）</text>

  <text x="50" y="212" font-size="7.8" fill="#8C8980">0ms</text>
  <text x="200" y="212" font-size="7.8" fill="#8C8980">2000ms</text>
  <text x="370" y="212" font-size="7.8" fill="#8C8980">4000ms</text>
  <text x="540" y="212" font-size="7.8" fill="#8C8980">6000ms</text>
  <text x="620" y="212" font-size="7.8" fill="#8C8980">8000</text>

  <!-- 网关 SERVER -->
  <rect x="60" y="220" width="24" height="16" rx="2" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="94" y="232" font-size="7.6" font-weight="600" fill="#1F4468">网关 SERVER</text>

  <!-- 订单 SERVER -->
  <rect x="88" y="242" width="440" height="16" rx="2" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="122" y="254" font-size="7.6" font-weight="600" fill="#1F4468">订单 SERVER（父）</text>

  <!-- MySQL CLIENT -->
  <rect x="98" y="264" width="80" height="16" rx="2" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="132" y="276" font-size="7.4" fill="#1D5A45" text-anchor="middle">MySQL CLIENT</text>
  <text x="190" y="276" font-size="7" fill="#8C8980">80ms</text>

  <!-- 支付 SERVER -->
  <rect x="190" y="286" width="280" height="16" rx="2" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="230" y="298" font-size="7.6" font-weight="600" fill="#7A4A12">支付 SERVER ★ 7.8s —— 关键路径</text>

  <!-- 空隙标注 -->
  <line x1="470" y1="264" x2="470" y2="302" stroke="#D2948C" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="478" y="314" font-size="7.2" fill="#7A322B">空隙：未埋点段 / 排队 —— 006 §6.2</text>

  <!-- 结论 -->
  <rect x="40" y="330" width="604" height="44" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="52" y="349" font-size="8.4" font-weight="600" fill="#1D5A45">瀑布图读法：父嵌套=调用关系 · 横条=耗时 · 关键路径=决定总耗时的链</text>
  <text x="52" y="365" font-size="7.6" fill="#1D5A45">本例结论：支付服务慢是关键路径——且支付 07.900 才收到，说明订单→支付的调用本身慢了 7.8s</text>

  <text x="32" y="396" font-size="9" fill="#8C8980">同一个 trace_id 串起全部 span —— "是同一次请求吗"从此有答案（000 §0.2）。</text>
  <text x="32" y="414" font-size="9" fill="#8C8980">模型细节：trace_id 16 字节、span 父子嵌套、上下文传播——下一册展开（001）。</text>

  </g>
</svg>
