<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1000" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>跨服务调用的困境与链路瀑布图</title>
  <desc>左区是没有链路的困境：三台机器各看各的日志，排障三问问问无解。右区是有链路后的瀑布图：一个 trace_id 串起网关、订单、支付、MySQL 的 span，父子嵌套与空隙直接可见。底部是三问有解与图例。</desc>

  <defs>
    <marker id="axOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1960" height="1000" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="60" y="54" font-size="20" font-weight="bold" fill="#263238">跨服务调用：从「各看各的」到一张瀑布图</text>
  <text x="1900" y="54" font-size="13" fill="#616161" text-anchor="end">011-链路 · 003 全景</text>

  <!-- 左分区：没有链路 -->
  <rect x="60" y="92" width="850" height="570" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="126" font-size="17" font-weight="bold" fill="#c62828">没有链路：三台机器各看各的</text>
  <text x="84" y="150" font-size="12" fill="#616161">同一次下单，三个地方三份日志，时间线靠人工对齐</text>

  <rect x="84" y="166" width="802" height="86" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="104" y="192" font-size="13" font-weight="bold" fill="#37474f">网关日志</text>
  <text x="104" y="216" font-size="12" fill="#616161">10:00:00.100 收到 POST /orders</text>
  <text x="104" y="238" font-size="12" fill="#616161">10:00:00.105 转发完成</text>

  <rect x="84" y="266" width="802" height="86" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="104" y="292" font-size="13" font-weight="bold" fill="#37474f">订单服务日志</text>
  <text x="104" y="316" font-size="12" fill="#616161">10:00:00.110 收到，调用支付……</text>
  <text x="104" y="338" font-size="12" fill="#616161">10:00:08.000 才返回</text>

  <rect x="84" y="366" width="802" height="86" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="104" y="392" font-size="13" font-weight="bold" fill="#37474f">支付服务日志</text>
  <text x="104" y="416" font-size="12" fill="#616161">10:00:07.900 才收到请求？</text>
  <text x="104" y="438" font-size="12" fill="#616161">中间 7.8 秒发生了什么？</text>

  <rect x="84" y="476" width="802" height="160" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="104" y="504" font-size="13" font-weight="bold" fill="#c62828">排障三问，问问无解</text>
  <text x="104" y="534" font-size="12.5" fill="#37474f">是同一次请求吗？三份日志对不上同一个 ID</text>
  <text x="104" y="562" font-size="12.5" fill="#37474f">8 秒花在哪一跳？只能逐台机器翻时间戳硬拼</text>
  <text x="104" y="590" font-size="12.5" fill="#37474f">库存服务是不是根本没打日志？无从得知</text>
  <text x="104" y="618" font-size="12" fill="#616161">每一段都可能是答案，但没有一段能自证</text>

  <!-- 跨区箭头 -->
  <line x1="916" y1="377" x2="942" y2="377" stroke="#e65100" stroke-width="2" marker-end="url(#axOrange)"/>
  <text x="929" y="360" font-size="11" fill="#e65100" text-anchor="middle">接入埋点</text>
  <text x="929" y="398" font-size="11" fill="#e65100" text-anchor="middle">trace_id 串起</text>

  <!-- 右分区：有链路 -->
  <rect x="950" y="92" width="950" height="570" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="974" y="126" font-size="17" font-weight="bold" fill="#1b5e20">有链路：一张瀑布图还原全部</text>
  <text x="974" y="150" font-size="12" fill="#616161">trace_id 4bf92f35…4736 串起网关、订单、支付、MySQL</text>

  <!-- 时间轴 -->
  <text x="1006" y="208" font-size="11" fill="#616161">0ms</text>
  <text x="1218" y="208" font-size="11" fill="#616161" text-anchor="middle">2000ms</text>
  <text x="1420" y="208" font-size="11" fill="#616161" text-anchor="middle">4000ms</text>
  <text x="1622" y="208" font-size="11" fill="#616161" text-anchor="middle">6000ms</text>
  <text x="1820" y="208" font-size="11" fill="#616161" text-anchor="end">8000ms</text>
  <line x1="1006" y1="216" x2="1820" y2="216" stroke="#bdbdbd" stroke-width="1"/>

  <!-- 瀑布条 -->
  <rect x="1006" y="232" width="34" height="30" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1052" y="252" font-size="12" font-weight="bold" fill="#0d2f5c">网关 SERVER（root，约 10ms）</text>

  <rect x="1012" y="274" width="806" height="30" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1032" y="294" font-size="12" font-weight="bold" fill="#0d2f5c">订单 SERVER（父 span，0.11s–8.00s）</text>

  <line x1="1105" y1="304" x2="1105" y2="316" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="1050" y="316" width="110" height="30" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1172" y="336" font-size="12" fill="#1b5e20">MySQL CLIENT 80ms</text>

  <line x1="1200" y1="304" x2="1200" y2="358" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="1150" y="358" width="606" height="30" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="1170" y="378" font-size="12" font-weight="bold" fill="#7f3f00">支付 SERVER 7.7s —— 关键路径</text>

  <rect x="1762" y="358" width="56" height="30" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1790" y="412" font-size="11" fill="#c62828" text-anchor="middle">空隙 ≈100ms</text>
  <text x="1790" y="430" font-size="11" fill="#c62828" text-anchor="middle">未埋点 / 排队</text>
  <text x="1790" y="448" font-size="11" fill="#c62828" text-anchor="middle">（124 §6.2）</text>

  <!-- 读法 -->
  <rect x="974" y="470" width="902" height="160" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="994" y="498" font-size="13" font-weight="bold" fill="#1b5e20">瀑布图读法（124 §6.2）</text>
  <text x="994" y="526" font-size="12.5" fill="#37474f">横条 = 一个 span 的耗时 · 嵌套 = 调用关系 · 最长链 = 关键路径</text>
  <text x="994" y="554" font-size="12.5" fill="#37474f">本例结论：支付服务慢是关键路径——订单 07.900 才把请求送达支付，调用本身慢了 7.8s</text>
  <text x="994" y="582" font-size="12.5" fill="#37474f">空隙直接可见：未埋点段与排队等待不再靠猜（124 §6.2）</text>
  <text x="994" y="610" font-size="12" fill="#616161">同一个 trace_id 串起全部 span——「是同一次请求吗」从此有答案（001 §0.2）</text>

  <!-- 汇总块 -->
  <rect x="60" y="690" width="1840" height="150" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="720" font-size="14" font-weight="bold" fill="#263238">三问从此有解</text>
  <text x="84" y="750" font-size="12.5" fill="#37474f">是同一次请求吗 → 同一 trace_id 贯穿全部 span（001 §0.2）</text>
  <text x="84" y="778" font-size="12.5" fill="#37474f">8 秒花在哪一跳 → 支付 SERVER 7.7s 是关键路径，优化它才缩短总延迟（124 §6.2）</text>
  <text x="84" y="806" font-size="12.5" fill="#37474f">有没有服务没埋点 → 空隙在瀑布图上直接可见（124 §6.2）</text>
  <text x="84" y="830" font-size="12" fill="#616161">模型细节：trace_id 16 字节、span 父子嵌套、W3C 上下文传播——见 111 §1.2 / §1.3</text>

  <!-- 图例 -->
  <rect x="60" y="862" width="1840" height="90" rx="8" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="100" y="890" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="132" y="902" font-size="12" fill="#37474f">SERVER（被调用方）</text>
  <rect x="480" y="890" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="512" y="902" font-size="12" fill="#37474f">CLIENT（调用方视角，如 SQL）</text>
  <rect x="960" y="890" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="992" y="902" font-size="12" fill="#37474f">关键路径（决定总耗时）</text>
  <rect x="1400" y="890" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1432" y="902" font-size="12" fill="#37474f">空隙（未埋点 / 排队）</text>
  <rect x="1700" y="890" width="22" height="14" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="1732" y="902" font-size="12" fill="#37474f">分区底色</text>
</svg>
