<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>链路排障四段流：从告警到 span 归因</title>
  <desc>① 告警确认哪个服务哪个接口涨了；② 通过 exemplar 或日志 trace_id 打开慢 trace；③ 瀑布图找关键路径与空隙；④ 读最慢 span 属性归因到下游对应册。底部是与日志的联动块和图例。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">链路排障四段流：从告警到归因</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">每段有明确出口</text>

  <!-- ① 告警 -->
  <rect x="40" y="80" width="1120" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#0d2f5c">① 告警确认（「监控」114）——哪个服务、哪个接口、P99 涨到多少</text>
  <text x="60" y="130" font-size="12" fill="#0d2f5c">RED 指标来自 spanmetrics——链路与指标同源（121 §3.1）</text>
  <text x="1140" y="152" font-size="11" fill="#0d2f5c" text-anchor="end">出口：服务名 + 时间点</text>

  <line x1="600" y1="172" x2="600" y2="192" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="612" y="186" font-size="10" fill="#616161">exemplar / 日志里的 trace_id</text>

  <!-- ② 打开慢 trace -->
  <rect x="40" y="196" width="1120" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="222" font-size="13" font-weight="bold" fill="#0d2f5c">② 打开慢 trace（本册 121 / 123）</text>
  <text x="60" y="246" font-size="12" fill="#0d2f5c">Grafana Explore / Jaeger UI / Tempo TraceQL——按 exemplar 的 trace_id 还原</text>
  <text x="1140" y="268" font-size="11" fill="#0d2f5c" text-anchor="end">出口：瀑布图</text>

  <line x1="600" y1="288" x2="600" y2="308" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="612" y="302" font-size="10" fill="#616161">瀑布读法三步</text>

  <!-- ③ 读瀑布 -->
  <rect x="40" y="312" width="1120" height="88" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#7f3f00">③ 读瀑布（124 §6.2）——关键路径在哪？</text>
  <text x="60" y="362" font-size="12" fill="#7f3f00">root 总耗时对齐用户感受 · 沿最长链找关键路径 · 找空隙（未埋点 / 排队）</text>
  <text x="60" y="384" font-size="11.5" font-weight="bold" fill="#7f3f00">本例：支付 CLIENT span 2.8s——db.statement 指向库存锁等待</text>
  <text x="1140" y="384" font-size="11" fill="#7f3f00" text-anchor="end">出口：最慢 span 的属性</text>

  <line x1="600" y1="404" x2="600" y2="424" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="612" y="418" font-size="10" fill="#616161">最慢 span 的属性</text>

  <!-- ④ 归因 -->
  <rect x="40" y="428" width="1120" height="88" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="454" font-size="13" font-weight="bold" fill="#123314">④ 归因（124 §6.3）——转下游对应册取证</text>
  <text x="60" y="478" font-size="12" fill="#123314">「数据库」131（锁等待）/「接入层」121（上游超时）/ 外部依赖治理</text>
  <text x="60" y="500" font-size="11.5" fill="#1b3d1e">error span 的属性要带全归因信息（error.type / 下游地址）——开发侧埋点义务</text>
  <text x="1140" y="500" font-size="11" fill="#123314" text-anchor="end">出口：定位到下游册</text>

  <!-- 联动块 -->
  <rect x="40" y="536" width="1120" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="563" font-size="12.5" fill="#7f3f00">与「日志」联动：trace_id 搜上下文日志，互证「链路说的」与「业务日志说的」（122 §4.4）——四段取证思想与「日志」124 §6.1 同源</text>

  <!-- 尾注 -->
  <text x="40" y="610" font-size="11.5" fill="#616161">链路自身的异常：断链 / 时钟偏移 / 采样漏单——先排除再归因（124 §6.4）</text>
  <text x="40" y="636" font-size="11.5" fill="#616161">「每一段都快但总耗时慢」的经典解法：并行度不足（该并行被串行）或空隙（未埋点段）——瀑布图上一目了然</text>

  <!-- 图例 -->
  <rect x="40" y="652" width="1120" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="676" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="688" font-size="12" fill="#37474f">定位入口（① ②）</text>
  <rect x="360" y="676" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="392" y="688" font-size="12" fill="#37474f">关键路径分析（③）</text>
  <rect x="660" y="676" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="692" y="688" font-size="12" fill="#37474f">归因出口（④）</text>
  <rect x="920" y="676" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="952" y="688" font-size="12" fill="#37474f">联动块</text>
</svg>
