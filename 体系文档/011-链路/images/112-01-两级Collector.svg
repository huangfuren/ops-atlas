<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>两级 Collector：Agent 就近收，Gateway 承担重活</title>
  <desc>应用 Pod 的 SDK 用 OTLP 发给本节点 Agent（DaemonSet，轻处理），Agent 转发中心 Gateway（Deployment，重活：尾部采样、路由、多后端分发），最后写入 Jaeger 或 Tempo。下方是应用直发后端的四个问题、Agent 必配与分工纪律、图例。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">两级 Collector：Agent 薄，Gateway 重</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">尾部采样只在 Gateway</text>

  <!-- 主链 -->
  <rect x="40" y="80" width="200" height="120" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="140" y="106" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">应用 Pod × N</text>
  <text x="140" y="130" font-size="11.5" fill="#0d2f5c" text-anchor="middle">SDK 自动埋点（111 §1.5）</text>
  <text x="140" y="152" font-size="11.5" fill="#0d2f5c" text-anchor="middle">OTLP → localhost:4317</text>
  <text x="140" y="174" font-size="11.5" fill="#0d2f5c" text-anchor="middle">进程内不加重活</text>

  <line x1="244" y1="140" x2="290" y2="140" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="267" y="130" font-size="10" fill="#616161" text-anchor="middle">OTLP</text>

  <rect x="294" y="80" width="240" height="120" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="414" y="104" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">Agent（DaemonSet）</text>
  <text x="414" y="128" font-size="11.5" fill="#1b3d1e" text-anchor="middle">轻处理：batch · 脱敏</text>
  <text x="414" y="150" font-size="11.5" fill="#1b3d1e" text-anchor="middle">每节点一个 · 故障域小</text>
  <text x="414" y="172" font-size="11.5" fill="#c62828" text-anchor="middle">禁止：尾部采样不放这（聚不齐）</text>

  <line x1="538" y1="140" x2="584" y2="140" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="561" y="130" font-size="10" fill="#616161" text-anchor="middle">OTLP</text>

  <rect x="588" y="80" width="270" height="120" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="723" y="104" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">Gateway（Deployment）</text>
  <text x="723" y="128" font-size="11.5" fill="#7f3f00" text-anchor="middle">重活：尾部采样（123 §5.3）</text>
  <text x="723" y="150" font-size="11.5" fill="#7f3f00" text-anchor="middle">路由 · 多后端分发 · 租户限流</text>
  <text x="723" y="172" font-size="11.5" fill="#5d4037" text-anchor="middle">规模大了再拆，起步可合并</text>

  <line x1="862" y1="140" x2="908" y2="140" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="885" y="130" font-size="10" fill="#616161" text-anchor="middle">OTLP</text>

  <rect x="912" y="105" width="248" height="70" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1036" y="131" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">Jaeger / Tempo（121）</text>
  <text x="1036" y="155" font-size="11.5" fill="#311b92" text-anchor="middle">存储 · 按 trace_id 还原</text>

  <!-- 四个问题 -->
  <rect x="40" y="232" width="1120" height="130" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="258" font-size="13" font-weight="bold" fill="#37474f">应用直发后端的四个问题（112 §2.1）——这就是要有两级的原因</text>
  <text x="60" y="286" font-size="12" fill="#37474f">① 后端凭据与地址耦合进应用　　② 重试逻辑分散在各应用、不可控</text>
  <text x="60" y="312" font-size="12" fill="#37474f">③ 无统一治理点（脱敏 / 过滤 / 采样没有落点）</text>
  <text x="60" y="338" font-size="12" fill="#37474f">④ 尾部采样需要中心聚齐整棵 trace——直发模式下无处安放</text>

  <!-- 必配条 -->
  <rect x="40" y="386" width="1120" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="413" font-size="12.5" fill="#1b5e20">Agent 必配：memory_limiter（自保）+ batch（攒批）——processor 顺序即语义：limiter 最前、batch 最后（112 §2.6 第 4 坑）</text>

  <!-- 分工纪律 -->
  <rect x="40" y="446" width="1120" height="44" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="60" y="473" font-size="12.5" fill="#7f3f00">分工原则：Agent 尽量薄（网络跳数少、故障域小）· Gateway 承担重活——尾部采样上线时就该拆两级（112 §2.3）</text>

  <!-- 尾注 -->
  <text x="40" y="524" font-size="11.5" fill="#616161">规模路径：起步一级（单 Collector）→ 出现尾部采样或多后端需求时拆两级；K8s 场景 Agent = DaemonSet（112 §2.3）</text>
  <text x="40" y="550" font-size="11.5" fill="#616161">常用 processor：batch / memory_limiter / resource / attributes / tail_sampling / filter（112 §2.4）</text>

  <!-- 图例 -->
  <rect x="40" y="572" width="1120" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="596" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="608" font-size="12" fill="#37474f">应用（数据入口）</text>
  <rect x="320" y="596" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="352" y="608" font-size="12" fill="#37474f">Agent（主体）</text>
  <rect x="560" y="596" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="592" y="608" font-size="12" fill="#37474f">Gateway（枢纽）</text>
  <rect x="800" y="596" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="832" y="608" font-size="12" fill="#37474f">后端存储</text>
  <rect x="1000" y="596" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="1032" y="608" font-size="12" fill="#37474f">纪律 / 通过条件</text>
</svg>
