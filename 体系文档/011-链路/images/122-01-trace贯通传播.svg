<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>trace 贯通：头随请求走，树随 span 长</title>
  <desc>网关生成 trace_id 开启 root span，向下游发起 HTTP 调用时 SDK 自动写 W3C traceparent 头，订单、支付逐跳成为子 span；MQ 场景上下文写进消息头，消费侧用 span link 关联生产侧。下方是四个高频断点、日志互跳与图例。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="axOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">trace 贯通：头随请求走，树随 span 长</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">断链 = 高频断点</text>

  <!-- 同步链 -->
  <rect x="40" y="76" width="240" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="160" y="100" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">网关</text>
  <text x="160" y="122" font-size="11.5" fill="#0d2f5c" text-anchor="middle">生成 trace_id + root span</text>

  <rect x="340" y="76" width="240" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="460" y="100" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">订单服务</text>
  <text x="460" y="122" font-size="11.5" fill="#0d2f5c" text-anchor="middle">SERVER span（子）</text>

  <rect x="640" y="76" width="240" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="760" y="100" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">支付服务</text>
  <text x="760" y="122" font-size="11.5" fill="#0d2f5c" text-anchor="middle">SERVER span（孙）</text>

  <rect x="940" y="76" width="220" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1050" y="100" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">MySQL</text>
  <text x="1050" y="122" font-size="11.5" fill="#123314" text-anchor="middle">CLIENT span（db.statement）</text>

  <line x1="280" y1="108" x2="336" y2="108" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <line x1="580" y1="108" x2="636" y2="108" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <line x1="880" y1="108" x2="936" y2="108" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <text x="40" y="164" font-size="11.5" fill="#0d47a1">每一跳 SDK 自动写 W3C 头：traceparent: 00-&lt;trace_id&gt;-&lt;当前span_id&gt;-01——下游读到后沿用 trace_id、认 parent（111 §1.3）</text>

  <!-- MQ 异步分支 -->
  <line x1="460" y1="140" x2="460" y2="196" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#axOrange)"/>
  <rect x="340" y="200" width="240" height="56" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="460" y="222" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">MQ（下单事件）</text>
  <text x="460" y="244" font-size="11.5" fill="#7f3f00" text-anchor="middle">消息头携带上下文</text>

  <line x1="580" y1="228" x2="636" y2="228" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#axOrange)"/>
  <text x="608" y="218" font-size="10" fill="#616161" text-anchor="middle">异步消费</text>

  <rect x="640" y="200" width="240" height="56" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="760" y="222" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">积分服务 CONSUMER</text>
  <text x="760" y="244" font-size="11.5" fill="#311b92" text-anchor="middle">span link 指回生产侧</text>

  <!-- 断点 -->
  <rect x="40" y="300" width="1120" height="160" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="326" font-size="13" font-weight="bold" fill="#c62828">四个高频断点（122 §4.5）</text>
  <text x="60" y="354" font-size="12" fill="#37474f">① 网关转发重写请求时丢 traceparent　　② 内部调用库未开 instrumentation</text>
  <text x="60" y="380" font-size="12" fill="#37474f">③ 自研 MQ 客户端不注入消息头　　④ 下游服务自造新 trace_id（换了 ID）</text>
  <text x="60" y="406" font-size="12.5" fill="#5d4037">通用排查：断点两侧各打一次上下文（上游发出的头 / 下游收到的头）——缺失或不一致的位置就是答案</text>
  <text x="60" y="440" font-size="11.5" fill="#616161">传播是逐跳约定：任何一跳没接（未埋点）或没传（手工转发丢头），树就在那里断掉（111 §1.3）</text>

  <!-- 日志互跳 -->
  <rect x="40" y="484" width="1120" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="511" font-size="12.5" fill="#7f3f00">日志互跳：埋点 SDK 把当前 trace_id 注入日志——告警 → 日志搜 ERROR → trace 还原瀑布，一键贯通（122 §4.4）</text>

  <!-- 尾注 -->
  <text x="40" y="560" font-size="11.5" fill="#616161">验收点：每一跳的下游是否真的收到了头——打印请求头或抓包，确认 traceparent 存在且 trace_id 与上游一致（122 §4.2）</text>
  <text x="40" y="586" font-size="11.5" fill="#616161">多 SDK 冲突（两个 tracer 都想管）也表现为断链——确认全局只有一个 provider（122 §4.5）</text>

  <!-- 图例 -->
  <rect x="40" y="608" width="1120" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="632" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="644" font-size="12" fill="#37474f">SERVER（服务节点）</text>
  <rect x="320" y="632" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="352" y="644" font-size="12" fill="#37474f">CLIENT（数据库 / 下游调用）</text>
  <rect x="640" y="632" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="672" y="644" font-size="12" fill="#37474f">MQ（异步通道）</text>
  <rect x="900" y="632" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="932" y="644" font-size="12" fill="#37474f">CONSUMER（异步消费方）</text>
</svg>
