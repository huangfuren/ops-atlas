<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>头部采样 vs 尾部采样：决策时机决定盲区</title>
  <desc>头部采样在入口掷骰子，不知道这单会不会出错，故障 trace 可能被丢掉；尾部采样在 Gateway 收齐整棵 trace 后决策，错误全留慢的全留，代价是缓存与算力。下方是生产组合、尾部策略速览与图例。</desc>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">头部采样 vs 尾部采样：决策时机决定盲区</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">决策位置：SDK / Gateway</text>

  <!-- 头部采样 -->
  <rect x="40" y="80" width="540" height="180" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#0d2f5c">头部采样（SDK / Agent 入口）</text>
  <rect x="60" y="118" width="170" height="24" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="145" y="135" font-size="11" fill="#0d2f5c" text-anchor="middle">掷骰子：10% 保留</text>
  <text x="60" y="166" font-size="12" fill="#0d2f5c">极简：无缓存——上游丢 = 全链路省</text>
  <text x="60" y="192" font-size="12" fill="#0d2f5c">parent-based：整棵树同留同丢</text>
  <text x="60" y="218" font-size="12" fill="#c62828">盲区：故障 trace 被骰子丢掉（123 §5.2）</text>
  <text x="60" y="244" font-size="11.5" fill="#0d2f5c">错误率 1‰、采样 10% 时，错误 trace 只剩一成</text>

  <!-- 尾部采样 -->
  <rect x="620" y="80" width="540" height="180" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="640" y="106" font-size="13" font-weight="bold" fill="#123314">尾部采样（Gateway，收齐整棵再决策）</text>
  <rect x="640" y="118" width="200" height="24" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="740" y="135" font-size="11" fill="#1b5e20" text-anchor="middle">错误全留 · 慢的全留</text>
  <text x="640" y="166" font-size="12" fill="#123314">证据密度最高，策略可组合（123 §5.3）</text>
  <text x="640" y="192" font-size="12" fill="#123314">决策依据：status / latency / 概率</text>
  <text x="640" y="218" font-size="12" fill="#c62828">代价：Gateway 缓存整棵 + decision_wait</text>
  <text x="640" y="244" font-size="11.5" fill="#1b3d1e">decision_wait 要大于最大链路跨度（123 §5.6 第 3 坑）</text>

  <!-- 生产组合 -->
  <rect x="40" y="280" width="1120" height="64" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="306" font-size="12.5" fill="#1b5e20">生产组合：概率保底（全服务 1–10%）+ 尾部优化（ERROR 全留 · 超 SLO 全留 · 安静服务保底）（123 §5.4）</text>
  <text x="60" y="330" font-size="12" fill="#1b5e20">部署：尾部采样器在 Gateway 的 tail_sampling processor——Agent 层不放（112 §2.4）</text>

  <!-- 策略速览 -->
  <rect x="40" y="364" width="1120" height="92" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="390" font-size="13" font-weight="bold" fill="#37474f">尾部策略速览（tail_sampling policies）</text>
  <text x="60" y="416" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">status_code: ERROR | latency: threshold_ms 1000 | probabilistic: 5%</text>
  <text x="60" y="442" font-size="11.5" fill="#616161">缓存容量按峰值 span 速率估算——溢出会强制决策，策略失效（123 §5.6 第 4 坑）</text>

  <!-- 尾注 -->
  <text x="40" y="492" font-size="11.5" fill="#616161">成本核算：日 span 数 × 采样率 × 平均大小 × 保留天数——采样率与保留期是两个独立旋钮（123 §5.5）</text>
  <text x="40" y="518" font-size="11.5" fill="#616161">纪律：头部采样决定「采不采」要在最入口统一；Collector 侧只做尾部采样与治理性丢弃（112 §2.5）</text>

  <!-- 图例 -->
  <rect x="40" y="540" width="1120" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="564" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="576" font-size="12" fill="#37474f">头部采样（入口掷骰子）</text>
  <rect x="360" y="564" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="392" y="576" font-size="12" fill="#37474f">尾部采样（Gateway 收齐决策）</text>
  <rect x="680" y="564" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="712" y="576" font-size="12" fill="#37474f">组合策略 / 纪律条</text>
</svg>
