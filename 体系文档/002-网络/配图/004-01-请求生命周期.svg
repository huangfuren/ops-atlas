<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 681.18" width="1200" height="681.18">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>一次 HTTP 请求经过谁：七步链路与四段责任</title>
  <desc>从左到右为浏览器、DNS、服务端边界（CDN/WAF/LB/Nginx）、应用四个区域，七个步骤编号标在箭头上，下方为响应返回与浏览器渲染的回程。</desc>
  <rect width="680" height="386" fill="#FFFFFF"/>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B6A65"/>
    </marker>
  </defs>
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <text x="40" y="28" font-size="13" font-weight="600" fill="#2C2C2A">一次 HTTP 请求经过谁：七步链路，四段责任</text>
    <text x="640" y="28" font-size="9" fill="#8A8880" text-anchor="end">①–⑦ 对应正文 4.1.1，每格标出该段该查什么</text>

    <rect x="40" y="64" width="130" height="122" rx="3" fill="#F8F6F1" stroke="#C9C6BC" stroke-width="0.8"/>
    <text x="56" y="86" font-size="11.5" font-weight="600" fill="#2C2C2A">浏览器</text>
    <text x="56" y="106" font-size="8.5" fill="#6B6A65">发起请求、接收响应</text>
    <text x="56" y="122" font-size="8.5" fill="#6B6A65">缓存命中就不发请求</text>
    <text x="56" y="138" font-size="8.5" fill="#6B6A65">⑦ 解析 HTML 再发请求</text>
    <text x="56" y="170" font-size="7.5" fill="#8A8880">4.2 · 4.6</text>

    <rect x="210" y="64" width="110" height="122" rx="3" fill="#F8F6F1" stroke="#C9C6BC" stroke-width="0.8"/>
    <text x="226" y="86" font-size="11.5" font-weight="600" fill="#2C2C2A">DNS 解析</text>
    <text x="226" y="106" font-size="8.5" fill="#6B6A65">域名 → IP</text>
    <text x="226" y="122" font-size="8.5" fill="#6B6A65">超过 200ms 就是慢</text>
    <text x="226" y="138" font-size="8.5" fill="#6B6A65">查 resolv.conf</text>
    <text x="226" y="170" font-size="7.5" fill="#8A8880">4.8.2</text>

    <rect x="360" y="64" width="150" height="122" rx="3" fill="#F8F6F1" stroke="#C9C6BC" stroke-width="0.8"/>
    <text x="374" y="86" font-size="11.5" font-weight="600" fill="#2C2C2A">服务端边界</text>
    <text x="374" y="110" font-size="9" fill="#4A4945">CDN → WAF → LB → Nginx</text>
    <text x="374" y="126" font-size="8.5" fill="#6B6A65">请求在这里转发到上游</text>
    <text x="374" y="142" font-size="8.5" fill="#6B6A65">大多数 5xx 在此被记下</text>
    <text x="374" y="170" font-size="7.5" fill="#8A8880">4.4 · 4.5</text>

    <rect x="550" y="64" width="90" height="122" rx="3" fill="#F8F6F1" stroke="#C9C6BC" stroke-width="0.8"/>
    <text x="564" y="86" font-size="11.5" font-weight="600" fill="#2C2C2A">应用</text>
    <text x="564" y="106" font-size="8.5" fill="#6B6A65">⑤ 处理业务</text>
    <text x="564" y="122" font-size="8.5" fill="#6B6A65">慢在这里最常见</text>
    <text x="564" y="138" font-size="8.5" fill="#6B6A65">看 urt 与日志</text>
    <text x="564" y="170" font-size="7.5" fill="#8A8880">4.8.3</text>

    <g stroke="#6B6A65" stroke-width="1" fill="none" marker-end="url(#ar1)">
      <path d="M170,125 L204,125"/>
      <path d="M320,125 L354,125"/>
      <path d="M510,125 L544,125"/>
      <path d="M595,186 L595,240 L105,240 L105,192"/>
    </g>

    <circle cx="187" cy="125" r="8" fill="#FAEEDA" stroke="#C08A3E" stroke-width="0.8"/>
    <text x="187" y="128" font-size="8" fill="#7A4A12" text-anchor="middle">1</text>
    <circle cx="337" cy="104" r="8" fill="#FAEEDA" stroke="#C08A3E" stroke-width="0.8"/>
    <text x="337" y="107" font-size="8" fill="#7A4A12" text-anchor="middle">2</text>
    <circle cx="337" cy="146" r="8" fill="#FAEEDA" stroke="#C08A3E" stroke-width="0.8"/>
    <text x="337" y="149" font-size="8" fill="#7A4A12" text-anchor="middle">3</text>
    <circle cx="527" cy="125" r="8" fill="#FAEEDA" stroke="#C08A3E" stroke-width="0.8"/>
    <text x="527" y="128" font-size="8" fill="#7A4A12" text-anchor="middle">4</text>

    <text x="620" y="258" font-size="9" fill="#6B6A65" text-anchor="end">⑥ 响应：状态行 + 头 + 体</text>
    <text x="60" y="258" font-size="9" fill="#6B6A65">⑦ 渲染：CSS / JS / 图片再发 N 个请求</text>

    <rect x="40" y="282" width="600" height="70" rx="3" fill="#F1EFE8"/>
    <text x="56" y="304" font-size="9.8" fill="#2C2C2A">无状态是这条链路能水平扩容的前提：服务端不记上一个请求，任何一台机器都能处理任何请求。</text>
    <text x="56" y="322" font-size="9.8" fill="#6B6A65">代价是登录态得自己维持——Cookie / Session / Token 放在客户端或共享存储里。</text>
    <text x="56" y="340" font-size="9.8" fill="#6B6A65">性能主战场在 ⑦：一个页面 80 个请求很常见，不是「一个页面一次请求」。</text>
  </g>

  </g>
</svg>
