<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710">
  <rect x="0" y="0" width="1200" height="710" fill="#ffffff"/>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#0d47a1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">连接复用与队头阻塞：为什么要升级版本</text>
  <text x="30" y="68" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">HTTP/1.0 默认短连接，HTTP/1.1 默认长连接　·　三条时间轴横轴都是时间，从左到右</text>
  <line x1="30" y1="86" x2="1170" y2="86" stroke="#cfd8dc" stroke-width="1"/>

  <text x="30" y="124" font-size="15" font-weight="bold" fill="#8d6e00" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">同样的三个请求，建连次数不同</text>

  <text x="30" y="168" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">短连接</text>
  <rect x="120" y="148" width="60" height="32" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="150" y="168" font-size="11" fill="#546e7a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">建连</text>
  <rect x="184" y="148" width="92" height="32" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="230" y="168" font-size="11" fill="#0d2f5c" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 1</text>
  <rect x="280" y="148" width="60" height="32" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="310" y="168" font-size="11" fill="#546e7a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">建连</text>
  <rect x="344" y="148" width="92" height="32" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="390" y="168" font-size="11" fill="#7f3f00" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 2</text>
  <rect x="440" y="148" width="60" height="32" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="470" y="168" font-size="11" fill="#546e7a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">建连</text>
  <rect x="504" y="148" width="92" height="32" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="550" y="168" font-size="11" fill="#123314" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 3</text>

  <text x="30" y="212" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">长连接</text>
  <rect x="120" y="192" width="60" height="32" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="150" y="212" font-size="11" fill="#546e7a" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">建连</text>
  <rect x="184" y="192" width="92" height="32" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="230" y="212" font-size="11" fill="#0d2f5c" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 1</text>
  <rect x="280" y="192" width="92" height="32" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="326" y="212" font-size="11" fill="#7f3f00" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 2</text>
  <rect x="376" y="192" width="92" height="32" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="422" y="212" font-size="11" fill="#123314" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 3</text>
  <text x="486" y="212" font-size="11" fill="#2e7d32" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">省下 2 次建连，即 2 个 RTT</text>

  <line x1="30" y1="242" x2="1170" y2="242" stroke="#cfd8dc" stroke-width="1"/>

  <text x="30" y="272" font-size="15" font-weight="bold" fill="#8d6e00" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">队头阻塞：一条连接上的三个请求</text>

  <text x="30" y="306" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">HTTP/1.1</text>
  <text x="30" y="322" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">串行</text>
  <rect x="150" y="286" width="320" height="28" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="310" y="305" font-size="11" fill="#0d2f5c" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 1（慢）</text>
  <rect x="474" y="286" width="130" height="28" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="539" y="305" font-size="11" fill="#7f3f00" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 2</text>
  <rect x="608" y="286" width="130" height="28" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="673" y="305" font-size="11" fill="#123314" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 3</text>
  <text x="754" y="305" font-size="11" fill="#bf360c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 1 慢，后面的全部排队 —— 这就是队头阻塞</text>

  <text x="30" y="362" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">HTTP/2</text>
  <text x="30" y="378" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">多路复用</text>
  <rect x="150" y="340" width="280" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <rect x="150" y="358" width="220" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <rect x="150" y="376" width="180" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <rect x="420" y="340" width="80" height="50" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="460" y="370" font-size="11" fill="#7f0000" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">丢包</text>
  <text x="516" y="370" font-size="11" fill="#bf360c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">应用层不再排队；但 TCP 丢一个包，三条流一起停</text>
  <text x="516" y="388" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">重传到达后才继续 —— 问题被推给了 TCP</text>

  <text x="30" y="432" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">HTTP/3</text>
  <text x="30" y="448" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">QUIC</text>
  <rect x="150" y="406" width="280" height="12" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <rect x="150" y="422" width="150" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <rect x="304" y="422" width="70" height="12" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <rect x="378" y="422" width="52" height="12" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <rect x="150" y="438" width="180" height="12" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="516" y="424" font-size="11" fill="#2e7d32" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">流之间互相独立，丢包只影响那一条流</text>
  <text x="516" y="442" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">前提：防火墙要放行 UDP 443</text>

  <text x="30" y="486" font-size="15" font-weight="bold" fill="#8d6e00" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">版本演进</text>

  <rect x="30" y="500" width="285" height="34" rx="4" fill="#eceff1"/>
  <text x="172" y="523" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.0</text>
  <rect x="315" y="500" width="285" height="34" rx="4" fill="#eceff1"/>
  <text x="457" y="523" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">1.1</text>
  <rect x="600" y="500" width="285" height="34" rx="4" fill="#eceff1"/>
  <text x="742" y="523" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">2</text>
  <rect x="885" y="500" width="285" height="34" rx="4" fill="#eceff1"/>
  <text x="1027" y="523" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">3</text>

  <rect x="30" y="538" width="285" height="60" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="48" y="562" font-size="11.5" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">每个请求一条连接</text>
  <text x="48" y="584" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">用完就断，短连接</text>
  <rect x="315" y="538" width="285" height="60" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="333" y="562" font-size="11.5" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">长连接；管道化很少启用</text>
  <text x="333" y="584" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">默认 keep-alive</text>
  <rect x="600" y="538" width="285" height="60" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="618" y="562" font-size="11.5" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">多路复用、头部压缩</text>
  <text x="618" y="584" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">仍跑在 TCP 上</text>
  <rect x="885" y="538" width="285" height="60" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="903" y="562" font-size="11.5" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">QUIC，流独立</text>
  <text x="903" y="584" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">需 UDP 443</text>

  <rect x="30" y="618" width="1140" height="56" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="642" font-size="13" font-weight="bold" fill="#e65100" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">三代各解决一半</text>
  <text x="50" y="664" font-size="11.5" fill="#5d4037" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">1.1 解决不了应用层队头阻塞；2 解决了应用层，却把问题推给了 TCP；3 才真正把流拆开 —— 所以「升级到 2」不等于「没有队头阻塞」。</text>

  <rect x="30" y="690" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="62" y="701" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 1 / 流 1</text>
  <rect x="200" y="690" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="232" y="701" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 2 / 流 2</text>
  <rect x="360" y="690" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="392" y="701" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求 3 / 流 3</text>
  <rect x="520" y="690" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="552" y="701" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">丢包停住</text>
  <rect x="650" y="690" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="682" y="701" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">建连</text>
</svg>
