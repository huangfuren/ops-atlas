<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#0d47a1">封装：每往下一层，加一个信封</text>
  <text x="40" y="78" font-size="11.5" fill="#616161">宽度按字节数等比（1B ≈ 7px），HTTP 数据长度仅示意；向下逐层加头，向上逐层剥头</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#cfd8dc" stroke-width="1"/>

  <text x="40" y="138" font-size="15" font-weight="bold" fill="#123314">应用层</text>
  <text x="40" y="162" font-size="11.5" fill="#616161">原始数据</text>
  <rect x="180" y="150" width="490" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="425" y="178" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">HTTP 数据 70B（示意）</text>

  <text x="40" y="238" font-size="15" font-weight="bold" fill="#0d2f5c">传输层</text>
  <text x="40" y="262" font-size="11.5" fill="#616161">+ TCP 头 20B</text>
  <rect x="180" y="250" width="140" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="250" y="278" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">TCP 头 20B</text>
  <rect x="320" y="250" width="490" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="565" y="278" font-size="13" fill="#123314" text-anchor="middle">HTTP 数据</text>

  <text x="40" y="338" font-size="15" font-weight="bold" fill="#311b92">网络层</text>
  <text x="40" y="362" font-size="11.5" fill="#616161">+ IP 头 20B</text>
  <rect x="180" y="350" width="140" height="44" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="250" y="378" font-size="12" font-weight="bold" fill="#311b92" text-anchor="middle">IP 头 20B</text>
  <rect x="320" y="350" width="140" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="390" y="378" font-size="12" fill="#0d2f5c" text-anchor="middle">TCP 头</text>
  <rect x="460" y="350" width="490" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="705" y="378" font-size="13" fill="#123314" text-anchor="middle">HTTP 数据</text>

  <text x="40" y="438" font-size="15" font-weight="bold" fill="#7f3f00">链路层</text>
  <text x="40" y="462" font-size="11.5" fill="#616161">+ 帧头 14B + FCS 4B</text>
  <rect x="180" y="450" width="98" height="44" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="229" y="478" font-size="12" font-weight="bold" fill="#7f3f00" text-anchor="middle">帧头 14B</text>
  <rect x="278" y="450" width="140" height="44" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="348" y="478" font-size="12" fill="#311b92" text-anchor="middle">IP 头</text>
  <rect x="418" y="450" width="140" height="44" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="488" y="478" font-size="12" fill="#0d2f5c" text-anchor="middle">TCP 头</text>
  <rect x="558" y="450" width="490" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="803" y="478" font-size="13" fill="#123314" text-anchor="middle">HTTP 数据</text>
  <rect x="1048" y="450" width="28" height="44" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="1090" y="478" font-size="11" fill="#c62828">FCS 4B</text>

  <line x1="150" y1="196" x2="150" y2="246" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="150" y1="296" x2="150" y2="346" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="150" y1="396" x2="150" y2="446" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="40" y="515" width="1120" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="64" y="543" font-size="13" font-weight="bold" fill="#7f3f00">三个头共 54B（帧头 14 + IP 20 + TCP 20），数据越小头占比越高</text>
  <text x="64" y="567" font-size="11.5" fill="#5d4037">一个 70B 的请求，光头部就占 54B——这是小包有效载荷率低的根本原因，也是 MTU 与 Nagle 调优的出发点。</text>

  <rect x="40" y="605" width="1120" height="34" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="56" y="615" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="86" y="626" font-size="12" fill="#37474f">应用数据</text>
  <rect x="186" y="615" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="216" y="626" font-size="12" fill="#37474f">TCP 头（传输层加）</text>
  <rect x="374" y="615" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="404" y="626" font-size="12" fill="#37474f">IP 头（网络层加）</text>
  <rect x="562" y="615" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="592" y="626" font-size="12" fill="#37474f">帧头（链路层加）</text>
  <rect x="750" y="615" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="780" y="626" font-size="12" fill="#37474f">FCS 帧校验</text>
</svg>
