<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
  <rect x="0" y="0" width="1200" height="670" fill="#ffffff"/>

  <text x="30" y="44" font-size="20" font-weight="bold" fill="#0d47a1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求与响应：同一种结构，四个部分</text>
  <text x="30" y="68" font-size="12" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">空行是头与体的分界，缺了整条报文都会解析错　·　左右两列逐段对齐，横向读就是同一位置</text>
  <line x1="30" y1="86" x2="1170" y2="86" stroke="#cfd8dc" stroke-width="1"/>

  <text x="30" y="116" font-size="17" font-weight="bold" fill="#0d47a1" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求</text>
  <text x="610" y="116" font-size="17" font-weight="bold" fill="#1b5e20" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">响应</text>

  <rect x="30" y="130" width="560" height="70" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="50" y="150" font-size="11" font-weight="bold" fill="#1565c0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">起始行</text>
  <text x="50" y="174" font-size="11" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">GET /index.html?from=nav HTTP/1.1</text>
  <text x="50" y="192" font-size="11" fill="#0d2f5c" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">方法 → 路径 + 查询串 → 版本　（自左向右）</text>

  <rect x="610" y="130" width="560" height="70" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="150" font-size="11" font-weight="bold" fill="#2e7d32" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">起始行</text>
  <text x="630" y="174" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">HTTP/1.1 200 OK</text>
  <text x="630" y="192" font-size="11" fill="#123314" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">版本 → 状态码 → 原因短语　（自左向右）</text>

  <rect x="30" y="210" width="560" height="186" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="50" y="230" font-size="11" font-weight="bold" fill="#1565c0" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">头部</text>
  <text x="50" y="254" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Host: www.example.com</text>
  <text x="50" y="276" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">User-Agent: Mozilla/5.0 (Windows NT 10.0)</text>
  <text x="50" y="298" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Accept: text/html,application/xhtml+xml</text>
  <text x="50" y="320" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Accept-Encoding: gzip, br</text>
  <text x="50" y="342" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Cookie: session_id=abc123</text>
  <text x="50" y="376" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">按用途分六类：上下文 / 认证 / 内容协商 / 缓存 / 连接 / 安全</text>

  <rect x="610" y="210" width="560" height="186" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="630" y="230" font-size="11" font-weight="bold" fill="#2e7d32" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">头部</text>
  <text x="630" y="254" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Server: nginx/1.24.0</text>
  <text x="630" y="276" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Content-Type: text/html; charset=UTF-8</text>
  <text x="630" y="298" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Content-Length: 3456</text>
  <text x="630" y="320" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Cache-Control: max-age=3600</text>
  <text x="630" y="342" font-size="11" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Set-Cookie: session_id=abc123</text>
  <text x="630" y="376" font-size="11" fill="#616161" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">看到没见过的头，先归类再查字段 —— 比背字段名有用</text>

  <rect x="30" y="404" width="560" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="50" y="429" font-size="11" fill="#7f3f00" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">（空行）必须有：头与体的分界，缺了整条报文解析错</text>

  <rect x="610" y="404" width="560" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="630" y="429" font-size="11" fill="#7f3f00" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">（空行）之后才是响应体</text>

  <rect x="30" y="452" width="560" height="64" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="50" y="476" font-size="11" font-weight="bold" fill="#546e7a" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">体</text>
  <text x="50" y="500" font-size="11" fill="#546e7a" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">GET 通常为空；POST / PUT 把提交内容放这里</text>

  <rect x="610" y="452" width="560" height="64" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="630" y="476" font-size="11" font-weight="bold" fill="#546e7a" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">体</text>
  <text x="630" y="500" font-size="11" fill="#546e7a" font-family="ui-monospace,Menlo,Consolas,monospace">&lt;html&gt;...&lt;/html&gt;</text>

  <rect x="30" y="536" width="1140" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="562" font-size="15" font-weight="bold" fill="#e65100" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">三个部分各管一件事</text>
  <text x="50" y="586" font-size="11.5" fill="#5d4037" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">起始行回答「要什么」，头部回答「我是谁、接受什么格式」，体才是数据本身 —— 排查时按这个顺序看，不会一上来就翻 body。</text>
  <text x="50" y="606" font-size="11.5" fill="#5d4037" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">头部是主战场：状态码对不对看起始行，业务对不对看体，中间那一大段问题最多。</text>

  <rect x="30" y="636" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="62" y="647" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">请求</text>
  <rect x="150" y="636" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="182" y="647" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">响应</text>
  <rect x="270" y="636" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="302" y="647" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">空行（分界，必须有）</text>
  <rect x="500" y="636" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="532" y="647" font-size="12" fill="#37474f" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">体</text>
</svg>
