<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>数据模型：一个指标如何切出多条时间线</title>
  <desc>同一个指标名下，label 组合不同即构成不同的时间线。三条 series 共享指标名，但因 code 与 instance 取值不同而彼此独立，图中用三种颜色区分；查询时 label 就是筛选维度。</desc>

  <rect width="680" height="330" fill="#FFFFFF"/>
  <text x="40" y="30" font-size="13" font-weight="500" fill="#2B2A27">一个指标，三条时间线</text>
  <text x="640" y="30" font-size="9.5" fill="#9A9791" text-anchor="end">颜色不同 = 各自独立，互不覆盖</text>

  <text x="56" y="66" font-size="12.5" font-weight="500" fill="#2B2A27" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">http_requests_total</text>
  <text x="220" y="66" font-size="9.5" fill="#9A9791">← 指标名：三条 series 共享同一个名字，回答「量的是什么」</text>

  <line x1="56" y1="74" x2="56" y2="230" stroke="#CFCCC2" stroke-width="1"/>

  <!-- series 1 -->
  <line x1="56" y1="110" x2="76" y2="110" stroke="#6BAF95" stroke-width="1"/>
  <rect x="76" y="96" width="250" height="28" rx="2" fill="#DFF3EC" stroke="#6BAF95" stroke-width="0.9"/>
  <text x="88" y="114" font-size="9.5" fill="#1B3D31" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">code="200", instance="10.0.0.1:8080"</text>
  <line x1="340" y1="110" x2="624" y2="110" stroke="#D3E9DF" stroke-width="1"/>
  <g fill="#4F8A74">
    <circle cx="370" cy="110" r="3.4"/><circle cx="440" cy="110" r="3.4"/>
    <circle cx="510" cy="110" r="3.4"/><circle cx="580" cy="110" r="3.4"/>
  </g>
  <text x="624" y="100" font-size="8.5" font-weight="500" fill="#1D5A45" text-anchor="end">series 1</text>

  <!-- series 2 -->
  <line x1="56" y1="170" x2="76" y2="170" stroke="#D9A458" stroke-width="1"/>
  <rect x="76" y="156" width="250" height="28" rx="2" fill="#FBEEDA" stroke="#D9A458" stroke-width="0.9"/>
  <text x="88" y="174" font-size="9.5" fill="#4A3208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">code="500", instance="10.0.0.1:8080"</text>
  <line x1="340" y1="170" x2="624" y2="170" stroke="#EBD9BC" stroke-width="1"/>
  <g fill="#C08A3E">
    <circle cx="370" cy="170" r="3.4"/><circle cx="440" cy="170" r="3.4"/>
    <circle cx="510" cy="170" r="3.4"/><circle cx="580" cy="170" r="3.4"/>
  </g>
  <text x="624" y="160" font-size="8.5" font-weight="500" fill="#7A4A12" text-anchor="end">series 2</text>

  <!-- series 3 -->
  <line x1="56" y1="230" x2="76" y2="230" stroke="#9C8ACB" stroke-width="1"/>
  <rect x="76" y="216" width="250" height="28" rx="2" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="0.9"/>
  <text x="88" y="234" font-size="9.5" fill="#33265C" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">code="200", instance="10.0.0.2:8080"</text>
  <line x1="340" y1="230" x2="624" y2="230" stroke="#D8CEEE" stroke-width="1"/>
  <g fill="#8168B8">
    <circle cx="370" cy="230" r="3.4"/><circle cx="440" cy="230" r="3.4"/>
    <circle cx="510" cy="230" r="3.4"/><circle cx="580" cy="230" r="3.4"/>
  </g>
  <text x="624" y="220" font-size="8.5" font-weight="500" fill="#46337A" text-anchor="end">series 3</text>

  <text x="340" y="252" font-size="9" fill="#9A9791">每个圆点是一个样本（timestamp, value）</text>
  <text x="624" y="244" font-size="8.5" fill="#9A9791" text-anchor="end">时间 →</text>

  <line x1="40" y1="266" x2="640" y2="266" stroke="#DCD9CE" stroke-width="0.8"/>
  <text x="40" y="286" font-size="9.5" fill="#4A4945">三条 series 的 label 组合各不相同，因此是三根独立的时间线，互不覆盖；组合若完全相同，就会互相覆盖。</text>
  <text x="40" y="306" font-size="9.5" fill="#4A4945">查询时 label 就是筛选维度：{code="500"} 只命中第 2 条；sum by (code) 会把第 1、3 条合并成一条。</text>
</svg>
