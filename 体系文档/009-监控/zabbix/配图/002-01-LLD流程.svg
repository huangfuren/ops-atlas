<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>LLD：从一条发现规则到成百个监控项</title>
  <desc>低级发现的链路是：发现规则执行一个 key，返回 JSON 实体数组；过滤器决定哪些实体要；监控项、触发器、图形原型决定每个实体生成什么；最后每个实体生成一组监控项与触发器。过滤器只决定要不要，覆盖决定生成后怎么改，覆盖首条命中即停。不加过滤的发现会生成大量无用监控项。</desc>

  <rect width="680" height="440" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">LLD：从一条发现规则到成百个监控项</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">002 §2.2</text>

  <defs>
    <marker id="a2Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a2Amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A458"/>
    </marker>
  </defs>

  <!-- 四段流程 -->
  <rect x="20" y="52" width="140" height="94" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="90" y="72" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">① 发现规则</text>
  <text x="90" y="90" font-size="6.6" fill="#4A4945" text-anchor="middle">key：vfs.fs.discovery</text>
  <text x="90" y="105" font-size="6.6" fill="#4A4945" text-anchor="middle">前端 Test 可直接执行</text>
  <text x="90" y="122" font-size="6.4" fill="#8C8980" text-anchor="middle">不取业务数据，只找实体</text>
  <text x="90" y="137" font-size="6.4" fill="#8C8980" text-anchor="middle">本机验证：agent2 -t key</text>

  <line x1="162" y1="99" x2="176" y2="99" stroke="#7FA6D0" stroke-width="1.3" marker-end="url(#a2Blue)"/>

  <rect x="178" y="52" width="150" height="94" rx="3" fill="#FAF9F4" stroke="#CFCCC2" stroke-width="1"/>
  <text x="253" y="72" font-size="8.2" font-weight="600" fill="#2B2A27" text-anchor="middle">② 实体列表（JSON）</text>
  <text x="190" y="90" font-size="6.4" fill="#4A4945">[{"{#FSNAME}":"/"},</text>
  <text x="190" y="104" font-size="6.4" fill="#4A4945"> {"{#FSNAME}":"/var"}]</text>
  <text x="190" y="122" font-size="6.4" fill="#8C8980">宏名由发现规则定义，</text>
  <text x="190" y="136" font-size="6.4" fill="#8C8980">原型里用同名宏占位</text>

  <line x1="330" y1="99" x2="344" y2="99" stroke="#7FA6D0" stroke-width="1.3" marker-end="url(#a2Blue)"/>

  <rect x="346" y="52" width="130" height="94" rx="3" fill="#FAF9F4" stroke="#CFCCC2" stroke-width="1"/>
  <text x="411" y="72" font-size="8.2" font-weight="600" fill="#2B2A27" text-anchor="middle">③ 过滤器</text>
  <text x="358" y="90" font-size="6.4" fill="#4A4945">{#FSNAME} not matches</text>
  <text x="358" y="104" font-size="6.4" fill="#4A4945">@File systems for discovery</text>
  <text x="358" y="122" font-size="6.4" fill="#8C8980">决定「要不要生成」，</text>
  <text x="358" y="136" font-size="6.4" fill="#8C8980">不加会把临时挂载也生成</text>

  <line x1="478" y1="99" x2="492" y2="99" stroke="#7FA6D0" stroke-width="1.3" marker-end="url(#a2Blue)"/>

  <rect x="494" y="52" width="166" height="94" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="577" y="72" font-size="8.2" font-weight="600" fill="#7A4A12" text-anchor="middle">④ 三种原型</text>
  <text x="506" y="90" font-size="6.6" fill="#7A4A12">监控项原型 → 取值（size / pfree）</text>
  <text x="506" y="105" font-size="6.6" fill="#7A4A12">触发器原型 → 阈值判定</text>
  <text x="506" y="120" font-size="6.6" fill="#7A4A12">图形原型 → 自动出图</text>
  <text x="506" y="138" font-size="6.4" fill="#8C8980">key 里的实体宏在生成时替换</text>

  <!-- 生成结果 -->
  <rect x="20" y="162" width="640" height="112" rx="3" fill="#FFFFFF" stroke="#E5E2D8" stroke-width="1"/>
  <text x="34" y="180" font-size="7.8" font-weight="600" fill="#2B2A27">生成结果：一个实体 → 一组监控项、触发器与图形</text>

  <rect x="34" y="190" width="296" height="72" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="46" y="207" font-size="7.2" font-weight="600" fill="#1D5A45">实体：/（根分区）</text>
  <text x="46" y="222" font-size="6.4" fill="#1D5A45">item　vfs.fs.size[/,pfree]</text>
  <text x="46" y="236" font-size="6.4" fill="#1D5A45">trigger　剩余空间 &lt; {$LOW_SPACE_LIMIT}</text>
  <text x="46" y="250" font-size="6.4" fill="#1D5A45">graph　自动生成使用率曲线</text>

  <rect x="350" y="190" width="296" height="72" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="362" y="207" font-size="7.2" font-weight="600" fill="#1D5A45">实体：/var（独立分区）</text>
  <text x="362" y="222" font-size="6.4" fill="#1D5A45">item　vfs.fs.size[/var,pfree]</text>
  <text x="362" y="236" font-size="6.4" fill="#1D5A45">trigger　剩余空间 &lt; {$LOW_SPACE_LIMIT}</text>
  <text x="362" y="250" font-size="6.4" fill="#1D5A45">graph　自动生成使用率曲线</text>

  <!-- 过滤器与覆盖的分工 -->
  <rect x="20" y="284" width="640" height="52" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="34" y="302" font-size="7.6" font-weight="600" fill="#2B2A27">过滤器 vs 覆盖：一个决定「要不要」，一个决定「生成后怎么改」</text>
  <text x="34" y="318" font-size="6.8" fill="#4A4945">过滤器在生成前筛实体（如排除 tmpfs）；覆盖在生成后改间隔、改阈值、禁用，按顺序匹配，第一条命中即停——</text>
  <text x="34" y="331" font-size="6.8" fill="#7A4A12">所以把「禁用 / 特例」规则放最前面，否则永远轮不到它。</text>

  <!-- 三个坑 -->
  <rect x="20" y="346" width="640" height="36" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="32" y="361" font-size="7.8" font-weight="600" fill="#7A322B">三个高频坑：① 无过滤 → 生成上百个 overlay/tmpfs 监控项　② 覆盖顺序反了 → 特例不生效　③ 用 ifIndex 命名 → 设备重启后图张冠李戴</text>
  <text x="32" y="375" font-size="6.8" fill="#7A322B">正确做法：先 Test 看原始 JSON → 加过滤器 → 用 ifDescr 命名 → 最后才开规则。</text>

  <rect x="20" y="390" width="640" height="32" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="32" y="410" font-size="7.4" fill="#1D5A45">验证闭环：发现规则最近执行时间 → 监控项列表里出现实体名 → Latest data 有值。三步缺一，都是 LLD 没走完。</text>

  <text x="32" y="432" font-size="9" fill="#8C8980">LLD 的价值不是「自动」，而是「实体变化时不用人工补监控项」——所以过滤与命名规则比规则本身更重要。</text>
</svg>
