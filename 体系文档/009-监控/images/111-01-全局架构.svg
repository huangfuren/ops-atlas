<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Prometheus 全局架构：采集端、本体、输出端三层</title>
  <desc>采集端三类来源（埋点任务、Exporter、Pushgateway）全部由 Prometheus 本体主动拉取；本体只有一个进程，内含 Retrieval、TSDB、Rules、HTTP API 四个模块，Retrieval 只进不出；输出端三种出口分别是 TSDB 到远程存储的 remote_write、Rules 到 Alertmanager 的告警推送、HTTP API 供 Grafana 查询。来源为 009-监控 111 §1.3，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="870" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">Prometheus 全局架构：中间那层只有一个进程</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 111 §1.3 · 111 §1.4 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">三条 pull 箭头全部由本体发起</text>

  <!-- 采集端 -->
  <rect x="40" y="110" width="1120" height="150" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="136" font-size="14" font-weight="bold" fill="#0d47a1">采集端：把目标状态翻译成 /metrics</text>
  <rect x="60" y="150" width="340" height="92" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="182" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Instrumented Job</text>
  <text x="230" y="208" font-size="11.5" fill="#0d2f5c" text-anchor="middle">业务埋点，自己暴露指标</text>
  <text x="230" y="228" font-size="11" fill="#0d2f5c" text-anchor="middle">应用进程内集成 client 库</text>
  <rect x="430" y="150" width="340" height="92" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="182" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Exporter</text>
  <text x="600" y="208" font-size="11.5" fill="#0d2f5c" text-anchor="middle">node / blackbox / mysqld</text>
  <text x="600" y="228" font-size="11" fill="#0d2f5c" text-anchor="middle">翻译第三方系统状态</text>
  <rect x="800" y="150" width="340" height="92" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="970" y="182" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Pushgateway</text>
  <text x="970" y="208" font-size="11.5" fill="#0d2f5c" text-anchor="middle">短命任务先推，再被拉</text>
  <text x="970" y="228" font-size="11" fill="#0d2f5c" text-anchor="middle">唯一例外：任务主动推</text>
  <line x1="230" y1="242" x2="230" y2="274" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="600" y1="242" x2="600" y2="274" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="970" y1="242" x2="970" y2="274" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="250" y="266" font-size="11" fill="#388e3c">pull</text>
  <text x="620" y="266" font-size="11" fill="#388e3c">pull</text>
  <text x="990" y="266" font-size="11" fill="#388e3c">pull</text>

  <!-- 本体 -->
  <rect x="40" y="296" width="1120" height="170" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="322" font-size="14" font-weight="bold" fill="#1b5e20">Prometheus Server：抓取、存储、规则、查询都在一个进程里</text>
  <rect x="70" y="340" width="250" height="106" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="195" y="374" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">Retrieval</text>
  <text x="195" y="400" font-size="11.5" fill="#123314" text-anchor="middle">抓取 + relabel</text>
  <text x="195" y="424" font-size="11" fill="#123314" text-anchor="middle">只进不出</text>
  <rect x="340" y="340" width="250" height="106" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="465" y="374" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">TSDB</text>
  <text x="465" y="400" font-size="11.5" fill="#123314" text-anchor="middle">WAL + block</text>
  <text x="465" y="424" font-size="11" fill="#123314" text-anchor="middle">可 remote_write</text>
  <rect x="610" y="340" width="250" height="106" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="735" y="374" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">Rules</text>
  <text x="735" y="400" font-size="11.5" fill="#123314" text-anchor="middle">record / alert</text>
  <text x="735" y="424" font-size="11" fill="#123314" text-anchor="middle">推告警给 AM</text>
  <rect x="880" y="340" width="250" height="106" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1005" y="374" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">HTTP API</text>
  <text x="1005" y="400" font-size="11.5" fill="#123314" text-anchor="middle">查询接口</text>
  <text x="1005" y="424" font-size="11" fill="#123314" text-anchor="middle">供 Grafana 读取</text>
  <line x1="465" y1="466" x2="465" y2="500" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="735" y1="466" x2="735" y2="500" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="1005" y1="466" x2="1005" y2="500" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 输出端 -->
  <rect x="40" y="502" width="1120" height="150" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="528" font-size="14" font-weight="bold" fill="#311b92">输出端：三种出口，方向与责任各不相同</text>
  <rect x="340" y="542" width="250" height="92" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="465" y="574" font-size="15" font-weight="bold" fill="#311b92" text-anchor="middle">远程存储</text>
  <text x="465" y="600" font-size="11.5" fill="#311b92" text-anchor="middle">Thanos / Mimir / VM</text>
  <text x="465" y="620" font-size="11" fill="#311b92" text-anchor="middle">remote_write</text>
  <rect x="610" y="542" width="250" height="92" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="735" y="574" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">Alertmanager</text>
  <text x="735" y="600" font-size="11.5" fill="#7f3f00" text-anchor="middle">去重 分组 抑制 路由</text>
  <text x="735" y="620" font-size="11" fill="#7f3f00" text-anchor="middle">告警推送</text>
  <rect x="880" y="542" width="250" height="92" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1005" y="574" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Grafana</text>
  <text x="1005" y="600" font-size="11.5" fill="#0d2f5c" text-anchor="middle">看板与临时查询</text>
  <text x="1005" y="620" font-size="11" fill="#0d2f5c" text-anchor="middle">由 API 供数</text>
  <text x="60" y="568" font-size="11.5" fill="#37474f">Retrieval 只拉取，本身不产生对外输出；</text>
  <text x="60" y="594" font-size="11.5" fill="#37474f">服务发现是内置客户端，不是要另装的组件；</text>
  <text x="60" y="620" font-size="11.5" fill="#37474f">Grafana 与 Prometheus 无强耦合。</text>

  <!-- 结论块 -->
  <rect x="40" y="670" width="1120" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="700" font-size="15" font-weight="bold" fill="#bf360c">★ 结构记法：采集端负责翻译，本体负责拉与算，输出端负责存、发、看</text>
  <text x="60" y="728" font-size="12.5" fill="#5d4037">上方三条绿箭头都是本体主动 pull；Pushgateway 是唯一例外——任务先推，再被本体拉走</text>
  <text x="60" y="750" font-size="12.5" fill="#5d4037">下方三种出口方向都是本体到外部：remote_write 推送、告警推送、供 Grafana 查询</text>

  <!-- 图例 -->
  <rect x="40" y="778" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="794" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="805" font-size="12" fill="#37474f">采集端 / 查询端</text>
  <rect x="300" y="794" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="332" y="805" font-size="12" fill="#37474f">本体模块</text>
  <rect x="520" y="794" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="552" y="805" font-size="12" fill="#37474f">远程存储</text>
  <rect x="740" y="794" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="772" y="805" font-size="12" fill="#37474f">告警枢纽</text>
</svg>
