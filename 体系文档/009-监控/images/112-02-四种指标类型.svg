<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>四种指标类型：形态差异决定查询方式</title>
  <desc>Counter 单调递增，归零即进程重启，用 rate 看斜率；Gauge 可增可减，直接取值或 avg_over_time；Histogram 是带 le 标签的累计分桶，可跨实例合并后算分位；Summary 的分位在客户端算好，多实例求和无意义。四者用四种语义色区分，形态线只示意差异，纵轴不代表同一量纲。来源为 009-监控 112 §2.2，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">四种指标类型：长什么样，决定怎么查</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 112 §2.2 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">形态示意，纵轴不同量纲</text>

  <!-- Counter -->
  <rect x="40" y="110" width="540" height="250" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="142" font-size="15" font-weight="bold" fill="#123314">Counter 计数器</text>
  <text x="60" y="168" font-size="11.5" fill="#123314">只增不减，归零即进程重启；用 rate() 看斜率</text>
  <path d="M 70 340 L 150 340 L 150 322 L 230 322 L 230 298 L 310 298 L 310 270 L 390 270 L 390 238 L 470 238 L 470 200 L 550 200"
        fill="none" stroke="#2e7d32" stroke-width="2"/>
  <line x1="70" y1="340" x2="550" y2="340" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="290" font-size="11" fill="#123314">阶梯只上不下</text>
  <text x="60" y="316" font-size="11" fill="#123314">典型：http_requests_total</text>

  <!-- Gauge -->
  <rect x="620" y="110" width="540" height="250" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="640" y="142" font-size="15" font-weight="bold" fill="#0d2f5c">Gauge 瞬时值</text>
  <text x="640" y="168" font-size="11.5" fill="#0d2f5c">可增可减；直接取值或 avg_over_time()</text>
  <path d="M 650 260 L 700 222 L 750 250 L 800 202 L 850 236 L 900 208 L 950 244 L 1000 216 L 1050 240 L 1120 224"
        fill="none" stroke="#1565c0" stroke-width="2"/>
  <line x1="650" y1="340" x2="1120" y2="340" stroke="#1565c0" stroke-width="1"/>
  <text x="640" y="290" font-size="11" fill="#0d2f5c">上下起伏，没有累积语义</text>
  <text x="640" y="316" font-size="11" fill="#0d2f5c">典型：node_memory_MemAvailable_bytes</text>

  <!-- Histogram -->
  <rect x="40" y="380" width="540" height="250" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="60" y="412" font-size="15" font-weight="bold" fill="#311b92">Histogram 直方图</text>
  <text x="60" y="438" font-size="11.5" fill="#311b92">累计计数带 le 标签；唯一能跨实例合并后再算分位</text>
  <g fill="#5e35b1" stroke="#311b92" stroke-width="1">
    <rect x="70" y="560" width="60" height="36"/>
    <rect x="160" y="540" width="60" height="56"/>
    <rect x="250" y="516" width="60" height="80"/>
    <rect x="340" y="488" width="60" height="108"/>
    <rect x="430" y="456" width="60" height="140"/>
  </g>
  <line x1="70" y1="596" x2="550" y2="596" stroke="#5e35b1" stroke-width="1"/>
  <g font-size="11" fill="#311b92" text-anchor="middle">
    <text x="100" y="614">0.1</text>
    <text x="190" y="614">0.5</text>
    <text x="280" y="614">1</text>
    <text x="370" y="614">5</text>
    <text x="460" y="614">+Inf</text>
  </g>
  <text x="60" y="512" font-size="11" fill="#311b92">柱高是该 le 桶的累计值</text>

  <!-- Summary -->
  <rect x="620" y="380" width="540" height="250" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="640" y="412" font-size="15" font-weight="bold" fill="#7f3f00">Summary 摘要</text>
  <text x="640" y="438" font-size="11.5" fill="#7f3f00">分位在客户端算好；多实例求和无意义</text>
  <path d="M 680 510 L 740 494 L 800 516 L 860 500 L 920 520 L 980 504 L 1040 514 L 1100 496"
        fill="none" stroke="#e65100" stroke-width="2"/>
  <path d="M 680 542 L 740 532 L 800 548 L 860 536 L 920 550 L 980 538 L 1040 546 L 1100 534"
        fill="none" stroke="#bf360c" stroke-width="1.5"/>
  <path d="M 680 570 L 740 564 L 800 574 L 860 566 L 920 576 L 980 568 L 1040 574 L 1100 566"
        fill="none" stroke="#7f3f00" stroke-width="1.5"/>
  <g font-size="11" fill="#7f3f00" text-anchor="end">
    <text x="670" y="514">p99</text>
    <text x="670" y="546">p90</text>
    <text x="670" y="574">p50</text>
  </g>
  <text x="640" y="600" font-size="11" fill="#7f3f00">典型：rpc_duration_seconds{quantile="0.99"}</text>

  <!-- 结论块 -->
  <rect x="40" y="650" width="1120" height="62" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="676" font-size="13" font-weight="bold" fill="#bf360c">★ 选型不确定时优先 Histogram：它是唯一能跨实例合并后再算分位的类型</text>
  <text x="60" y="700" font-size="12.5" fill="#5d4037">Summary 的 0.99 加 0.99 还是 0.99，且无法回溯任意分位；平均值会掩盖长尾，SLO 场景看分位</text>

  <!-- 图例 -->
  <rect x="40" y="726" width="1120" height="34" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="736" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="92" y="747" font-size="12" fill="#37474f">Counter</text>
  <rect x="260" y="736" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="292" y="747" font-size="12" fill="#37474f">Gauge</text>
  <rect x="460" y="736" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="492" y="747" font-size="12" fill="#37474f">Histogram</text>
  <rect x="680" y="736" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="712" y="747" font-size="12" fill="#37474f">Summary</text>
</svg>
