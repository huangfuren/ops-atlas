<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>两阶段 relabel：改的是不同对象</title>
  <desc>抓取链上只有两个可改写环节：第 2 步 relabel_configs 在抓取前改目标，决定抓不抓、抓哪里；第 5 步 metric_relabel_configs 在入库前改样本，决定存不存。第 1 步服务发现产出含双下划线的内部标签，第 3 步 HTTP GET 与解析注入 job 和 instance。写入 TSDB 时所有双下划线开头的标签自动丢弃，要让元数据变正式标签只能在第 2 步显式 replace。编号与 111 §1.4 抓取六步一致，解析已并入第 3 步。来源为 009-监控 113 §3.6，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">两阶段 relabel：一个改目标，一个改样本</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 113 §3.6 · 111 §1.4 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#bf360c" text-anchor="end">琥珀＝可改写（仅 ② ⑤）</text>

  <!-- 阶段标签 -->
  <text x="205" y="112" font-size="11.5" font-weight="bold" fill="#0d47a1" text-anchor="middle">抓取前</text>
  <line x1="70" y1="120" x2="340" y2="120" stroke="#1565c0" stroke-width="2"/>
  <text x="475" y="112" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">抓取中</text>
  <line x1="340" y1="120" x2="610" y2="120" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="112" font-size="11.5" font-weight="bold" fill="#311b92" text-anchor="middle">入库前</text>
  <line x1="610" y1="120" x2="1130" y2="120" stroke="#5e35b1" stroke-width="2"/>

  <!-- ① 服务发现 -->
  <rect x="70" y="140" width="250" height="200" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="195" y="172" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">① 服务发现</text>
  <text x="90" y="204" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">__address__</text>
  <text x="90" y="228" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">__meta_*</text>
  <text x="196" y="228" font-size="11.5" fill="#0d2f5c">内部标签</text>
  <text x="90" y="256" font-size="11" fill="#0d2f5c">目标列表来自 static / file</text>
  <text x="90" y="278" font-size="11" fill="#0d2f5c">/ consul / k8s 服务发现</text>
  <text x="90" y="308" font-size="11" fill="#0d2f5c">此时标签全带双下划线</text>

  <!-- ② relabel_configs -->
  <rect x="340" y="140" width="250" height="200" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="465" y="172" font-size="14" font-weight="bold" fill="#7f3f00" text-anchor="middle">② relabel_configs ★</text>
  <text x="360" y="204" font-size="11.5" fill="#7f3f00">抓取前 · 改的是目标</text>
  <text x="360" y="228" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">keep / drop / replace</text>
  <text x="360" y="256" font-size="11" fill="#7f3f00">决定抓不抓、抓哪里</text>
  <text x="360" y="278" font-size="11" fill="#7f3f00">元数据转正式 label</text>
  <text x="360" y="308" font-size="11" fill="#7f3f00">只能在这一步改</text>

  <!-- ③ HTTP GET + 解析 -->
  <rect x="610" y="140" width="250" height="200" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="735" y="172" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">③ HTTP GET + 解析</text>
  <text x="630" y="204" font-size="11.5" fill="#123314">默认 /metrics，10s 超时</text>
  <text x="630" y="228" font-size="11.5" fill="#123314">注入 job、instance</text>
  <text x="630" y="256" font-size="11" fill="#123314">解析文本 / OpenMetrics</text>
  <text x="630" y="278" font-size="11" fill="#123314">__* 标签此时仍在</text>
  <text x="630" y="308" font-size="11" fill="#123314">只搬运，不改写</text>

  <!-- ⑤ metric_relabel -->
  <rect x="880" y="140" width="250" height="200" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="1005" y="172" font-size="14" font-weight="bold" fill="#7f3f00" text-anchor="middle">⑤ metric_relabel ★</text>
  <text x="900" y="204" font-size="11.5" fill="#7f3f00">入库前 · 改的是样本</text>
  <text x="900" y="228" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">drop</text>
  <text x="954" y="228" font-size="11.5" fill="#7f3f00">高基数指标</text>
  <text x="900" y="256" font-size="11" fill="#7f3f00">决定存不存、删哪列</text>
  <text x="900" y="278" font-size="11" fill="#7f3f00">降基数最后一道闸</text>
  <text x="900" y="308" font-size="11" fill="#7f3f00">要删样本只在这里</text>

  <line x1="322" y1="240" x2="336" y2="240" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="592" y1="240" x2="606" y2="240" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="862" y1="240" x2="876" y2="240" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结论块 -->
  <rect x="40" y="362" width="1120" height="96" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="392" font-size="14" font-weight="bold" fill="#bf360c">★ 写入 TSDB 时，所有以双下划线开头的标签自动丢弃，不会入库</text>
  <text x="60" y="418" font-size="12.5" fill="#5d4037">要让 __meta_* 变成正式 label，只能在 ② 里显式 replace 到不带双下划线的新名字</text>
  <text x="60" y="442" font-size="12.5" fill="#5d4037">编号与 111「抓取六步」一致：原第 ④ 步解析已并入 ③，所以从 ③ 直接跳到 ⑤</text>

  <!-- 图例 -->
  <rect x="40" y="478" width="1120" height="122" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="60" y="503" font-size="12" fill="#37474f">执行顺序：按数组顺序逐条执行，前一条输出是后一条输入——先 keep 再 replace 与反过来，命中的目标集不同</text>
  <text x="60" y="529" font-size="12" fill="#37474f">改目标用 relabel_configs，改样本用 metric_relabel_configs；两者作用对象不同，不能互换</text>
  <rect x="60" y="545" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="556" font-size="12" fill="#37474f">抓取前 · 目标阶段</text>
  <rect x="350" y="545" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="382" y="556" font-size="12" fill="#37474f">可改写环节 ★</text>
  <rect x="640" y="545" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="672" y="556" font-size="12" fill="#37474f">抓取中 · 请求阶段</text>
</svg>
