<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>一次抓取的六个步骤：抓取前、抓取中、入库</title>
  <desc>六个步骤分三段：抓取前是服务发现产出目标列表与 relabel_configs 改写目标，抓取中是 HTTP GET 与解析注入目标标签，入库是 metric_relabel_configs 改写样本与写 WAL 和 Head。仅第 2 步与第 5 步可改写数据，用琥珀色标出；第 2 步改的是哪个目标，第 5 步改的是哪些样本。来源为 009-监控 111 §1.4 与 113 §3.6，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="950" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">一次抓取发生了什么：六步、三段、两个可改写点</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 111 §1.4 · 113 §3.6 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#bf360c" text-anchor="end">琥珀＝可改写（仅 ② ⑤）</text>

  <!-- 抓取前 -->
  <rect x="40" y="110" width="1120" height="210" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="136" font-size="14" font-weight="bold" fill="#0d47a1">抓取前：决定抓谁、抓哪里</text>
  <rect x="60" y="156" width="530" height="138" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="188" font-size="15" font-weight="bold" fill="#0d2f5c">① 服务发现产出目标列表</text>
  <text x="80" y="218" font-size="11.5" fill="#0d2f5c">static / file / consul / k8s 等，每个目标是一组 label</text>
  <text x="80" y="246" font-size="11.5" fill="#0d2f5c">含 __address__ 与 __meta_* 内部标签</text>
  <text x="80" y="274" font-size="11" fill="#0d2f5c">出问题：目标根本不出现在 Status → Targets 里</text>
  <rect x="610" y="156" width="530" height="138" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="630" y="188" font-size="15" font-weight="bold" fill="#7f3f00">② relabel_configs 改写目标 ★</text>
  <text x="630" y="218" font-size="11.5" fill="#7f3f00">keep / drop 整个目标，或改写 __address__</text>
  <text x="630" y="246" font-size="11.5" fill="#7f3f00">此时改的是「目标」，还没发出请求</text>
  <text x="630" y="274" font-size="11" fill="#7f3f00">要让元数据变正式 label，只在这里 replace</text>
  <line x1="600" y1="262" x2="606" y2="262" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="600" y1="320" x2="600" y2="338" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 抓取中 -->
  <rect x="40" y="340" width="1120" height="210" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="366" font-size="14" font-weight="bold" fill="#1b5e20">抓取中：发请求、解析文本、注入标签</text>
  <rect x="60" y="386" width="530" height="138" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="418" font-size="15" font-weight="bold" fill="#123314">③ HTTP GET</text>
  <text x="80" y="448" font-size="11.5" fill="#123314">请求 scheme://__address__ 加 metrics_path</text>
  <text x="80" y="476" font-size="11.5" fill="#123314">默认超时 scrape_timeout = 10s</text>
  <text x="80" y="504" font-size="11" fill="#123314">出问题：目标在列表里但 up = 0，看 Error 字段</text>
  <rect x="610" y="386" width="530" height="138" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="418" font-size="15" font-weight="bold" fill="#123314">④ 解析并注入目标标签</text>
  <text x="630" y="448" font-size="11.5" fill="#123314">解析文本 / OpenMetrics 格式</text>
  <text x="630" y="476" font-size="11.5" fill="#123314">注入 job、instance，此时 __* 标签仍在</text>
  <text x="630" y="504" font-size="11" fill="#123314">这一步只搬运，不改写数据</text>
  <line x1="600" y1="492" x2="606" y2="492" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="600" y1="550" x2="600" y2="568" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 入库 -->
  <rect x="40" y="570" width="1120" height="210" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="596" font-size="14" font-weight="bold" fill="#311b92">入库：降基数最后一道闸，然后落盘</text>
  <rect x="60" y="616" width="530" height="138" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="80" y="648" font-size="15" font-weight="bold" fill="#7f3f00">⑤ metric_relabel_configs ★</text>
  <text x="80" y="678" font-size="11.5" fill="#7f3f00">入库前决定存不存、删哪个 label</text>
  <text x="80" y="706" font-size="11.5" fill="#7f3f00">此时改的是「样本」，是降基数的最后一道闸</text>
  <text x="80" y="734" font-size="11" fill="#7f3f00">丢弃高基数指标要放在这里，不是第 ② 步</text>
  <rect x="610" y="616" width="530" height="138" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="630" y="648" font-size="15" font-weight="bold" fill="#311b92">⑥ 写 WAL 与 Head</text>
  <text x="630" y="678" font-size="11.5" fill="#311b92">样本同时写预写日志与内存 head block</text>
  <text x="630" y="706" font-size="11.5" fill="#311b92">所有以 __ 开头的标签在入库时自动丢弃</text>
  <text x="630" y="734" font-size="11" fill="#311b92">同时记录 up、scrape_duration_seconds 等自监控</text>
  <line x1="600" y1="722" x2="606" y2="722" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结论块 -->
  <rect x="40" y="794" width="1120" height="66" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="820" font-size="13" font-weight="bold" fill="#bf360c">★ 六步里只有 ② 和 ⑤ 能改变数据：② 改「哪个目标」，⑤ 改「哪些样本」</text>
  <text x="60" y="844" font-size="12.5" fill="#5d4037">其余四步只负责搬运；排查时先按三段定位，再去对应步骤找配置（111 §1.4）</text>

  <!-- 图例 -->
  <rect x="40" y="872" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="888" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="899" font-size="12" fill="#37474f">抓取前 · 目标阶段</text>
  <rect x="300" y="888" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="332" y="899" font-size="12" fill="#37474f">抓取中 · 请求阶段</text>
  <rect x="540" y="888" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="572" y="899" font-size="12" fill="#37474f">入库 · 落盘阶段</text>
  <rect x="780" y="888" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="812" y="899" font-size="12" fill="#37474f">可改写步骤 ★</text>
</svg>
