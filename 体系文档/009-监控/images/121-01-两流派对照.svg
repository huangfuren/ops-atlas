<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Zabbix 与 Prometheus：采集模型与数据模型的分岔</title>
  <desc>左侧 Zabbix 是模板化监控平台，server 通过可选 proxy 或直连，用 agent2、SNMP、IPMI、JMX 多协议采集，数据模型是 item 取值到 trigger 求值。右侧 Prometheus 是标签化时序库，按服务发现目标主动拉取 /metrics，数据模型是指标名加 label 再由规则求值。两者采集方向与数据结构不同，但告警出口可以汇合，实际环境常并存。来源为 009-监控 121 与 120-Zabbix README，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">Zabbix 与 Prometheus：采集模型与数据模型的分岔</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 121 两流派选型全貌 · 120-Zabbix README · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">本质差异：谁发起采集 · 数据怎么表示</text>

  <!-- 左：Zabbix -->
  <rect x="40" y="110" width="540" height="290" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="140" font-size="15" font-weight="bold" fill="#1b5e20">Zabbix · 模板化平台 + 多协议采集</text>
  <rect x="60" y="158" width="230" height="76" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="175" y="186" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">Zabbix server</text>
  <text x="175" y="212" font-size="11" fill="#0d2f5c" text-anchor="middle">调度 · 求值 · 告警</text>
  <rect x="330" y="158" width="230" height="76" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="445" y="186" font-size="13" font-weight="bold" fill="#616161" text-anchor="middle">Zabbix proxy（可选）</text>
  <text x="445" y="212" font-size="11" fill="#616161" text-anchor="middle">跨网段 · 断网本地缓存</text>
  <line x1="292" y1="196" x2="326" y2="196" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="254" width="500" height="126" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="76" y="280" font-size="13" font-weight="bold" fill="#1b5e20">被监控端：四类协议</text>
  <text x="76" y="306" font-size="11.5" fill="#37474f">agent2 :10050　SNMP :161　IPMI　JMX → Java gateway :10052</text>
  <text x="76" y="332" font-size="11.5" fill="#37474f">被动＝server 连 agent 取数；主动＝agent 连 server 上报</text>
  <text x="76" y="358" font-size="11" fill="#616161">模板定义采什么，LLD 长出磁盘、网卡、接口</text>
  <line x1="445" y1="236" x2="445" y2="250" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右：Prometheus -->
  <rect x="620" y="110" width="540" height="290" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="640" y="140" font-size="15" font-weight="bold" fill="#1b5e20">Prometheus · 标签化时序库 + 拉取</text>
  <rect x="640" y="158" width="230" height="76" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="755" y="186" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">Prometheus</text>
  <text x="755" y="212" font-size="11" fill="#7f3f00" text-anchor="middle">scrape · TSDB · PromQL</text>
  <rect x="910" y="158" width="230" height="76" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1025" y="186" font-size="13" font-weight="bold" fill="#616161" text-anchor="middle">服务发现</text>
  <text x="1025" y="212" font-size="11" fill="#616161" text-anchor="middle">K8s / file_sd / Consul</text>
  <line x1="872" y1="196" x2="906" y2="196" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="254" width="500" height="126" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="656" y="280" font-size="13" font-weight="bold" fill="#bf360c">抓取目标：/metrics 端点</text>
  <text x="656" y="306" font-size="11.5" fill="#37474f">exporter · kubelet/cAdvisor · node-exporter · 应用埋点</text>
  <text x="656" y="332" font-size="11.5" fill="#37474f">以 pull 为主；短命任务用 pushgateway 兜底</text>
  <text x="656" y="358" font-size="11" fill="#616161">指标集合由 exporter 决定，服务发现决定抓谁</text>
  <line x1="755" y1="236" x2="755" y2="250" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 数据模型对照 -->
  <rect x="40" y="420" width="540" height="100" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="448" font-size="13" font-weight="bold" fill="#0d2f5c">一个监控项＝一个 key 加一个值</text>
  <text x="60" y="474" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">system.cpu.load[percpu,avg1] = 0.8</text>
  <text x="60" y="500" font-size="11" fill="#0d2f5c">维度靠 LLD 生成多个 item 表达</text>
  <rect x="620" y="420" width="540" height="100" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="640" y="448" font-size="13" font-weight="bold" fill="#7f3f00">一条样本＝指标名加一组 label 加时间戳</text>
  <text x="640" y="474" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">node_load1{instance="10.0.0.5:9100"} 0.8</text>
  <text x="640" y="500" font-size="11" fill="#7f3f00">维度靠 label 切分，查询靠 PromQL</text>

  <!-- 选型三问 -->
  <rect x="40" y="542" width="1120" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="572" font-size="14" font-weight="bold" fill="#bf360c">★ 选型三问</text>
  <text x="60" y="598" font-size="12.5" fill="#5d4037">① 目标以容器或 K8s 为主？是 → Prometheus　② 有 SNMP 设备、Windows、IPMI？有 → Zabbix 必上</text>
  <text x="60" y="622" font-size="12.5" fill="#5d4037">③ 团队更熟 SQL 还是 PromQL？这是日常排障成本问题，换工具不换人，学习曲线就是真成本</text>

  <!-- 共存结论 -->
  <rect x="40" y="650" width="1120" height="58" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="684" font-size="13" font-weight="bold" fill="#123314">共存是常态：容器层 Prometheus，网络与遗留系统 Zabbix，告警统一汇到值班平台，不强行二选一</text>

  <!-- 图例 -->
  <rect x="40" y="726" width="1120" height="64" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="744" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="755" font-size="12" fill="#37474f">Zabbix 侧</text>
  <rect x="280" y="744" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="755" font-size="12" fill="#37474f">Prometheus 侧</text>
  <rect x="540" y="744" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="572" y="755" font-size="12" fill="#37474f">告警汇合 / 共存</text>
  <text x="840" y="755" font-size="12" fill="#616161">灰色虚线框＝可选组件</text>
</svg>
