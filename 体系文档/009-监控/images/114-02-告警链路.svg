<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>告警链路：谁判断，谁发送</title>
  <desc>上半是 Prometheus 进程：规则求值后进入 pending，持续满足 for 之后变 firing，firing 才推送到 Alertmanager。下半是 Alertmanager 进程，内部依次完成去重、分组、抑制与静默、路由，最后投递到 webhook 或邮件接收端。去重压多副本重复推送，抑制压根因连带的噪声，两者不同层不能混用；分组逻辑不要写进规则。来源为 009-监控 114 §4.4，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">告警链路：谁判断，谁发送</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 114 §4.4 · 113 §3.11 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">一个进程判断，另一个进程投递</text>

  <!-- 上半：Prometheus -->
  <rect x="40" y="110" width="1120" height="180" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="138" font-size="14" font-weight="bold" fill="#1b5e20">Prometheus：只判断要不要发</text>
  <rect x="60" y="156" width="300" height="106" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="210" y="188" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">规则求值</text>
  <text x="210" y="216" font-size="11.5" fill="#0d2f5c" text-anchor="middle">每 evaluation_interval 跑一次</text>
  <text x="210" y="240" font-size="11" fill="#0d2f5c" text-anchor="middle">表达式为真即进入下一态</text>
  <rect x="410" y="156" width="300" height="106" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="560" y="188" font-size="15" font-weight="bold" fill="#5d4700" text-anchor="middle">pending</text>
  <text x="560" y="216" font-size="11.5" fill="#5d4700" text-anchor="middle">持续满足 for 条件</text>
  <text x="560" y="240" font-size="11" fill="#5d4700" text-anchor="middle">此时不发任何通知</text>
  <rect x="760" y="156" width="300" height="106" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="910" y="188" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">firing ★</text>
  <text x="910" y="216" font-size="11.5" fill="#7f3f00" text-anchor="middle">满足 for 后转 firing</text>
  <text x="910" y="240" font-size="11" fill="#7f3f00" text-anchor="middle">POST 给 Alertmanager</text>
  <line x1="362" y1="209" x2="406" y2="209" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="712" y1="209" x2="756" y2="209" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 跨进程 POST -->
  <path d="M 1060 262 L 1120 262 L 1120 300 L 100 300 L 100 334" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="600" y="294" font-size="11.5" fill="#7f3f00" text-anchor="middle">POST /api/v2/alerts · firing 之后才启动投递链路</text>

  <!-- 下半：Alertmanager -->
  <rect x="40" y="336" width="1120" height="200" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="364" font-size="14" font-weight="bold" fill="#311b92">Alertmanager：决定发给谁、发几次</text>
  <rect x="60" y="382" width="240" height="126" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="180" y="414" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">去重</text>
  <text x="180" y="442" font-size="11.5" fill="#311b92" text-anchor="middle">多副本只留一份</text>
  <text x="180" y="470" font-size="11" fill="#311b92" text-anchor="middle">压重复推送</text>
  <text x="180" y="494" font-size="11" fill="#311b92" text-anchor="middle">不同层，别混用</text>
  <rect x="330" y="382" width="240" height="126" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="450" y="414" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">分组</text>
  <text x="450" y="442" font-size="11.5" fill="#311b92" text-anchor="middle">同组并成一条</text>
  <text x="450" y="470" font-size="11" fill="#311b92" text-anchor="middle">group_wait 凑组</text>
  <text x="450" y="494" font-size="11" fill="#311b92" text-anchor="middle">不要写进规则</text>
  <rect x="600" y="382" width="240" height="126" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="720" y="414" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">抑制 / 静默</text>
  <text x="720" y="442" font-size="11.5" fill="#311b92" text-anchor="middle">压掉连带告警</text>
  <text x="720" y="470" font-size="11" fill="#311b92" text-anchor="middle">根因响了静音噪声</text>
  <text x="720" y="494" font-size="11" fill="#311b92" text-anchor="middle">按 label 匹配</text>
  <rect x="870" y="382" width="240" height="126" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="990" y="414" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">路由</text>
  <text x="990" y="442" font-size="11.5" fill="#311b92" text-anchor="middle">按 label 匹配接收端</text>
  <text x="990" y="470" font-size="11" fill="#311b92" text-anchor="middle">决定发给谁</text>
  <text x="990" y="494" font-size="11" fill="#311b92" text-anchor="middle">决定发几次</text>
  <line x1="302" y1="445" x2="326" y2="445" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="445" x2="596" y2="445" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="842" y1="445" x2="866" y2="445" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 接收端 -->
  <rect x="40" y="556" width="1120" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="584" font-size="14" font-weight="bold" fill="#123314">接收端：webhook / 邮件 / 值班平台</text>
  <text x="60" y="610" font-size="11.5" fill="#123314">告警到达：最快 for + group_wait，最坏再多一个 interval 的抖动（详见 113 时间轴图）</text>
  <line x1="990" y1="508" x2="990" y2="552" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 结论块 -->
  <rect x="40" y="644" width="1120" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="674" font-size="14" font-weight="bold" fill="#bf360c">★ 职责边界：Prometheus 只判断是否触发，Alertmanager 负责发不发、发给谁、发几次</text>
  <text x="60" y="700" font-size="12.5" fill="#5d4037">去重压的是同一告警被多副本各推一遍，抑制压的是根因响了连带项一起静音——两者不同层</text>

  <!-- 图例 -->
  <rect x="40" y="732" width="1120" height="58" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="750" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="761" font-size="12" fill="#37474f">规则判断</text>
  <rect x="280" y="750" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="312" y="761" font-size="12" fill="#37474f">pending</text>
  <rect x="460" y="750" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="492" y="761" font-size="12" fill="#37474f">firing ★</text>
  <rect x="640" y="750" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="672" y="761" font-size="12" fill="#37474f">AM 内部四步</text>
  <rect x="880" y="750" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="912" y="761" font-size="12" fill="#37474f">接收端</text>
</svg>
