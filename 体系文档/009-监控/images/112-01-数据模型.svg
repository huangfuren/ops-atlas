<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>数据模型：一个指标切出三条独立时间线</title>
  <desc>同一个指标名 http_requests_total 下，label 组合不同就构成不同时间线。图中三条 series 共享指标名，但 code 与 instance 的取值不同，彼此独立互不覆盖；每个圆点是一个 (timestamp, value) 样本。查询时 label 就是筛选维度，{code="500"} 只命中第二条，sum by (code) 会把第一、三条合并。来源为 009-监控 112 §2.1，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="730" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">一个指标，三条时间线：label 组合决定身份</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 112 §2.1 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">颜色不同＝各自独立，互不覆盖</text>

  <!-- 指标名 -->
  <rect x="40" y="110" width="1120" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="142" font-size="15" font-weight="bold" fill="#bf360c">http_requests_total</text>
  <text x="60" y="166" font-size="11.5" fill="#5d4037">指标名回答「量的是什么」——三条 series 共享同一个名字，只靠 label 区分身份</text>

  <!-- series 1 -->
  <rect x="40" y="204" width="1120" height="92" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="236" font-size="15" font-weight="bold" fill="#123314">series 1 · code 200 / instance .1</text>
  <text x="60" y="262" font-size="11.5" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">code="200", instance="10.0.0.1:8080"</text>
  <text x="60" y="284" font-size="11" fill="#123314">圆点＝样本 (timestamp, value)，沿时间轴向右排列</text>
  <line x1="760" y1="250" x2="1130" y2="250" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="790" cy="250" r="4" fill="#2e7d32"/>
  <circle cx="890" cy="250" r="4" fill="#2e7d32"/>
  <circle cx="990" cy="250" r="4" fill="#2e7d32"/>
  <circle cx="1090" cy="250" r="4" fill="#2e7d32"/>
  <text x="1130" y="238" font-size="11" fill="#123314" text-anchor="end">时间向右</text>

  <!-- series 2 -->
  <rect x="40" y="308" width="1120" height="92" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="60" y="340" font-size="15" font-weight="bold" fill="#7f3f00">series 2 · code 500 / instance .1</text>
  <text x="60" y="366" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">code="500", instance="10.0.0.1:8080"</text>
  <text x="60" y="388" font-size="11" fill="#7f3f00">只改 code 的取值，就是一根全新的时间线</text>
  <line x1="760" y1="354" x2="1130" y2="354" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="790" cy="354" r="4" fill="#e65100"/>
  <circle cx="890" cy="354" r="4" fill="#e65100"/>
  <circle cx="990" cy="354" r="4" fill="#e65100"/>
  <circle cx="1090" cy="354" r="4" fill="#e65100"/>
  <text x="1130" y="342" font-size="11" fill="#7f3f00" text-anchor="end">筛选维度</text>

  <!-- series 3 -->
  <rect x="40" y="412" width="1120" height="92" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="60" y="444" font-size="15" font-weight="bold" fill="#311b92">series 3 · code 200 / instance .2</text>
  <text x="60" y="470" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">code="200", instance="10.0.0.2:8080"</text>
  <text x="60" y="492" font-size="11" fill="#311b92">只改 instance 的取值，同样是一根独立时间线</text>
  <line x1="760" y1="458" x2="1130" y2="458" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="790" cy="458" r="4" fill="#5e35b1"/>
  <circle cx="890" cy="458" r="4" fill="#5e35b1"/>
  <circle cx="990" cy="458" r="4" fill="#5e35b1"/>
  <circle cx="1090" cy="458" r="4" fill="#5e35b1"/>
  <text x="1130" y="446" font-size="11" fill="#311b92" text-anchor="end">组合唯一</text>

  <!-- 结论块 -->
  <rect x="40" y="526" width="1120" height="92" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="556" font-size="14" font-weight="bold" fill="#bf360c">★ 基数数的是 series，不是指标名</text>
  <text x="60" y="582" font-size="12.5" fill="#5d4037">10 台机器 × 5 个方法 × 6 个状态码 ＝ 300 条时间线，指标名始终只有一个</text>
  <text x="60" y="604" font-size="12.5" fill="#5d4037">label 组合完全相同会互相覆盖，表现为数据莫名少一半——relabel 改写时要避免</text>

  <!-- 图例 -->
  <rect x="40" y="638" width="1120" height="72" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="654" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="92" y="665" font-size="12" fill="#37474f">series 1</text>
  <rect x="280" y="654" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="665" font-size="12" fill="#37474f">series 2</text>
  <rect x="500" y="654" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="532" y="665" font-size="12" fill="#37474f">series 3</text>
  <text x="720" y="665" font-size="12" fill="#37474f">查询：{code="500"} 只命中 series 2</text>
  <text x="720" y="691" font-size="12" fill="#37474f">sum by (code) 把 series 1 与 3 合并</text>
</svg>
