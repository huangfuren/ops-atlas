<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Zabbix 6.0 组件与数据流：谁连谁、走哪个端口</title>
  <desc>被监控端四类接入：agent2 走 10050，SNMP 设备走 161，IPMI 带外，JMX 经 Java gateway 10052。数据汇聚到 server 的 10051：被动模式是 server 连 agent，主动模式是 agent 连 server。跨网段或大规模时中间加 proxy，断网可本地缓存。server 读写 MySQL 3306，前端 nginx/PHP 8080 只读写数据库、不参与采集。来源为 009-监控 122 §2 与 125，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">Zabbix 6.0 组件与数据流：谁连谁、走哪个端口</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 122 §2 · 125 分布式 Proxy · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">前端只是数据库的另一个客户端</text>

  <!-- 左：被监控端 -->
  <rect x="40" y="110" width="300" height="300" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="140" font-size="15" font-weight="bold" fill="#1b5e20">被监控端</text>
  <rect x="60" y="156" width="260" height="66" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="182" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">agent2 · 10050</text>
  <text x="190" y="206" font-size="11" fill="#0d2f5c" text-anchor="middle">Linux / Windows 主机</text>
  <rect x="60" y="238" width="260" height="66" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="190" y="264" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">SNMP · 161</text>
  <text x="190" y="288" font-size="11" fill="#37474f" text-anchor="middle">交换机 / 防火墙 / UPS</text>
  <rect x="60" y="320" width="260" height="66" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="190" y="346" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">IPMI / JMX</text>
  <text x="190" y="370" font-size="11" fill="#37474f" text-anchor="middle">带外硬件 / Java → 10052</text>

  <!-- 中：proxy -->
  <rect x="380" y="280" width="240" height="100" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="310" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">Zabbix proxy（可选）</text>
  <text x="500" y="336" font-size="11" fill="#311b92" text-anchor="middle">跨网段 · 大规模 · 断网缓存</text>
  <text x="500" y="360" font-size="11" fill="#311b92" text-anchor="middle">server 与 agent 之间</text>

  <!-- 右：服务端 -->
  <rect x="660" y="110" width="500" height="300" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="680" y="140" font-size="15" font-weight="bold" fill="#1b5e20">服务端</text>
  <rect x="680" y="156" width="220" height="90" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="790" y="184" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">server · 10051</text>
  <text x="790" y="208" font-size="11" fill="#7f3f00" text-anchor="middle">调度 / 求值 / 告警</text>
  <text x="790" y="230" font-size="11" fill="#7f3f00" text-anchor="middle">配置缓存</text>
  <rect x="920" y="156" width="220" height="90" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1030" y="184" font-size="13" font-weight="bold" fill="#311b92" text-anchor="middle">MySQL · 3306</text>
  <text x="1030" y="208" font-size="11" fill="#311b92" text-anchor="middle">配置 / 历史 / 趋势</text>
  <text x="1030" y="230" font-size="11" fill="#311b92" text-anchor="middle">事件</text>
  <line x1="902" y1="200" x2="916" y2="200" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680" y="270" width="220" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="790" y="298" font-size="12.5" font-weight="bold" fill="#263238" text-anchor="middle">nginx / PHP · 8080</text>
  <text x="790" y="324" font-size="11" fill="#37474f" text-anchor="middle">前端，不参与采集</text>
  <rect x="920" y="270" width="220" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1030" y="298" font-size="12.5" font-weight="bold" fill="#263238" text-anchor="middle">浏览器</text>
  <text x="1030" y="324" font-size="11" fill="#37474f" text-anchor="middle">运维人员</text>
  <line x1="916" y1="310" x2="904" y2="310" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 主链路：主动上报与被动取数 -->
  <line x1="302" y1="182" x2="676" y2="182" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="490" y="174" font-size="11.5" fill="#0d47a1" text-anchor="middle">主动检查：agent → server:10051（出站可达即可）</text>
  <line x1="676" y1="250" x2="302" y2="250" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="490" y="268" font-size="11.5" fill="#bf360c" text-anchor="middle">被动检查：server → agent:10050（每台放行端口）</text>
  <line x1="302" y1="330" x2="376" y2="330" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="622" y1="330" x2="676" y2="330" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 主被动对照 -->
  <rect x="40" y="434" width="540" height="112" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="462" font-size="13" font-weight="bold" fill="#7f3f00">被动检查：server → agent:10050</text>
  <text x="60" y="488" font-size="11.5" fill="#7f3f00">每台被监控机要放行 10050，适合同网段、主机少</text>
  <text x="60" y="514" font-size="11.5" fill="#7f3f00">排障：</text>
  <text x="118" y="514" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">zabbix_get -s &lt;ip&gt; -k agent.ping</text>
  <rect x="620" y="434" width="540" height="112" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="640" y="462" font-size="13" font-weight="bold" fill="#123314">主动检查：agent → server:10051</text>
  <text x="640" y="488" font-size="11.5" fill="#123314">只需出站可达，适合跨网段、NAT 后、主机多</text>
  <text x="640" y="514" font-size="11.5" fill="#123314">硬条件：Hostname 与前端主机名逐字符一致</text>

  <!-- 端口速查 -->
  <rect x="40" y="566" width="1120" height="76" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="594" font-size="13" font-weight="bold" fill="#263238">端口速查</text>
  <text x="60" y="620" font-size="12" fill="#37474f">10051 server/proxy · 10050 agent · 10052 Java gateway · 8080/80/443 前端 · 3306 数据库 · 162/udp SNMP trap</text>

  <!-- 结论块 -->
  <rect x="40" y="664" width="1120" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="694" font-size="14" font-weight="bold" fill="#bf360c">★ 只开必要方向：被动要 server 能连 agent，主动要 agent 能连 server，两者防火墙规则相反</text>
  <text x="60" y="720" font-size="12.5" fill="#5d4037">部署顺序：chrony → 数据库 → server → 前端（含时区与 SELinux）→ agent2 → 纳管，每步都有验证命令</text>

  <!-- 图例 -->
  <rect x="40" y="756" width="1120" height="54" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="772" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="783" font-size="12" fill="#37474f">被监控端</text>
  <rect x="280" y="772" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="783" font-size="12" fill="#37474f">核心 server / 被动</text>
  <rect x="540" y="772" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="572" y="783" font-size="12" fill="#37474f">proxy / 数据库</text>
  <rect x="800" y="772" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="832" y="783" font-size="12" fill="#37474f">主动检查</text>
</svg>
