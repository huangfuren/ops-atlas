<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>LLD：从一条发现规则到成百个监控项</title>
  <desc>低级发现链路：发现规则执行 key 返回 JSON 实体数组，过滤器决定哪些实体要，监控项、触发器、图形三种原型决定每个实体生成什么，最后每个实体生成一组监控项与触发器。过滤器决定要不要生成，覆盖决定生成后怎么改，覆盖按顺序匹配首条命中即停。高频坑是无过滤生成大量无用监控项、覆盖顺序反了、用 ifIndex 命名。来源为 009-监控 123 §2.2 与 §2.3，截止 2026-11-26。</desc>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">LLD：从一条发现规则到成百个监控项</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：009-监控 123 §2.2 / §2.3 · 120-Zabbix README · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">实体变化时不用人工补监控项</text>

  <!-- 四段流程 -->
  <rect x="40" y="110" width="250" height="180" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="165" y="142" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">① 发现规则</text>
  <text x="60" y="172" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">vfs.fs.discovery</text>
  <text x="60" y="198" font-size="11" fill="#0d2f5c">前端 Test 可直接执行</text>
  <text x="60" y="222" font-size="11" fill="#0d2f5c">只找实体，不取业务数据</text>
  <text x="60" y="246" font-size="11" fill="#0d2f5c">本机验证：agent2 -t key</text>
  <text x="60" y="274" font-size="11" fill="#0d2f5c">先看原始 JSON 再配过滤</text>

  <rect x="330" y="110" width="250" height="180" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="455" y="142" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">② 实体列表 JSON</text>
  <text x="350" y="172" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">[{"{#FSNAME}":"/"},</text>
  <text x="350" y="196" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace"> {"{#FSNAME}":"/var"}]</text>
  <text x="350" y="224" font-size="11" fill="#37474f">宏名由发现规则定义</text>
  <text x="350" y="248" font-size="11" fill="#37474f">原型里用同名宏占位</text>
  <text x="350" y="274" font-size="11" fill="#616161">实体即挂载点、接口这类对象</text>

  <rect x="620" y="110" width="250" height="180" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="745" y="142" font-size="14" font-weight="bold" fill="#5d4700" text-anchor="middle">③ 过滤器</text>
  <text x="640" y="172" font-size="11.5" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">{#FSNAME} not matches</text>
  <text x="640" y="196" font-size="11.5" fill="#5d4700" font-family="ui-monospace,Menlo,Consolas,monospace">@File systems for discovery</text>
  <text x="640" y="224" font-size="11" fill="#5d4700">决定要不要生成</text>
  <text x="640" y="248" font-size="11" fill="#5d4700">不加会把临时挂载也生成</text>
  <text x="640" y="274" font-size="11" fill="#5d4700">容器宿主机尤其要过滤</text>

  <rect x="910" y="110" width="250" height="180" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="1035" y="142" font-size="14" font-weight="bold" fill="#7f3f00" text-anchor="middle">④ 三种原型 ★</text>
  <text x="930" y="172" font-size="11.5" fill="#7f3f00">监控项原型 → 取值</text>
  <text x="930" y="196" font-size="11.5" fill="#7f3f00">触发器原型 → 阈值判定</text>
  <text x="930" y="220" font-size="11.5" fill="#7f3f00">图形原型 → 自动出图</text>
  <text x="930" y="248" font-size="11" fill="#7f3f00">key 里的实体宏在生成时替换</text>
  <text x="930" y="274" font-size="11" fill="#7f3f00">一处定义，多实体复用</text>

  <line x1="292" y1="200" x2="326" y2="200" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="582" y1="200" x2="616" y2="200" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="872" y1="200" x2="906" y2="200" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 生成结果 -->
  <rect x="40" y="312" width="1120" height="180" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="340" font-size="13" font-weight="bold" fill="#1b5e20">生成结果：一个实体 → 一组监控项、触发器与图形</text>
  <rect x="60" y="356" width="530" height="116" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="80" y="384" font-size="13" font-weight="bold" fill="#123314">实体：/（根分区）</text>
  <text x="80" y="412" font-size="11.5" fill="#123314">item　vfs.fs.size[/,pfree]</text>
  <text x="80" y="438" font-size="11.5" fill="#123314">trigger　剩余空间低于 {$LOW_SPACE_LIMIT}</text>
  <text x="80" y="462" font-size="11" fill="#123314">graph　自动生成使用率曲线</text>
  <rect x="610" y="356" width="530" height="116" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="384" font-size="13" font-weight="bold" fill="#123314">实体：/var（独立分区）</text>
  <text x="630" y="412" font-size="11.5" fill="#123314">item　vfs.fs.size[/var,pfree]</text>
  <text x="630" y="438" font-size="11.5" fill="#123314">trigger　剩余空间低于 {$LOW_SPACE_LIMIT}</text>
  <text x="630" y="462" font-size="11" fill="#123314">graph　自动生成使用率曲线</text>

  <!-- 过滤器 vs 覆盖 -->
  <rect x="40" y="514" width="1120" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="60" y="542" font-size="13" font-weight="bold" fill="#5d4700">过滤器 vs 覆盖：一个决定要不要，一个决定生成后怎么改</text>
  <text x="60" y="570" font-size="12" fill="#5d4700">覆盖按顺序匹配，首条命中即停——禁用与特例规则要放最前面，否则永远轮不到它</text>

  <!-- 高频坑 -->
  <rect x="40" y="606" width="1120" height="78" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="634" font-size="13" font-weight="bold" fill="#7f0000">三个高频坑</text>
  <text x="60" y="660" font-size="12" fill="#7f0000">① 无过滤 → 生成上百个 overlay/tmpfs 监控项　② 覆盖顺序反了 → 特例不生效　③ 用 ifIndex 命名 → 重启后图张冠李戴</text>
  <text x="60" y="680" font-size="12" fill="#7f0000">正确做法：先 Test 看原始 JSON → 加过滤器 → 用 ifDescr 命名 → 最后才开规则</text>

  <!-- 结论块 -->
  <rect x="40" y="704" width="1120" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="740" font-size="13" font-weight="bold" fill="#bf360c">★ 验证闭环：发现规则最近执行时间 → 监控项列表出现实体名 → Latest data 有值，三步缺一都是 LLD 没走完</text>

  <!-- 图例 -->
  <rect x="40" y="778" width="1120" height="42" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="790" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="801" font-size="12" fill="#37474f">发现规则</text>
  <rect x="260" y="790" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="292" y="801" font-size="12" fill="#37474f">过滤器</text>
  <rect x="460" y="790" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="492" y="801" font-size="12" fill="#37474f">原型 ★</text>
  <rect x="660" y="790" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="692" y="801" font-size="12" fill="#37474f">生成实体</text>
  <rect x="880" y="790" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="912" y="801" font-size="12" fill="#37474f">高频坑</text>
</svg>
