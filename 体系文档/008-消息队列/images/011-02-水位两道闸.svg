<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>水位两道闸：阻塞生产者是流控，不是丢消息</title>
  <desc>生产者发布消息进入 RabbitMQ，消息堆积在队列消耗内存与磁盘。两道自保闸：内存水位约为物理内存的一定比例（按版本查证），磁盘空闲低于限制（默认 50MB），任一触发都会阻塞生产者连接。阻塞是流控不是故障，消费者不受影响。正确处置是先归因堆积、再扩消费，水位会自动回落；只调高水位等于把报警器调哑，根因仍在消费能力（011 §1.5）。alarm 状态与队列深度应进监控（011 §1.7）。</desc>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">水位两道闸：阻塞生产者是流控，不是丢消息</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：008-消息队列 011 §1.5 内存与磁盘水位 · 011 §1.7 集群与监控 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">消费不受影响</text>

  <!-- 生产者 -->
  <rect x="40" y="164" width="220" height="96" rx="48" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="150" y="202" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">生产者</text>
  <text x="150" y="230" font-size="11.5" fill="#0d2f5c" text-anchor="middle">publish 消息</text>
  <text x="150" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">连接可被 blocking</text>
  <line x1="264" y1="212" x2="330" y2="212" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="297" y="202" font-size="11" fill="#616161" text-anchor="middle">publish</text>

  <!-- broker -->
  <rect x="334" y="130" width="400" height="164" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="534" y="166" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">RabbitMQ broker</text>
  <text x="534" y="196" font-size="11.5" fill="#123314" text-anchor="middle">队列积压 · 消息索引</text>
  <text x="534" y="220" font-size="11.5" fill="#123314" text-anchor="middle">内存占用升 · 磁盘写入升</text>
  <text x="534" y="256" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">消费跟不上 → 资源持续涨</text>
  <text x="534" y="280" font-size="11" fill="#123314" text-anchor="middle">两道闸检测到超限就掐生产端</text>

  <!-- 两道闸 -->
  <line x1="738" y1="180" x2="800" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="738" y1="244" x2="800" y2="244" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="804" y="148" width="356" height="64" rx="8" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="982" y="174" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">闸① 内存水位 ★</text>
  <text x="982" y="198" font-size="11.5" fill="#7f3f00" text-anchor="middle">约 0.6 × 物理内存（按版本查证）</text>

  <rect x="804" y="224" width="356" height="64" rx="8" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="982" y="250" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">闸② 磁盘空闲 ★</text>
  <text x="982" y="274" font-size="11.5" fill="#7f3f00" text-anchor="middle">低于 limit（默认 50MB）</text>

  <!-- 任一超限 → 阻塞 -->
  <line x1="534" y1="298" x2="534" y2="338" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="548" y="326" font-size="11.5" fill="#7f0000">任一超限</text>

  <rect x="334" y="342" width="400" height="76" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="534" y="372" font-size="15" font-weight="bold" fill="#7f0000" text-anchor="middle">阻塞生产者（连接 blocking）</text>
  <text x="534" y="400" font-size="11.5" fill="#7f0000" text-anchor="middle">流控而非故障 —— 消费者不受影响</text>

  <!-- 正确处置 -->
  <rect x="804" y="324" width="356" height="112" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="982" y="352" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">正确处置三步</text>
  <text x="982" y="380" font-size="11.5" fill="#123314" text-anchor="middle">① 归因堆积（013 §3.3）</text>
  <text x="982" y="404" font-size="11.5" fill="#123314" text-anchor="middle">② 扩消费 → 水位自动回落</text>
  <text x="982" y="428" font-size="11.5" fill="#123314" text-anchor="middle">③ 必要时才评估水位参数</text>

  <!-- 反模式 -->
  <rect x="40" y="446" width="1120" height="56" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="472" font-size="13" font-weight="bold" fill="#bf360c">只调高水位不清堆积 ＝ 把报警器调哑：alarm 解除后自动恢复，但根因仍在消费能力（011 §1.5）</text>
  <text x="60" y="492" font-size="11.5" fill="#5d4037">阻塞不是丢消息：消息还在队列里，先查为什么消费不掉，而不是先动闸值</text>

  <!-- 结论块 -->
  <rect x="40" y="518" width="1120" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="548" font-size="15" font-weight="bold" fill="#bf360c">★ 两道闸是自我保护，不是故障告警——处置顺序永远是「归因 → 扩消费 → 调参」</text>
  <text x="60" y="574" font-size="12.5" fill="#5d4037">· 指标接入：内存 / 磁盘 / connection blocking / 队列深度经 Prometheus 插件暴露，alarm 状态进监控（011 §1.7）</text>

  <!-- 图例 -->
  <rect x="40" y="610" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="626" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="637" font-size="12" fill="#37474f">生产者</text>
  <rect x="250" y="626" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="282" y="637" font-size="12" fill="#37474f">broker / 正确处置</text>
  <rect x="500" y="626" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="532" y="637" font-size="12" fill="#37474f">两道闸 ★</text>
  <rect x="700" y="626" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="732" y="637" font-size="12" fill="#37474f">阻塞生产者</text>
  <text x="960" y="637" font-size="12" fill="#7f0000">红箭头＝触发流控</text>
</svg>
