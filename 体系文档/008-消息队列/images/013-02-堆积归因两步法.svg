<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 882" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>堆积归因两步法：不归因的扩容是浪费</title>
  <desc>堆积第一步看消费速率是否归零或趋零：归零是假活，消费者进程在但被下游阻塞，修下游即恢复。第二步比较生产与消费速率曲线：生产跳升是突增，治上游并评估下游容量；消费长期低于生产是能力问题，按手段阶梯处理：修阻塞、提效率、扩消费者、扩分区有顺序代价、降级需业务签字。毒丸消息进死信（013 §3.6）。扩容同时评估下游承受力，把 MQ 的压力转给数据库只是换爆炸地点。</desc>

  <rect x="0" y="0" width="1200" height="882" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">堆积归因两步法：不归因的扩容是浪费</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：008-消息队列 013 §3.3 成因分类 · §3.4 手段清单 · §3.5 顺序 · §3.6 死信 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">毒丸另走死信</text>

  <!-- 起点 -->
  <rect x="40" y="108" width="1120" height="62" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="600" y="136" font-size="15" font-weight="bold" fill="#7f0000" text-anchor="middle">症状：lag / 队列深度持续涨（堆积）</text>
  <text x="600" y="158" font-size="11.5" fill="#7f0000" text-anchor="middle">先归因，再动手——不归因的扩容大多是浪费</text>

  <line x1="600" y1="174" x2="600" y2="204" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第一步 -->
  <rect x="40" y="208" width="1120" height="62" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="600" y="236" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">第一步：消费速率是否归零 / 趋零？</text>
  <text x="600" y="258" font-size="11.5" fill="#0d2f5c" text-anchor="middle">看消费速率曲线，不是看 lag 数字本身</text>

  <!-- 假活分支 -->
  <line x1="340" y1="274" x2="260" y2="306" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="248" y="292" font-size="12" font-weight="bold" fill="#7f0000" text-anchor="end">是 → 假活</text>
  <rect x="40" y="310" width="540" height="106" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="338" font-size="13" font-weight="bold" fill="#123314">假活：消费者进程在，但被下游阻塞</text>
  <text x="60" y="366" font-size="11.5" fill="#123314">数据库慢 / 外部 API 挂 / 锁等待 → 消费速率趋零</text>
  <text x="60" y="392" font-size="12.5" font-weight="bold" fill="#123314">动作：修下游即恢复，加消费者无效</text>

  <!-- 否 分支 -->
  <line x1="760" y1="274" x2="840" y2="306" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="852" y="292" font-size="12" font-weight="bold" fill="#616161" text-anchor="start">否 → 第二步</text>
  <rect x="620" y="310" width="540" height="106" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="640" y="338" font-size="13" font-weight="bold" fill="#37474f">消费速率正常，但追不上生产</text>
  <text x="640" y="366" font-size="11.5" fill="#37474f">进入第二步：比较生产与消费两条速率曲线的形态</text>
  <text x="640" y="392" font-size="11.5" fill="#616161">曲线形态决定是治上游还是扩消费能力</text>

  <line x1="600" y1="418" x2="600" y2="452" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第二步 -->
  <rect x="40" y="456" width="1120" height="62" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="600" y="484" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">第二步：生产速率 vs 消费速率对比</text>
  <text x="600" y="506" font-size="11.5" fill="#0d2f5c" text-anchor="middle">两条曲线放一起看，是跳升还是长期低于</text>

  <!-- 突增 / 能力两分支 -->
  <rect x="40" y="534" width="540" height="112" rx="8" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="562" font-size="13" font-weight="bold" fill="#7f3f00">生产速率跳升 ＝ 突增</text>
  <text x="60" y="590" font-size="11.5" fill="#7f3f00">来源：大促 / 上游重试风暴 / 新业务上线</text>
  <text x="60" y="616" font-size="12.5" font-weight="bold" fill="#7f3f00">动作：治上游（限流、修重试）+ 评估下游容量</text>
  <text x="60" y="638" font-size="11.5" fill="#7f3f00">扩容只是兜底，不治根因</text>

  <rect x="620" y="534" width="540" height="112" rx="8" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="640" y="562" font-size="13" font-weight="bold" fill="#7f3f00">消费长期低于生产 ＝ 能力问题</text>
  <text x="640" y="590" font-size="11.5" fill="#7f3f00">手段阶梯（按代价从小到大）：</text>
  <text x="640" y="616" font-size="12.5" font-weight="bold" fill="#7f3f00">修阻塞 → 提效率 → 扩消费者 → 扩分区 → 降级</text>
  <text x="640" y="638" font-size="11.5" fill="#7f3f00">扩分区破坏 key 顺序（013 §3.5），降级需业务签字</text>

  <!-- 阶梯细节 -->
  <rect x="40" y="662" width="1120" height="62" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="60" y="688" font-size="12.5" font-weight="bold" fill="#37474f">阶梯细节：RabbitMQ 扩消费者直接生效；Kafka 受分区数上限约束（6 分区最多 6 并发）</text>
  <text x="60" y="710" font-size="11.5" fill="#616161">扩容同时评估下游（数据库 / 接口）承受力——把 MQ 的压力转给数据库只是换爆炸地点</text>

  <!-- 结论块 -->
  <rect x="40" y="740" width="1120" height="66" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="768" font-size="15" font-weight="bold" fill="#bf360c">★ 毒丸消息卡住消费不是能力问题：N 次失败进死信队列，扩一百个消费者也没用（013 §3.6）</text>
  <text x="60" y="792" font-size="12" fill="#5d4037">· 两步法的价值：先归因再动手——突增修上游比扩容便宜，假活修下游比加人有效</text>

  <!-- 图例 -->
  <rect x="40" y="820" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="836" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="92" y="847" font-size="12" fill="#37474f">症状 / 假活</text>
  <rect x="250" y="836" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="282" y="847" font-size="12" fill="#37474f">归因步骤</text>
  <rect x="450" y="836" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="482" y="847" font-size="12" fill="#37474f">假活结论</text>
  <rect x="650" y="836" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="682" y="847" font-size="12" fill="#37474f">两类分支</text>
  <text x="920" y="847" font-size="12" fill="#7f0000">先归因，再动手</text>
</svg>
