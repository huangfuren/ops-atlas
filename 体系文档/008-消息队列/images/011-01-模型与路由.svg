<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>RabbitMQ 模型：exchange 只管路由，queue 才排队，vhost 才是隔离边界</title>
  <desc>生产者把消息发到交换器，exchange 按 direct 精确、fanout 广播、topic 模式三种规则路由进队列。没有匹配绑定的消息默认被静默丢弃，重要业务要配 alternate 兜底并监控 unroutable 指标。队列持久化与仲裁队列保证存储可靠，消费者带 prefetch 与 ack。全部资源以 vhost 为隔离边界，按环境或业务划分，不全站共用一个斜杠。路由配置是元数据变更，改 binding 前要确认存量消息去向（011 §1.2）；消息没进队列查路由，进了队列不消费查消费者（013 §3.3）。</desc>

  <rect x="0" y="0" width="1200" height="730" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">RabbitMQ 模型：exchange 只管路由，queue 才排队</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：008-消息队列 011 §1.1 / §1.2 / §1.3 / §1.8 · 013 §3.3 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">unroutable 默认静默丢弃</text>

  <!-- vhost 边界 -->
  <rect x="300" y="100" width="860" height="368" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="324" y="128" font-size="13" font-weight="bold" fill="#616161">vhost：权限 + 资源的隔离边界（按环境 / 业务划分，不全站共用 /）</text>

  <!-- 生产者 -->
  <rect x="40" y="238" width="210" height="92" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="145" y="274" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">生产者</text>
  <text x="145" y="302" font-size="11.5" fill="#0d2f5c" text-anchor="middle">publish 到 exchange</text>
  <text x="145" y="320" font-size="11" fill="#0d2f5c" text-anchor="middle">带 routing key</text>
  <line x1="254" y1="284" x2="324" y2="284" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="289" y="274" font-size="11" fill="#616161" text-anchor="middle">publish</text>

  <!-- exchange -->
  <rect x="328" y="218" width="270" height="132" rx="8" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="463" y="252" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">exchange 交换器 ★</text>
  <text x="463" y="282" font-size="11.5" fill="#7f3f00" text-anchor="middle">direct —— routing key 精确匹配</text>
  <text x="463" y="306" font-size="11.5" fill="#7f3f00" text-anchor="middle">fanout —— 广播到所有绑定队列</text>
  <text x="463" y="330" font-size="11.5" fill="#7f3f00" text-anchor="middle">topic —— 模式匹配（* 单词 / # 多词）</text>

  <!-- binding 箭头 -->
  <line x1="602" y1="250" x2="680" y2="196" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602" y1="284" x2="680" y2="284" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="602" y1="318" x2="680" y2="372" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="232" font-size="11" fill="#616161" text-anchor="middle">binding</text>

  <!-- queues -->
  <rect x="684" y="158" width="456" height="76" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="912" y="188" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">订单队列 · durable + quorum</text>
  <text x="912" y="214" font-size="11" fill="#123314" text-anchor="middle">消费者 ×N · prefetch=50 · 处理完再 ack</text>

  <rect x="684" y="246" width="456" height="76" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="912" y="276" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">通知队列 · fanout 广播目标</text>
  <text x="912" y="302" font-size="11" fill="#123314" text-anchor="middle">短信 / 推送 / 积分各自消费同一条消息</text>

  <rect x="684" y="334" width="456" height="76" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="912" y="364" font-size="13" font-weight="bold" fill="#616161" text-anchor="middle">审计队列 · 旁路记录</text>
  <text x="912" y="390" font-size="11" fill="#616161" text-anchor="middle">同一消息多路复用，不占主链路</text>

  <!-- unroutable -->
  <line x1="463" y1="354" x2="463" y2="404" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="474" y="388" font-size="11" fill="#7f0000">无匹配 binding</text>
  <rect x="328" y="408" width="812" height="48" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="734" y="428" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">unroutable：无匹配队列默认丢弃！静默丢消息比 broker 崩了更难发现</text>
  <text x="734" y="446" font-size="11.5" fill="#7f0000" text-anchor="middle">配 alternate exchange 兜底 + unroutable 指标进监控（011 §1.7）</text>

  <!-- 路由元数据警示 -->
  <rect x="40" y="486" width="1120" height="62" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="512" font-size="13" font-weight="bold" fill="#bf360c">路由配置是元数据变更：改 binding / routing key 前，先确认存量消息去向与新旧规则衔接（011 §1.2）</text>
  <text x="60" y="536" font-size="11.5" fill="#5d4037">vhost 隔离的是权限与资源，不是性能：拓扑按环境或业务拆，避免测试消息串进生产队列</text>

  <!-- 结论块 -->
  <rect x="40" y="562" width="1120" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="592" font-size="15" font-weight="bold" fill="#bf360c">★ 排障分界：消息没进队列＝路由问题；进了队列不消费＝prefetch / 毒丸 / 消费者问题（013 §3.3）</text>
  <text x="60" y="618" font-size="12.5" fill="#5d4037">· queue 才排队、confirm / ack 才可靠：exchange 本身不存消息，路由错了 broker 不会帮你兜底</text>

  <!-- 图例 -->
  <rect x="40" y="654" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="670" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="681" font-size="12" fill="#37474f">生产者</text>
  <rect x="250" y="670" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="282" y="681" font-size="12" fill="#37474f">路由层 ★</text>
  <rect x="450" y="670" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="482" y="681" font-size="12" fill="#37474f">业务队列</text>
  <rect x="650" y="670" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="682" y="681" font-size="12" fill="#37474f">丢弃 / 告警</text>
  <rect x="850" y="670" width="22" height="14" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="882" y="681" font-size="12" fill="#37474f">边界 / 旁路</text>
</svg>
