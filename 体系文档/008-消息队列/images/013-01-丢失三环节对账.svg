<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 822" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>消息丢失三环节对账：先对账，再修复</title>
  <desc>消息丢失的申诉先对账三个环节：生产端丢在发出即忘或发送失败未重试，验收点是确认级别与发送日志；存储端丢在未持久化未复制就宕机，验收点是持久化三件套与仲裁队列或 ISR 配置；消费端丢在先提交后处理，验收点是处理完再确认加幂等。三方日志按业务键对齐，结论三选一：真丢修对应环节、还在队列未消费是堆积、已消费转下游（013 §3.1）。</desc>

  <rect x="0" y="0" width="1200" height="822" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">丢失三环节：先对账，再修复</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：008-消息队列 013 §3.1 丢失三环节对账 · 013 §3.3 堆积 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">三方日志按业务键对齐</text>

  <!-- ① 生产端 -->
  <rect x="40" y="104" width="1120" height="128" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="40" y="104" width="220" height="128" rx="8" fill="#1565c0"/>
  <text x="150" y="154" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">① 生产端</text>
  <text x="150" y="182" font-size="11.5" fill="#ffffff" text-anchor="middle">发出去就等于</text>
  <text x="150" y="204" font-size="11.5" fill="#ffffff" text-anchor="middle">送到了吗？</text>
  <text x="284" y="142" font-size="13" font-weight="bold" fill="#7f0000">丢：acks=0 / 1 · 发送失败没有重试与日志 · 异步发送进程崩溃</text>
  <text x="284" y="176" font-size="12.5" fill="#123314">验收：acks=all + 失败重试 + 发送确认留日志（生产端要能拿出发送成功证据）</text>
  <text x="284" y="206" font-size="11.5" fill="#0d2f5c">证据：生产者 confirm / 事务回执日志，按订单号或 request_id 可查</text>

  <line x1="600" y1="236" x2="600" y2="268" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ② 存储端 -->
  <rect x="40" y="272" width="1120" height="128" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="40" y="272" width="220" height="128" rx="8" fill="#1565c0"/>
  <text x="150" y="322" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">② 存储端</text>
  <text x="150" y="350" font-size="11.5" fill="#ffffff" text-anchor="middle">broker 真的</text>
  <text x="150" y="372" font-size="11.5" fill="#ffffff" text-anchor="middle">存住了吗？</text>
  <text x="284" y="310" font-size="13" font-weight="bold" fill="#7f0000">丢：消息 / 队列未持久化 · 副本不足时宕机 · RabbitMQ 非仲裁队列单点</text>
  <text x="284" y="344" font-size="12.5" fill="#123314">验收：RabbitMQ 持久化三件套 + 仲裁队列；Kafka 副本 3 + min.insync.replicas=2</text>
  <text x="284" y="374" font-size="11.5" fill="#0d2f5c">证据：队列深度 / 分区 ISR 状态 / 消息落盘指标，确认消息曾进入 broker</text>

  <line x1="600" y1="404" x2="600" y2="436" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ③ 消费端 -->
  <rect x="40" y="440" width="1120" height="128" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="40" y="440" width="220" height="128" rx="8" fill="#1565c0"/>
  <text x="150" y="490" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">③ 消费端</text>
  <text x="150" y="518" font-size="11.5" fill="#ffffff" text-anchor="middle">先确认</text>
  <text x="150" y="540" font-size="11.5" fill="#ffffff" text-anchor="middle">还是先处理？</text>
  <text x="284" y="478" font-size="13" font-weight="bold" fill="#7f0000">丢：auto-commit 先提交 offset，处理还没完成就崩溃</text>
  <text x="284" y="512" font-size="12.5" fill="#123314">验收：处理完再确认 / 提交 + 消费幂等（对重复免疫，重复不是丢）</text>
  <text x="284" y="542" font-size="11.5" fill="#0d2f5c">证据：消费处理日志按同一业务键可查，确认是否真的处理过</text>

  <!-- 对账方法 -->
  <rect x="40" y="592" width="1120" height="78" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="622" font-size="15" font-weight="bold" fill="#bf360c">对账：生产发送日志 → MQ 存储证据 → 消费处理日志，三方按业务键对齐</text>
  <text x="60" y="650" font-size="12.5" fill="#5d4037">结论三选一：真丢（修对应环节） / 还在队列未消费（堆积，013 §3.3） / 已消费（转下游排查）</text>

  <!-- 结论块 -->
  <rect x="40" y="686" width="1120" height="62" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="714" font-size="15" font-weight="bold" fill="#bf360c">★ 三方证据缺一环，就不要急着改配置——先定位丢在哪个环节，再谈怎么修</text>
  <text x="60" y="738" font-size="12" fill="#5d4037">· 幂等是最后一道保险：重复投递靠消费端幂等兜底，但幂等救不了真正丢掉的消息（013 §3.2）</text>

  <!-- 图例 -->
  <rect x="40" y="760" width="1120" height="62" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="776" width="22" height="14" rx="3" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="787" font-size="12" fill="#37474f">环节序号</text>
  <rect x="250" y="776" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="282" y="787" font-size="12" fill="#37474f">三环节主体</text>
  <text x="470" y="787" font-size="12" fill="#7f0000">红字＝丢的线索</text>
  <text x="700" y="787" font-size="12" fill="#123314">绿字＝验收点</text>
  <text x="930" y="787" font-size="12" fill="#37474f">三选一，先证据后动手</text>
</svg>
