<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1040" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>AI 运维五层骨架与板块地图：规约、骨架、连接、授权、交付五层</title>
  <desc>左区是五层骨架自下而上叠加：行为（011）→ 骨架（012）→ 连接（013）→ 授权（014）→ 交付（015），跳层缺地基；下方是三类回路与核心五件。右区是板块地图：总览三件套、正文五册、附录 190、跨板块分界与接手要点。数据来源：19-AI运维 板块正文，不绑定模型厂商。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1960" height="1040" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="52" font-size="20" font-weight="bold" fill="#263238">AI 运维五层骨架与板块地图：规约、骨架、连接、授权、交付五层</text>
  <text x="1920" y="52" font-size="11" fill="#757575" text-anchor="end">数据来源：19-AI运维 板块 001~003、011~015、190 册正文 · 2026-11-26 · 不绑定模型厂商</text>

  <!-- ================= 左区：五层骨架 ================= -->
  <rect x="40" y="84" width="880" height="770" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="64" y="120" font-size="15" font-weight="bold" fill="#263238">五层骨架：一层一册，自下而上叠加</text>
  <text x="896" y="120" font-size="11" fill="#757575" text-anchor="end">跳层落地会缺地基</text>

  <!-- 015 交付层 -->
  <rect x="64" y="146" width="832" height="72" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="84" y="172" font-size="13" font-weight="bold" fill="#123314">交付层（015）：AI 服务化交付</text>
  <text x="84" y="198" font-size="11.5" fill="#123314">能力仓库闭环（建仓 → 使用方克隆即用 → 反馈 → 更新回仓）· 交付物成对 · 版本路由</text>

  <line x1="480" y1="218" x2="480" y2="230" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 014 安全层 -->
  <rect x="64" y="234" width="832" height="72" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="84" y="260" font-size="13" font-weight="bold" fill="#7f3f00">安全层（014）：AI 批量操作安全 ★ 没有它，交付是定时炸弹</text>
  <text x="84" y="286" font-size="11.5" fill="#7f3f00">授权三件套（<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">--write --authorized-by --reason</tspan> 缺一即拒）· 永不放行白名单 · 凭据红线</text>

  <line x1="480" y1="306" x2="480" y2="318" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 013 连接层 -->
  <rect x="64" y="322" width="832" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="84" y="348" font-size="13" font-weight="bold" fill="#0d2f5c">连接层（013）：MCP 接入与受管调用</text>
  <text x="84" y="374" font-size="11.5" fill="#0d2f5c">MCP 三形态 · 受管调用四步 · 失败分流两表——403 换入口绕过 = 审计断裂</text>

  <line x1="480" y1="394" x2="480" y2="406" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 012 骨架层 -->
  <rect x="64" y="410" width="832" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="84" y="436" font-size="13" font-weight="bold" fill="#0d2f5c">骨架层（012）：Harness 与技能工程</text>
  <text x="84" y="462" font-size="11.5" fill="#0d2f5c">单一事实源 + 软链接（复制必分叉）· init 前置检查包 · references 五件套</text>

  <line x1="480" y1="482" x2="480" y2="494" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 011 行为层 -->
  <rect x="64" y="498" width="832" height="72" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="84" y="524" font-size="13" font-weight="bold" fill="#0d2f5c">行为层（011）：AI 协作规约 ★ 地基</text>
  <text x="84" y="550" font-size="11.5" fill="#0d2f5c">规约四层效力（宪法 · 刑法 · 规则）· 输出六条 · 回合闭环 · 记忆分「资产 vs 私产」</text>

  <!-- 三类回路 -->
  <rect x="64" y="590" width="832" height="118" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="84" y="616" font-size="13" font-weight="bold" fill="#37474f">三类回路——把「一次性的聪明」变成「可重复的机制」</text>
  <text x="84" y="644" font-size="11.5" fill="#37474f">回合闭环：就绪卡片 → 影响面声明 → 人贴回 → AI 回填（未实测不填结论）</text>
  <text x="84" y="668" font-size="11.5" fill="#37474f">链路守卫：只读探针验通才查 → 不通回修复文档 → 修好重验再回主干</text>
  <text x="84" y="692" font-size="11.5" fill="#37474f">能力仓库闭环：建仓 → 使用方克隆即用 → 反馈 → 更新仓库，末端回仓</text>

  <!-- 核心五件 -->
  <rect x="64" y="724" width="832" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="84" y="748" font-size="13" font-weight="bold" fill="#bf360c">★ 核心五件：规约即代码 · 单一事实源 · 授权三件套 · 链路守卫 · 三态上报——缺一件塌一层</text>
  <text x="84" y="774" font-size="11.5" fill="#7f3f00">三态上报：AI 汇报只说成功 / 失败 / 受阻——受理不等于成功</text>

  <!-- 左区底注 -->
  <text x="84" y="816" font-size="11" fill="#616161">规约即代码：规矩长在仓库里随版本管理，不在会话口头——换会话、换工具、换人都成立（011）</text>
  <text x="84" y="840" font-size="11" fill="#616161">误解澄清：AI 运维 ≠ prompt 技巧——五层工程，prompt 只是最表层；检查包防的是环境与配置，不是智力</text>

  <!-- ================= 右区：板块地图 ================= -->
  <rect x="960" y="84" width="960" height="770" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="984" y="120" font-size="15" font-weight="bold" fill="#263238">板块地图：总览三件套 + 正文五册 + 附录</text>
  <text x="1896" y="120" font-size="11" fill="#757575" text-anchor="end">主线：行为管住 → 骨架搭好 → 连接收敛 → 授权收紧 → 交付成环</text>

  <!-- 总览三件套 -->
  <text x="984" y="148" font-size="12" font-weight="bold" fill="#37474f">总览三件套</text>
  <rect x="984" y="158" width="296" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1132" y="188" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">001 全貌</text>
  <text x="1132" y="212" font-size="11" fill="#0d2f5c" text-anchor="middle">五层骨架 · 工程化定义</text>
  <text x="1132" y="232" font-size="11" fill="#1565c0" text-anchor="middle">分界 · 学习路径</text>
  <rect x="1292" y="158" width="296" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1440" y="188" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">002 方法论</text>
  <text x="1440" y="212" font-size="11" fill="#0d2f5c" text-anchor="middle">规约即代码 · 三态上报</text>
  <text x="1440" y="232" font-size="11" fill="#1565c0" text-anchor="middle">回路机制思维</text>
  <rect x="1600" y="158" width="296" height="88" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="1748" y="188" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">003 全景图 ★ 本图</text>
  <text x="1748" y="212" font-size="11" fill="#7f3f00" text-anchor="middle">五层骨架 + 五册位置</text>
  <text x="1748" y="232" font-size="11" fill="#bf360c" text-anchor="middle">板块配图唯一持有者</text>

  <!-- 正文五册 -->
  <text x="984" y="270" font-size="12" font-weight="bold" fill="#37474f">正文五册</text>
  <rect x="1002" y="280" width="164" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1084" y="308" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">011 行为规约</text>
  <text x="1084" y="334" font-size="11" fill="#0d2f5c" text-anchor="middle">规约四层效力</text>
  <text x="1084" y="356" font-size="11" fill="#0d2f5c" text-anchor="middle">输出六条</text>
  <text x="1084" y="378" font-size="11" fill="#1565c0" text-anchor="middle">回合闭环</text>
  <rect x="1180" y="280" width="164" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1262" y="308" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">012 骨架</text>
  <text x="1262" y="334" font-size="11" fill="#0d2f5c" text-anchor="middle">单一事实源</text>
  <text x="1262" y="356" font-size="11" fill="#0d2f5c" text-anchor="middle">init 检查包</text>
  <text x="1262" y="378" font-size="11" fill="#1565c0" text-anchor="middle">references</text>
  <rect x="1358" y="280" width="164" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1440" y="308" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">013 连接</text>
  <text x="1440" y="334" font-size="11" fill="#0d2f5c" text-anchor="middle">MCP 三形态</text>
  <text x="1440" y="356" font-size="11" fill="#0d2f5c" text-anchor="middle">受管四步</text>
  <text x="1440" y="378" font-size="11" fill="#1565c0" text-anchor="middle">失败分流两表</text>
  <rect x="1536" y="280" width="164" height="104" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="1618" y="308" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">014 安全 ★</text>
  <text x="1618" y="334" font-size="11" fill="#7f3f00" text-anchor="middle">授权三件套</text>
  <text x="1618" y="356" font-size="11" fill="#7f3f00" text-anchor="middle">永不放行白名单</text>
  <text x="1618" y="378" font-size="11" fill="#bf360c" text-anchor="middle">凭据红线</text>
  <rect x="1714" y="280" width="164" height="104" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="1796" y="308" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">015 交付</text>
  <text x="1796" y="334" font-size="11" fill="#123314" text-anchor="middle">能力仓库闭环</text>
  <text x="1796" y="356" font-size="11" fill="#123314" text-anchor="middle">交付物成对</text>
  <text x="1796" y="378" font-size="11" fill="#388e3c" text-anchor="middle">版本路由</text>

  <!-- 附录 -->
  <rect x="984" y="404" width="912" height="52" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="1440" y="436" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">190 术语表：词汇 · 缩写 · 易混对 · 症状反查——按症状反查册号</text>

  <!-- 跨板块分界 -->
  <rect x="984" y="476" width="912" height="150" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1004" y="506" font-size="13" font-weight="bold" fill="#5e35b1">跨板块分界：这些问题不归本板块管</text>
  <text x="1004" y="534" font-size="11.5" fill="#37474f">人与系统的变更纪律 →「SRE」012——AI 这个新同事的用工纪律在本板块 011；AI 违规复盘仍走 SRE 复盘</text>
  <text x="1004" y="558" font-size="11.5" fill="#37474f">SQL 与库运维本身 →「数据库」册——AI 连库的凭据与授权通道在 014，不在数据库册</text>
  <text x="1004" y="582" font-size="11.5" fill="#37474f">镜像仓库 →「CICD」135——AI 能力仓库形态同源、内容不同，别共用一个仓</text>
  <text x="1004" y="606" font-size="11.5" fill="#37474f">K8s 对象操作 →「容器」册——AI 不直接改生产，走既有变更通道</text>

  <!-- 接手要点 -->
  <rect x="984" y="646" width="912" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="1004" y="676" font-size="13" font-weight="bold" fill="#bf360c">★ 给团队引入 AI 协作的第一件事</text>
  <text x="1004" y="702" font-size="12" fill="#5d4037">把规约写进仓库（011）：红线级条款 + 输出六条——提示词跟会话走，进仓库才随版本管理与团队分发</text>
  <text x="1004" y="726" font-size="11" fill="#616161">写操作先立授权三件套（014）：<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">--write --authorized-by --reason</tspan> 缺一即拒，授权即审计</text>

  <!-- 右区底注 -->
  <text x="1004" y="774" font-size="11" fill="#616161">按角色进：管行为 → 011；搭技能库 → 012；接数据 → 013；上生产前 → 014；交付团队 → 015</text>
  <text x="1004" y="798" font-size="11" fill="#616161">误解澄清：MCP 是协议 + 能力索引，不是插件市场——索引没有的能力不存在；判定该不该写库的是人，不是 AI</text>

  <!-- 底部汇总 -->
  <rect x="40" y="878" width="1880" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="64" y="912" font-size="13" font-weight="bold" fill="#bf360c">一句话总结：AI 工程化 = 行为、骨架、连接、授权、交付五层全部工程化——把 AI 从「会话玩具」变成「可规约、可审计、可交付」的团队生产力。</text>
  <text x="64" y="942" font-size="11.5" fill="#7f3f00">两条铁律：规矩进仓库不进会话；写操作三件套缺一即拒——即使授权，白名单外也结构化拒绝。</text>

  <!-- 图例 -->
  <rect x="40" y="982" width="1880" height="42" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="64" y="996" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="96" y="1008" font-size="11" fill="#37474f">基础层（行为 / 骨架 / 连接）</text>
  <rect x="340" y="996" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="372" y="1008" font-size="11" fill="#37474f">安全层 / 本图（枢纽）</text>
  <rect x="590" y="996" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="622" y="1008" font-size="11" fill="#37474f">交付层</text>
  <rect x="740" y="996" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="772" y="1008" font-size="11" fill="#37474f">术语表附录</text>
  <rect x="920" y="996" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="952" y="1008" font-size="11" fill="#37474f">核心五件 / 结论块</text>
  <rect x="1140" y="996" width="22" height="14" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="1172" y="1008" font-size="11" fill="#37474f">分区容器</text>
</svg>
