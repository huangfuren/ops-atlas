<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 829.41" width="1200" height="829.41" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>Redis 缓存层级与板块八册地图</title>
  <desc>请求链路四层：用户请求、应用本地缓存、Redis、数据库，标注命中与未中走向。下半是板块八册地图：000 全貌、001 数据结构与场景、002 持久化、003 主从复制与哨兵、004 Cluster 集群、005 缓存设计三件套、006 运维实战与排错、007 安全与监控衔接。底部提示接手第一步是分清可丢缓存与不可丢主存储。</desc>
  <g transform="scale(1.7647058824)">
  <rect width="680" height="470" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">缓存层级与板块八册地图</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">000 全貌 · 配图</text>

  <defs>
    <marker id="r0Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="r0Red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>

  <!-- 请求链路 -->
  <rect x="20" y="50" width="640" height="120" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="30" y="68" font-size="8" font-weight="600" fill="#8C8980">请求链路：命中率决定数据库死活</text>
  <rect x="36" y="80" width="118" height="56" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="95" y="100" font-size="8.6" font-weight="600" fill="#2B2A27" text-anchor="middle">用户请求</text>
  <text x="95" y="116" font-size="7" fill="#4A4945" text-anchor="middle">读 / 写流量</text>
  <rect x="200" y="80" width="140" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="270" y="100" font-size="8.6" font-weight="600" fill="#1F4468" text-anchor="middle">应用 · 本地缓存</text>
  <text x="270" y="116" font-size="7" fill="#4A4945" text-anchor="middle">进程内存 · 挡最热</text>
  <text x="270" y="130" font-size="6.8" fill="#8C8980" text-anchor="middle">Caffeine / 本地字典</text>
  <rect x="386" y="80" width="140" height="56" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="456" y="100" font-size="8.6" font-weight="600" fill="#7A4A12" text-anchor="middle">Redis ★ 本板块</text>
  <text x="456" y="116" font-size="7" fill="#7A4A12" text-anchor="middle">共享缓存层</text>
  <text x="456" y="130" font-size="6.8" fill="#7A4A12" text-anchor="middle">单线程 · 原子命令</text>
  <rect x="566" y="80" width="90" height="56" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="611" y="100" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">数据库</text>
  <text x="611" y="116" font-size="7" fill="#7A322B" text-anchor="middle">最后防线</text>
  <text x="611" y="130" font-size="6.8" fill="#7A322B" text-anchor="middle">数据全量在此</text>
  <line x1="156" y1="108" x2="196" y2="108" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#r0Blue)"/>
  <line x1="342" y1="108" x2="382" y2="108" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#r0Blue)"/>
  <text x="362" y="98" font-size="6.8" fill="#4A4945" text-anchor="middle">本地未中</text>
  <line x1="528" y1="96" x2="562" y2="96" stroke="#D2948C" stroke-width="1.2" marker-end="url(#r0Red)"/>
  <text x="545" y="88" font-size="6.8" fill="#7A322B" text-anchor="middle">未中回源</text>
  <text x="456" y="146" font-size="7" fill="#4A4945" text-anchor="middle">命中率越高，数据库越安全——命中率是缓存体系第一指标（007 §5 接告警）</text>

  <!-- 八册地图 -->
  <rect x="20" y="182" width="640" height="206" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="30" y="200" font-size="8" font-weight="600" fill="#8C8980">板块八册地图</text>
  <rect x="30" y="208" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="105" y="228" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">000 全貌 ★ 你在这里</text>
  <text x="105" y="244" font-size="7" fill="#4A4945" text-anchor="middle">层级 · 地图 · 概念</text>
  <text x="105" y="257" font-size="7" fill="#4A4945" text-anchor="middle">分界 · 学习路径</text>
  <rect x="186" y="208" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="261" y="228" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">001 数据结构与场景</text>
  <text x="261" y="244" font-size="7" fill="#4A4945" text-anchor="middle">九种结构 · 场景</text>
  <text x="261" y="257" font-size="7" fill="#4A4945" text-anchor="middle">编码转换 · 误用</text>
  <rect x="342" y="208" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="417" y="228" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">002 持久化</text>
  <text x="417" y="244" font-size="7" fill="#4A4945" text-anchor="middle">RDB · AOF · 混合</text>
  <text x="417" y="257" font-size="7" fill="#4A4945" text-anchor="middle">fork · 备份≠持久化</text>
  <rect x="498" y="208" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="573" y="228" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">006 运维实战与排错</text>
  <text x="573" y="244" font-size="7" fill="#4A4945" text-anchor="middle">内存 · 大 key · 热 key</text>
  <text x="573" y="257" font-size="7" fill="#4A4945" text-anchor="middle">慢查询 · 延迟 · INFO</text>
  <rect x="30" y="272" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="105" y="292" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">003 主从复制与哨兵</text>
  <text x="105" y="308" font-size="7" fill="#4A4945" text-anchor="middle">复制 · 切换时序</text>
  <text x="105" y="321" font-size="7" fill="#4A4945" text-anchor="middle">脑裂防治</text>
  <rect x="186" y="272" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="261" y="292" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">004 Cluster 集群</text>
  <text x="261" y="308" font-size="7" fill="#4A4945" text-anchor="middle">16384 槽 · MOVED</text>
  <text x="261" y="321" font-size="7" fill="#4A4945" text-anchor="middle">hash tag · 倾斜</text>
  <rect x="342" y="272" width="150" height="56" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="417" y="292" font-size="8.2" font-weight="600" fill="#7A4A12" text-anchor="middle">005 缓存设计三件套</text>
  <text x="417" y="308" font-size="7" fill="#7A4A12" text-anchor="middle">穿透 · 击穿 · 雪崩</text>
  <text x="417" y="321" font-size="7" fill="#7A4A12" text-anchor="middle">一致性 · 淘汰策略</text>
  <rect x="498" y="272" width="150" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="573" y="292" font-size="8.2" font-weight="600" fill="#1F4468" text-anchor="middle">007 安全与监控衔接</text>
  <text x="573" y="308" font-size="7" fill="#4A4945" text-anchor="middle">ACL · 禁命令</text>
  <text x="573" y="321" font-size="7" fill="#4A4945" text-anchor="middle">指标映射 · 阈值</text>

  <!-- 底部 -->
  <rect x="20" y="400" width="640" height="26" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="32" y="417" font-size="7.8" font-weight="600" fill="#7A4A12">★ 接手第一步：分清 Redis 里存的是「可丢缓存」还是「不可丢主存储」——它决定持久化与高可用的投入（002 / 003）</text>

  <text x="32" y="448" font-size="8.6" fill="#8C8980">分界：选型对比 → 数据库 010/009；消息语义 → 消息队列 004；redis_exporter 配置 → 监控 007；备份方法论 → Linux 010。</text>
  </g>
</svg>
