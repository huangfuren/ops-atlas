<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>哨兵切换时序：六步完成主从易主，脑裂窗口与防治</title>
  <desc>左列六步：主库失联、各哨兵主观下线、quorum 确认升级客观下线、哨兵间选 leader、挑数据最新的从库提升、通知客户端与从库。右上脑裂窗口：旧主分区期间仍接写入，恢复后全量同步丢失；防治是 min-replicas-to-write 与 max-lag。右下切换演练五步。数据来源：113 主从复制与哨兵册 §3~§5，Redis 7.2。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="860" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">哨兵切换时序：六步完成主从易主</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">113 主从复制与哨兵 §3~§5 · Redis 7.2</text>

  <!-- 步骤 1 -->
  <rect x="40" y="88" width="560" height="84" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="76" cy="130" r="16" fill="#1565c0"/>
  <text x="76" y="135" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="108" y="122" font-size="14" font-weight="bold" fill="#0d2f5c">主库失联</text>
  <text x="108" y="146" font-size="12" fill="#0d2f5c">网络分区或进程崩溃——客户端开始报错</text>

  <line x1="76" y1="172" x2="76" y2="184" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 步骤 2 -->
  <rect x="40" y="188" width="560" height="84" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="76" cy="230" r="16" fill="#1565c0"/>
  <text x="76" y="235" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="108" y="222" font-size="14" font-weight="bold" fill="#0d2f5c">主观下线（sdown）</text>
  <text x="108" y="246" font-size="12" fill="#0d2f5c">每个哨兵独立判定，超时未回复就标记为失联（默认 30s）</text>
  <text x="108" y="264" font-size="11" fill="#1565c0" font-family="ui-monospace,Menlo,Consolas,monospace">down-after-milliseconds = 30000</text>

  <line x1="76" y1="272" x2="76" y2="284" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 步骤 3 -->
  <rect x="40" y="288" width="560" height="84" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="76" cy="330" r="16" fill="#1565c0"/>
  <text x="76" y="335" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="108" y="322" font-size="14" font-weight="bold" fill="#0d2f5c">客观下线（odown）</text>
  <text x="108" y="346" font-size="12" fill="#0d2f5c">≥ quorum 个哨兵都确认失联才切换——防单个哨兵误判</text>
  <text x="108" y="364" font-size="11" fill="#1565c0" font-family="ui-monospace,Menlo,Consolas,monospace">sentinel monitor mymaster 10.0.0.1 6379 2</text>

  <line x1="76" y1="372" x2="76" y2="384" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 步骤 4 -->
  <rect x="40" y="388" width="560" height="84" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="76" cy="430" r="16" fill="#1565c0"/>
  <text x="76" y="435" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="108" y="422" font-size="14" font-weight="bold" fill="#0d2f5c">哨兵之间选举 leader</text>
  <text x="108" y="446" font-size="12" fill="#0d2f5c">Raft 式多数派投票，leader 负责执行切换——所以哨兵要 ≥3 个、奇数、跨机器</text>

  <line x1="76" y1="472" x2="76" y2="484" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 步骤 5 -->
  <rect x="40" y="488" width="560" height="84" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <circle cx="76" cy="530" r="16" fill="#e65100"/>
  <text x="76" y="535" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="108" y="522" font-size="14" font-weight="bold" fill="#7f3f00">挑数据最新的从库提升为新主</text>
  <text x="108" y="546" font-size="12" fill="#7f3f00">选主三级：优先级数值越小越优先（0 = 永不参与）→ 复制偏移量最大 → runid 最小</text>
  <text x="108" y="564" font-size="11" fill="#bf360c" font-family="ui-monospace,Menlo,Consolas,monospace">replica-priority · repl offset · runid</text>

  <line x1="76" y1="572" x2="76" y2="584" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 步骤 6 -->
  <rect x="40" y="588" width="560" height="84" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <circle cx="76" cy="630" r="16" fill="#388e3c"/>
  <text x="76" y="635" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
  <text x="108" y="622" font-size="14" font-weight="bold" fill="#123314">通知客户端与从库</text>
  <text x="108" y="646" font-size="12" fill="#123314">客户端必须用 sentinel 模式才能自动发现新主，写死 IP 切换后写全打到旧主</text>
  <text x="108" y="664" font-size="11" fill="#388e3c" font-family="ui-monospace,Menlo,Consolas,monospace">+switch-master  sentinel get-master-addr-by-name mymaster</text>

  <!-- 脑裂窗口 -->
  <rect x="640" y="88" width="520" height="176" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="660" y="116" font-size="13" font-weight="bold" fill="#7f0000">脑裂窗口：分区期间的数据丢失</text>
  <text x="660" y="142" font-size="12" fill="#7f0000">主库没挂，只是与哨兵 / 从库网络分区——</text>
  <text x="660" y="164" font-size="12" fill="#7f0000">哨兵照常切出新主，旧主仍在接客户端写入；</text>
  <text x="660" y="186" font-size="12" fill="#7f0000">分区恢复后旧主降为从库并全量同步新主——</text>
  <text x="660" y="212" font-size="12" font-weight="bold" fill="#7f0000">分区期间写进旧主的数据全部丢失</text>
  <text x="660" y="238" font-size="11" fill="#c62828">窗口大小由写入量与分区时长决定，事先算过才叫评估</text>

  <!-- 防治 -->
  <rect x="640" y="284" width="520" height="150" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="660" y="312" font-size="13" font-weight="bold" fill="#7f3f00">防治（主库配置，两项都设）</text>
  <text x="660" y="338" font-size="11" fill="#7f3f00"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">min-replicas-to-write 1</tspan> —— 至少 1 个从库跟得上才接受写</text>
  <text x="660" y="360" font-size="11" fill="#7f3f00"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">min-replicas-max-lag 10</tspan> —— 从库延迟超过 10s 视为失联</text>
  <text x="660" y="390" font-size="12" fill="#5d4037">没有健康从库就拒绝写入——脑裂窗口内旧主自动变只读</text>
  <text x="660" y="414" font-size="11" fill="#616161">代价：全部从库失联时主库也只读——可用性换一致性，主存储业务值得</text>

  <!-- 演练 -->
  <rect x="640" y="454" width="520" height="218" rx="6" fill="#ffffff" stroke="#388e3c" stroke-width="1.5"/>
  <text x="660" y="482" font-size="13" font-weight="bold" fill="#123314">切换演练：不演练等于不会切（113 §5）</text>
  <text x="660" y="508" font-size="12" fill="#37474f">① 手动触发 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">SENTINEL failover</tspan>，从库日志出现 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">+switch-master</tspan></text>
  <text x="660" y="534" font-size="12" fill="#37474f">② 事件流 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">+sdown → +odown → +failover → +switch-master</tspan></text>
  <text x="660" y="560" font-size="12" fill="#37474f">③ <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">INFO replication</tspan> 验证角色翻转、客户端已重连</text>
  <text x="660" y="586" font-size="12" fill="#37474f">④ 旧主重新上线自动降为从库，数据与新主对齐</text>
  <text x="660" y="612" font-size="12" fill="#37474f">⑤ 故障恢复演练走全链路（方法见「数据库」121）</text>
  <text x="660" y="646" font-size="11" fill="#616161">切换全程秒级到分钟级——SLO 承诺要按这个窗口算（「SRE」011）</text>

  <!-- 结论块 -->
  <rect x="40" y="688" width="1120" height="68" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="64" y="716" font-size="13" font-weight="bold" fill="#bf360c">★ 部署铁律：哨兵 ≥3 个、奇数、跨机器（不与主库同机）；客户端必须用 sentinel 模式，写死 IP 切换后写全打到旧主</text>
  <text x="64" y="742" font-size="11.5" fill="#7f3f00"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">repl_backlog-size</tspan> 按写入速率 × 预期断线时长调大（生产 ≥64MB），默认 1MB 断线秒级触发全量同步风暴；切换上限 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10">failover-timeout</tspan> 180s</text>

  <!-- 尾注 -->
  <text x="40" y="780" font-size="11" fill="#616161">PSYNC2（Redis 7.2）支持故障转移后增量重连；从库默认只读（replica-read-only yes），应用不要把写打到从库</text>

  <!-- 图例 -->
  <rect x="40" y="796" width="1120" height="44" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="810" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="822" font-size="11" fill="#37474f">切换步骤</text>
  <rect x="200" y="810" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="232" y="822" font-size="11" fill="#37474f">关键：挑新主</text>
  <rect x="380" y="810" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="412" y="822" font-size="11" fill="#37474f">完成通知</text>
  <rect x="520" y="810" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="552" y="822" font-size="11" fill="#37474f">脑裂风险</text>
  <rect x="660" y="810" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="692" y="822" font-size="11" fill="#37474f">防治配置</text>
  <rect x="800" y="810" width="22" height="14" rx="3" fill="#ffffff" stroke="#388e3c" stroke-width="1"/>
  <text x="832" y="822" font-size="11" fill="#37474f">演练清单</text>
</svg>
