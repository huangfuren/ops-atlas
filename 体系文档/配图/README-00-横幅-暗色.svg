<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264.71" width="1200" height="264.71" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系；主页门面横幅暗色版，与 README-00-横幅.svg 同构同坐标，仅换配色 -->
  <g transform="scale(1.7647058824)">

  <title>ops-atlas · 运维工程师知识库主页横幅（暗色）</title>
  <desc>与明色版同构的暗色配色：左侧为书名与定位，右侧为六组板块缩影卡片，坐标与明色版完全一致。</desc>

  <rect width="680" height="150" fill="#1E1D1A"/>
  <rect x="0.5" y="0.5" width="679" height="149" fill="none" stroke="#3A3833" stroke-width="1"/>

  <!-- 左：书名与定位 -->
  <text x="26" y="46" font-size="20" font-weight="700" fill="#F2EFE7">ops-atlas</text>
  <text x="26" y="70" font-size="14" font-weight="600" fill="#D6D1C6">运维工程师知识库</text>
  <text x="26" y="92" font-size="9.5" fill="#98938A">体系化教材 · 按册速查 · 术语表与症状反查</text>
  <rect x="26" y="104" width="88" height="18" rx="9" fill="#3A2C18" stroke="#B8873F" stroke-width="1"/>
  <text x="70" y="116.5" font-size="9" fill="#F0C88E" text-anchor="middle">★ 持续更新</text>

  <!-- 分隔线 -->
  <line x1="318" y1="24" x2="318" y2="126" stroke="#3A3833" stroke-width="1"/>

  <!-- 右：六组板块缩影（3×2 卡片） -->
  <rect x="334" y="30" width="102" height="44" rx="3" fill="#1B2938" stroke="#4C7CA6" stroke-width="1"/>
  <text x="342" y="43" font-size="8.5" font-weight="600" fill="#A6C6E6">地基</text>
  <text x="342" y="56" font-size="8" fill="#C6C2B8">Linux · 网络</text>
  <text x="342" y="67" font-size="8" fill="#C6C2B8">虚拟化</text>

  <rect x="442" y="30" width="102" height="44" rx="3" fill="#262039" stroke="#6B5A9C" stroke-width="1"/>
  <text x="450" y="43" font-size="8.5" font-weight="600" fill="#BCAEE0">中间件</text>
  <text x="450" y="56" font-size="8" fill="#C6C2B8">数据库 · 消息队列</text>
  <text x="450" y="67" font-size="8" fill="#C6C2B8">Redis · Java 应用</text>

  <rect x="550" y="30" width="102" height="44" rx="3" fill="#1B2938" stroke="#4C7CA6" stroke-width="1"/>
  <text x="558" y="43" font-size="8.5" font-weight="600" fill="#A6C6E6">平台与交付</text>
  <text x="558" y="56" font-size="8" fill="#C6C2B8">容器 · CICD</text>
  <text x="558" y="67" font-size="8" fill="#C6C2B8">接入层 · 云平台</text>

  <rect x="334" y="80" width="102" height="44" rx="3" fill="#262039" stroke="#6B5A9C" stroke-width="1"/>
  <text x="342" y="93" font-size="8.5" font-weight="600" fill="#BCAEE0">可观测</text>
  <text x="342" y="106" font-size="8" fill="#C6C2B8">监控 · 日志</text>
  <text x="342" y="117" font-size="8" fill="#C6C2B8">链路</text>

  <rect x="442" y="80" width="102" height="44" rx="3" fill="#332616" stroke="#A5783B" stroke-width="1"/>
  <text x="450" y="93" font-size="8.5" font-weight="600" fill="#EAC58F">安全</text>
  <text x="450" y="106" font-size="8" fill="#C6C2B8">加固 · 基线</text>
  <text x="450" y="117" font-size="8" fill="#C6C2B8">审计 · 应急</text>

  <rect x="550" y="80" width="102" height="44" rx="3" fill="#2A2926" stroke="#55524B" stroke-width="1"/>
  <text x="558" y="93" font-size="8.5" font-weight="600" fill="#EDEAE2">方法与语言</text>
  <text x="558" y="106" font-size="8" fill="#C6C2B8">Python · Go</text>
  <text x="558" y="117" font-size="8" fill="#C6C2B8">SRE 方法论</text>

  </g>
