<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 264.71" width="1200" height="264.71" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系；主页门面横幅（内容为板块地图缩影，不含会过时的数字） -->
  <g transform="scale(1.7647058824)">

  <title>ops-atlas · 运维工程师知识库主页横幅</title>
  <desc>左侧为书名与定位：体系化教材、按册速查、术语表与症状反查，角标标注持续更新。右侧为六组板块缩影卡片：地基（Linux、网络、虚拟化）、中间件（数据库、消息队列、Redis、Java 应用）、平台与交付（容器、CICD、接入层、云平台）、可观测（监控、日志、链路）、安全（加固、基线、审计）、方法与语言（Python、Go、SRE），共 18 个板块。</desc>

  <rect width="680" height="150" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="679" height="149" fill="none" stroke="#EDEAE2" stroke-width="1"/>

  <!-- 左：书名与定位 -->
  <text x="26" y="46" font-size="20" font-weight="700" fill="#2B2A27">ops-atlas</text>
