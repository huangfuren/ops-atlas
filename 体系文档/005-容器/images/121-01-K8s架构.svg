<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>K8s 集群架构：控制平面决策，节点执行</title>
  <desc>顶部 kubectl 把请求发给控制平面：apiserver 是唯一入口负责认证校验并读写 etcd，scheduler 决定新 Pod 落在哪个节点，controller-manager 持续把现实掰向期望状态。两个工作节点上 kubelet 按指令拉起容器并上报状态，kube-proxy 维护 Service 转发规则，containerd 真正跑容器。控制平面挂掉不影响存量业务。</desc>

  <!-- 坐标表：画布 1200x810 | 标题 52 / 副标题 84 | kubectl 胶囊 y=110 h=40 |
       控制面外框 x=40 y=176 w=1120 h=150 | 控制面卡 x=60/335/610/885 w=250 h=94 y=214 |
       节点外框 x=40 / 620，y=360 w=540 h=220 | 节点卡 w=240 h=68，x=60/320 与 640/900，y=400/480 |
       结论块 y=600 h=100 | 图例 y=724 h=65 -->

  <rect x="0" y="0" width="1200" height="810" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">K8s 架构：控制平面决策，节点执行</text>
  <text x="40" y="84" font-size="12" fill="#616161">一切通信过 apiserver；控制面挂掉 ≠ 业务挂，存量照跑</text>

  <rect x="500" y="110" width="200" height="40" rx="20" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="600" y="136" font-size="12" font-weight="bold" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">kubectl apply -f app.yaml</text>
  <line x1="600" y1="150" x2="600" y2="172" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="176" width="1120" height="150" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="202" font-size="14" font-weight="bold" fill="#1b5e20">控制平面：决策与事实来源</text>

  <rect x="60" y="214" width="250" height="94" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="78" y="240" font-size="13" font-weight="bold" fill="#0d2f5c">kube-apiserver</text>
  <text x="78" y="264" font-size="11.5" fill="#37474f">唯一入口：认证 · 校验</text>
  <text x="78" y="286" font-size="11" fill="#37474f">读写 etcd</text>

  <rect x="335" y="214" width="250" height="94" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="353" y="240" font-size="13" font-weight="bold" fill="#7f3f00">etcd ★</text>
  <text x="353" y="264" font-size="11.5" fill="#7f3f00">集群唯一事实来源</text>
  <text x="353" y="286" font-size="11" fill="#7f3f00">备份它 = 备份集群</text>

  <rect x="610" y="214" width="250" height="94" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="628" y="240" font-size="13" font-weight="bold" fill="#0d2f5c">kube-scheduler</text>
  <text x="628" y="264" font-size="11.5" fill="#37474f">决定新 Pod 落点</text>
  <text x="628" y="286" font-size="11" fill="#37474f">挂了 → 全部 Pending</text>

  <rect x="885" y="214" width="250" height="94" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="903" y="240" font-size="13" font-weight="bold" fill="#0d2f5c">controller-manager</text>
  <text x="903" y="264" font-size="11.5" fill="#37474f">现实 → 期望状态</text>
  <text x="903" y="286" font-size="11" fill="#37474f">挂了 → 不自愈</text>

  <line x1="300" y1="326" x2="300" y2="356" stroke="#607d8b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="900" y1="326" x2="900" y2="356" stroke="#607d8b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="312" y="348" font-size="11" fill="#616161">指令下发 / 状态上报</text>
  <text x="912" y="348" font-size="11" fill="#616161">指令下发 / 状态上报</text>

  <rect x="40" y="360" width="540" height="220" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="386" font-size="14" font-weight="bold" fill="#1b5e20">工作节点 1</text>
  <rect x="60" y="400" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="78" y="426" font-size="13" font-weight="bold" fill="#123314">kubelet</text>
  <text x="78" y="448" font-size="11.5" fill="#37474f">拉起容器 · 上报状态</text>
  <rect x="320" y="400" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="338" y="426" font-size="13" font-weight="bold" fill="#123314">kube-proxy</text>
  <text x="338" y="448" font-size="11.5" fill="#37474f">Service 转发规则</text>
  <rect x="60" y="480" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="78" y="506" font-size="13" font-weight="bold" fill="#123314">containerd</text>
  <text x="78" y="528" font-size="11.5" fill="#37474f">真正跑容器（CRI）</text>
  <rect x="320" y="480" width="240" height="68" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="338" y="506" font-size="13" font-weight="bold" fill="#37474f">Pod × N</text>
  <text x="338" y="528" font-size="11.5" fill="#616161">业务负载</text>

  <rect x="620" y="360" width="540" height="220" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="640" y="386" font-size="14" font-weight="bold" fill="#1b5e20">工作节点 2</text>
  <rect x="640" y="400" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="658" y="426" font-size="13" font-weight="bold" fill="#123314">kubelet</text>
  <text x="658" y="448" font-size="11.5" fill="#37474f">拉起容器 · 上报状态</text>
  <rect x="900" y="400" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="918" y="426" font-size="13" font-weight="bold" fill="#123314">kube-proxy</text>
  <text x="918" y="448" font-size="11.5" fill="#37474f">Service 转发规则</text>
  <rect x="640" y="480" width="240" height="68" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="658" y="506" font-size="13" font-weight="bold" fill="#123314">containerd</text>
  <text x="658" y="528" font-size="11.5" fill="#37474f">真正跑容器（CRI）</text>
  <rect x="900" y="480" width="240" height="68" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="918" y="506" font-size="13" font-weight="bold" fill="#37474f">Pod × N</text>
  <text x="918" y="528" font-size="11.5" fill="#616161">业务负载</text>

  <rect x="40" y="600" width="1120" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="628" font-size="15" font-weight="bold" fill="#bf360c">★ 控制面决策，节点执行；组件挂掉表现各异</text>
  <text x="60" y="654" font-size="12.5" fill="#5d4037">· apiserver 失联 · scheduler 全 Pending · kubelet 单节点 NotReady</text>
  <text x="60" y="676" font-size="12.5" fill="#5d4037">· 自愈分两层：节点 kubelet 重启崩掉的容器；控制面 Deployment 补齐副本数</text>
  <text x="60" y="694" font-size="12.5" fill="#5d4037">· 控制面挂掉不影响存量业务，但无法新建、调度与自愈</text>

  <rect x="40" y="724" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="745" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="756" font-size="12" fill="#37474f">控制面组件</text>
  <rect x="280" y="745" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="756" font-size="12" fill="#37474f">关键存储 etcd ★</text>
  <rect x="560" y="745" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="592" y="756" font-size="12" fill="#37474f">节点组件</text>
  <rect x="820" y="745" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="852" y="756" font-size="12" fill="#37474f">业务负载</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>
</svg>
