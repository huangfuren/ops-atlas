  <title>容器运行时栈全景：三册总览、Docker 六册、K8s 十册与一条调用链</title>
  <desc>五行：① 总览与附录 4 册；② 110-Docker 单机线 6 册；③ 120-K8s 核心线 5 册；④ 130-K8s 进阶与交付线 5 册；⑤ 运行时调用链：docker CLI 或 kubectl → dockerd 或 apiserver → kubelet 与 containerd → runc → 容器进程。学习自底向上先建直觉，排障自顶向下把现象落到节点运行时。K8s 1.24 起 kubelet 经 CRI 直连 containerd，不再经过 Docker。</desc>

