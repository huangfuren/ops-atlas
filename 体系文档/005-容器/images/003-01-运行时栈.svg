  <!-- ========== 结论块 ========== -->
  <rect x="60" y="736" width="1840" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="80" y="764" font-size="15" font-weight="bold" fill="#bf360c">★ 学习自底向上：111~116 先建单机直觉，再进 121~135；排障自顶向下：K8s 现象最终落到节点运行时</text>
  <text x="80" y="788" font-size="12.5" fill="#5d4037">· Docker 线按 111 → 112 → 113 → 114 → 115 → 116 顺序读，跳过单机地基学 K8s 会缺一层直觉</text>
  <text x="80" y="809" font-size="12.5" fill="#5d4037">· 术语三份：190 管领域词，110 术语表管 Docker 词，120 术语表管 K8s 词</text>
  <text x="1000" y="788" font-size="12.5" fill="#5d4037">· K8s 1.24+ 通过 CRI 直连 containerd，docker ps 看不到 K8s 容器，要用 crictl</text>
  <text x="1000" y="809" font-size="12.5" fill="#5d4037">· 镜像都是 OCI 格式：本地 build → 推仓库 → 集群拉，这条路径不受运行时替换影响</text>

