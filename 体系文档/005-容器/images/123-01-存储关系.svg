<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>K8s 存储对象关系：Pod 挂 PVC，PVC 绑 PV，StorageClass 动态供给</title>
  <desc>Pod 通过 volumeMount 引用 PVC；PVC 是使用者申请单，声明容量与访问模式；PV 是真实存储资源。PVC 声明 storageClassName 后由 StorageClass 模板自动创建对应 PV，即动态供给。RWO 表示单节点读写；回收策略决定 PVC 删除后 PV 保留还是联动删除。</desc>

  <!-- 坐标表：画布 1200x650 | 标题 52 / 副标题 84 | 上排三卡 x=40/435/830 w=330 h=130 y=130 |
       卡间箭头 x=374→429 / 769→824，y=195 | StorageClass x=435 y=300 w=725 h=100 |
       动态供给虚线 x=600 / 1000，y=298→264 | 结论块 y=430 h=110 | 图例 y=564 h=65 -->

  <rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">存储对象关系：申请与供给分离</text>
  <text x="40" y="84" font-size="12" fill="#616161">Pod 只认 PVC；PV 由 StorageClass 动态供给，回收策略决定数据去留</text>

  <rect x="40" y="130" width="330" height="130" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="58" y="158" font-size="15" font-weight="bold" fill="#123314">Pod（使用者）</text>
  <text x="58" y="186" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">volumeMounts:</text>
  <text x="58" y="208" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">claimName: app-data</text>
  <text x="58" y="238" font-size="11.5" fill="#2e5230">重调度后 PVC 跟着走</text>

  <line x1="374" y1="195" x2="429" y2="195" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402" y="183" font-size="11" fill="#616161" text-anchor="middle">挂载</text>

  <rect x="435" y="130" width="330" height="130" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="453" y="158" font-size="13" font-weight="bold" fill="#0d2f5c">PVC · app-data（申请单）</text>
  <text x="453" y="186" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">requests: 50Gi</text>
  <text x="453" y="208" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">accessModes: RWO</text>
  <text x="453" y="238" font-size="11.5" fill="#37474f">RWO = 单节点读写（云盘常态）</text>

  <line x1="769" y1="195" x2="824" y2="195" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="797" y="183" font-size="11" fill="#616161" text-anchor="middle">绑定</text>

  <rect x="830" y="130" width="330" height="130" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="848" y="158" font-size="15" font-weight="bold" fill="#7f3f00">PV（存储资源）★</text>
  <text x="848" y="186" font-size="12" fill="#37474f">云盘 / NFS 目录</text>
  <text x="848" y="208" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">reclaimPolicy:</text>
  <text x="848" y="238" font-size="12" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">Retain / Delete</text>

  <rect x="435" y="300" width="725" height="100" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="455" y="328" font-size="13" font-weight="bold" fill="#37474f">StorageClass（供货模板）—— kubectl get sc</text>
  <text x="455" y="354" font-size="11.5" fill="#37474f">provisioner（CSI 驱动）· reclaimPolicy · volumeBindingMode</text>
  <text x="455" y="380" font-size="11.5" fill="#616161">WaitForFirstConsumer：等 Pod 落定再建盘，多可用区自动对齐</text>

  <line x1="600" y1="298" x2="600" y2="264" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="614" y="286" font-size="11" fill="#7f3f00">storageClassName: fast-ssd</text>
  <line x1="1000" y1="298" x2="1000" y2="264" stroke="#e65100" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowOrange)"/>
  <text x="1014" y="286" font-size="11" fill="#7f3f00">动态创建</text>

  <rect x="40" y="430" width="1120" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="458" font-size="15" font-weight="bold" fill="#bf360c">★ 申请与供给分离：Pod 只认 PVC，PVC 绑定 PV</text>
  <text x="60" y="484" font-size="12.5" fill="#5d4037">· RWO 单节点读写是云盘常态；多副本配 RWO 会永远 Pending，需 RWX 或每副本独立 PVC</text>
  <text x="60" y="506" font-size="12.5" fill="#5d4037">· 生产数据的类必须 Retain（或复核默认值）：顺手删 PVC，云盘可能跟着没了</text>
  <text x="60" y="528" font-size="12.5" fill="#5d4037">· StorageClass 决定谁建盘、怎么回收、何时建盘</text>

  <rect x="40" y="564" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="585" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="92" y="596" font-size="12" fill="#37474f">Pod</text>
  <rect x="260" y="585" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="292" y="596" font-size="12" fill="#37474f">PVC（申请）</text>
  <rect x="520" y="585" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="552" y="596" font-size="12" fill="#37474f">PV（资源）★</text>
  <rect x="800" y="585" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="832" y="596" font-size="12" fill="#37474f">StorageClass（模板）</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>
</svg>
