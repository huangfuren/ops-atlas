<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Compose 单机编排：一组容器、一张默认网络、一份 YAML</title>
  <desc>一台机器上的三个服务：web 对外发布 8080，db 用具名卷存数据并带健康检查，cache 秒起。它们自动接入同一张默认网络，服务名就是主机名，web 用 DB_HOST=db 互联不写 IP。depends_on 配 service_healthy 后，web 等 db 健康检查通过才启动——启动顺序不等于服务就绪。</desc>

  <!-- 坐标表：画布 1200x620 | 标题 52 / 副标题 84 | 宿主机框 x=40 y=120 w=1120 h=270 |
       服务卡 x=60/430/800，w=340 h=104，y=166 | 默认网络带 y=300 h=40 | 卷 y=352 h=30 |
       结论块 y=414 h=86 | 图例 y=524 h=65 -->

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">Compose：一台机器上的一组容器</text>
  <text x="40" y="84" font-size="12" fill="#616161">一份 compose.yaml 定义全部服务；服务名就是主机名，不写 IP</text>

  <rect x="40" y="120" width="1120" height="270" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="60" y="146" font-size="12" fill="#616161">docker host —— compose.yaml 定义全部三个服务</text>

  <rect x="60" y="166" width="340" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="192" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">web · myapp:1.4.2</text>
  <text x="230" y="216" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ports: 8080:8080</text>
  <text x="230" y="238" font-size="11.5" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">restart: unless-stopped</text>
  <text x="230" y="260" font-size="11" fill="#616161" text-anchor="middle">对外入口</text>

  <rect x="430" y="166" width="340" height="104" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="600" y="192" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">db · mysql:8.0 ★</text>
  <text x="600" y="216" font-size="11.5" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">volumes: db-data:/var/lib/mysql</text>
  <text x="600" y="238" font-size="11.5" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">healthcheck: mysqladmin ping</text>
  <text x="600" y="260" font-size="11" fill="#7f3f00" text-anchor="middle">就绪后才放 web 进来</text>

  <rect x="800" y="166" width="340" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="970" y="192" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">cache · redis:7</text>
  <text x="970" y="216" font-size="11.5" fill="#37474f" text-anchor="middle">秒起，无需健康检查</text>
  <text x="970" y="238" font-size="11.5" fill="#37474f" text-anchor="middle">REDIS_HOST=cache</text>
  <text x="970" y="260" font-size="11" fill="#2e5230" text-anchor="middle">按服务名互访</text>

  <line x1="230" y1="270" x2="230" y2="298" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="600" y2="298" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="270" x2="970" y2="298" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="300" width="1080" height="40" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="600" y="325" font-size="12" font-weight="bold" fill="#311b92" text-anchor="middle">默认网络（自动创建）—— DB_HOST=db · REDIS_HOST=cache，不写 IP</text>

  <rect x="430" y="352" width="340" height="30" rx="4" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="600" y="372" font-size="11" fill="#37474f" text-anchor="middle">具名卷 db-data —— rm 容器数据还在（113）</text>

  <rect x="40" y="414" width="1120" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="442" font-size="15" font-weight="bold" fill="#bf360c">★ 启动顺序 ≠ 服务就绪</text>
  <text x="60" y="468" font-size="12.5" fill="#5d4037">· depends_on + condition: service_healthy：db 健康检查通过后 web 才启动</text>
  <text x="60" y="490" font-size="12.5" fill="#5d4037">· 只写 depends_on 只保证「先启动」；cache 秒起，无需健康检查</text>

  <rect x="40" y="524" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="545" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="556" font-size="12" fill="#37474f">web</text>
  <rect x="260" y="545" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="292" y="556" font-size="12" fill="#37474f">db（带卷与健康检查）</text>
  <rect x="540" y="545" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="572" y="556" font-size="12" fill="#37474f">cache</text>
  <rect x="740" y="545" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="772" y="556" font-size="12" fill="#37474f">默认网络</text>
  <rect x="960" y="545" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="992" y="556" font-size="12" fill="#37474f">具名卷</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>
</svg>
