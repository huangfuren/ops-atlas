<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>多阶段构建：编译阶段怎么脏都行，运行阶段只带产物</title>
  <desc>左侧 build 阶段基于 golang 镜像约 250MB，装整套工具链，唯一使命是产出二进制；右侧 runtime 阶段从干净的 alpine 起步，只拷入二进制，成品约 12MB。COPY --from 是两个阶段之间唯一传递的东西。底部是单阶段与多阶段的体积对比。</desc>

  <!-- 坐标表：画布 1200x720 | 标题 52 / 副标题 84 | 中间标注 y=132 |
       阶段卡 x=40 / 640，w=520 h=190，y=150 | 箭头 x=564→632，y=245 |
       体积对比标题 y=372，条 y=408 / 448 | 结论块 y=496 h=86 | 图例 y=606 h=65 | 尾注 y=694 -->

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">多阶段构建：250MB 进，12MB 出</text>
  <text x="40" y="84" font-size="12" fill="#616161">工具链不进最终镜像——编译环境怎么脏都行，运行阶段只带产物</text>

  <text x="600" y="132" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">COPY --from=build · 只拷 /bin/app</text>

  <rect x="40" y="150" width="520" height="190" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="180" font-size="15" font-weight="bold" fill="#0d2f5c">阶段 1 · build</text>
  <text x="60" y="208" font-size="12" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">FROM golang:1.22-alpine<tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">（约</tspan> 250MB<tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">）</tspan></text>
  <text x="60" y="238" font-size="12.5" fill="#37474f">内容：源码 + 工具链 + 构建缓存</text>
  <text x="60" y="266" font-size="12.5" fill="#37474f">使命：产出 /bin/app —— 仅此而已</text>
  <text x="60" y="294" font-size="12.5" fill="#37474f">怎么脏都行：测试依赖、调试符号都留下</text>
  <text x="60" y="322" font-size="12" fill="#616161">这一层不会出现在最终镜像里</text>

  <line x1="564" y1="245" x2="632" y2="245" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="640" y="150" width="520" height="190" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="180" font-size="15" font-weight="bold" fill="#123314">阶段 2 · runtime</text>
  <text x="660" y="208" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">FROM alpine:3.19<tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">（约</tspan> 7MB<tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">）</tspan></text>
  <text x="660" y="238" font-size="12.5" fill="#37474f">内容：/bin/app + CA 证书（如需出站）</text>
  <text x="660" y="266" font-size="12.5" fill="#37474f">没有：工具链 · 源码 · 构建缓存</text>
  <text x="660" y="294" font-size="12.5" fill="#37474f">攻击面与分发成本同步下降</text>
  <text x="660" y="322" font-size="12" fill="#2e5230">最终只交付这一阶段</text>

  <text x="40" y="372" font-size="14" font-weight="bold" fill="#37474f">体积对比（同一条流水线的两种写法）</text>

  <text x="40" y="424" font-size="12" fill="#7f0000">单阶段</text>
  <rect x="200" y="408" width="860" height="22" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="1070" y="423" font-size="12" fill="#7f0000">250MB+</text>

  <text x="40" y="464" font-size="12" fill="#123314">多阶段</text>
  <rect x="200" y="448" width="42" height="22" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="252" y="463" font-size="12" fill="#123314">约 12MB（alpine 基座 7MB + 二进制）</text>

  <rect x="40" y="496" width="1120" height="86" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="524" font-size="15" font-weight="bold" fill="#bf360c">★ 编译阶段怎么脏都行，运行阶段只带产物</text>
  <text x="60" y="550" font-size="12.5" fill="#5d4037">· CI 里的测试阶段可以作为第三段插在中间（CICD 132 §8.4）</text>
  <text x="60" y="572" font-size="12.5" fill="#5d4037">· 静态二进制可再 FROM scratch：没有 sh、没有 CA 证书，需自带（112 §2.6）</text>

  <rect x="40" y="606" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="627" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="638" font-size="12" fill="#37474f">build 阶段（工具链）</text>
  <rect x="340" y="627" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="372" y="638" font-size="12" fill="#37474f">runtime 阶段（最终镜像）</text>
  <rect x="680" y="627" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="712" y="638" font-size="12" fill="#37474f">单阶段体积对照</text>

  <text x="40" y="694" font-size="12" fill="#616161">静态二进制 + scratch 可再瘦一圈；代价是没有 shell 与证书，需自行补齐。</text>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>
</svg>
