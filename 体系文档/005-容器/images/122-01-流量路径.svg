<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>外部流量六跳：每一跳断了是什么现象</title>
  <desc>用户请求六跳：浏览器发起 HTTPS、DNS 解析到 LB 公网 IP、云负载均衡四层分流、Ingress Controller 按域名路径路由并终止 TLS、Service 从 Endpoints 选就绪 Pod、Pod 内应用响应。右侧逐跳给出断开的现象与排查入口，自下而上逐跳验证是网络排障的基本方法。</desc>

  <!-- 坐标表：画布 1200x770 | 标题 52 / 副标题 84 | 列头 y=112 | 六行 y=124/194/264/334/404/474，h=62 |
       序号圆 cx=68，跳名 x=110，说明 x=110 y+50，现象 x=560 y+36 | 结论块 y=560 h=100 | 图例 y=684 h=65 -->

  <rect x="0" y="0" width="1200" height="770" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">外部流量六跳：每一跳断了是什么现象</text>
  <text x="40" y="84" font-size="12" fill="#616161">自下而上逐跳验证；先分清 DNS 错、连接错、HTTP 错</text>
  <text x="110" y="112" font-size="12" font-weight="bold" fill="#616161">经过什么</text>
  <text x="560" y="112" font-size="12" font-weight="bold" fill="#616161">断了的现象 / 查哪</text>

  <rect x="40" y="124" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="138" width="34" height="34" rx="17" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="68" y="160" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">1</text>
  <text x="110" y="150" font-size="13" font-weight="bold" fill="#0d2f5c">用户浏览器</text>
  <text x="110" y="172" font-size="11.5" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">https://app.example.com</text>
  <text x="560" y="160" font-size="12" fill="#7f0000">报错先分清：DNS 错 / 连接错 / HTTP 错</text>
  <line x1="40" y1="186" x2="1160" y2="186" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="40" y="194" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="208" width="34" height="34" rx="17" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="68" y="230" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">2</text>
  <text x="110" y="220" font-size="13" font-weight="bold" fill="#0d2f5c">DNS</text>
  <text x="110" y="242" font-size="11.5" fill="#37474f">域名 → LB 公网 IP（「网络」003）</text>
  <text x="560" y="230" font-size="12" fill="#7f0000">解析不到 → 云 DNS / TTL 未过期</text>
  <line x1="40" y1="256" x2="1160" y2="256" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="40" y="264" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="278" width="34" height="34" rx="17" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="68" y="300" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">3</text>
  <text x="110" y="290" font-size="13" font-weight="bold" fill="#0d2f5c">云负载均衡</text>
  <text x="110" y="312" font-size="11.5" fill="#37474f">公网 IP 持有者，四层分流到 ingress-nginx</text>
  <text x="560" y="300" font-size="12" fill="#7f0000">504 在 LB → LB 到 Controller 不通</text>
  <line x1="40" y1="326" x2="1160" y2="326" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="40" y="334" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="348" width="34" height="34" rx="17" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="68" y="370" font-size="12" font-weight="bold" fill="#7f3f00" text-anchor="middle">4</text>
  <text x="110" y="360" font-size="13" font-weight="bold" fill="#7f3f00">Ingress Controller</text>
  <text x="110" y="382" font-size="11.5" fill="#37474f">按 host + path 匹配规则，终止 TLS</text>
  <text x="560" y="370" font-size="12" fill="#7f0000">404 → 规则没写对 / Controller 没装</text>
  <line x1="40" y1="396" x2="1160" y2="396" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="40" y="404" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="418" width="34" height="34" rx="17" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="68" y="440" font-size="12" font-weight="bold" fill="#7f3f00" text-anchor="middle">5</text>
  <text x="110" y="430" font-size="13" font-weight="bold" fill="#7f3f00">Service</text>
  <text x="110" y="452" font-size="11.5" fill="#37474f">ClusterIP → Endpoints 选一个就绪 Pod</text>
  <text x="560" y="440" font-size="12" fill="#7f0000">503 → Endpoints 空：label / 探针（6.5）</text>
  <line x1="40" y1="466" x2="1160" y2="466" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="40" y="474" width="1120" height="62" fill="#ffffff"/>
  <rect x="51" y="488" width="34" height="34" rx="17" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="68" y="510" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">6</text>
  <text x="110" y="500" font-size="13" font-weight="bold" fill="#123314">Pod（应用）</text>
  <text x="110" y="522" font-size="11.5" fill="#37474f">容器 :8080 响应；readiness 不过不接流量</text>
  <text x="560" y="510" font-size="12" fill="#7f0000">500 → 应用日志（125 三板斧）</text>

  <rect x="40" y="560" width="1120" height="100" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="588" font-size="15" font-weight="bold" fill="#bf360c">★ 每一跳都有验证命令：nslookup 验 2 · curl IP 验 3 · get ingress 验 4 · get endpoints 验 5</text>
  <text x="60" y="614" font-size="12.5" fill="#5d4037">· ping 不通 Service 不是故障：ClusterIP 是转发规则的目的地址，没有进程监听 ICMP（6.10）</text>
  <text x="60" y="636" font-size="12.5" fill="#5d4037">· K8s 没有端口映射层：Pod IP 直接可达，稳定入口全靠 Service 的虚拟 IP</text>

  <rect x="40" y="684" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="697" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="708" font-size="12" fill="#37474f">外部链路</text>
  <rect x="270" y="697" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="302" y="708" font-size="12" fill="#37474f">K8s 入口与转发</text>
  <rect x="550" y="697" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="582" y="708" font-size="12" fill="#37474f">应用</text>
</svg>
