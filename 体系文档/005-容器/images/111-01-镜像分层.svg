<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>镜像分层与 overlay2：读穿透，写拷贝</title>
  <desc>左侧容器视角：最上层是容器独有的可写层，下面三层只读镜像层依次是应用代码、依赖、基础镜像。右侧宿主视角：merged 是容器看到的统一视图，diff 是可写层实体，lower 是多个容器共享的只读层。读从上往下穿透；首次写把整个文件拷到 diff 再改；删下层文件只放 whiteout 遮罩，不释放镜像层空间。</desc>

  <!-- 坐标表：画布 1200x700 | 标题 52 / 副标题 84 | 分组标题 y=116，x=40 / 620 |
       左卡 x=40 w=520 h=64：y=130/204/278/352 | 右卡 x=620 w=540 h=64：y=130/204/278 |
       结论块 y=440 h=110 | 图例 y=574 h=65 | 尾注 y=662 -->

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">镜像分层与 overlay2：读穿透，写拷贝</text>
  <text x="40" y="84" font-size="12" fill="#616161">可写层随容器删，只读层被多个容器共享——拉取快、磁盘省，根源都在分层</text>

  <text x="40" y="116" font-size="14" font-weight="bold" fill="#37474f">容器视角：只读层 + 可写层</text>
  <text x="620" y="116" font-size="14" font-weight="bold" fill="#37474f">宿主视角：overlay2 目录</text>

  <rect x="40" y="130" width="520" height="64" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="58" y="154" font-size="13" font-weight="bold" fill="#7f3f00">可写层（容器独有）★</text>
  <text x="58" y="178" font-size="11.5" fill="#7f3f00">读从上层开始；首次写把整个文件拷到这里，rm 容器即消失</text>

  <rect x="40" y="204" width="520" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="228" font-size="13" font-weight="bold" fill="#0d2f5c">只读层 ③ 应用代码</text>
  <text x="58" y="252" font-size="11.5" fill="#37474f">COPY 产物；本层找不到继续往下穿透</text>

  <rect x="40" y="278" width="520" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="302" font-size="13" font-weight="bold" fill="#0d2f5c">只读层 ② 依赖</text>
  <text x="58" y="326" font-size="11.5" fill="#37474f">go mod download / apk add 的安装结果</text>

  <rect x="40" y="352" width="520" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="376" font-size="13" font-weight="bold" fill="#0d2f5c">只读层 ① 基础镜像</text>
  <text x="58" y="400" font-size="11.5" fill="#37474f">alpine 等基座——多容器共享同一份</text>

  <rect x="620" y="130" width="540" height="64" rx="6" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="638" y="154" font-size="13" font-weight="bold" fill="#37474f">merged/ —— 统一视图</text>
  <text x="638" y="178" font-size="11.5" fill="#37474f">容器内 / 看到的根目录，不占双份空间</text>

  <rect x="620" y="204" width="540" height="64" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="638" y="228" font-size="13" font-weight="bold" fill="#7f3f00">diff/ —— 可写层实体 ★</text>
  <text x="638" y="252" font-size="11.5" fill="#7f3f00">取证：du -sh 看容器偷偷写了多少</text>

  <rect x="620" y="278" width="540" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="638" y="302" font-size="13" font-weight="bold" fill="#0d2f5c">lower/ —— 镜像只读层</text>
  <text x="638" y="326" font-size="11.5" fill="#37474f">容器 B 挂同一份 → 磁盘上只存一份</text>

  <rect x="40" y="440" width="1120" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="468" font-size="15" font-weight="bold" fill="#bf360c">★ 写时复制（COW）：首写把整个文件从下层拷到 diff 再改</text>
  <text x="60" y="494" font-size="12.5" fill="#5d4037">· 读从上往下穿透；首次写才 copy-up，改过的文件此后都在可写层</text>
  <text x="60" y="516" font-size="12.5" fill="#5d4037">· 删下层文件 = 在 diff 放遮罩（whiteout），下层原文件还在——删文件不释放镜像层空间</text>
  <text x="60" y="538" font-size="12.5" fill="#5d4037">· 数据库等持续大写负载必须用卷（113），可写层只放日志尾巴与临时文件</text>

  <rect x="40" y="574" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="595" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="606" font-size="12" fill="#37474f">只读镜像层</text>
  <rect x="280" y="595" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="606" font-size="12" fill="#37474f">可写层 ★</text>
  <rect x="500" y="595" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="532" y="606" font-size="12" fill="#37474f">统一视图</text>

  <text x="40" y="662" font-size="12" fill="#616161">init 层是 overlay2 里最容易漏看的第四个成员；取证路径见 111 §1.3。</text>
</svg>
