<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>滚动更新时间线：replicas=3、maxSurge=1、maxUnavailable=0 的四帧</title>
  <desc>四帧展示滚动更新：t0 三个旧 Pod；t1 起一个新 Pod，靠 maxSurge 临时到四个；t2 新 Pod 过 readiness 进入 Endpoints 接流量后旧 Pod 才退；t3 三个全是新 Pod，旧 ReplicaSet 保留可回滚。readiness 是放行闸门。</desc>

  <!-- 坐标表：画布 1200x560 | 标题 52 / 副标题 84 | 四帧 x=40/325/610/895 w=265 h=200 y=120 |
       Pod 槽 44×44，x=56/108/160/212，y=170 | 帧间箭头 x=307→317 / 592→602 / 877→887，y=220 |
       结论块 y=344 h=110 | 图例 y=478 h=65 -->

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>

  <text x="40" y="52" font-size="20" font-weight="bold" fill="#0f172a">滚动更新四帧：先起新的，就绪了才退旧的</text>
  <text x="40" y="84" font-size="12" fill="#616161">replicas=3 · maxSurge=1（允许多 1 个）· maxUnavailable=0（全程 ≥3 可用）；默认都是 25%</text>

  <rect x="40" y="120" width="265" height="200" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="56" y="146" font-size="13" font-weight="bold" fill="#37474f">t0 · 起始</text>
  <rect x="56" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="108" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="160" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="56" y="240" font-size="11.5" fill="#37474f">旧 旧 旧 · 3/3</text>
  <text x="56" y="262" font-size="11.5" fill="#616161">set image 触发</text>

  <line x1="307" y1="220" x2="317" y2="220" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="325" y="120" width="265" height="200" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="341" y="146" font-size="13" font-weight="bold" fill="#37474f">t1 · 新 Pod 起来</text>
  <rect x="341" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="393" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="445" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="497" y="170" width="44" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="341" y="240" font-size="11.5" fill="#37474f">3 旧 + 1 新（临时 4 个）</text>
  <text x="341" y="262" font-size="11.5" fill="#616161">maxSurge=1 的体现</text>

  <line x1="592" y1="220" x2="602" y2="220" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="120" width="265" height="200" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="626" y="146" font-size="13" font-weight="bold" fill="#37474f">t2 · 新就绪，旧才退</text>
  <rect x="626" y="170" width="44" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="678" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="730" y="170" width="44" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="626" y="240" font-size="11.5" fill="#37474f">新 1 过 readiness → Endpoints</text>
  <text x="626" y="262" font-size="11.5" fill="#37474f">旧 1 退出，回到 3 个</text>
  <text x="626" y="286" font-size="11" fill="#c62828">没配 readiness = 名存实亡</text>

  <line x1="877" y1="220" x2="887" y2="220" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="895" y="120" width="265" height="200" rx="6" fill="#fafafa" stroke="#2e7d32" stroke-width="2"/>
  <text x="911" y="146" font-size="13" font-weight="bold" fill="#1b5e20">t3 · 完成 ★</text>
  <rect x="911" y="170" width="44" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="963" y="170" width="44" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="1015" y="170" width="44" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="911" y="240" font-size="11.5" fill="#123314">3/3 新版 · 旧 RS 归零</text>
  <text x="911" y="262" font-size="11.5" fill="#123314">旧 RS 保留，可回滚</text>

  <rect x="40" y="344" width="1120" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="372" font-size="15" font-weight="bold" fill="#bf360c">★ readiness 是放行闸门：新 Pod 就绪进了 Endpoints，旧 Pod 才退</text>
  <text x="60" y="398" font-size="12.5" fill="#5d4037">· 卡拉取 = ImagePullBackOff（tag 错）；卡就绪 = readiness 不过（探针/依赖）——describe 新 Pod 分辨</text>
  <text x="60" y="420" font-size="12.5" fill="#5d4037">· rollout status 看进度（CI 里当等待门），rollout undo 回到旧 RS</text>
  <text x="60" y="442" font-size="12.5" fill="#5d4037">· 前提：旧镜像还在仓库、数据库兼容旧代码；maxUnavailable=0 全程容量不缩</text>

  <rect x="40" y="478" width="1120" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="499" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="510" font-size="12" fill="#37474f">旧版 Pod</text>
  <rect x="280" y="499" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="312" y="510" font-size="12" fill="#37474f">新版 Pod ★</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>
</svg>
