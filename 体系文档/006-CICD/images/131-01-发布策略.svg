<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>三种发布策略对比：滚动、蓝绿、灰度</title>
  <desc>三列对比：滚动发布逐台替换新旧共存，资源最省回滚靠反向滚动；蓝绿两套环境整切流量，回滚是秒级切回但资源翻倍；灰度按比例先放小流量观察指标再逐级放量，回滚是权重归零。三者的共同前提是新版本能与旧版本共存。</desc>

  <rect x="0" y="0" width="1200" height="690" fill="#ffffff"/>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">三种发布策略：代价、回滚、前提</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：006-CICD 131 §7.2-§7.5 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">共同前提：新旧共存</text>

  <!-- 列 1：滚动 -->
  <rect x="40" y="110" width="360" height="330" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="220" y="144" font-size="17" font-weight="bold" fill="#0d47a1" text-anchor="middle">滚动</text>
  <rect x="76" y="166" width="44" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="130" y="166" width="44" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="184" y="166" width="44" height="34" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="238" y="166" width="44" height="34" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="292" y="166" width="44" height="34" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="220" y="222" font-size="11.5" fill="#616161" text-anchor="middle">绿＝新版　蓝＝旧版 · 逐台替换</text>
  <text x="60" y="256" font-size="12.5" fill="#37474f">资源代价：最低（+ 一批）</text>
  <text x="60" y="288" font-size="12.5" fill="#37474f">回滚：反向滚动（中速）</text>
  <text x="60" y="320" font-size="12.5" fill="#37474f">适合：常规迭代 · 默认选它</text>
  <text x="60" y="360" font-size="11.5" fill="#123314">K8s：maxSurge / maxUnavailable</text>
  <text x="60" y="388" font-size="11.5" fill="#123314">虚机：Ansible serial 分批</text>
  <text x="60" y="422" font-size="11" fill="#616161">共存期要求应用兼容两版</text>

  <!-- 列 2：蓝绿 -->
  <rect x="420" y="110" width="360" height="330" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="600" y="144" font-size="17" font-weight="bold" fill="#0d47a1" text-anchor="middle">蓝绿</text>
  <rect x="456" y="166" width="288" height="34" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="188" font-size="11.5" font-weight="bold" fill="#0d2f5c" text-anchor="middle">蓝 · 旧版 ← 100% 流量</text>
  <rect x="456" y="208" width="288" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="230" font-size="11.5" font-weight="bold" fill="#123314" text-anchor="middle">绿 · 新版 ← 0%（待验证）</text>
  <text x="440" y="264" font-size="12.5" fill="#37474f">资源代价：×2 双环境</text>
  <text x="440" y="296" font-size="12.5" fill="#123314">回滚：切回蓝（秒级）</text>
  <text x="440" y="328" font-size="12.5" fill="#37474f">适合：大版本 · 快回滚诉求</text>
  <text x="440" y="366" font-size="11.5" fill="#616161">隐患：切走期间蓝环境要保持</text>
  <text x="440" y="392" font-size="11.5" fill="#616161">可用（会话 / 定时任务）</text>
  <text x="440" y="422" font-size="11" fill="#616161">演练切回，别只演切过去</text>

  <!-- 列 3：灰度 -->
  <rect x="800" y="110" width="360" height="330" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="980" y="144" font-size="17" font-weight="bold" fill="#0d47a1" text-anchor="middle">灰度 / 金丝雀</text>
  <rect x="836" y="166" width="34" height="34" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="878" y="166" width="246" height="34" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="980" y="188" font-size="11.5" font-weight="bold" fill="#7f3f00" text-anchor="middle">5% 新版 ← 观察指标</text>
  <text x="980" y="222" font-size="11" font-weight="bold" fill="#37474f" text-anchor="middle">5% → 25% → 50% → 100%</text>
  <text x="820" y="264" font-size="12.5" fill="#37474f">资源代价：低（多一实例起）</text>
  <text x="820" y="296" font-size="12.5" fill="#123314">回滚：weight 归零（快）</text>
  <text x="820" y="328" font-size="12.5" fill="#37474f">适合：核心业务 · 高风险变更</text>
  <text x="820" y="366" font-size="11.5" fill="#616161">前提：指标按版本分桶（131 §7.4）</text>
  <text x="820" y="392" font-size="11.5" fill="#616161">执行器：接入层权重路由</text>
  <text x="820" y="422" font-size="11" fill="#616161">灰度终点就是滚动</text>

  <!-- 选择经验 -->
  <rect x="40" y="458" width="1120" height="88" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="488" font-size="15" font-weight="bold" fill="#bf360c">★ 选择经验：默认滚动，核心业务与大版本上灰度，需要秒级回滚用蓝绿</text>
  <text x="60" y="516" font-size="12.5" fill="#5d4037">三者不互斥，灰度放量到 100% 就是滚动；发布检查单十项全绿才动，回滚预案必须演练过（131 §7.5 / §7.9）</text>
  <text x="60" y="538" font-size="12.5" fill="#5d4037">数据库变更不参与任何策略的「一键回退」——expand-contract 三步法是它的独立轨道（131 §7.6）</text>

  <!-- 结论块 -->
  <rect x="40" y="562" width="1120" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="594" font-size="13" fill="#7f0000">红线：新旧共存是三种策略的共同前提——数据库删列必须隔版本，应用不兼容两版就先修应用再发布</text>

  <!-- 图例 -->
  <rect x="40" y="632" width="1120" height="48" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="647" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="92" y="658" font-size="12" fill="#37474f">新版</text>
  <rect x="250" y="647" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="282" y="658" font-size="12" fill="#37474f">旧版</text>
  <rect x="450" y="647" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="482" y="658" font-size="12" fill="#37474f">选择结论 ★</text>
  <rect x="700" y="647" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="732" y="658" font-size="12" fill="#37474f">红线</text>
  <rect x="900" y="647" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="932" y="658" font-size="12" fill="#37474f">策略卡</text>
</svg>
