<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Git 三区模型：工作区、暂存区、本地仓库、远端之间的搬运</title>
  <desc>四个区从左到右：工作区是正在编辑的文件，git add 把改动搬进暂存区决定这次提交什么，git commit 把暂存区定格为快照进本地仓库，git push 同步到远端。反向：restore 丢弃工作区改动，reset 退回提交，pull 拉取远端更新。git status 是三区之间的透视镜。</desc>

  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#0d47a1">Git 三区模型：每条命令都在搬运文件</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：006-CICD 111 §1.1 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">蓝实线＝正向搬运　灰实线＝反向回退</text>

  <!-- 四个区 -->
  <rect x="40" y="110" width="235" height="96" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="157" y="142" font-size="15" font-weight="bold" fill="#0d2f5c" text-anchor="middle">工作区</text>
  <text x="157" y="168" font-size="11.5" fill="#0d2f5c" text-anchor="middle">正在编辑的文件</text>
  <text x="157" y="190" font-size="11" fill="#0d2f5c" text-anchor="middle">未跟踪 / 已改未暂存</text>

  <rect x="335" y="110" width="235" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="452" y="142" font-size="15" font-weight="bold" fill="#5d4700" text-anchor="middle">暂存区</text>
  <text x="452" y="168" font-size="11.5" fill="#5d4700" text-anchor="middle">这次提交什么</text>
  <text x="452" y="190" font-size="11" fill="#5d4700" text-anchor="middle">按逻辑分批 add</text>

  <rect x="630" y="110" width="235" height="96" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="747" y="142" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">本地仓库</text>
  <text x="747" y="168" font-size="11.5" fill="#123314" text-anchor="middle">提交历史（快照链）</text>
  <text x="747" y="190" font-size="11" fill="#123314" text-anchor="middle">分支是指针 · 零成本</text>

  <rect x="925" y="110" width="235" height="96" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1042" y="142" font-size="15" font-weight="bold" fill="#311b92" text-anchor="middle">远端仓库</text>
  <text x="1042" y="168" font-size="11.5" fill="#311b92" text-anchor="middle">GitLab / GitHub</text>
  <text x="1042" y="190" font-size="11" fill="#311b92" text-anchor="middle">保护分支 · PR/MR 评审</text>

  <!-- 正向箭头 -->
  <line x1="279" y1="158" x2="328" y2="158" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="305" y="148" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">add</text>
  <line x1="574" y1="158" x2="623" y2="158" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="600" y="148" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">commit</text>
  <line x1="869" y1="158" x2="918" y2="158" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="895" y="148" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">push</text>

  <!-- 反向箭头 -->
  <line x1="329" y1="232" x2="281" y2="232" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="254" font-size="12" fill="#616161" text-anchor="middle">restore</text>
  <line x1="624" y1="232" x2="576" y2="232" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="254" font-size="12" fill="#616161" text-anchor="middle">reset</text>
  <line x1="919" y1="232" x2="871" y2="232" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="254" font-size="12" fill="#616161" text-anchor="middle">pull / fetch</text>

  <!-- 结论块 -->
  <rect x="40" y="284" width="1120" height="130" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="314" font-size="15" font-weight="bold" fill="#bf360c">★ status 是三区透视镜：未跟踪 / 已改未暂存 / 已暂存未提交 / 已提交未推送，四种状态一眼分清</text>
  <text x="60" y="342" font-size="12.5" fill="#5d4037">· 暂存区的价值：按逻辑分批 add，让每个提交原子化——回退时切得开，别用 commit -a 一把梭（111 §1.11）</text>
  <text x="60" y="368" font-size="12.5" fill="#5d4037">· commit 记录快照而非差异；分支是指针（41 字节），建分支零成本——合并与 rebase 都在快照链上发生（111 §1.3 / §1.5）</text>
  <text x="60" y="394" font-size="12.5" fill="#5d4037">· detached HEAD 状态下改代码切走即丢——先 switch -c 建分支再动手（111 §1.7）</text>

  <!-- 图例 -->
  <rect x="40" y="430" width="1120" height="60" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="450" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="461" font-size="12" fill="#37474f">工作区（输入）</text>
  <rect x="310" y="450" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="342" y="461" font-size="12" fill="#37474f">暂存区（提交边界）</text>
  <rect x="580" y="450" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="612" y="461" font-size="12" fill="#37474f">本地仓库（快照链）</text>
  <rect x="870" y="450" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="902" y="461" font-size="12" fill="#37474f">远端仓库（协作）</text>
</svg>
