<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Jenkins 架构：controller 只调度，构建下放 agent，标签匹配能力</title>
  <desc>GitLab 的 push 通过 webhook 秒级触发 controller；controller 只负责调度、记录与展示，把构建任务按标签派发给对应的 agent——java17 的任务到装了 JDK 17 的机器，docker 标签的到容器构建机。在 controller 上直接构建有三大后遗症：磁盘 CPU 互拖、凭据污染、无法扩容。</desc>

  <rect x="0" y="0" width="1200" height="690" fill="#ffffff"/>

  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#0d47a1">Jenkins 架构：controller 调度，agent 干活</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：006-CICD 112 §2.1 / §2.3 / §2.6 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">能力匹配靠 label</text>

  <!-- GitLab 外部 -->
  <rect x="40" y="130" width="200" height="90" rx="27" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="140" y="166" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle">GitLab</text>
  <text x="140" y="192" font-size="11.5" fill="#37474f" text-anchor="middle">push / MR 事件</text>

  <!-- webhook -->
  <line x1="244" y1="175" x2="306" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="275" y="165" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle">webhook</text>

  <!-- controller -->
  <rect x="310" y="112" width="580" height="126" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2.5"/>
  <text x="600" y="146" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">controller（2C4G 足够）</text>
  <text x="600" y="174" font-size="12" fill="#7f3f00" text-anchor="middle">调度 · 构建记录 · Web UI · 凭据保管 · Jenkinsfile 读取</text>
  <text x="600" y="200" font-size="12" fill="#7f0000" text-anchor="middle">禁止：在 controller 上跑构建——三大后遗症：互拖 / 污染 / 无法扩容</text>
  <text x="600" y="224" font-size="11.5" fill="#5d4700" text-anchor="middle">备份只需 /var/jenkins_home，进 Git 的 Jenkinsfile 不占备份</text>

  <!-- 派发线 -->
  <line x1="600" y1="238" x2="600" y2="268" stroke="#1565c0" stroke-width="2"/>
  <line x1="180" y1="268" x2="1020" y2="268" stroke="#1565c0" stroke-width="2"/>
  <line x1="180" y1="268" x2="180" y2="306" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="268" x2="600" y2="306" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="1020" y1="268" x2="1020" y2="306" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="810" y="260" font-size="12" fill="#0d47a1">按 label 派发</text>

  <!-- agents -->
  <rect x="40" y="312" width="280" height="132" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="344" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">agent-1</text>
  <text x="180" y="370" font-size="11.5" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">labels: linux, java17</text>
  <text x="180" y="394" font-size="11.5" fill="#123314" text-anchor="middle">装了 JDK 17 的构建机</text>
  <text x="180" y="418" font-size="11" fill="#2e5230" text-anchor="middle">workspace 独立</text>

  <rect x="460" y="312" width="280" height="132" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="344" font-size="15" font-weight="bold" fill="#123314" text-anchor="middle">agent-2</text>
  <text x="600" y="370" font-size="11.5" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">labels: linux, node18</text>
  <text x="600" y="394" font-size="11.5" fill="#123314" text-anchor="middle">前端项目构建机</text>
  <text x="600" y="418" font-size="11" fill="#2e5230" text-anchor="middle">并发数 = 磁盘与 CPU 阀门</text>

  <rect x="880" y="312" width="280" height="132" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="1020" y="344" font-size="15" font-weight="bold" fill="#7f3f00" text-anchor="middle">★ agent-3</text>
  <text x="1020" y="370" font-size="11.5" fill="#7f3f00" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">labels: docker</text>
  <text x="1020" y="394" font-size="11.5" fill="#7f3f00" text-anchor="middle">容器内构建：环境即代码</text>
  <text x="1020" y="418" font-size="11" fill="#5d4700" text-anchor="middle">推荐的生产形态</text>

  <!-- 警示条 -->
  <rect x="40" y="462" width="1120" height="76" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="490" font-size="15" font-weight="bold" fill="#7f0000">反例：controller 上直接构建的后遗症</text>
  <text x="60" y="516" font-size="12.5" fill="#7f0000">· 磁盘与 CPU 互拖，Web UI 卡死　· 构建代码污染凭据环境　· 构建量涨了无法横向扩容</text>

  <!-- 结论块 -->
  <rect x="40" y="556" width="1120" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="584" font-size="15" font-weight="bold" fill="#bf360c">★ 能力进标签，别写死节点名——换机器流水线零改动（112 §2.3）</text>
  <text x="60" y="610" font-size="12.5" fill="#5d4037">· 声明式 Jenkinsfile 进 Git，controller 只保管凭据与记录；构建下放 agent 才能扩容（112 §2.5 / §2.7）</text>

  <!-- 图例 -->
  <rect x="40" y="644" width="1120" height="40" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="655" width="22" height="14" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="1"/>
  <text x="92" y="666" font-size="12" fill="#37474f">外部事件</text>
  <rect x="270" y="655" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="302" y="666" font-size="12" fill="#37474f">枢纽 / 推荐形态 ★</text>
  <rect x="560" y="655" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="592" y="666" font-size="12" fill="#37474f">构建 agent</text>
  <rect x="820" y="655" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="852" y="666" font-size="12" fill="#37474f">反面：不这么做</text>
</svg>
