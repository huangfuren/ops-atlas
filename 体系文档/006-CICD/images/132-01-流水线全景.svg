<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>流水线全景：六个阶段，每段有门禁、有产物、可重跑</title>
  <desc>Checkout 生成贯穿全链路的版本号；构建与测试在容器内进行，测试红了立即停线；镜像推 Harbor 接扫描门禁；部署测试环境用 rollout status 等待完成并冒烟验证；人工审批后发布生产；最后成败都发通知并写部署记录。失败从红段重跑的前提是版本号不变且各段幂等。</desc>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#0d47a1">流水线全景：六段，段段有门禁</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：006-CICD 132 §8.2-§8.9 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">失败从红段重跑</text>

  <!-- 列头 -->
  <text x="60" y="112" font-size="12" fill="#616161">阶段</text>
  <text x="830" y="112" font-size="12" fill="#616161">门禁</text>

  <!-- ① Checkout -->
  <rect x="40" y="122" width="760" height="64" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="60" y="150" font-size="15" font-weight="bold" fill="#37474f">① Checkout</text>
  <text x="60" y="174" font-size="11.5" fill="#37474f">checkout scm + 版本号一次生成：tag-commit（132 §8.3）</text>
  <text x="830" y="160" font-size="12" fill="#616161">无门禁</text>
  <line x1="420" y1="188" x2="420" y2="204" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ② Build & Test -->
  <rect x="40" y="210" width="760" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="238" font-size="15" font-weight="bold" fill="#0d2f5c">② Build &amp; Test（容器内构建）</text>
  <text x="60" y="262" font-size="11.5" fill="#0d2f5c">go build / go test —— 单元级门禁（132 §8.4）</text>
  <text x="830" y="248" font-size="12" font-weight="bold" fill="#c62828">红 = 停线，开发修代码</text>
  <line x1="420" y1="276" x2="420" y2="292" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ③ Image -->
  <rect x="40" y="298" width="760" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="326" font-size="15" font-weight="bold" fill="#0d2f5c">③ Image（推 Harbor）</text>
  <text x="60" y="350" font-size="11.5" fill="#0d2f5c">docker build + push，机器人账号，不可变 tag（132 §8.5）</text>
  <text x="830" y="336" font-size="12" font-weight="bold" fill="#c62828">扫描 HIGH 拦截（123 §6.8）</text>
  <line x1="420" y1="364" x2="420" y2="380" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ④ Deploy Test -->
  <rect x="40" y="386" width="760" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="414" font-size="15" font-weight="bold" fill="#0d2f5c">④ Deploy Test</text>
  <text x="60" y="438" font-size="11.5" fill="#0d2f5c">kubectl set image + rollout status --timeout + 冒烟（132 §8.6）</text>
  <text x="830" y="424" font-size="12" font-weight="bold" fill="#c62828">rollout 未完成即红</text>
  <line x1="420" y1="452" x2="420" y2="468" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ⑤ Deploy Prod -->
  <rect x="40" y="474" width="760" height="64" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="60" y="502" font-size="15" font-weight="bold" fill="#7f3f00">⑤ 人工审批 input + Deploy Prod</text>
  <text x="60" y="526" font-size="11.5" fill="#7f3f00">滚动起步，成熟后接灰度放量（131 §7.4）</text>
  <text x="830" y="512" font-size="12" font-weight="bold" fill="#7f3f00">审批人 ≠ 发布人</text>
  <line x1="420" y1="540" x2="420" y2="556" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ⑥ Notify -->
  <rect x="40" y="562" width="760" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="590" font-size="15" font-weight="bold" fill="#123314">⑥ Notify + 部署记录</text>
  <text x="60" y="614" font-size="11.5" fill="#123314">成败都发 IM + release 记录：谁 · 何时 · 哪个版本 · 谁审批（132 §8.8）</text>
  <text x="830" y="600" font-size="12" fill="#123314">静默成功最危险</text>

  <!-- 结论块 -->
  <rect x="40" y="646" width="1120" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="674" font-size="12.5" fill="#5d4037">★ 重跑两前提：版本号在 ① 一次生成不变（132 §8.3）；各段幂等——set image 天然幂等，Harbor 同 tag 重推被不可变规则拒绝</text>

  <!-- 图例 -->
  <rect x="40" y="700" width="1120" height="48" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="715" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="92" y="726" font-size="12" fill="#37474f">无门禁</text>
  <rect x="250" y="715" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="282" y="726" font-size="12" fill="#37474f">自动段</text>
  <rect x="450" y="715" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="482" y="726" font-size="12" fill="#37474f">人工审批 ★</text>
  <rect x="700" y="715" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="732" y="726" font-size="12" fill="#37474f">收尾</text>
</svg>
