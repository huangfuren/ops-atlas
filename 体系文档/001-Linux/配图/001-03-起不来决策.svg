<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 762.35" width="1200" height="762.35" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 等比放大：整体 scale(1.764706)，内部坐标未改动 -->
  <g transform="scale(1.7647058824)">
  <title>开机失败时按屏幕现象定位卡在哪一级</title>
  <desc>四行对应启动链的四个阶段。第一列是能看到的屏幕现象，第二列是据此判断卡在哪一级，第三列是这一级该怎么救。判断依据只有屏幕，所以救之前要先看清最后一屏。处置动作从轻到重：改 BIOS、重装引导、修根分区与 fstab、进 rescue 或 emergency，最后才是 rd.break 改密码。</desc>

  <rect width="680" height="432" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">起不来怎么办：先定位卡在哪一级，再决定救哪一级</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">从轻到重，别乱试</text>

  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9A69C"/>
    </marker>
  </defs>

  <text x="40" y="58" font-size="8.6" fill="#8C8980">屏幕最后停在</text>
  <text x="268" y="58" font-size="8.6" fill="#8C8980">卡在哪一级</text>
  <text x="394" y="58" font-size="8.6" fill="#8C8980">这一级怎么救</text>

  <!-- ================= 行 1：固件 ================= -->
  <rect x="40" y="70" width="206" height="72" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="88" font-size="8.4" fill="#4A4945">屏幕无输出</text>
  <text x="52" y="102" font-size="8.4" fill="#4A4945">卡在厂商 logo 不动</text>
  <text x="52" y="116" font-size="8.4" fill="#4A4945">no bootable device</text>
  <line x1="248" y1="106" x2="264" y2="106" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="268" y="70" width="104" height="72" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="320" y="100" font-size="9.5" font-weight="600" fill="#1D5A45" text-anchor="middle">① 固件</text>
  <text x="320" y="118" font-size="8" fill="#1D5A45" text-anchor="middle">UEFI / BIOS</text>
  <line x1="374" y1="106" x2="390" y2="106" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="394" y="70" width="246" height="72" rx="3" fill="#FAF9F5" stroke="#CFCCC2" stroke-width="1"/>
  <text x="406" y="86" font-size="8.4" fill="#2B2A27">进 BIOS 看启动顺序与硬盘识别</text>
  <text x="406" y="100" font-size="8.4" fill="#2B2A27">盘不被识别：先查线缆、背板</text>
  <text x="406" y="114" font-size="8.4" fill="#2B2A27">再查 RAID 卡电池与阵列状态</text>

  <!-- ================= 行 2：引导器 ================= -->
  <rect x="40" y="150" width="206" height="72" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="168" font-size="8.4" fill="#4A4945">grub&gt; 或 grub rescue&gt;</text>
  <text x="52" y="182" font-size="8.4" fill="#4A4945">error: unknown filesystem</text>
  <text x="52" y="196" font-size="8.4" fill="#4A4945">连启动菜单都不出</text>
  <line x1="248" y1="186" x2="264" y2="186" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="268" y="150" width="104" height="72" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="320" y="180" font-size="9.5" font-weight="600" fill="#7A4A12" text-anchor="middle">② 引导器</text>
  <text x="320" y="198" font-size="8" fill="#7A4A12" text-anchor="middle">GRUB2</text>
  <line x1="374" y1="186" x2="390" y2="186" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="394" y="150" width="246" height="72" rx="3" fill="#FAF9F5" stroke="#CFCCC2" stroke-width="1"/>
  <text x="406" y="166" font-size="8.4" fill="#2B2A27">先在 grub&gt; 里 ls 找分区，确认盘还在</text>
  <text x="406" y="180" font-size="8.4" fill="#2B2A27">救援盘启动，chroot 后重装引导</text>
  <text x="406" y="194" font-size="8.4" fill="#2B2A27">动手前先备份 /boot</text>

  <!-- ================= 行 3：内核 ================= -->
  <rect x="40" y="230" width="206" height="72" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="248" font-size="8.4" fill="#4A4945">滚屏后停住不动</text>
  <text x="52" y="262" font-size="8.4" fill="#4A4945">停在 dracut:/#</text>
  <text x="52" y="276" font-size="8.4" fill="#4A4945">内核报错后 panic</text>
  <line x1="248" y1="266" x2="264" y2="266" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="268" y="230" width="104" height="72" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="320" y="260" font-size="9.5" font-weight="600" fill="#1F4468" text-anchor="middle">③ 内核</text>
  <text x="320" y="278" font-size="8" fill="#1F4468" text-anchor="middle">initramfs</text>
  <line x1="374" y1="266" x2="390" y2="266" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="394" y="230" width="246" height="72" rx="3" fill="#FAF9F5" stroke="#CFCCC2" stroke-width="1"/>
  <text x="406" y="246" font-size="8.4" fill="#2B2A27">查根分区、LVM 是否可见</text>
  <text x="406" y="260" font-size="8.4" fill="#2B2A27">查 /etc/fstab 有没有写错的行</text>
  <text x="406" y="274" font-size="8.4" fill="#2B2A27">必要时 dracut -f 重建内存盘</text>

  <!-- ================= 行 4：用户态 ================= -->
  <rect x="40" y="310" width="206" height="72" rx="3" fill="#FFFFFF" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="328" font-size="8.4" fill="#4A4945">Welcome to emergency mode</text>
  <text x="52" y="342" font-size="8.4" fill="#4A4945">卡在 A start job is running</text>
  <text x="52" y="356" font-size="8.4" fill="#4A4945">（等它超时，记下是哪个 unit）</text>
  <line x1="248" y1="346" x2="264" y2="346" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="268" y="310" width="104" height="72" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="320" y="340" font-size="9.5" font-weight="600" fill="#46337A" text-anchor="middle">④ 用户态</text>
  <text x="320" y="358" font-size="8" fill="#46337A" text-anchor="middle">systemd</text>
  <line x1="374" y1="346" x2="390" y2="346" stroke="#A9A69C" stroke-width="1.2" marker-end="url(#arrGray)"/>
  <rect x="394" y="310" width="246" height="72" rx="3" fill="#FAF9F5" stroke="#CFCCC2" stroke-width="1"/>
  <text x="406" y="326" font-size="8.4" fill="#2B2A27">rescue.target：挂全盘的单用户</text>
  <text x="406" y="340" font-size="8.4" fill="#2B2A27">emergency.target：只挂根、只读</text>
  <text x="406" y="354" font-size="8.4" fill="#2B2A27">改 root 密码用 rd.break</text>

  <text x="32" y="404" font-size="9" fill="#8C8980">三招从轻到重：rescue → emergency → rd.break。每一招都要先确认现象对得上，别乱试。</text>
  <text x="32" y="420" font-size="9" fill="#8C8980">判断依据只有屏幕 —— 所以动手前先把最后一屏拍下来，它决定了后面所有动作。</text>

  </g>
</svg>
