<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790.59" width="1200" height="790.59" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 等比放大：整体 scale(1.764706)，内部坐标未改动 -->
  <g transform="scale(1.7647058824)">
  <title>Linux 运维手册的六层十册体系</title>
  <desc>十册按六层排列：机器层（01 系统与启动、02 进程与资源）、权限层（03）、存储层（04）、网络与服务层（05、06）、操作层（07、08）、运营层（09、10）。每册只回答一个问题。卡片颜色按册的性质区分：蓝色是系统与内核，琥珀是权限边界，紫色是数据，绿色是连接，红色是故障与风险，灰色是通用手段。层越靠上越贴近机器本体，越靠下越贴近日常处置。底部列出参考层三册与配色图例。</desc>

  <rect width="680" height="448" fill="#FFFFFF"/>
  <text x="32" y="32" font-size="13.5" font-weight="600" fill="#2B2A27">六层十册：一册只回答一个问题</text>
  <text x="648" y="32" font-size="9" fill="#8C8980" text-anchor="end">按任务顺序自上而下</text>

  <!-- ========== 层1 机器 ========== -->
  <rect x="24" y="54" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="81" font-size="11" font-weight="600" fill="#4A4945">机器</text>

  <rect x="116" y="60" width="246" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="127" y="75" font-size="10.5" font-weight="700" fill="#1F4468">01</text>
  <text x="150" y="75" font-size="10.5" font-weight="500" fill="#1F4468">系统与启动</text>
  <text x="127" y="88" font-size="8.6" fill="#1F4468">机器由什么组成，开机按什么顺序</text>

  <rect x="378" y="60" width="246" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="389" y="75" font-size="10.5" font-weight="700" fill="#1F4468">02</text>
  <text x="412" y="75" font-size="10.5" font-weight="500" fill="#1F4468">进程与资源</text>
  <text x="389" y="88" font-size="8.6" fill="#1F4468">谁在跑、占了多少、卡在哪</text>

  <!-- ========== 层2 权限 ========== -->
  <rect x="24" y="108" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="135" font-size="11" font-weight="600" fill="#4A4945">权限</text>

  <rect x="116" y="114" width="508" height="34" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="127" y="129" font-size="10.5" font-weight="700" fill="#7A4A12">03</text>
  <text x="150" y="129" font-size="10.5" font-weight="500" fill="#7A4A12">用户、权限与安全</text>
  <text x="127" y="142" font-size="8.6" fill="#7A4A12">谁允许登、登进来能对什么做什么、事后能查到谁</text>

  <!-- ========== 层3 存储 ========== -->
  <rect x="24" y="162" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="189" font-size="11" font-weight="600" fill="#4A4945">存储</text>

  <rect x="116" y="168" width="508" height="34" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="127" y="183" font-size="10.5" font-weight="700" fill="#46337A">04</text>
  <text x="150" y="183" font-size="10.5" font-weight="500" fill="#46337A">存储与文件系统</text>
  <text x="127" y="196" font-size="8.6" fill="#46337A">盘怎么分区挂载，空间为什么对不上</text>

  <!-- ========== 层4 网络与服务 ========== -->
  <rect x="24" y="216" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="243" font-size="11" font-weight="600" fill="#4A4945">网络与服务</text>

  <rect x="116" y="222" width="246" height="34" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="127" y="237" font-size="10.5" font-weight="700" fill="#1D5A45">05</text>
  <text x="150" y="237" font-size="10.5" font-weight="500" fill="#1D5A45">网络配置与排障</text>
  <text x="127" y="250" font-size="8.6" fill="#1D5A45">连不通卡在哪一层</text>

  <rect x="378" y="222" width="246" height="34" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="389" y="237" font-size="10.5" font-weight="700" fill="#1F4468">06</text>
  <text x="412" y="237" font-size="10.5" font-weight="500" fill="#1F4468">软件、服务与任务</text>
  <text x="389" y="250" font-size="8.6" fill="#1F4468">怎么装、怎么常驻、怎么定时</text>

  <!-- ========== 层5 操作 ========== -->
  <rect x="24" y="270" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="297" font-size="11" font-weight="600" fill="#4A4945">操作</text>

  <rect x="116" y="276" width="246" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="127" y="291" font-size="10.5" font-weight="700" fill="#4A4945">07</text>
  <text x="150" y="291" font-size="10.5" font-weight="500" fill="#4A4945">命令行与文本处理</text>
  <text x="127" y="304" font-size="8.6" fill="#4A4945">怎么把需要的信息挖出来</text>

  <rect x="378" y="276" width="246" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="389" y="291" font-size="10.5" font-weight="700" fill="#4A4945">08</text>
  <text x="412" y="291" font-size="10.5" font-weight="500" fill="#4A4945">Shell 脚本</text>
  <text x="389" y="304" font-size="8.6" fill="#4A4945">重复三次的事，写成不出错的脚本</text>

  <!-- ========== 层6 运营 ========== -->
  <rect x="24" y="324" width="612" height="46" rx="3" fill="#F7F6F1" stroke="#DDD9CD" stroke-width="1"/>
  <text x="40" y="351" font-size="11" font-weight="600" fill="#4A4945">运营</text>

  <rect x="116" y="330" width="246" height="34" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="127" y="345" font-size="10.5" font-weight="700" fill="#7A322B">09</text>
  <text x="150" y="345" font-size="10.5" font-weight="500" fill="#7A322B">性能分析与排障</text>
  <text x="127" y="358" font-size="8.6" fill="#7A322B">慢了、挂了，第一个数看哪个</text>

  <rect x="378" y="330" width="246" height="34" rx="3" fill="#ECE7F7" stroke="#9C8ACB" stroke-width="1"/>
  <text x="389" y="345" font-size="10.5" font-weight="700" fill="#46337A">10</text>
  <text x="412" y="345" font-size="10.5" font-weight="500" fill="#46337A">数据备份与共享</text>
  <text x="389" y="358" font-size="8.6" fill="#46337A">数据怎么备才敢说能恢复</text>

  <!-- ========== 参考层与图例 ========== -->
  <text x="32" y="390" font-size="9" fill="#8C8980">参考层：00 术语表 · A 命令速查 · B 发行版差异（三册只查不读）</text>

  <rect x="32" y="406" width="9" height="9" fill="#7FA6D0" stroke="#7FA6D0" stroke-width="1"/>
  <text x="44" y="414" font-size="8.4" fill="#4A4945">系统与内核</text>
  <rect x="112" y="406" width="9" height="9" fill="#D9A458" stroke="#D9A458" stroke-width="1"/>
  <text x="124" y="414" font-size="8.4" fill="#4A4945">权限边界</text>
  <rect x="184" y="406" width="9" height="9" fill="#9C8ACB" stroke="#9C8ACB" stroke-width="1"/>
  <text x="196" y="414" font-size="8.4" fill="#4A4945">数据</text>
  <rect x="236" y="406" width="9" height="9" fill="#6BAF95" stroke="#6BAF95" stroke-width="1"/>
  <text x="248" y="414" font-size="8.4" fill="#4A4945">连接</text>
  <rect x="288" y="406" width="9" height="9" fill="#D2948C" stroke="#D2948C" stroke-width="1"/>
  <text x="300" y="414" font-size="8.4" fill="#4A4945">故障与风险</text>
  <rect x="366" y="406" width="9" height="9" fill="#CFCCC2" stroke="#CFCCC2" stroke-width="1"/>
  <text x="378" y="414" font-size="8.4" fill="#4A4945">通用手段</text>

  <text x="32" y="436" font-size="9" fill="#8C8980">越靠上越贴近机器本体，越靠下越贴近日常处置；跨册的问题按「最后一步落在哪册」归属。</text>

  </g>
</svg>
