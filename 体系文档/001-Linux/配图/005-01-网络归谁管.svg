<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 723.53" width="1200" height="723.53" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 等比放大：整体 scale(1.764706)，内部坐标未改动 -->
  <g transform="scale(1.7647058824)">
  <title>按配置文件判断这台机器的网络归哪个服务管</title>
  <desc>从上往下依次问四个问题，第一个命中的就是答案：有 /etc/netplan 的 yaml 归 netplan，用 netplan apply 生效；有 /etc/network/interfaces 归 ifupdown，重启 networking；有 ifcfg 开头的网卡文件归 network-scripts，CentOS 7 用 nmcli 或 restart network；有 nmconnection 归 NetworkManager keyfile，Rocky 9 与 CentOS 8 以后用这种格式。四样都没有，就只剩 ip addr add 的临时办法。核心结论是：配置文件存在不等于有人在读它，改了不生效往往是因为改错了文件。</desc>

  <rect width="680" height="410" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">改哪个文件才生效：先问网络归谁管</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">改错文件等于没改</text>

  <defs>
    <marker id="a8Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a8Rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#CFCCC2"/>
    </marker>
  </defs>

  <text x="32" y="54" font-size="9.5" font-weight="600" fill="#4A4945">从上往下问，第一个命中的就是答案</text>

  <!-- 判定轨 -->
  <line x1="48" y1="66" x2="48" y2="322" stroke="#CFCCC2" stroke-width="1"/>
  <line x1="48" y1="322" x2="48" y2="330" stroke="#CFCCC2" stroke-width="1" marker-end="url(#a8Rail)"/>

  <!-- 1 -->
  <rect x="56" y="64" width="264" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="68" y="84" font-size="8.8" font-weight="600" fill="#1F4468">有 /etc/netplan/*.yaml 吗</text>
  <text x="68" y="100" font-size="7.6" fill="#1F4468">ls /etc/netplan/</text>
  <text x="68" y="113" font-size="7.2" fill="#8C8980">Ubuntu 17.10 之后都是它</text>
  <line x1="322" y1="92" x2="342" y2="92" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <rect x="344" y="64" width="304" height="56" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="356" y="84" font-size="9" font-weight="600" fill="#1F4468">netplan</text>
  <text x="356" y="100" font-size="7.6" fill="#4A4945">改 yaml，然后 netplan apply</text>
  <text x="356" y="113" font-size="7.2" fill="#8C8980">先用 netplan try，错语法会自动回滚</text>

  <!-- 2 -->
  <rect x="56" y="132" width="264" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="68" y="152" font-size="8.8" font-weight="600" fill="#1F4468">有 /etc/network/interfaces 吗</text>
  <text x="68" y="168" font-size="7.6" fill="#1F4468">systemctl is-active networking</text>
  <text x="68" y="181" font-size="7.2" fill="#8C8980">Debian 系的传统写法</text>
  <line x1="322" y1="160" x2="342" y2="160" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <rect x="344" y="132" width="304" height="56" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="356" y="152" font-size="9" font-weight="600" fill="#1F4468">ifupdown</text>
  <text x="356" y="168" font-size="7.6" fill="#4A4945">改 interfaces，重启 networking</text>
  <text x="356" y="181" font-size="7.2" fill="#8C8980">Ubuntu 17.10 之前也是这一套</text>

  <!-- 3 -->
  <rect x="56" y="200" width="264" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="68" y="220" font-size="8.8" font-weight="600" fill="#1F4468">有 ifcfg-* 网卡文件吗</text>
  <text x="68" y="236" font-size="7.6" fill="#1F4468">ls /etc/sysconfig/network-scripts/</text>
  <text x="68" y="249" font-size="7.2" fill="#8C8980">CentOS 7 的标准位置</text>
  <line x1="322" y1="228" x2="342" y2="228" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <rect x="344" y="200" width="304" height="56" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="356" y="220" font-size="9" font-weight="600" fill="#1F4468">network-scripts</text>
  <text x="356" y="236" font-size="7.6" fill="#4A4945">nmcli c reload 后 nmcli c up 名字</text>
  <text x="356" y="249" font-size="7.2" fill="#8C8980">NetworkManager 没跑就用 restart network</text>

  <!-- 4 -->
  <rect x="56" y="268" width="264" height="56" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="68" y="288" font-size="8.8" font-weight="600" fill="#1F4468">有 *.nmconnection 吗</text>
  <text x="68" y="304" font-size="7.6" fill="#1F4468">ls /etc/NetworkManager/system-connections/</text>
  <text x="68" y="317" font-size="7.2" fill="#8C8980">Rocky 9 / RHEL 9 起是默认</text>
  <line x1="322" y1="296" x2="342" y2="296" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <rect x="344" y="268" width="304" height="56" rx="3" fill="#FFFFFF" stroke="#7FA6D0" stroke-width="1"/>
  <text x="356" y="288" font-size="9" font-weight="600" fill="#1F4468">NetworkManager keyfile</text>
  <text x="356" y="304" font-size="7.6" fill="#4A4945">同样用 nmcli，不再手写 ifcfg</text>
  <text x="356" y="317" font-size="7.2" fill="#8C8980">文件权限要 600，否则 NM 不读</text>

  <rect x="56" y="336" width="592" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="68" y="357" font-size="8.2" fill="#4A4945">四样都没有 → 只剩 ip addr add 的临时办法，重启就没了（排障时验证用，不是配置）</text>

  <text x="32" y="392" font-size="9" fill="#8C8980">文件存在，不等于有人在读它：改了不生效，先确认归谁管 —— 这一册一半的时间浪费在这里。</text>

  </g>
</svg>
