<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 808.24" width="1200" height="808.24" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 等比放大：整体 scale(1.764706)，内部坐标未改动 -->
  <g transform="scale(1.7647058824)">
  <title>脚本的四种结束方式殊途同归到 EXIT trap，kill -9 是唯一的旁路</title>
  <desc>上半部分：正常结束、set -e 拦下失败、Ctrl-C 的 INT、kill 的 TERM 四种结束方式全部汇入 EXIT trap 执行清理，然后进程退出，退出码原样保留。下半部分两个陷阱：kill -9 不可捕获，trap 不执行临时文件留下；trap 里跑了命令会改掉退出码，要先存 rc 再 return 恢复。底部备注防重入：exec 打开文件描述符加 flock 非阻塞锁，拿不到锁退出码用 0，进程退出锁自动释放。</desc>

  <rect width="680" height="458" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">trap：四种结束方式殊途同归，kill -9 是唯一旁路</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">清理写在 EXIT 里</text>

  <defs>
    <marker id="a8Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="a8Red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>

  <!-- ① 主时序 -->
  <text x="32" y="56" font-size="9.5" font-weight="600" fill="#4A4945">① 无论怎么结束，EXIT trap 都会执行</text>

  <rect x="40" y="70" width="170" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="56" y="91" font-size="8.4" fill="#4A4945">正常结束：exit 3</text>
  <rect x="40" y="112" width="170" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="56" y="133" font-size="8.4" fill="#4A4945">set -e 拦下失败命令</text>
  <rect x="40" y="154" width="170" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="56" y="175" font-size="8.4" fill="#4A4945">INT：Ctrl-C</text>
  <rect x="40" y="196" width="170" height="34" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="56" y="217" font-size="8.4" fill="#4A4945">TERM：kill 默认信号</text>

  <line x1="215" y1="87" x2="291" y2="138" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <line x1="215" y1="129" x2="291" y2="146" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <line x1="215" y1="171" x2="291" y2="152" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <line x1="215" y1="213" x2="291" y2="160" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>

  <rect x="298" y="110" width="152" height="76" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="374" y="134" font-size="8.6" font-weight="600" fill="#1F4468" text-anchor="middle">trap cleanup EXIT</text>
  <text x="374" y="152" font-size="7.4" fill="#1F4468" text-anchor="middle">清临时文件 · 锁 · 半截包</text>
  <text x="374" y="168" font-size="7.4" fill="#8C8980" text-anchor="middle">五个信号里必抓的一个</text>

  <line x1="455" y1="148" x2="533" y2="148" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a8Blue)"/>
  <text x="494" y="140" font-size="7.4" fill="#8C8980" text-anchor="middle">清理完</text>

  <rect x="540" y="124" width="104" height="48" rx="3" fill="#E4F0EA" stroke="#1D5A45" stroke-width="1"/>
  <text x="592" y="145" font-size="8.6" font-weight="600" fill="#1D5A45" text-anchor="middle">进程退出</text>
  <text x="592" y="161" font-size="7.4" fill="#1D5A45" text-anchor="middle">退出码 3 原样保留</text>

  <text x="32" y="250" font-size="9" fill="#8C8980">EXIT 已覆盖 INT / TERM（收到信号脚本结束，EXIT trap 照样跑）；要区分「是被打断的」才单独抓 INT / TERM。</text>

  <!-- ② 两个陷阱 -->
  <text x="32" y="270" font-size="9.5" font-weight="600" fill="#4A4945">② 两个陷阱</text>

  <rect x="40" y="280" width="294" height="76" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="54" y="299" font-size="9.5" font-weight="600" fill="#7A322B">kill -9 拦不住</text>
  <text x="54" y="316" font-size="7.8" fill="#7A322B">信号 9 不可捕获——trap EXIT 不执行，</text>
  <text x="54" y="332" font-size="7.8" fill="#7A322B">临时文件留下。放 /tmp 靠系统清，</text>
  <text x="54" y="348" font-size="7.8" fill="#7A322B">或下次启动先清上一轮残留</text>

  <rect x="350" y="280" width="294" height="76" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="364" y="299" font-size="9.5" font-weight="600" fill="#7A322B">trap 里跑了命令，$? 就被改掉</text>
  <text x="364" y="316" font-size="7.8" fill="#7A322B">cleanup 里 rm 成功 → 最终退出码变 0。</text>
  <text x="364" y="332" font-size="7.8" fill="#1D5A45">对：local rc=$? 先存，清理完</text>
  <text x="364" y="348" font-size="7.8" fill="#1D5A45">return $rc——退出码原样交还</text>

  <!-- ③ 防重入 -->
  <rect x="40" y="370" width="604" height="56" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="54" y="388" font-size="8.2" font-weight="600" fill="#7A4A12">防重入是另一类保险（8.9）：两个实例不能同时跑</text>
  <text x="54" y="406" font-size="7.6" fill="#7A4A12">exec 9&gt;/var/lock/x.lock; flock -n 9 || exit 0 —— 拿不到锁退出码用 0（cron 不告警）；进程退出锁自动释放，kill -9 也放</text>

  <text x="32" y="446" font-size="9" fill="#8C8980">信号备忘：EXIT 必抓 · ERR 配 set -E 打错误日志 · INT / TERM 视需要 · HUP 一般不抓（脚本不该依赖终端）</text>

  </g>
</svg>
