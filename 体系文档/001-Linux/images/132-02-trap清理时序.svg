<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 645" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>trap EXIT 的四种结束路径与两个陷阱</title>
  <desc>左侧四种结束方式都汇到同一个 EXIT trap：正常 exit 3、set -e 拦下失败、Ctrl-C 的 INT、kill 的 TERM，因为收到信号后脚本结束，EXIT trap 照样会跑。中间是 trap cleanup EXIT 负责清理临时文件、锁与半截包，右侧清理完进程才退出，退出码原样保留。下行两个陷阱：kill -9 不可捕获，trap 里再跑命令会把 $? 改掉导致退出码丢失，正确做法是先存 rc。</desc>

  <!-- 坐标表：画布 1200x645 | 左四块 x=30 w=300 h=48 y=76/132/188/244 | 汇聚线 x=350 | 中卡 x=380 w=270 y=110 h=150 | 右卡 x=700 w=470 y=110 h=150 | 区②两卡 w=560 y=326 h=120 | 结论块 y=462 h=76 | 图例 y=556 h=65 -->

  <rect x="0" y="0" width="1200" height="645" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">trap：四种结束方式殊途同归，kill -9 是唯一旁路</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">清理写在 EXIT 里</text>

  <!-- ============ 区① 四种结束 ============ -->
  <text x="30" y="66" font-size="12" fill="#616161">① 无论怎么结束，EXIT trap 都会执行</text>

  <rect x="30" y="76" width="300" height="48" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="96" font-size="12.5" font-weight="bold" fill="#123314">正常结束</text>
  <text x="46" y="116" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">exit 3</text>

  <rect x="30" y="132" width="300" height="48" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="46" y="152" font-size="12.5" font-weight="bold" fill="#7f3f00">set -e 拦下失败命令</text>
  <text x="46" y="172" font-size="11" fill="#7f3f00">非零退出即中止，也算结束</text>

  <rect x="30" y="188" width="300" height="48" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="46" y="208" font-size="12.5" font-weight="bold" fill="#311b92">INT：Ctrl-C</text>
  <text x="46" y="228" font-size="11" fill="#311b92">交互中断，脚本结束</text>

  <rect x="30" y="244" width="300" height="48" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="46" y="264" font-size="12.5" font-weight="bold" fill="#311b92">TERM：kill 默认信号</text>
  <text x="46" y="284" font-size="11" fill="#311b92">systemd stop 发的就是这个</text>

  <line x1="350" y1="100" x2="350" y2="268" stroke="#607d8b" stroke-width="2"/>
  <line x1="338" y1="184" x2="378" y2="184" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="110" width="270" height="150" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="400" y="138" font-size="14" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">trap cleanup EXIT</text>
  <text x="400" y="166" font-size="11.5" fill="#123314">EXIT 是五种信号里必抓的那一个</text>
  <text x="400" y="190" font-size="11.5" fill="#123314">清临时文件 · 锁 · 半截包</text>
  <text x="400" y="214" font-size="11.5" fill="#123314">收到 INT / TERM 后脚本结束，</text>
  <text x="400" y="236" font-size="11.5" fill="#123314">EXIT trap 照样跑 —— 不用单独抓</text>

  <line x1="654" y1="185" x2="694" y2="185" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="110" width="470" height="150" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="720" y="138" font-size="14" font-weight="bold" fill="#1b5e20">清理完，进程才真正退出</text>
  <text x="720" y="164" font-size="11.5" fill="#1b3d1e">退出码原样保留：exit 3 就是 3，不会被清理动作改掉。</text>
  <text x="720" y="188" font-size="11.5" fill="#1b3d1e">要区分「正常结束」和「被打断的」，才需要单独抓 INT / TERM，</text>
  <text x="720" y="210" font-size="11.5" fill="#1b3d1e">否则只写一个 EXIT 就够了。</text>
  <text x="720" y="238" font-size="11" fill="#2e5230">经验：脚本超过 20 行就该有 trap，哪怕只删一个临时目录。</text>

  <!-- ============ 区② 两个陷阱 ============ -->
  <text x="30" y="312" font-size="12" fill="#616161">② 两个陷阱</text>

  <rect x="30" y="326" width="560" height="120" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="50" y="352" font-size="13" font-weight="bold" fill="#7f0000">kill -9 拦不住</text>
  <text x="50" y="376" font-size="11.5" fill="#7f0000">信号 9 不可捕获，trap EXIT 不执行，临时文件留下。</text>
  <text x="50" y="398" font-size="11.5" fill="#7f0000">对策：临时文件放 /tmp 靠系统清，</text>
  <text x="50" y="420" font-size="11.5" fill="#7f0000">或下次启动时先清上一轮残留（防重入同理）。</text>
  <text x="50" y="440" font-size="11" fill="#7f0000">这也是「不要用 kill -9 关服务」的一个理由</text>

  <rect x="610" y="326" width="560" height="120" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="352" font-size="13" font-weight="bold" fill="#7f0000">trap 里跑了命令，$? 就被改掉</text>
  <text x="630" y="376" font-size="11.5" fill="#7f0000">cleanup 里 rm 成功 → 最终退出码变成 0，</text>
  <text x="630" y="398" font-size="11.5" fill="#7f0000">监控就看不到真实失败原因。</text>
  <text x="630" y="420" font-size="11.5" fill="#123314">对：local rc=$? 先存，清理完 return $rc</text>
  <text x="630" y="440" font-size="11" fill="#7f0000">退出码要原样交还，这是 trap 的基本礼貌</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="462" width="1140" height="76" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="486" font-size="12.5" font-weight="bold" fill="#5d4037">信号备忘：EXIT 必抓 · ERR 配 set -E 打错误日志 · INT / TERM 视需要 · HUP 一般不抓（脚本不该依赖终端）。</text>
  <text x="50" y="508" font-size="11.5" fill="#5d4037">防重入是另一道保险：exec 9&gt;/var/lock/x.lock; flock -n 9 || exit 0 —— 拿不到锁退出码用 0，cron 不告警。</text>
  <text x="50" y="528" font-size="11" fill="#616161">进程退出锁自动释放，kill -9 也会放 —— 所以 flock 比手写 pid 文件可靠。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="556" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="571" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="582" font-size="12" fill="#37474f">正常结束</text>
  <rect x="264" y="571" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="296" y="582" font-size="12" fill="#37474f">set -e 中止</text>
  <rect x="488" y="571" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="520" y="582" font-size="12" fill="#37474f">信号结束（INT / TERM）</text>
  <rect x="800" y="571" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="832" y="582" font-size="12" fill="#37474f">EXIT trap</text>
  <rect x="1000" y="571" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="1032" y="582" font-size="12" fill="#37474f">陷阱</text>
</svg>
