<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1100" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Linux 板块六层与各层册号的体系总览</title>
  <desc>自下而上六层：机器层对应 111 系统与启动，进程层 112，权限层 113，存储层 114，网络与服务层 121 与 122，操作与运营层 131 至 134。每册卡片给出该册的核心范围；单册层的右侧给出这一层的排障入口，比如访问不了文件先查 113、df 与 du 对不上先查 114。最下方附录区是 190 术语表、A 命令速查、B 发行版差异，三册只查不读，不参与学习顺序。</desc>

  <!-- 坐标表：画布 1960x1100 | 层容器 x=60 w=1840 h=110 | 层6 y=90 / 层5 y=226 / 层4 y=362 / 层3 y=498 / 层2 y=634 / 层1 y=770 | 附录 y=906 h=80 | 图例 y=1010 h=65 | 册卡区 x=270~1880：4册 w=380 gap=30，2册 w=785 gap=40，1册 w=760 -->

  <rect x="0" y="0" width="1960" height="1100" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="60" y="52" font-size="20" font-weight="bold" fill="#0f172a">六层十册：一册只回答一个问题</text>
  <text x="1900" y="52" font-size="12" fill="#616161" text-anchor="end">编号自下而上 = 依赖顺序　自上而下使用 = 学习顺序</text>

  <!-- ============ ⑥ 操作与运营层 ============ -->
  <rect x="60" y="90" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#e65100" stroke-width="2"/>
  <text x="80" y="132" font-size="17" font-weight="bold" fill="#bf360c">⑥ 操作与运营层</text>
  <text x="80" y="156" font-size="11" fill="#616161">131 ~ 134　四册</text>
  <text x="80" y="178" font-size="11" fill="#616161">日常处置的手段</text>

  <rect x="270" y="105" width="380" height="80" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="288" y="129" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">131</text>
  <text x="330" y="129" font-size="15" font-weight="bold" fill="#7f3f00">命令行与文本处理</text>
  <text x="288" y="153" font-size="11.5" fill="#7f3f00">分词与展开、管道与流、文本三剑客</text>
  <text x="288" y="173" font-size="11" fill="#7f3f00">怎么把需要的信息从输出里挖出来</text>

  <rect x="680" y="105" width="380" height="80" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="698" y="129" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">132</text>
  <text x="740" y="129" font-size="15" font-weight="bold" fill="#7f3f00">Shell 脚本</text>
  <text x="698" y="153" font-size="11.5" fill="#7f3f00">变量与控制流、set 保险丝、trap 清理</text>
  <text x="698" y="173" font-size="11" fill="#7f3f00">重复三次的事，写成不出错的脚本</text>

  <rect x="1090" y="105" width="380" height="80" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="1108" y="129" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">133</text>
  <text x="1150" y="129" font-size="15" font-weight="bold" fill="#7f3f00">性能分析与排障</text>
  <text x="1108" y="153" font-size="11.5" fill="#7f3f00">USE 五维、故障树、30 秒抓现场</text>
  <text x="1108" y="173" font-size="11" fill="#7f3f00">慢了、挂了，第一个数该看哪个</text>

  <rect x="1500" y="105" width="380" height="80" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="1518" y="129" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">134</text>
  <text x="1560" y="129" font-size="15" font-weight="bold" fill="#7f3f00">数据备份与共享</text>
  <text x="1518" y="153" font-size="11.5" fill="#7f3f00">3-2-1 底线、rsync 三模式、NFS 与 SMB</text>
  <text x="1518" y="173" font-size="11" fill="#7f3f00">数据怎么备，才敢说「能恢复」</text>

  <line x1="980" y1="200" x2="980" y2="222" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ ⑤ 网络与服务层 ============ -->
  <rect x="60" y="226" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="268" font-size="17" font-weight="bold" fill="#1b5e20">⑤ 网络与服务层</text>
  <text x="80" y="292" font-size="11" fill="#4e6b50">121 ~ 122　两册</text>
  <text x="80" y="314" font-size="11" fill="#4e6b50">对外连接与常驻</text>

  <rect x="270" y="241" width="785" height="80" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <text x="288" y="265" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">121</text>
  <text x="330" y="265" font-size="15" font-weight="bold" fill="#123314">网络配置与排障</text>
  <text x="288" y="289" font-size="11.5" fill="#123314">网卡归谁管（netplan / ifupdown / NetworkManager）、路由、防火墙、五层排查</text>
  <text x="288" y="309" font-size="11" fill="#123314">连不通卡在哪一层 —— 每层一条命令，通过才往下走</text>

  <rect x="1095" y="241" width="785" height="80" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2"/>
  <text x="1113" y="265" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">122</text>
  <text x="1155" y="265" font-size="15" font-weight="bold" fill="#123314">软件、服务与任务</text>
  <text x="1113" y="289" font-size="11.5" fill="#123314">rpm 与 deb 依赖语义、systemd unit 依赖、定时任务、日志归属</text>
  <text x="1113" y="309" font-size="11" fill="#123314">怎么装、怎么常驻、怎么定时、出问题去哪个日志找</text>

  <line x1="980" y1="336" x2="980" y2="358" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ ④ 存储层 ============ -->
  <rect x="60" y="362" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#5e35b1" stroke-width="2"/>
  <text x="80" y="404" font-size="17" font-weight="bold" fill="#311b92">④ 存储层</text>
  <text x="80" y="428" font-size="11" fill="#616161">114　一册</text>
  <text x="80" y="450" font-size="11" fill="#616161">数据落在哪里</text>

  <rect x="270" y="377" width="760" height="80" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="288" y="401" font-size="13" font-weight="bold" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">114</text>
  <text x="330" y="401" font-size="15" font-weight="bold" fill="#311b92">存储与文件系统</text>
  <text x="288" y="425" font-size="11.5" fill="#311b92">分区与文件系统、LVM、inode、挂载与 fstab、配额、df 与 du 的差额</text>
  <text x="288" y="445" font-size="11" fill="#311b92">盘怎么分区挂载，空间为什么对不上</text>

  <rect x="1050" y="377" width="830" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1068" y="399" font-size="12" font-weight="bold" fill="#4e6b50">这一层的排障入口</text>
  <text x="1068" y="421" font-size="11.5" fill="#37474f">df 满了但 du 少一半 → 先 lsof +L1 找 deleted 文件</text>
  <text x="1068" y="441" font-size="11.5" fill="#37474f">lsblk 有盘但 df 没有 → 没挂载，或者没写 fstab</text>

  <line x1="980" y1="472" x2="980" y2="494" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ ③ 权限层 ============ -->
  <rect x="60" y="498" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#f9a825" stroke-width="2"/>
  <text x="80" y="540" font-size="17" font-weight="bold" fill="#8d6e00">③ 权限层</text>
  <text x="80" y="564" font-size="11" fill="#8d6e00">113　一册</text>
  <text x="80" y="586" font-size="11" fill="#8d6e00">谁能碰这个文件</text>

  <rect x="270" y="513" width="760" height="80" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="288" y="537" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">113</text>
  <text x="330" y="537" font-size="15" font-weight="bold" fill="#7f3f00">用户、权限与安全</text>
  <text x="288" y="561" font-size="11.5" fill="#7f3f00">uid 与 gid、rwx 三组位、umask、sudo 与 PAM、SELinux、audit</text>
  <text x="288" y="581" font-size="11" fill="#7f3f00">谁允许登、登进来能对什么做什么、事后能查到谁</text>

  <rect x="1050" y="513" width="830" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1068" y="535" font-size="12" font-weight="bold" fill="#4e6b50">这一层的排障入口</text>
  <text x="1068" y="557" font-size="11.5" fill="#37474f">某人访问不了某个文件 → 先 namei -l，不是 ls -l</text>
  <text x="1068" y="577" font-size="11.5" fill="#37474f">chmod 777 还是 403 → 第二道门是 SELinux，看 ls -Z</text>

  <line x1="980" y1="608" x2="980" y2="630" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ ② 进程层 ============ -->
  <rect x="60" y="634" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="676" font-size="17" font-weight="bold" fill="#1b5e20">② 进程层</text>
  <text x="80" y="700" font-size="11" fill="#4e6b50">112　一册</text>
  <text x="80" y="722" font-size="11" fill="#4e6b50">谁在跑、占了多少</text>

  <rect x="270" y="649" width="760" height="80" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="288" y="673" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">112</text>
  <text x="330" y="673" font-size="15" font-weight="bold" fill="#123314">进程与资源</text>
  <text x="288" y="697" font-size="11.5" fill="#123314">进程与线程、六个状态、信号、内存与 CPU 口径、cgroup 限额</text>
  <text x="288" y="717" font-size="11" fill="#123314">谁在跑、占了多少、卡在哪 —— 负载高不等于 CPU 不够</text>

  <rect x="1050" y="649" width="830" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1068" y="671" font-size="12" font-weight="bold" fill="#4e6b50">这一层的排障入口</text>
  <text x="1068" y="693" font-size="11.5" fill="#37474f">负载高但 CPU 空 → 先数 D 状态，多半在等 IO</text>
  <text x="1068" y="713" font-size="11.5" fill="#37474f">kill -9 不掉 → 看 /proc/&lt;pid&gt;/wchan，不是权限问题</text>

  <line x1="980" y1="744" x2="980" y2="766" stroke="#607d8b" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- ============ ① 机器层 ============ -->
  <rect x="60" y="770" width="1840" height="110" rx="12" fill="#f1f8e9" fill-opacity="0.55" stroke="#1565c0" stroke-width="2"/>
  <text x="80" y="812" font-size="17" font-weight="bold" fill="#0d47a1">① 机器层</text>
  <text x="80" y="836" font-size="11" fill="#1565c0">111　一册</text>
  <text x="80" y="858" font-size="11" fill="#1565c0">底层，一切依赖它</text>

  <rect x="270" y="785" width="760" height="80" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="288" y="809" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">111</text>
  <text x="330" y="809" font-size="15" font-weight="bold" fill="#0d2f5c">系统与启动</text>
  <text x="288" y="833" font-size="11.5" fill="#0d2f5c">发行版与目录树、启动四阶段、systemd 与 target、起不来的救援路径</text>
  <text x="288" y="853" font-size="11" fill="#0d2f5c">机器由什么组成，开机按什么顺序</text>

  <rect x="1050" y="785" width="830" height="80" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="1068" y="807" font-size="12" font-weight="bold" fill="#4e6b50">这一层的排障入口</text>
  <text x="1068" y="829" font-size="11.5" fill="#37474f">起不来 → 先看屏幕停在哪一级，再决定救哪一级</text>
  <text x="1068" y="849" font-size="11.5" fill="#37474f">服务没起 → systemctl status，看它依赖的 unit 卡在哪</text>

  <!-- ============ 附录区 ============ -->
  <rect x="60" y="906" width="1840" height="80" rx="12" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="80" y="938" font-size="15" font-weight="bold" fill="#546e7a">附录区</text>
  <text x="80" y="960" font-size="11" fill="#546e7a">只查不读，不参与学习顺序</text>

  <rect x="270" y="916" width="380" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="288" y="940" font-size="13" font-weight="bold" fill="#546e7a" font-family="ui-monospace,Menlo,Consolas,monospace">190</text>
  <text x="330" y="940" font-size="14" font-weight="bold" fill="#546e7a">术语表</text>
  <text x="288" y="962" font-size="11" fill="#546e7a">按术语查定义与它落在哪一册</text>

  <rect x="680" y="916" width="380" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="698" y="940" font-size="13" font-weight="bold" fill="#546e7a" font-family="ui-monospace,Menlo,Consolas,monospace">A</text>
  <text x="730" y="940" font-size="14" font-weight="bold" fill="#546e7a">命令速查</text>
  <text x="698" y="962" font-size="11" fill="#546e7a">按场景查命令与参数</text>

  <rect x="1090" y="916" width="380" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="1108" y="940" font-size="13" font-weight="bold" fill="#546e7a" font-family="ui-monospace,Menlo,Consolas,monospace">B</text>
  <text x="1140" y="940" font-size="14" font-weight="bold" fill="#546e7a">发行版差异</text>
  <text x="1108" y="962" font-size="11" fill="#546e7a">同一件事在 RHEL 与 Debian 上的写法</text>

  <text x="1500" y="938" font-size="12" fill="#616161">先按问题定位到某册，再回附录查具体写法；</text>
  <text x="1500" y="958" font-size="12" fill="#616161">三册都不进学习顺序，也不用从头读。</text>

  <!-- ============ 图例 ============ -->
  <rect x="60" y="1010" width="1840" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="80" y="1025" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="112" y="1036" font-size="12" fill="#37474f">① 机器层（111）</text>
  <rect x="342" y="1025" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="374" y="1036" font-size="12" fill="#37474f">② 进程层（112）</text>
  <rect x="604" y="1025" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="636" y="1036" font-size="12" fill="#37474f">③ 权限层（113）</text>
  <rect x="866" y="1025" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="898" y="1036" font-size="12" fill="#37474f">④ 存储层（114）</text>
  <rect x="1128" y="1025" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="1160" y="1036" font-size="12" fill="#37474f">⑤ 网络与服务层（121 ~ 122）</text>
  <rect x="1470" y="1025" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1.5"/>
  <text x="1502" y="1036" font-size="12" fill="#37474f">⑥ 操作与运营层（131 ~ 134）</text>
  <rect x="1800" y="1025" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="1832" y="1036" font-size="12" fill="#37474f">附录</text>
</svg>
