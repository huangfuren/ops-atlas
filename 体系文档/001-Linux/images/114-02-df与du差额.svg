<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>df 与 du 空间对不上的原因</title>
  <desc>上行是最常见的原因：文件被 rm 后目录项消失，但进程还开着 fd，inode 的 nlink 归 0 而引用仍在，42G 数据块一直被占着，于是 df 说满了而 du 遍历不到。右侧说明用 lsof +L1 找出这些 deleted 文件。下行按差额方向分两侧：df 大 du 小时，可能是元数据、快照、子挂载覆盖或 4K 块对齐；du 大 df 小时，可能是 apparent-size 或跨了挂载点。底部提示两个数都小时要查 inode。</desc>

  <!-- 坐标表：画布 1200x700 | 区①三卡 w=190 gap=40 y=76 h=90 x=30/260/490 | 对比两块 w=330 y=186 h=56 | 右说明 x=710 w=460 y=76 h=190 | 区②两栏 w=560 x=30/610 y=336 h=180 | 结论块 y=536 h=56 | 图例 y=612 h=65 -->

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">df 满了、du 却只有一半：块去哪了</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">先 lsof +L1</text>

  <!-- ============ 区① 删除但未释放 ============ -->
  <text x="30" y="66" font-size="12" fill="#616161">① 最常见的一个：文件删了，块没还</text>

  <rect x="30" y="76" width="180" height="90" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="46" y="102" font-size="13" font-weight="bold" fill="#0d2f5c">目录项</text>
  <text x="46" y="124" font-size="11" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">/app/logs/app.log</text>
  <text x="46" y="146" font-size="11" fill="#0d2f5c">名字和 inode 号的对应</text>

  <line x1="214" y1="121" x2="262" y2="121" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="112" font-size="10" fill="#616161" text-anchor="middle">rm</text>
  <text x="238" y="138" font-size="10" fill="#616161" text-anchor="middle">只删这层</text>

  <rect x="270" y="76" width="180" height="90" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="286" y="102" font-size="13" font-weight="bold" fill="#7f3f00">inode</text>
  <text x="286" y="124" font-size="11" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">nlink <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">归</tspan> 0</text>
  <text x="286" y="146" font-size="11" fill="#7f3f00">还开着 fd，引用不清零</text>

  <line x1="454" y1="121" x2="502" y2="121" stroke="#c62828" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="478" y="112" font-size="10" fill="#c62828" text-anchor="middle">引用未清</text>

  <rect x="510" y="76" width="180" height="90" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="526" y="102" font-size="13" font-weight="bold" fill="#7f0000">数据块</text>
  <text x="526" y="124" font-size="15" font-weight="bold" fill="#7f0000">42G 一直占着</text>
  <text x="526" y="146" font-size="11" fill="#7f0000">内核不敢回收，直到 fd 关掉</text>

  <rect x="30" y="186" width="330" height="56" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="50" y="208" font-size="13" font-weight="bold" fill="#7f0000">df 说满了</text>
  <text x="50" y="228" font-size="11" fill="#7f0000">按 inode 的块数算，被占的照样算</text>

  <text x="370" y="218" font-size="17" font-weight="bold" fill="#c62828" text-anchor="middle">≠</text>

  <rect x="380" y="186" width="330" height="56" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="400" y="208" font-size="13" font-weight="bold" fill="#7f0000">du 找不到</text>
  <text x="400" y="228" font-size="11" fill="#7f0000">遍历目录树，没有名字就统计不到</text>

  <!-- 右侧 lsof 说明 -->
  <rect x="710" y="76" width="460" height="166" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="730" y="102" font-size="14" font-weight="bold" fill="#5d4037">怎么找出来：lsof +L1</text>
  <text x="730" y="126" font-size="11.5" fill="#5d4037">NLINK 是 0、文件名后面带</text>
  <text x="730" y="146" font-size="11.5" fill="#5d4037" font-family="ui-monospace,Menlo,Consolas,monospace">(deleted) <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">的那几行</tspan></text>
  <text x="730" y="172" font-size="11.5" fill="#5d4037">把它们加起来，往往正好等于差额。</text>
  <line x1="730" y1="188" x2="1150" y2="188" stroke="#ffcc80" stroke-width="1"/>
  <text x="730" y="208" font-size="11.5" fill="#5d4037">处置：重启对应进程（如 reload 日志），</text>
  <text x="730" y="228" font-size="11.5" fill="#5d4037">或让程序自己 reopen，空间立刻还给 df。</text>

  <!-- ============ 区② 按差额方向分两侧 ============ -->
  <text x="30" y="320" font-size="12" fill="#616161">② 其余的，按差额方向分两侧看</text>

  <rect x="30" y="336" width="560" height="180" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="50" y="362" font-size="13" font-weight="bold" fill="#0d2f5c">df 大、du 小：占了余额却不在抽屉里</text>

  <text x="50" y="390" font-size="11.5" font-weight="bold" fill="#37474f">文件系统元数据</text>
  <text x="50" y="408" font-size="11" fill="#616161">inode 表、日志、保留块 —— stat -f 看得到，属正常</text>
  <line x1="50" y1="418" x2="570" y2="418" stroke="#eceff1" stroke-width="1"/>

  <text x="50" y="436" font-size="11.5" font-weight="bold" fill="#37474f">快照还占着空间</text>
  <text x="50" y="454" font-size="11" fill="#616161">LVM、虚机快照 —— lvs 看数据百分比，删快照才还给 df</text>
  <line x1="50" y1="464" x2="570" y2="464" stroke="#eceff1" stroke-width="1"/>

  <text x="50" y="482" font-size="11.5" font-weight="bold" fill="#37474f">子挂载盖住了目录</text>
  <text x="50" y="500" font-size="11" fill="#616161">findmnt -R /data，卸载后才看得到原目录里的内容</text>

  <rect x="610" y="336" width="560" height="180" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="630" y="362" font-size="13" font-weight="bold" fill="#0d2f5c">du 大、df 小：两边称的不是同一种东西</text>

  <text x="630" y="390" font-size="11.5" font-weight="bold" fill="#37474f">用了 --apparent-size</text>
  <text x="630" y="408" font-size="11" fill="#616161">按文件逻辑大小算，或把稀疏文件按实占之外计</text>
  <text x="630" y="426" font-size="11" fill="#616161">换回 du -sh 默认口径再核对一遍</text>
  <line x1="630" y1="438" x2="1150" y2="438" stroke="#eceff1" stroke-width="1"/>

  <text x="630" y="458" font-size="11.5" font-weight="bold" fill="#37474f">du 跨了挂载点</text>
  <text x="630" y="476" font-size="11" fill="#616161">把别的盘、/proc、/sys 也算进来，自然比 df 大</text>
  <text x="630" y="494" font-size="11" fill="#616161">加 -x 限制在同一文件系统内，再比一次</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="536" width="1140" height="56" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="560" font-size="12.5" font-weight="bold" fill="#5d4037">两个数都小、却还是写不进 → 不是空间问题，是 inode 用尽，用 df -i 看。</text>
  <text x="50" y="582" font-size="11.5" fill="#5d4037">小文件按 4K 块计、实际只写几十字节，属正常现象，别去「清理」。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="612" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="627" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="638" font-size="12" fill="#37474f">目录项（名字）</text>
  <rect x="264" y="627" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="296" y="638" font-size="12" fill="#37474f">inode（引用计数）</text>
  <rect x="488" y="627" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="520" y="638" font-size="12" fill="#37474f">被占住的数据块</text>
</svg>
