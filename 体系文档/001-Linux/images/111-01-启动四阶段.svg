<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>启动链的四个阶段与 initramfs 的作用</title>
  <desc>上行是从按电源到出现登录提示符的四个阶段：固件自检并找引导器、GRUB2 读配置加载内核与 initramfs、内核初始化硬件并挂根分区、systemd 作为 PID 1 按依赖拉起服务进入 target。每段下方红色条是这一段坏掉时屏幕上的样子，据此判断该救哪一级。下行解释阶段三为什么需要 initramfs：挂根分区要先有文件系统驱动，而驱动模块本身放在根分区里，两者互为前提形成死锁，内存盘把驱动提前放进内存来打破它。</desc>

  <!-- 坐标表：画布 1200x600 | 内容区 x=30~1170 | 四卡 w=256 pitch=284 x=46/330/614/898 | 卡 y=76 h=88 | 失败条 y=184 h=52 | 分隔线 y=258 | 双框 y=300 h=68 w=520 x=30/650 | 结论块 y=408 h=84 | 图例 y=512 h=65 -->

  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">启动链：从按电源到登录提示符只有四段</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">卡在哪一级，就救哪一级</text>

  <!-- ============ ① 固件 ============ -->
  <rect x="46" y="76" width="256" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="62" y="104" font-size="15" font-weight="bold" fill="#0d2f5c">① 固件</text>
  <text x="62" y="125" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">UEFI / BIOS</text>
  <text x="62" y="143" font-size="11.5" fill="#0d2f5c">自检硬件，按启动顺序找引导器</text>

  <!-- ============ ② 引导器 ============ -->
  <rect x="330" y="76" width="256" height="88" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="346" y="104" font-size="15" font-weight="bold" fill="#7f3f00">② 引导器</text>
  <text x="346" y="125" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">GRUB2</text>
  <text x="346" y="143" font-size="11.5" fill="#7f3f00">读配置，加载内核与 initramfs</text>

  <!-- ============ ③ 内核 ============ -->
  <rect x="614" y="76" width="256" height="88" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="104" font-size="15" font-weight="bold" fill="#123314">③ 内核</text>
  <text x="630" y="125" font-size="11.5" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">vmlinuz + initramfs</text>
  <text x="630" y="143" font-size="11.5" fill="#123314">初始化硬件、挂根分区、启 PID 1</text>

  <!-- ============ ④ 用户态 ============ -->
  <rect x="898" y="76" width="256" height="88" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="914" y="104" font-size="15" font-weight="bold" fill="#311b92">④ 用户态</text>
  <text x="914" y="125" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">systemd (PID 1)</text>
  <text x="914" y="143" font-size="11.5" fill="#311b92">按依赖拉起服务，进入 target</text>

  <!-- ============ 段间箭头 ============ -->
  <line x1="304" y1="120" x2="322" y2="120" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="588" y1="120" x2="606" y2="120" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="872" y1="120" x2="890" y2="120" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 失败表现条 ============ -->
  <text x="600" y="176" font-size="11" fill="#616161" text-anchor="middle">↓ 该段坏掉时，屏幕最后停在这里</text>

  <rect x="46" y="184" width="256" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="62" y="204" font-size="11" fill="#7f0000">无输出、卡厂商 logo</text>
  <text x="62" y="222" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">no bootable device</text>

  <rect x="330" y="184" width="256" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="346" y="204" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">grub&gt; / rescue&gt;</text>
  <text x="346" y="222" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">unknown filesystem</text>

  <rect x="614" y="184" width="256" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="204" font-size="11" fill="#7f0000">大量报错后 panic</text>
  <text x="630" y="222" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">dracut:/#</text>

  <rect x="898" y="184" width="256" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="914" y="204" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">A start job is running...</text>
  <text x="914" y="222" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">emergency mode</text>

  <!-- ============ 分隔 ============ -->
  <line x1="30" y1="258" x2="1170" y2="258" stroke="#cfd8dc" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ============ initramfs ============ -->
  <text x="30" y="286" font-size="14" font-weight="bold" fill="#263238">阶段③的进阶：为什么必须有一个内存盘</text>

  <rect x="30" y="300" width="520" height="68" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="50" y="327" font-size="13" font-weight="bold" fill="#0d2f5c">想挂上根分区</text>
  <text x="50" y="347" font-size="11.5" fill="#0d2f5c">得先有 ext4 / LVM / RAID 驱动</text>

  <line x1="558" y1="326" x2="642" y2="326" stroke="#c62828" stroke-width="2"
        stroke-dasharray="5 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <line x1="642" y1="344" x2="558" y2="344" stroke="#c62828" stroke-width="2"
        stroke-dasharray="5 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>

  <rect x="650" y="300" width="520" height="68" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="670" y="327" font-size="13" font-weight="bold" fill="#0d2f5c">但驱动又放在哪里</text>
  <text x="670" y="347" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">/lib/modules —— 在根分区里</text>

  <text x="30" y="394" font-size="11.5" fill="#7f0000">两者互相等对方先就位 —— 这是死锁，光靠内核自己走不过去。</text>

  <rect x="30" y="408" width="1140" height="84" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="434" font-size="14" font-weight="bold" fill="#5d4037">initramfs 打破它</text>
  <text x="50" y="456" font-size="11.5" fill="#5d4037">把驱动先装进一个内存盘，用它挂上根分区，再 switch_root 把根切过去。</text>
  <text x="50" y="474" font-size="11" fill="#616161">内存盘由 dracut / mkinitrd 生成；换内核或改 LVM、RAID 配置后必须跟着重建，这是它最常见的失效原因。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="512" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="527" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="538" font-size="12" fill="#37474f">① 固件层</text>
  <rect x="264" y="527" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="296" y="538" font-size="12" fill="#37474f">② 引导层</text>
  <rect x="488" y="527" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="520" y="538" font-size="12" fill="#37474f">③ 内核层</text>
  <rect x="712" y="527" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="744" y="538" font-size="12" fill="#37474f">④ 用户态</text>
  <rect x="936" y="527" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="968" y="538" font-size="12" fill="#37474f">该段失败表现</text>
</svg>
