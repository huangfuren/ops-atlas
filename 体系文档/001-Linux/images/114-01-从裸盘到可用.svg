<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 655" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>从裸盘到 df 可见的五步流程与两个断点</title>
  <desc>上行是从物理盘到可用的五步：内核识别 /dev/sda、用 parted 或 fdisk 分区、mkfs 建文件系统、mount 挂载、最后 df -hT 能看见并可读写。中行是两个最常见的断点：有分区但没 mkfs，mount 会报 unknown fs type；有文件系统但没挂载，lsblk 看得到而 df 里没有。下行是三条各看一半的命令：lsblk -f 看设备树、df -hT 看可用空间、blkid 与 findmnt 看 UUID 与真实挂载点。</desc>

  <!-- 坐标表：画布 1200x655 | 五步卡 w=212 pitch=232 y=76 h=110 | 断点两卡 w=560 y=220 h=90 | 命令三卡 w=360 pitch=390 y=346 h=120 | 结论块 y=484 h=64 | 图例 y=568 h=65 -->

  <rect x="0" y="0" width="1200" height="655" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">从裸盘到 df 看得见：五步，断在两处</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">FSTYPE 空 = 没 mkfs</text>

  <!-- ============ 区① 五步 ============ -->
  <rect x="30" y="76" width="212" height="110" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="104" font-size="14" font-weight="bold" fill="#123314">① 物理盘</text>
  <text x="46" y="128" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">/dev/sda</text>
  <text x="46" y="152" font-size="11" fill="#123314">内核自动识别</text>
  <text x="46" y="172" font-size="11" fill="#2e5230">lsblk 里看得见，但还不能用</text>

  <line x1="246" y1="131" x2="258" y2="131" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="262" y="76" width="212" height="110" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="278" y="104" font-size="14" font-weight="bold" fill="#123314">② 分区</text>
  <text x="278" y="128" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">parted / fdisk</text>
  <text x="278" y="152" font-size="11" fill="#123314">划出 /dev/sda1</text>
  <text x="278" y="172" font-size="11" fill="#2e5230">此时 FSTYPE 还是空的</text>

  <line x1="478" y1="131" x2="490" y2="131" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="494" y="76" width="212" height="110" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="510" y="104" font-size="14" font-weight="bold" fill="#123314">③ 文件系统</text>
  <text x="510" y="128" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">mkfs.ext4 / xfs</text>
  <text x="510" y="152" font-size="11" fill="#123314">分区上刷一层文件系统</text>
  <text x="510" y="172" font-size="11" fill="#2e5230">blkid 有 TYPE 了，才算过这步</text>

  <line x1="710" y1="131" x2="722" y2="131" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="726" y="76" width="212" height="110" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="742" y="104" font-size="14" font-weight="bold" fill="#123314">④ 挂载</text>
  <text x="742" y="128" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">mount / fstab</text>
  <text x="742" y="152" font-size="11" fill="#123314">挂到 /data 这样的目录上</text>
  <text x="742" y="172" font-size="11" fill="#2e5230">写进 fstab 才能重启后还在</text>

  <line x1="942" y1="131" x2="954" y2="131" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="958" y="76" width="212" height="110" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="974" y="104" font-size="14" font-weight="bold" fill="#123314">⑤ 可用</text>
  <text x="974" y="128" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">df -hT</text>
  <text x="974" y="152" font-size="11" fill="#123314">能读也能写</text>
  <text x="974" y="172" font-size="11" fill="#123314">到这里才算「盘可用」</text>

  <!-- ============ 区② 两个断点 ============ -->
  <text x="30" y="206" font-size="12" fill="#616161">两个断点：动作少做一步，现象完全不同</text>

  <rect x="30" y="220" width="560" height="90" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="50" y="244" font-size="13" font-weight="bold" fill="#7f0000">断在 ② 与 ③ 之间：有分区，没 mkfs</text>
  <text x="50" y="268" font-size="11.5" fill="#7f0000">mount 报 unknown filesystem type</text>
  <text x="50" y="290" font-size="11.5" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">lsblk -f 里 FSTYPE 一列是空的</text>
  <text x="50" y="306" font-size="11" fill="#7f0000">新手最容易在这卡住：还以为盘坏了，其实是没建文件系统</text>

  <rect x="610" y="220" width="560" height="90" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="244" font-size="13" font-weight="bold" fill="#7f0000">断在 ③ 与 ④ 之间：有文件系统，没挂载</text>
  <text x="630" y="268" font-size="11.5" fill="#7f0000">lsblk 看得到，但 df 里没有这个盘</text>
  <text x="630" y="290" font-size="11.5" fill="#7f0000">写进去的数据落在挂载点原来的目录上</text>
  <text x="630" y="306" font-size="11" fill="#7f0000">只 mount 不写 fstab，重启后照样丢 —— 两条都要做</text>

  <!-- ============ 区③ 三条命令 ============ -->
  <text x="30" y="332" font-size="12" fill="#616161">三条命令各看一半，合起来才完整</text>

  <rect x="30" y="346" width="360" height="120" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="50" y="372" font-size="14" font-weight="bold" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">lsblk -f</text>
  <text x="50" y="396" font-size="11.5" fill="#311b92">设备树：谁在谁上面</text>
  <text x="50" y="418" font-size="11.5" fill="#311b92">每一层的类型与挂载点，一次看全</text>
  <text x="50" y="442" font-size="11" fill="#311b92">FSTYPE 空 = 没 mkfs；MOUNTPOINT 空 = 没挂载</text>
  <text x="50" y="460" font-size="11" fill="#311b92">两个空位，正好对应上面两个断点</text>

  <rect x="420" y="346" width="360" height="120" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="440" y="372" font-size="14" font-weight="bold" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">df -hT</text>
  <text x="440" y="396" font-size="11.5" fill="#311b92">只看已挂载的文件系统</text>
  <text x="440" y="418" font-size="11.5" fill="#311b92">「还能写多少」的权威答案</text>
  <text x="440" y="442" font-size="11" fill="#311b92">T 列是文件系统类型，别只看容量</text>
  <text x="440" y="460" font-size="11" fill="#311b92">df 里没有 = 没挂上，再大也用不了</text>

  <rect x="810" y="346" width="360" height="120" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="830" y="372" font-size="14" font-weight="bold" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">blkid / findmnt</text>
  <text x="830" y="396" font-size="11.5" fill="#311b92">UUID、类型、真实挂载点</text>
  <text x="830" y="418" font-size="11.5" fill="#311b92">写 fstab 用它，不用 /dev/sda1</text>
  <text x="830" y="442" font-size="11" fill="#311b92">设备名会变（插拔、云盘顺序），UUID 不会</text>
  <text x="830" y="460" font-size="11" fill="#311b92">findmnt 还能反查某个目录来自哪个设备</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="484" width="1140" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="508" font-size="12.5" font-weight="bold" fill="#5d4037">先 lsblk -f 看设备树，再 df -hT 看可用空间；两者对不上，就是上面两个断点之一。</text>
  <text x="50" y="532" font-size="11.5" fill="#5d4037">「盘满没满」别问 du —— df 与 du 的差额另有来源，见配图 114-02。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="568" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="583" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="594" font-size="12" fill="#37474f">流程步骤</text>
  <rect x="264" y="583" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="296" y="594" font-size="12" fill="#37474f">终点：可用</text>
  <rect x="488" y="583" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="520" y="594" font-size="12" fill="#37474f">断点现象</text>
  <rect x="712" y="583" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="744" y="594" font-size="12" fill="#37474f">查询命令</text>
</svg>
