<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 745" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>系统起不来时的定位与救援决策表</title>
  <desc>按屏幕最后停在哪里分四行：无输出或卡厂商 logo 属固件层、grub 提示符属引导器、dracut 或 panic 属内核、emergency mode 或卡在启动任务属用户态。每行给出该层的判断依据与对应救援动作，从进 BIOS 查启动顺序，到 chroot 重装引导、dracut 重建内存盘、rescue 与 emergency 目标以及 rd.break 改密码，都按从轻到重的顺序排列。</desc>

  <!-- 坐标表：画布 1200x745 | 三列 x=30 w=400 / x=440 w=250 / x=700 w=470 | 表头 y=66 h=30 | 四行 h=104 y=104/220/336/452 | 结论块 y=572 h=64 | 图例 y=656 h=65 -->

  <rect x="0" y="0" width="1200" height="745" fill="#ffffff"/>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">起不来怎么办：先定位卡在哪一级，再决定救哪一级</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">从轻到重，别乱试</text>

  <!-- ============ 表头 ============ -->
  <rect x="30" y="66" width="1140" height="30" fill="#eceff1"/>
  <text x="46" y="86" font-size="13" font-weight="bold" fill="#37474f">屏幕最后停在这里</text>
  <text x="456" y="86" font-size="13" font-weight="bold" fill="#37474f">卡在哪一级</text>
  <text x="716" y="86" font-size="13" font-weight="bold" fill="#37474f">这一级怎么救（越往后越重）</text>

  <!-- ============ 行 1 固件 ============ -->
  <rect x="30" y="104" width="400" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="46" y="132" font-size="11.5" fill="#7f0000">屏幕无输出</text>
  <text x="46" y="154" font-size="11.5" fill="#7f0000">卡在厂商 logo 不动</text>
  <text x="46" y="176" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">no bootable device</text>

  <rect x="440" y="104" width="250" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="456" y="140" font-size="15" font-weight="bold" fill="#0d2f5c">① 固件</text>
  <text x="456" y="164" font-size="11.5" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">UEFI / BIOS</text>

  <rect x="700" y="104" width="470" height="104" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="716" y="132" font-size="11.5" fill="#1b3d1e">进 BIOS 看启动顺序与硬盘识别</text>
  <text x="716" y="154" font-size="11.5" fill="#1b3d1e">盘不被识别：先查线缆、背板</text>
  <text x="716" y="176" font-size="11.5" fill="#1b3d1e">再查 RAID 卡电池与阵列状态</text>

  <!-- ============ 行 2 引导器 ============ -->
  <rect x="30" y="220" width="400" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="46" y="248" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">grub&gt; 或 grub rescue&gt;</text>
  <text x="46" y="270" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">error: unknown filesystem</text>
  <text x="46" y="292" font-size="11.5" fill="#7f0000">连启动菜单都不出</text>

  <rect x="440" y="220" width="250" height="104" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="456" y="256" font-size="15" font-weight="bold" fill="#7f3f00">② 引导器</text>
  <text x="456" y="280" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">GRUB2</text>

  <rect x="700" y="220" width="470" height="104" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="716" y="248" font-size="11.5" fill="#1b3d1e">先在 grub&gt; 里 ls 找分区，确认盘还在</text>
  <text x="716" y="270" font-size="11.5" fill="#1b3d1e">救援盘启动，chroot 后重装引导</text>
  <text x="716" y="292" font-size="11.5" fill="#1b3d1e">动手前先备份 /boot</text>

  <!-- ============ 行 3 内核 ============ -->
  <rect x="30" y="336" width="400" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="46" y="364" font-size="11.5" fill="#7f0000">滚屏后停住不动</text>
  <text x="46" y="386" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">停在 dracut:/#</text>
  <text x="46" y="408" font-size="11.5" fill="#7f0000">内核报错后 panic</text>

  <rect x="440" y="336" width="250" height="104" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="456" y="372" font-size="15" font-weight="bold" fill="#123314">③ 内核</text>
  <text x="456" y="396" font-size="11.5" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">initramfs</text>

  <rect x="700" y="336" width="470" height="104" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="716" y="364" font-size="11.5" fill="#1b3d1e">查根分区、LVM 是否可见</text>
  <text x="716" y="386" font-size="11.5" fill="#1b3d1e">查 /etc/fstab 有没有写错的行</text>
  <text x="716" y="408" font-size="11.5" fill="#1b3d1e">必要时 dracut -f 重建内存盘</text>

  <!-- ============ 行 4 用户态 ============ -->
  <rect x="30" y="452" width="400" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="46" y="480" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">Welcome to emergency mode</text>
  <text x="46" y="502" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">A start job is running...</text>
  <text x="46" y="524" font-size="11.5" fill="#7f0000">等它超时，记下卡住的是哪个 unit</text>

  <rect x="440" y="452" width="250" height="104" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="456" y="488" font-size="15" font-weight="bold" fill="#311b92">④ 用户态</text>
  <text x="456" y="512" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">systemd</text>

  <rect x="700" y="452" width="470" height="104" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="716" y="480" font-size="11.5" fill="#1b3d1e">rescue.target：挂全盘的单用户</text>
  <text x="716" y="502" font-size="11.5" fill="#1b3d1e">emergency.target：只挂根、只读</text>
  <text x="716" y="524" font-size="11.5" fill="#1b3d1e">改 root 密码用 rd.break</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="572" width="1140" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="596" font-size="13" font-weight="bold" fill="#5d4037">三招从轻到重：rescue → emergency → rd.break。每一招都要先确认现象对得上，别乱试。</text>
  <text x="50" y="620" font-size="11.5" fill="#5d4037">判断依据只有屏幕 —— 所以动手前先把最后一屏拍下来，它决定了后面所有动作。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="656" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="671" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="682" font-size="12" fill="#37474f">① 固件层</text>
  <rect x="264" y="671" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="296" y="682" font-size="12" fill="#37474f">② 引导层</text>
  <rect x="488" y="671" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="520" y="682" font-size="12" fill="#37474f">③ 内核层</text>
  <rect x="712" y="671" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="744" y="682" font-size="12" fill="#37474f">④ 用户态</text>
  <rect x="936" y="671" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="968" y="682" font-size="12" fill="#37474f">该级失败表现</text>
</svg>
