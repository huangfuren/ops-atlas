<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>网络排查的五层顺序与每层的判断依据</title>
  <desc>五行依次是链路、地址、路由、端口、应用，每层只给一条命令和该看的字段：ip a 看 UP 与 LOWER_UP、ip a 看 inet 与掩码、ip route get 看 via dev src、ss -lntp 看监听、curl -v 看状态码。右侧一列给出不通过时说明什么，比如网线对端、配置没生效、缺网关、服务只听 127.0.0.1。底部提示同网段不必查路由层。</desc>

  <!-- 坐标表：画布 1200x720 | 表头 y=66 h=32 | 五行 x=30 w=1140 h=76 y=100/192/284/376/468 | 结论块 y=560 h=56 | 图例 y=634 h=65 -->

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">五层排查：顺序本身就是方法</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">跳着查会来回绕</text>

  <!-- ============ 表头 ============ -->
  <rect x="30" y="66" width="1140" height="32" fill="#eceff1"/>
  <text x="46" y="87" font-size="12.5" font-weight="bold" fill="#37474f">层</text>
  <text x="210" y="87" font-size="12.5" font-weight="bold" fill="#37474f">一条命令，看什么</text>
  <text x="750" y="87" font-size="12.5" font-weight="bold" fill="#37474f">不通过说明什么</text>

  <!-- ============ 1 链路 ============ -->
  <rect x="30" y="100" width="1140" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="132" font-size="17" font-weight="bold" fill="#123314">1</text>
  <text x="46" y="158" font-size="13" font-weight="bold" fill="#123314">链路</text>
  <text x="210" y="132" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">ip a</text>
  <text x="210" y="156" font-size="11.5" fill="#123314">看有没有 UP 与 LOWER_UP</text>
  <text x="750" y="144" font-size="11.5" fill="#123314">网线、对端、云平台网卡没挂上</text>

  <line x1="100" y1="176" x2="100" y2="190" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="112" y="188" font-size="10" fill="#388e3c">正常才往下</text>

  <!-- ============ 2 地址 ============ -->
  <rect x="30" y="192" width="1140" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="224" font-size="17" font-weight="bold" fill="#123314">2</text>
  <text x="46" y="250" font-size="13" font-weight="bold" fill="#123314">地址</text>
  <text x="210" y="224" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">ip a</text>
  <text x="210" y="248" font-size="11.5" fill="#123314">看 inet 与掩码</text>
  <text x="750" y="236" font-size="11.5" fill="#123314">配置没生效，或掩码与对端不一致</text>

  <line x1="100" y1="268" x2="100" y2="282" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="112" y="280" font-size="10" fill="#388e3c">正常才往下</text>

  <!-- ============ 3 路由 ============ -->
  <rect x="30" y="284" width="1140" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="316" font-size="17" font-weight="bold" fill="#123314">3</text>
  <text x="46" y="342" font-size="13" font-weight="bold" fill="#123314">路由</text>
  <text x="210" y="316" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">ip route get <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">目标</tspan>IP</text>
  <text x="210" y="340" font-size="11.5" fill="#123314">看 via / dev / src</text>
  <text x="750" y="328" font-size="11.5" fill="#123314">缺网关，或多网卡选错出口</text>

  <line x1="100" y1="360" x2="100" y2="374" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="112" y="372" font-size="10" fill="#388e3c">正常才往下</text>

  <!-- ============ 4 端口 ============ -->
  <rect x="30" y="376" width="1140" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="46" y="408" font-size="17" font-weight="bold" fill="#123314">4</text>
  <text x="46" y="434" font-size="13" font-weight="bold" fill="#123314">端口</text>
  <text x="210" y="408" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">ss -lntp</text>
  <text x="210" y="432" font-size="11.5" fill="#123314">再看防火墙与云安全组</text>
  <text x="750" y="420" font-size="11.5" fill="#123314">服务没起，或只听 127.0.0.1</text>

  <line x1="100" y1="452" x2="100" y2="466" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="112" y="464" font-size="10" fill="#388e3c">正常才往下</text>

  <!-- ============ 5 应用 ============ -->
  <rect x="30" y="468" width="1140" height="76" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="46" y="500" font-size="17" font-weight="bold" fill="#0d2f5c">5</text>
  <text x="46" y="526" font-size="13" font-weight="bold" fill="#0d2f5c">应用</text>
  <text x="210" y="500" font-size="12" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">curl -v</text>
  <text x="210" y="524" font-size="11.5" fill="#0d2f5c">看状态码与响应头</text>
  <text x="750" y="512" font-size="11.5" fill="#0d2f5c">握手成了，问题在应用自己，不在这四层</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="560" width="1140" height="56" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="584" font-size="12.5" font-weight="bold" fill="#5d4037">同网段只需查 1、2、4、5 层 —— 同网段不经过网关，去查路由是白费力气。</text>
  <text x="50" y="606" font-size="11.5" fill="#5d4037">每一层只要一条命令，通过才往下走；五层走完最多五步，比凭经验乱敲快得多。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="634" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="649" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="660" font-size="12" fill="#37474f">网络四层（链路 · 地址 · 路由 · 端口）</text>
  <rect x="420" y="649" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="452" y="660" font-size="12" fill="#37474f">应用层（最后一层）</text>
  <line x1="660" y1="656" x2="700" y2="656" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="660" font-size="12" fill="#37474f">该层通过，才进入下一层</text>
</svg>
