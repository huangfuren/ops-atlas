<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>标准输入输出的三条流与 2&gt;&amp;1 的复制语义</title>
  <desc>上行说明每个命令自带三个口：0 号标准输入从键盘读，1 号标准输出是命令结果、会被管道接走，2 号标准错误直接打到屏幕、不进程道，所以管道后面的 grep 抓不到报错。下行对比两种重定向顺序：先写大于号再写 2 大于 1，两条流都进文件；顺序反过来，2 已经指向终端再改 1 就没用了，stderr 仍留在屏幕上。</desc>

  <!-- 坐标表：画布 1200x680 | 三行 x=30 w=1140 h=64 y=76/148/220 | 两卡 w=560 y=336 h=164 | 结论块 y=516 h=64 | 图例 y=598 h=65 -->

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">三条流：管道只接走 1，2 要手动并进去</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">2&gt;&amp;1 = 复制此刻指向</text>

  <!-- ============ 区① 三条流 ============ -->
  <text x="30" y="66" font-size="12" fill="#616161">① 每个命令三个口：0 读输入、1 出结果、2 出报错</text>

  <rect x="30" y="76" width="1140" height="64" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="50" y="118" font-size="20" font-weight="bold" fill="#0d2f5c">0</text>
  <text x="100" y="106" font-size="13" font-weight="bold" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">stdin</text>
  <text x="100" y="126" font-size="11" fill="#0d2f5c">标准输入</text>
  <text x="270" y="116" font-size="11.5" fill="#0d2f5c">键盘输入 → 命令</text>
  <text x="620" y="116" font-size="11.5" fill="#0d2f5c">不写就是终端；脚本里可用 &lt; 文件 换掉</text>

  <rect x="30" y="148" width="1140" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="50" y="190" font-size="20" font-weight="bold" fill="#123314">1</text>
  <text x="100" y="178" font-size="13" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">stdout</text>
  <text x="100" y="198" font-size="11" fill="#123314">标准输出</text>
  <text x="270" y="188" font-size="11.5" fill="#123314">命令的正常结果 → 屏幕或管道</text>
  <text x="620" y="188" font-size="11.5" fill="#123314">管道 | 只接走这一条，所以 grep 搜得到</text>

  <rect x="30" y="220" width="1140" height="64" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="50" y="262" font-size="20" font-weight="bold" fill="#7f0000">2</text>
  <text x="100" y="250" font-size="13" font-weight="bold" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">stderr</text>
  <text x="100" y="270" font-size="11" fill="#7f0000">标准错误</text>
  <text x="270" y="260" font-size="11.5" fill="#7f0000">报错直接打到屏幕，默认不进管道</text>
  <text x="620" y="260" font-size="11.5" fill="#7f0000">「管道后面 grep 不到报错」就是这个原因</text>

  <!-- ============ 区② 2>&1 的两种顺序 ============ -->
  <text x="30" y="318" font-size="12" fill="#616161">② 2&gt;&amp;1 是「复制 1 此刻的指向」，写在 &gt; 前还是后，结果不同</text>

  <rect x="30" y="336" width="560" height="164" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="50" y="362" font-size="13" font-weight="bold" fill="#1b5e20" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">对：</tspan>cmd &gt; out.log 2&gt;&amp;1</text>
  <text x="50" y="388" font-size="11.5" fill="#1b3d1e">第一步：把 1 指向文件　→　1 = out.log</text>
  <text x="50" y="410" font-size="11.5" fill="#1b3d1e">第二步：把 2 指向「1 现在指的地方」→ 2 = out.log</text>
  <text x="50" y="432" font-size="11.5" fill="#1b3d1e">结果：两条流都进 out.log，屏幕干净</text>
  <rect x="50" y="448" width="520" height="36" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="64" y="471" font-size="11" fill="#1b3d1e">顺序记法：先把 1 安顿好，再让 2 复制 1</text>

  <rect x="610" y="336" width="560" height="164" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="630" y="362" font-size="13" font-weight="bold" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">错：</tspan>cmd 2&gt;&amp;1 &gt; out.log</text>
  <text x="630" y="388" font-size="11.5" fill="#7f0000">第一步：把 2 指向「1 现在指的地方」—— 此时还是终端</text>
  <text x="630" y="410" font-size="11.5" fill="#7f0000">第二步：把 1 指向文件 —— 2 已经定型，仍指着终端</text>
  <text x="630" y="432" font-size="11.5" fill="#7f0000">结果：stderr 留在屏幕，stdout 进了文件</text>
  <rect x="630" y="448" width="520" height="36" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="644" y="471" font-size="11" fill="#7f0000">这个顺序只在终端上看日志时有用，写脚本别用</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="516" width="1140" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="540" font-size="12.5" font-weight="bold" fill="#5d4037">记法：2&gt;&amp;1 永远写在 &gt; 后面；&amp;&gt; 是等价的新写法，脚本里写 &gt; out.log 2&gt;&amp;1 更保险。</text>
  <text x="50" y="564" font-size="11.5" fill="#5d4037">进管道同理：find / -name "*.conf" 2&gt;&amp;1 | grep -i denied —— 先并流，再进管道。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="598" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="613" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="624" font-size="12" fill="#37474f">0 标准输入</text>
  <rect x="264" y="613" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="296" y="624" font-size="12" fill="#37474f">1 标准输出（进管道）</text>
  <rect x="560" y="613" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="592" y="624" font-size="12" fill="#37474f">2 标准错误 / 错误顺序</text>
  <rect x="870" y="613" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="902" y="624" font-size="12" fill="#37474f">正确顺序</text>
</svg>
