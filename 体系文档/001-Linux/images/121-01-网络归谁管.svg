<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>网络配置归属的四级判断与兜底办法</title>
  <desc>从上往下依次判断网络由谁管理：存在 /etc/netplan 就归 netplan，改 yaml 后 netplan apply；存在 /etc/network/interfaces 就归 ifupdown，改完重启 networking；存在 ifcfg 文件就归 network-scripts；存在 nmconnection 就归 NetworkManager keyfile，后两者都用 nmcli。四样都没有只剩 ip addr add 的临时办法。底部结论是文件存在不等于有人在读它。</desc>

  <!-- 坐标表：画布 1200x680 | 四行卡 x=30 w=1140 h=84 y=76/172/268/364 | 兜底条 y=464 h=44 | 结论块 y=524 h=56 | 图例 y=596 h=65 -->

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">改哪个文件才生效：先问网络归谁管</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">改错文件等于没改</text>

  <!-- ============ 表头 ============ -->
  <text x="30" y="66" font-size="12" fill="#616161">从上往下问，第一个命中的就是答案</text>

  <!-- ============ 行1 netplan ============ -->
  <rect x="30" y="76" width="1140" height="84" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="50" y="124" font-size="17" font-weight="bold" fill="#0d2f5c">1</text>
  <text x="86" y="112" font-size="11" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">ls /etc/netplan/</text>
  <text x="86" y="134" font-size="11" fill="#0d2f5c">有 *.yaml 吗</text>
  <text x="350" y="118" font-size="14" font-weight="bold" fill="#0d2f5c">netplan</text>
  <text x="350" y="138" font-size="11" fill="#0d2f5c">Ubuntu 17.10 之后</text>
  <text x="500" y="112" font-size="11.5" fill="#0d2f5c">改 yaml，然后 netplan apply</text>
  <text x="500" y="134" font-size="11" fill="#0d2f5c">先用 netplan try，语法错会自动回滚</text>
  <text x="830" y="124" font-size="11" fill="#0d2f5c">现代 Ubuntu 只认它，别再改 interfaces</text>

  <!-- ============ 行2 ifupdown ============ -->
  <rect x="30" y="172" width="1140" height="84" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="50" y="220" font-size="17" font-weight="bold" fill="#123314">2</text>
  <text x="86" y="208" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">/etc/network/interfaces</text>
  <text x="86" y="230" font-size="11" fill="#123314">这个文件在吗</text>
  <text x="350" y="214" font-size="14" font-weight="bold" fill="#123314">ifupdown</text>
  <text x="350" y="234" font-size="11" fill="#123314">Debian 系传统写法</text>
  <text x="500" y="208" font-size="11.5" fill="#123314">改 interfaces，重启 networking</text>
  <text x="500" y="230" font-size="11" fill="#123314">systemctl restart networking 即可生效</text>
  <text x="830" y="220" font-size="11" fill="#123314">Ubuntu 17.10 之前也是这一套</text>

  <!-- ============ 行3 network-scripts ============ -->
  <rect x="30" y="268" width="1140" height="84" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="50" y="316" font-size="17" font-weight="bold" fill="#7f3f00">3</text>
  <text x="86" y="304" font-size="11" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">ls /etc/sysconfig/</text>
  <text x="86" y="318" font-size="11" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">network-scripts/</text>
  <text x="86" y="340" font-size="11" fill="#7f3f00">有 ifcfg-* 吗</text>
  <text x="350" y="310" font-size="14" font-weight="bold" fill="#7f3f00">network-scripts</text>
  <text x="350" y="330" font-size="11" fill="#7f3f00">CentOS 7 标准位置</text>
  <text x="500" y="304" font-size="11.5" fill="#7f3f00">nmcli c reload 后 nmcli c up 名字</text>
  <text x="500" y="326" font-size="11" fill="#7f3f00">NetworkManager 没跑就 restart network</text>
  <text x="830" y="316" font-size="11" fill="#7f3f00">CentOS 8 起已废弃，改用下面的 keyfile</text>

  <!-- ============ 行4 NM keyfile ============ -->
  <rect x="30" y="364" width="1140" height="84" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="50" y="412" font-size="17" font-weight="bold" fill="#311b92">4</text>
  <text x="86" y="400" font-size="11" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">ls /etc/NetworkManager/</text>
  <text x="86" y="414" font-size="11" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">system-connections/</text>
  <text x="86" y="436" font-size="11" fill="#311b92">有 *.nmconnection 吗</text>
  <text x="350" y="406" font-size="13" font-weight="bold" fill="#311b92">NM keyfile</text>
  <text x="350" y="426" font-size="11" fill="#311b92">Rocky 9 / RHEL 9 起默认</text>
  <text x="500" y="400" font-size="11.5" fill="#311b92">同样用 nmcli，不再手写 ifcfg</text>
  <text x="500" y="422" font-size="11" fill="#311b92">nmcli c show 看全部连接名</text>
  <text x="830" y="412" font-size="11" fill="#311b92">文件权限必须 600，否则 NM 不读</text>

  <!-- ============ 兜底 ============ -->
  <rect x="30" y="464" width="1140" height="44" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="50" y="492" font-size="12.5" font-weight="bold" fill="#546e7a">四样都没有 → 只剩临时办法</text>
  <text x="290" y="492" font-size="11.5" fill="#546e7a" font-family="ui-monospace,Menlo,Consolas,monospace">ip addr add 10.0.0.5/24 dev eth0</text>
  <text x="620" y="492" font-size="11.5" fill="#546e7a">重启就没了 —— 排障时验证连通性用它，不是配置手段</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="524" width="1140" height="56" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="548" font-size="12.5" font-weight="bold" fill="#5d4037">文件存在，不等于有人在读它：改了不生效，先确认归谁管。</text>
  <text x="50" y="570" font-size="11.5" fill="#5d4037">这一册一半的排查时间浪费在这里 —— 系统里同时躺着两套配置时会互相打架。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="596" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="611" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="72" y="622" font-size="12" fill="#37474f">netplan（Ubuntu 新）</text>
  <rect x="264" y="611" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="296" y="622" font-size="12" fill="#37474f">ifupdown（Debian 传统）</text>
  <rect x="530" y="611" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="562" y="622" font-size="12" fill="#37474f">network-scripts（CentOS 7）</text>
  <rect x="810" y="611" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="842" y="622" font-size="12" fill="#37474f">NM keyfile（RHEL 9）</text>
  <rect x="1040" y="611" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="1072" y="622" font-size="12" fill="#37474f">临时</text>
</svg>
