<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>set -euo pipefail 的三个开关、三个漏网与 local 陷阱</title>
  <desc>上行是三个开关各自的防护范围与缺失后果：-e 遇非零退出，-u 防止未定义变量被展开成空值，-o pipefail 让管道任一段失败就整体失败。中行是 -e 的三个漏网：if 与 while 的条件、|| 与 &amp;&amp; 的左侧、! 取反，这些地方的失败是正常答案，不会被 -e 拦。下行是最隐蔽的 local 陷阱：local v=$(false) 会把命令替换的失败吞掉，退出码变成 local 自己的 0，正确做法是分两行写。</desc>

  <!-- 坐标表：画布 1200x735 | 区①三行 h=64 y=76/146/216 | 列 开关 x=50 / 作用 x=270 / 后果 x=630 | 区②三卡 w=360 pitch=390 y=314 h=100 | 区③条 y=448 h=100 | 结论块 y=564 h=64 | 图例 y=646 h=65 -->

  <rect x="0" y="0" width="1200" height="735" fill="#ffffff"/>

  <!-- ============ 标题 ============ -->
  <text x="30" y="42" font-size="20" font-weight="bold" fill="#263238">set -euo pipefail：拦住明处的死法，漏掉暗处的失败</text>
  <text x="1170" y="42" font-size="12" fill="#616161" text-anchor="end">防手滑删库，靠的是 -u</text>

  <!-- ============ 区① 三个开关 ============ -->
  <text x="30" y="66" font-size="12" fill="#616161">① 三个开关，各管一类死法</text>

  <rect x="30" y="76" width="1140" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="50" y="104" font-size="15" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">-e</text>
  <text x="50" y="126" font-size="11" fill="#123314">errexit</text>
  <text x="270" y="116" font-size="11.5" fill="#123314">任何命令返回非 0 就立刻退出脚本</text>
  <text x="630" y="104" font-size="11.5" fill="#7f0000">少了它：cd 失败了，</text>
  <text x="630" y="126" font-size="11.5" fill="#7f0000">后面还在错误的目录里删东西</text>

  <rect x="30" y="146" width="1140" height="64" rx="6" fill="#a5d6a7" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="50" y="174" font-size="15" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">-u</text>
  <text x="50" y="196" font-size="11" fill="#123314">nounset</text>
  <text x="270" y="186" font-size="11.5" fill="#123314">用到未定义变量就退出，而不是当成空串</text>
  <text x="630" y="174" font-size="11.5" fill="#123314">少了它：DIR 拼错成 DIRR，展开成空，</text>
  <text x="630" y="196" font-size="11.5" fill="#123314">rm -rf "" 的后果不用多说 —— 这条最值钱</text>

  <rect x="30" y="216" width="1140" height="64" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="50" y="244" font-size="15" font-weight="bold" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">-o pipefail</text>
  <text x="50" y="266" font-size="11" fill="#123314">管道</text>
  <text x="270" y="256" font-size="11.5" fill="#123314">管道里任意一段失败，整条管道就算失败</text>
  <text x="630" y="244" font-size="11.5" fill="#7f0000">少了它：cmd | tee log 里 cmd 崩了，</text>
  <text x="630" y="266" font-size="11.5" fill="#7f0000">tee 成功，整条管道仍然算成功</text>

  <!-- ============ 区② -e 的三个漏网 ============ -->
  <text x="30" y="300" font-size="12" fill="#616161">② -e 的三个漏网：失败是「正常答案」的地方</text>

  <rect x="30" y="314" width="360" height="100" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="50" y="340" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">if / while <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">条件</tspan></text>
  <text x="50" y="364" font-size="11.5" fill="#7f3f00">if false 不会退出</text>
  <text x="50" y="386" font-size="11" fill="#7f3f00">失败正是 if 在问「成不成」的正常答案</text>
  <text x="50" y="404" font-size="11" fill="#7f3f00">条件里要自己判返回码</text>

  <rect x="420" y="314" width="360" height="100" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="440" y="340" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">|| <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">与</tspan> &amp;&amp; <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">的左边</tspan></text>
  <text x="440" y="364" font-size="11.5" fill="#7f3f00">false || echo 照样执行</text>
  <text x="440" y="386" font-size="11" fill="#7f3f00">cmd || true 是「明确忽略错误」的写法</text>
  <text x="440" y="404" font-size="11" fill="#7f3f00">既然你写了兜底，就不该再被 -e 打断</text>

  <rect x="810" y="314" width="360" height="100" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="830" y="340" font-size="13" font-weight="bold" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">! <tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">取反</tspan></text>
  <text x="830" y="364" font-size="11.5" fill="#7f3f00">! true 变成失败，不触发退出</text>
  <text x="830" y="386" font-size="11" fill="#7f3f00">取反本身就是「我要处理这个失败」</text>
  <text x="830" y="404" font-size="11" fill="#7f3f00">但 x=$(false) 不取反，照样退出 —— 见 ③</text>

  <!-- ============ 区③ local 陷阱 ============ -->
  <text x="30" y="434" font-size="12" fill="#616161">③ 最隐蔽的洞：local 把命令替换的失败吞掉</text>

  <rect x="30" y="448" width="560" height="100" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="50" y="474" font-size="13" font-weight="bold" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">错：</tspan>local v=$(false)</text>
  <text x="50" y="496" font-size="11.5" fill="#7f0000">失败被吞，脚本 exit 0 照常往下跑。</text>
  <text x="50" y="518" font-size="11" fill="#7f0000">这行的退出码是 local 自己的，恒 0，</text>
  <text x="50" y="538" font-size="11" fill="#7f0000">命令替换的 1 被盖掉；declare / export 同理。</text>

  <rect x="610" y="448" width="560" height="100" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="630" y="474" font-size="13" font-weight="bold" fill="#1b5e20" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif">对：</tspan>local v; v=$(false)</text>
  <text x="630" y="496" font-size="11.5" fill="#1b3d1e">先单独声明，下一行再赋值 —— 失败就拦得住。</text>
  <text x="630" y="518" font-size="11" fill="#1b3d1e">函数里每一个 $( ) 赋值都值得这么拆开写。</text>
  <text x="630" y="538" font-size="11" fill="#1b3d1e">这行很短，但漏一次就是数据事故。</text>

  <!-- ============ 结论块 ============ -->
  <rect x="30" y="564" width="1140" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="50" y="588" font-size="12.5" font-weight="bold" fill="#5d4037">加了 ≠ 安全：三个漏网点都在「失败是正常答案」的地方 —— 那里要你自己处理失败，而不是指望 -e。</text>
  <text x="50" y="612" font-size="11.5" fill="#5d4037">函数里每一个 $( ) 赋值都值得拆成两行；这行代码不长，但漏一次就是数据事故。</text>

  <!-- ============ 图例 ============ -->
  <rect x="30" y="646" width="1140" height="65" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="40" y="661" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="72" y="672" font-size="12" fill="#37474f">生效的开关</text>
  <rect x="264" y="661" width="22" height="14" rx="3" fill="#a5d6a7" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="296" y="672" font-size="12" fill="#37474f">最值钱的一条（-u）</text>
  <rect x="560" y="661" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="592" y="672" font-size="12" fill="#37474f">-e 拦不住的地方</text>
  <rect x="836" y="661" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="868" y="672" font-size="12" fill="#37474f">静默失败的写法</text>
</svg>
