<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>location 匹配决策：四种修饰符的生效顺序</title>
  <desc>请求 URI 进来后按固定顺序裁决：先看等号精确匹配，命中立即结束；否则找最长前缀匹配并记住它，若它带 ^~ 就直接使用跳过正则；否则按文件顺序逐条试正则，第一条命中的生效；正则全不中时回到刚才记住的最长前缀。右侧是四种修饰符的写法示例与工程纪律，浏览器排障用 curl -I 打目标 URI 并把 error_log 升到 notice 级，能看到 Nginx 选中了哪个 location。</desc>

  <rect x="0" y="0" width="1200" height="710" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <!-- 标题 + 数据来源 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">location 匹配：顺序决定一切</text>
  <text x="40" y="76" font-size="12" fill="#616161">来源：007-接入层 111 §1.5 · 排障见 121 §7.7 · 截止 2026-11-26</text>
  <text x="1160" y="76" font-size="12" fill="#616161" text-anchor="end">error_log notice 可见选中过程</text>

  <!-- 请求入口 -->
  <rect x="40" y="100" width="690" height="38" rx="19" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="385" y="125" font-size="15" font-weight="bold" fill="#37474f" text-anchor="middle">请求 URI 进来</text>
  <line x1="385" y1="138" x2="385" y2="152" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ① 精确匹配 -->
  <rect x="40" y="154" width="690" height="66" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="180" font-size="15" font-weight="bold" fill="#0d2f5c">① 有 = 精确匹配命中？</text>
  <text x="60" y="204" font-size="11.5" fill="#0d2f5c">location = /healthz —— 命中即结束，零回溯</text>
  <rect x="600" y="172" width="116" height="30" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="658" y="192" font-size="11.5" fill="#123314" text-anchor="middle">命中 → 用它</text>
  <line x1="385" y1="220" x2="385" y2="234" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="232" font-size="11" fill="#616161">否，继续</text>

  <!-- ② 最长前缀 -->
  <rect x="40" y="236" width="690" height="66" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="262" font-size="15" font-weight="bold" fill="#0d2f5c">② 找最长前缀匹配，并记住它</text>
  <text x="60" y="286" font-size="11.5" fill="#0d2f5c">若它是 ^~ 前缀 → 直接用它，跳过正则</text>
  <rect x="600" y="254" width="116" height="30" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="658" y="274" font-size="11.5" fill="#123314" text-anchor="middle">^~ → 用它</text>
  <line x1="385" y1="302" x2="385" y2="316" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="314" font-size="11" fill="#616161">不带 ^~ 才继续</text>

  <!-- ③ 正则 -->
  <rect x="40" y="318" width="690" height="66" rx="6" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="60" y="344" font-size="15" font-weight="bold" fill="#7f3f00">③ 按文件顺序逐条试正则（~ / ~*）</text>
  <text x="60" y="368" font-size="11.5" fill="#5d4700">第一条命中的生效 —— 顺序敏感，重排会变行为</text>
  <rect x="600" y="336" width="116" height="30" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="658" y="356" font-size="11.5" fill="#123314" text-anchor="middle">命中 → 用它</text>
  <line x1="385" y1="384" x2="385" y2="398" stroke="#607d8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="396" font-size="11" fill="#616161">正则全不中</text>

  <!-- ④ 回到最长前缀 -->
  <rect x="40" y="400" width="690" height="62" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="426" font-size="15" font-weight="bold" fill="#0d2f5c">④ 回到 ② 记住的最长前缀</text>
  <text x="60" y="450" font-size="11.5" fill="#0d2f5c">location / 作兜底永远存在</text>

  <!-- 右侧修饰符清单 -->
  <text x="770" y="130" font-size="15" font-weight="bold" fill="#263238">四种修饰符</text>

  <rect x="770" y="146" width="390" height="64" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="790" y="172" font-size="15" font-weight="bold" fill="#311b92">=　精确匹配</text>
  <text x="790" y="196" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">location = /healthz</text>

  <rect x="770" y="222" width="390" height="64" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="790" y="248" font-size="15" font-weight="bold" fill="#311b92">^~　前缀且跳过正则</text>
  <text x="790" y="272" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">location ^~ /static/</text>

  <rect x="770" y="298" width="390" height="64" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="790" y="324" font-size="15" font-weight="bold" fill="#311b92">~ / ~*　正则</text>
  <text x="790" y="348" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">location ~ \.php$　（~* 忽略大小写）</text>

  <rect x="770" y="374" width="390" height="64" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="790" y="400" font-size="15" font-weight="bold" fill="#311b92">无修饰符　普通前缀</text>
  <text x="790" y="424" font-size="11.5" fill="#311b92" font-family="ui-monospace,Menlo,Consolas,monospace">location /api/　（也可能成为最长前缀）</text>

  <rect x="770" y="450" width="390" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="790" y="476" font-size="13" font-weight="bold" fill="#bf360c">SPA 必备（刷新不 404）</text>
  <text x="790" y="500" font-size="11.5" fill="#5d4037" font-family="ui-monospace,Menlo,Consolas,monospace">try_files $uri $uri/ /index.html</text>

  <!-- 排障条 -->
  <rect x="40" y="482" width="690" height="80" rx="6" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="60" y="508" font-size="13" font-weight="bold" fill="#37474f">排障：看清 Nginx 到底选了哪个 location</text>
  <text x="60" y="532" font-size="11.5" fill="#616161">curl -I 打目标 URI；error_log 升到 notice 级，日志里能看到匹配过程（121 §7.7）</text>
  <text x="60" y="552" font-size="11.5" fill="#616161">改完必须 nginx -t 再 reload——location 顺序一换，行为跟着换</text>

  <!-- 结论块 -->
  <rect x="40" y="576" width="1120" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="606" font-size="15" font-weight="bold" fill="#bf360c">★ 顺序是硬规则：精确 → 最长前缀（^~ 截断）→ 正则（先到先得）→ 回前缀</text>
  <text x="60" y="632" font-size="12.5" fill="#5d4037">静态目录用 ^~ 免受正则误伤；高频探测路径写 =；SPA 用 try_files 兜底——都是把顺序写死，不靠猜</text>

  <!-- 图例 -->
  <rect x="40" y="662" width="1120" height="42" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="60" y="675" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="686" font-size="12" fill="#37474f">精确 / 前缀判定</text>
  <rect x="280" y="675" width="22" height="14" rx="3" fill="#ffcc80" stroke="#e65100" stroke-width="1"/>
  <text x="312" y="686" font-size="12" fill="#37474f">正则（顺序敏感）</text>
  <rect x="520" y="675" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="552" y="686" font-size="12" fill="#37474f">命中即止</text>
  <rect x="740" y="675" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="772" y="686" font-size="12" fill="#37474f">修饰符写法</text>
  <text x="1000" y="686" font-size="12" fill="#7f0000">红字步骤＝排障入口</text>
</svg>
