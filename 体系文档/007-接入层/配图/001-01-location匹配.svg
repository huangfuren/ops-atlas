<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>location 匹配决策：四种修饰符的生效顺序</title>
  <desc>请求 URI 进来后按固定顺序裁决：先看等号精确匹配，命中立即结束；否则找最长前缀匹配并记住它，若它带 ^~ 就直接使用跳过正则；否则按文件顺序逐条试正则，第一条命中的生效；正则全不中时回到刚才记住的最长前缀。右侧是四种修饰符的写法示例与工程纪律。</desc>

  <rect width="680" height="400" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">location 匹配：顺序决定一切</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">error_log notice 可见选中过程</text>

  <defs>
    <marker id="f1Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- 请求入口 -->
  <rect x="40" y="50" width="200" height="30" rx="15" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.4"/>
  <text x="140" y="70" font-size="8.6" font-weight="600" fill="#37474F" text-anchor="middle">请求 URI 进来</text>
  <line x1="140" y1="80" x2="140" y2="96" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#f1Blue)"/>

  <!-- ① -->
  <rect x="40" y="100" width="300" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="54" y="118" font-size="8.6" font-weight="600" fill="#1F4468">① 有 = 精确匹配命中？</text>
  <text x="54" y="134" font-size="7.4" fill="#4A4945">location = /healthz —— 命中即结束，零回溯</text>
  <text x="352" y="122" font-size="7.8" font-weight="600" fill="#1D5A45">是 → 用它 ✓</text>
  <text x="352" y="138" font-size="7.4" fill="#8C8980">否 ↓（高频探测路径必写 =）</text>
  <line x1="140" y1="144" x2="140" y2="160" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#f1Blue)"/>

  <!-- ② -->
  <rect x="40" y="164" width="300" height="44" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="54" y="182" font-size="8.6" font-weight="600" fill="#1F4468">② 找最长前缀匹配，并记住它</text>
  <text x="54" y="198" font-size="7.4" fill="#4A4945">若它是 ^~ 前缀 → 直接用它，跳过正则</text>
  <text x="352" y="186" font-size="7.8" font-weight="600" fill="#1D5A45">^~ → 用它 ✓</text>
  <text x="352" y="202" font-size="7.4" fill="#8C8980">静态目录用 ^~ 免受正则误伤</text>
  <line x1="140" y1="208" x2="140" y2="224" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#f1Blue)"/>
  <text x="148" y="220" font-size="7.2" fill="#8C8980">不带 ^~ 才继续 ↓</text>

  <!-- ③ -->
  <rect x="40" y="228" width="300" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="54" y="246" font-size="8.6" font-weight="600" fill="#7A4A12">③ 按文件顺序逐条试正则（~ / ~*）</text>
  <text x="54" y="262" font-size="7.4" fill="#7A4A12">第一条命中的生效 —— 顺序敏感，重排会变行为</text>
  <text x="352" y="250" font-size="7.8" font-weight="600" fill="#1D5A45">命中 → 用它 ✓</text>
  <text x="352" y="266" font-size="7.4" fill="#8C8980">全不中 ↓</text>
  <line x1="140" y1="272" x2="140" y2="288" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#f1Blue)"/>
  <text x="148" y="284" font-size="7.2" fill="#8C8980">全不中</text>

  <!-- ④ -->
  <rect x="40" y="292" width="300" height="44" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="54" y="310" font-size="8.6" font-weight="600" fill="#4A4945">④ 回到 ② 记住的最长前缀</text>
  <text x="54" y="326" font-size="7.4" fill="#8C8980">location / 作兜底永远存在</text>

  <!-- 右侧修饰符清单 -->
  <text x="380" y="96" font-size="9.5" font-weight="600" fill="#4A4945">四种修饰符</text>
  <rect x="380" y="104" width="264" height="52" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="392" y="122" font-size="8" font-weight="600" fill="#2B2A27">=   精确匹配（/healthz）</text>
  <text x="392" y="140" font-size="8" font-weight="600" fill="#2B2A27">^~  前缀且跳过正则（/static/）</text>
  <rect x="380" y="162" width="264" height="52" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="392" y="180" font-size="8" font-weight="600" fill="#2B2A27">~   正则，区分大小写（\.php$）</text>
  <text x="392" y="198" font-size="8" font-weight="600" fill="#2B2A27">~*  正则，不区分大小写</text>
  <rect x="380" y="220" width="264" height="52" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="392" y="238" font-size="8" font-weight="600" fill="#2B2A27">无修饰符  普通前缀（/api/）</text>
  <text x="392" y="256" font-size="7.6" fill="#8C8980">也可能成为 ② 的"最长前缀"</text>

  <rect x="380" y="284" width="264" height="52" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="392" y="302" font-size="8" font-weight="600" fill="#7A4A12">SPA 必备：</text>
  <text x="392" y="320" font-size="7.8" fill="#7A4A12">try_files $uri $uri/ /index.html</text>

  <text x="32" y="384" font-size="9" fill="#8C8980">排障：curl -I 打目标 URI + error_log 升到 notice 级，能看到 Nginx 选中了哪个 location（007 §7.7）。</text>
</svg>
