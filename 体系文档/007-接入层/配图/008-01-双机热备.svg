<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 758.82" width="1200" height="758.82" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>双机热备：正常态与主故障态的 VIP 漂移</title>
  <desc>正常态：用户访问 VIP，LB-1 是 MASTER 持有 VIP，每秒向 LB-2 发 VRRP 通告，两台都把流量转给后端集群。故障态：LB-1 停止服务后，LB-2 约 3 秒收不到通告就接管 VIP，流量继续，中断时长秒级。漂移时长由 advert_int 与抢占机制决定，演练覆盖停服务与断网卡两种故障注入。</desc>

  <rect width="680" height="430" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">双机热备：VIP 漂移，秒级接管</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">演练过的才算高可用</text>

  <defs>
    <marker id="c8Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="c8Red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>

  <!-- ============ 正常态 ============ -->
  <text x="40" y="56" font-size="9.5" font-weight="600" fill="#4A4945">① 正常态：VIP 在 MASTER 上</text>

  <rect x="40" y="66" width="110" height="30" rx="15" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.4"/>
  <text x="95" y="86" font-size="8.6" font-weight="600" fill="#37474F" text-anchor="middle">用户</text>
  <line x1="150" y1="81" x2="204" y2="81" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c8Blue)"/>
  <text x="177" y="74" font-size="7.4" fill="#8C8980" text-anchor="middle">VIP</text>

  <rect x="210" y="66" width="180" height="30" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1.4"/>
  <text x="300" y="86" font-size="8.6" font-weight="600" fill="#1D5A45" text-anchor="middle">LB-1 · MASTER · 持有 VIP</text>

  <rect x="450" y="66" width="180" height="30" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="540" y="86" font-size="8.6" font-weight="600" fill="#4A4945" text-anchor="middle">LB-2 · BACKUP · 待命</text>

  <line x1="390" y1="81" x2="446" y2="81" stroke="#9C8ACB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="418" y="74" font-size="7" fill="#46337A" text-anchor="middle">VRRP 通告 1s</text>

  <line x1="300" y1="96" x2="300" y2="118" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c8Blue)"/>
  <line x1="540" y1="96" x2="540" y2="118" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c8Blue)"/>

  <rect x="210" y="122" width="420" height="26" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="420" y="139" font-size="8.2" fill="#4A4945" text-anchor="middle">后端集群 × N（HAProxy 主动检查 / Nginx upstream）</text>

  <line x1="32" y1="162" x2="648" y2="162" stroke="#EDEAE2" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ============ 故障态 ============ -->
  <text x="40" y="184" font-size="9.5" font-weight="600" fill="#4A4945">② 主故障态：LB-1 停止 keepalived</text>

  <rect x="40" y="194" width="110" height="30" rx="15" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.4"/>
  <text x="95" y="214" font-size="8.6" font-weight="600" fill="#37474F" text-anchor="middle">用户</text>
  <line x1="150" y1="209" x2="404" y2="209" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c8Blue)"/>
  <text x="270" y="202" font-size="7.4" fill="#1D5A45" text-anchor="middle">VIP 已漂移（中断 1-3 秒）</text>

  <rect x="210" y="194" width="180" height="30" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1.4"/>
  <text x="300" y="214" font-size="8.6" font-weight="600" fill="#7A322B" text-anchor="middle">LB-1 · DOWN（注入故障）</text>

  <rect x="450" y="194" width="180" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.4"/>
  <text x="540" y="214" font-size="8.6" font-weight="600" fill="#7A4A12" text-anchor="middle">LB-2 · 接管 VIP（3 秒内）</text>

  <line x1="390" y1="209" x2="446" y2="209" stroke="#D2948C" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#c8Red)"/>
  <text x="418" y="234" font-size="7" fill="#7A322B" text-anchor="middle">通告中断 ≥3×advert_int → 接管</text>

  <line x1="540" y1="224" x2="540" y2="246" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#c8Blue)"/>

  <rect x="210" y="250" width="420" height="26" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="420" y="267" font-size="8.2" fill="#4A4945" text-anchor="middle">后端集群 × N（LB-2 继续转发，业务无感）</text>

  <!-- 演练要点 -->
  <rect x="40" y="292" width="604" height="70" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="312" font-size="8.4" font-weight="600" fill="#7A4A12">演练六步（8.8）：基线 → 停 keepalived → 验证 VIP 漂移与中断时长 → 告警是否响 → 回切 → 复盘</text>
  <text x="52" y="330" font-size="7.8" fill="#7A4A12">回切默认 preempt：主恢复会抢回 VIP（二次切换）；nopreempt 则备机不还——团队约定一种</text>
  <text x="52" y="348" font-size="7.8" fill="#7A4A12">两种故障注入都要做：stop 服务（验证逻辑）+ 断网卡（验证最坏场景）</text>

  <text x="32" y="396" font-size="9" fill="#8C8980">已建立的 TCP 连接会断：短连接业务无感，长连接业务需要重连逻辑——「秒级漂移」的真实含义（8.8）。</text>
  <text x="32" y="416" font-size="9" fill="#8C8980">脑裂预防：防火墙放行 vrrp 协议；云上 VPC 无组播，改 unicast_peer 单播（8.3）。两台配置必须同源（Ansible 下发）。</text>

  </g>
</svg>
