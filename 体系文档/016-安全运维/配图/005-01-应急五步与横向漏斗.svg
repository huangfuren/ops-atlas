<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="706" viewBox="0 0 1200 706" xmlns="http://www.w3.org/2000/svg">
  <title>应急响应五步与横向排查漏斗</title>
  <desc>上：应急五步主链（准备→遏制→根除→恢复→复盘）；下左：全网横向排查漏斗四层；下右：可疑进程四特征。来源：真实安全收口事件教材化，2026-11-08。</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>
  <g transform="scale(1.7647058824)" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <defs>
      <marker id="a5Blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#7FA6D0"/>
      </marker>
      <marker id="a5Amber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#D9A458"/>
      </marker>
    </defs>

    <!-- 标题与来源 -->
    <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">应急响应五步与横向排查漏斗</text>
    <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">「安全运维」005 · 防御视角</text>

    <!-- 上半：五步主链 -->
    <text x="32" y="50" font-size="9.5" fill="#4A4945">应急五步——顺序不能乱，每步有产出：</text>
    <!-- 五卡：x=32,160,288,416,544 w=104 h=66 y=58 -->
    <rect x="32" y="58" width="104" height="66" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
    <circle cx="48" cy="74" r="9" fill="#1F4468"/>
    <text x="48" y="77.5" font-size="9" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="63" y="77.5" font-size="10.5" font-weight="600" fill="#1F4468">准备</text>
    <text x="40" y="94" font-size="8.5" fill="#4A4945">联系人清单·隔离预案</text>
    <text x="40" y="106" font-size="8.5" fill="#4A4945">取证工具·备份</text>
    <text x="40" y="118" font-size="8" fill="#8C8980">没准备的应急=现场发挥</text>

    <rect x="160" y="58" width="104" height="66" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
    <circle cx="176" cy="74" r="9" fill="#7A322B"/>
    <text x="176" y="77.5" font-size="9" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="191" y="77.5" font-size="10.5" font-weight="600" fill="#7A322B">遏制</text>
    <text x="168" y="94" font-size="8.5" fill="#4A4945">防火墙断网隔离</text>
    <text x="168" y="106" font-size="8.5" fill="#4A4945">⚠ 拔电源丢内存证据</text>
    <text x="168" y="118" font-size="8" fill="#8C8980">动主机前先快照留证</text>

    <rect x="288" y="58" width="104" height="66" rx="3" fill="#FAE6E4" stroke="#D2948C"/>
    <circle cx="304" cy="74" r="9" fill="#7A322B"/>
    <text x="304" y="77.5" font-size="9" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="319" y="77.5" font-size="10.5" font-weight="600" fill="#7A322B">根除</text>
    <text x="296" y="94" font-size="8.5" fill="#4A4945">摘后门·重置凭据</text>
    <text x="296" y="106" font-size="8.5" fill="#4A4945">必要时干净重建</text>
    <text x="296" y="118" font-size="8" fill="#8C8980">凭据全轮换：钥/码/token</text>

    <rect x="416" y="58" width="104" height="66" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
    <circle cx="432" cy="74" r="9" fill="#1F4468"/>
    <text x="432" y="77.5" font-size="9" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="447" y="77.5" font-size="10.5" font-weight="600" fill="#1F4468">恢复</text>
    <text x="424" y="94" font-size="8.5" fill="#4A4945">干净备份/镜像重建</text>
    <text x="424" y="106" font-size="8.5" fill="#4A4945">分批回网持续监控</text>
    <text x="424" y="118" font-size="8" fill="#8C8980">观察期后再放开访问</text>

    <rect x="544" y="58" width="104" height="66" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
    <circle cx="560" cy="74" r="9" fill="#46337A"/>
    <text x="560" y="77.5" font-size="9" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="575" y="77.5" font-size="10.5" font-weight="600" fill="#46337A">复盘</text>
    <text x="552" y="94" font-size="8.5" fill="#4A4945">时间线·根因·改进项</text>
    <text x="552" y="106" font-size="8.5" fill="#4A4945">落入复盘文档</text>
    <text x="552" y="118" font-size="8" fill="#8C8980">衔接「SRE」003 无指责</text>

    <!-- 主链箭头 -->
    <line x1="136" y1="91" x2="158" y2="91" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a5Blue)"/>
    <line x1="264" y1="91" x2="286" y2="91" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a5Blue)"/>
    <line x1="392" y1="91" x2="414" y2="91" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a5Blue)"/>
    <line x1="520" y1="91" x2="542" y2="91" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#a5Blue)"/>

    <line x1="32" y1="140" x2="648" y2="140" stroke="#EDEAE2" stroke-width="1"/>

    <!-- 下左：漏斗 -->
    <text x="32" y="160" font-size="9.5" fill="#4A4945">横向排查漏斗——单机确认失陷后全网收窄（每层留原始数据）：</text>
    <!-- 四层：右对齐收窄 x 尾=308 -->
    <rect x="40" y="172" width="268" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
    <text x="52" y="189" font-size="9" font-weight="600" fill="#1F4468">① 全量</text>
    <text x="296" y="189" font-size="8.5" fill="#4A4945" text-anchor="end">ps auxf · ss -tunap 原始清单落档</text>
    <rect x="76" y="210" width="232" height="32" rx="3" fill="#E4EEF9" stroke="#7FA6D0"/>
    <text x="88" y="227" font-size="9" font-weight="600" fill="#1F4468">② 非 root 过滤</text>
    <text x="296" y="227" font-size="8.5" fill="#4A4945" text-anchor="end">系统守护被普通用户拉起=高危</text>
    <rect x="112" y="248" width="196" height="32" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="124" y="265" font-size="9" font-weight="600" fill="#7A4A12">③ 四特征筛选</text>
    <text x="296" y="265" font-size="8.5" fill="#4A4945" text-anchor="end">逐条定性 → 可疑清单</text>
    <rect x="148" y="286" width="160" height="32" rx="3" fill="#ECE7F7" stroke="#9C8ACB"/>
    <text x="160" y="303" font-size="9" font-weight="600" fill="#46337A">④ 精准处置</text>
    <text x="296" y="303" font-size="8.5" fill="#4A4945" text-anchor="end">逐个确认 · 更新基线</text>
    <!-- 漏斗收窄虚线 -->
    <line x1="308" y1="204" x2="308" y2="210" stroke="#8C8980" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="308" y1="242" x2="308" y2="248" stroke="#8C8980" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="308" y1="280" x2="308" y2="286" stroke="#8C8980" stroke-width="0.8" stroke-dasharray="2,2"/>
    <text x="40" y="336" font-size="8" fill="#8C8980">实测漏斗：3563 全量 → 903 非 root → 7 可疑 → 精准点杀</text>

    <!-- 下右：四特征 2x2 -->
    <text x="348" y="160" font-size="9.5" fill="#4A4945">可疑进程四特征——命中即现形：</text>
    <rect x="348" y="172" width="144" height="52" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="360" y="190" font-size="9" font-weight="600" fill="#7A4A12">用户不对</text>
    <text x="360" y="206" font-size="8" fill="#4A4945">非 root 跑系统服务名</text>
    <text x="360" y="217" font-size="8" fill="#8C8980">如普通用户拉起 rsyslogd</text>
    <rect x="504" y="172" width="144" height="52" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="516" y="190" font-size="9" font-weight="600" fill="#7A4A12">路径不对</text>
    <text x="516" y="206" font-size="8" fill="#4A4945">./xxx 或 /tmp 下</text>
    <text x="516" y="217" font-size="8" fill="#8C8980">而非 /usr/sbin/ 标准位</text>
    <rect x="348" y="236" width="144" height="52" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="360" y="254" font-size="9" font-weight="600" fill="#7A4A12">参数不对</text>
    <text x="360" y="270" font-size="8" fill="#4A4945">与服务标准参数</text>
    <text x="360" y="281" font-size="8" fill="#8C8980">格式不符</text>
    <rect x="504" y="236" width="144" height="52" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="516" y="254" font-size="9" font-weight="600" fill="#7A4A12">同机有参照 ★</text>
    <text x="516" y="270" font-size="8" fill="#4A4945">同名 root 正规版在跑</text>
    <text x="516" y="281" font-size="8" fill="#8C8980">对照即现形</text>
    <text x="348" y="336" font-size="8" fill="#8C8980">★ 四条中"同机参照"最快定性——真版假版一眼可辨</text>

    <!-- 底部琥珀总结 -->
    <rect x="32" y="348" width="616" height="26" rx="3" fill="#FBEEDA" stroke="#D9A458"/>
    <text x="340" y="364" font-size="9" font-weight="600" fill="#7A4A12" text-anchor="middle">每一层留原始数据（结论可推翻，原始证据不能丢）· 陌生 IP 溯源定性后回写资产台账，阴暗角落才清得掉</text>
    <text x="32" y="388" font-size="8" fill="#8C8980">来源：安全收口事件教材化（进程查杀漏斗 / 机器侧总体结论）· 2026-11-08 · 「安全运维」005 §4</text>
