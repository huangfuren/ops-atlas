<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>应急响应五步与横向排查漏斗</title>
  <desc>上半是应急五步主链：准备、遏制、根除、恢复、复盘，顺序不能乱，每步有产出。下半左是横向排查漏斗四层：全量采集、非 root 过滤、四特征筛选、精准处置；下半右是可疑进程四特征。每一层留原始数据。数据来源：015 日志审计与应急响应册 §3~§5，安全收口事件教材化 2026-11-08。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="730" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">应急响应五步与横向排查漏斗</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">015 日志审计与应急响应 §3~§5 · 防御视角</text>

  <!-- 五步主链 -->
  <text x="40" y="80" font-size="13" font-weight="bold" fill="#263238">应急五步——顺序不能乱，每步有产出</text>

  <rect x="40" y="92" width="208" height="124" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <circle cx="70" cy="117" r="15" fill="#1565c0"/>
  <text x="70" y="122" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="94" y="122" font-size="14" font-weight="bold" fill="#0d2f5c">准备</text>
  <text x="56" y="152" font-size="11.5" fill="#0d2f5c">联系人清单 · 隔离预案</text>
  <text x="56" y="174" font-size="11.5" fill="#0d2f5c">取证工具 · 干净备份</text>
  <text x="56" y="198" font-size="11" fill="#1565c0">没准备的应急 = 现场发挥</text>

  <rect x="268" y="92" width="208" height="124" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <circle cx="298" cy="117" r="15" fill="#c62828"/>
  <text x="298" y="122" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="322" y="122" font-size="14" font-weight="bold" fill="#7f0000">遏制</text>
  <text x="284" y="152" font-size="11.5" fill="#7f0000">防火墙断网隔离</text>
  <text x="284" y="174" font-size="11.5" fill="#7f0000">动主机前先快照留证</text>
  <text x="284" y="198" font-size="11" fill="#c62828">直接拔电会丢内存证据</text>

  <rect x="496" y="92" width="208" height="124" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <circle cx="526" cy="117" r="15" fill="#c62828"/>
  <text x="526" y="122" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="550" y="122" font-size="14" font-weight="bold" fill="#7f0000">根除</text>
  <text x="512" y="152" font-size="11.5" fill="#7f0000">摘后门 · 重置凭据</text>
  <text x="512" y="174" font-size="11.5" fill="#7f0000">必要时干净重建</text>
  <text x="512" y="198" font-size="11" fill="#c62828">凭据全轮换：钥 / 码 / token</text>

  <rect x="724" y="92" width="208" height="124" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <circle cx="754" cy="117" r="15" fill="#388e3c"/>
  <text x="754" y="122" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="778" y="122" font-size="14" font-weight="bold" fill="#123314">恢复</text>
  <text x="740" y="152" font-size="11.5" fill="#123314">干净备份 / 镜像重建</text>
  <text x="740" y="174" font-size="11.5" fill="#123314">分批回网持续监控</text>
  <text x="740" y="198" font-size="11" fill="#388e3c">观察期过后再放开访问</text>

  <rect x="952" y="92" width="208" height="124" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <circle cx="982" cy="117" r="15" fill="#5e35b1"/>
  <text x="982" y="122" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1006" y="122" font-size="14" font-weight="bold" fill="#311b92">复盘</text>
  <text x="968" y="152" font-size="11.5" fill="#311b92">时间线 · 根因 · 改进项</text>
  <text x="968" y="174" font-size="11.5" fill="#311b92">落入复盘文档</text>
  <text x="968" y="198" font-size="11" fill="#5e35b1">无指责口径见「SRE」013</text>

  <line x1="250" y1="154" x2="264" y2="154" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <line x1="478" y1="154" x2="492" y2="154" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <line x1="706" y1="154" x2="720" y2="154" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <line x1="934" y1="154" x2="948" y2="154" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 下左：漏斗 -->
  <text x="40" y="262" font-size="13" font-weight="bold" fill="#263238">横向排查漏斗：单机确认失陷后全网收窄</text>

  <rect x="60" y="276" width="520" height="52" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="80" y="297" font-size="12" font-weight="bold" fill="#0d2f5c">① 全量采集</text>
  <text x="80" y="317" font-size="11" fill="#0d2f5c"><tspan font-family="ui-monospace,Menlo,Consolas,monospace">ps auxf</tspan> · <tspan font-family="ui-monospace,Menlo,Consolas,monospace">ss -tunap</tspan> 原始清单落档</text>

  <rect x="100" y="340" width="440" height="52" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="120" y="361" font-size="12" font-weight="bold" fill="#0d2f5c">② 非 root 过滤</text>
  <text x="120" y="381" font-size="11" fill="#0d2f5c">系统守护被普通用户拉起 = 高危</text>

  <rect x="140" y="404" width="360" height="52" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="160" y="425" font-size="12" font-weight="bold" fill="#5d4700">③ 四特征筛选</text>
  <text x="160" y="445" font-size="11" fill="#5d4700">逐条定性 → 可疑清单</text>

  <rect x="180" y="468" width="280" height="52" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="200" y="489" font-size="12" font-weight="bold" fill="#311b92">④ 精准处置</text>
  <text x="200" y="509" font-size="11" fill="#311b92">逐个确认 · 更新基线</text>

  <text x="60" y="548" font-size="11" fill="#616161">实测漏斗：3563 全量 → 903 非 root → 7 可疑 → 精准点杀——每层留原始数据</text>

  <!-- 下右：四特征 -->
  <text x="640" y="262" font-size="13" font-weight="bold" fill="#263238">可疑进程四特征：命中即现形</text>

  <rect x="640" y="276" width="250" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="656" y="302" font-size="13" font-weight="bold" fill="#5d4700">用户不对</text>
  <text x="656" y="326" font-size="11.5" fill="#37474f">非 root 跑系统服务名</text>
  <text x="656" y="350" font-size="11" fill="#616161">如普通用户拉起 rsyslogd</text>

  <rect x="910" y="276" width="250" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="926" y="302" font-size="13" font-weight="bold" fill="#5d4700">路径不对</text>
  <text x="926" y="326" font-size="11.5" fill="#37474f"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">./xxx</tspan> 或 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">/tmp</tspan> 下</text>
  <text x="926" y="350" font-size="11" fill="#616161">而非 /usr/sbin 标准位</text>

  <rect x="640" y="384" width="250" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="656" y="410" font-size="13" font-weight="bold" fill="#5d4700">参数不对</text>
  <text x="656" y="434" font-size="11.5" fill="#37474f">与服务标准参数</text>
  <text x="656" y="458" font-size="11" fill="#616161">格式不符</text>

  <rect x="910" y="384" width="250" height="96" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="926" y="410" font-size="13" font-weight="bold" fill="#bf360c">同机有参照 ★</text>
  <text x="926" y="434" font-size="11.5" fill="#37474f">同名 root 正规版在跑</text>
  <text x="926" y="458" font-size="11" fill="#616161">对照即现形，最快定性</text>

  <text x="640" y="504" font-size="11" fill="#616161">扫出陌生 IP：按五类溯源到资产，全部可解释才算收口（「网络」131）</text>
  <text x="640" y="528" font-size="11" fill="#616161">溯源完回写资产台账——否则下次扫描把同一批 IP 再怀疑一遍</text>

  <!-- 结论块 -->
  <rect x="40" y="560" width="1120" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="64" y="586" font-size="13" font-weight="bold" fill="#bf360c">每一层留原始数据——结论可推翻，原始证据不能丢</text>
  <text x="64" y="610" font-size="12" fill="#5d4037">审计采集面六类齐、留存 ≥6 个月（015 §2）；出了事按五步走，事后按无指责复盘改进（「SRE」013）</text>

  <!-- 尾注 -->
  <text x="40" y="648" font-size="11" fill="#616161">来源：安全收口事件教材化 · 2026-11-08 · 防御视角，不写攻击细节</text>

  <!-- 图例 -->
  <rect x="40" y="664" width="1120" height="44" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="678" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="690" font-size="11" fill="#37474f">常规步骤 / 漏斗采集</text>
  <rect x="300" y="678" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="332" y="690" font-size="11" fill="#37474f">遏制 / 根除（高危操作）</text>
  <rect x="560" y="678" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="592" y="690" font-size="11" fill="#37474f">恢复</text>
  <rect x="680" y="678" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="712" y="690" font-size="11" fill="#37474f">可疑特征 / 筛选</text>
  <rect x="890" y="678" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="922" y="690" font-size="11" fill="#37474f">复盘 / 精准处置</text>
  <rect x="1080" y="678" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="1112" y="690" font-size="11" fill="#37474f">结论块</text>
</svg>
