<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 741.18" width="1200" height="741.18" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>GC 三色标记 + 混合写屏障：并发标记为什么不漏标</title>
  <desc>三色抽象：白是未访问可能被回收，灰是已访问但子对象未扫描完，黑是扫描完安全。标记从 GC Roots 出发把可达对象涂灰，逐个扫完涂黑，剩下的白对象就是垃圾。并发标记的问题在于业务代码同时还在改指针，黑对象新指向白对象会导致误回收，解法是写屏障记录每次指针写入，混合写屏障把 STW 压到两次几十微秒。</desc>

  <rect width="680" height="420" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">GC 三色标记 + 混合写屏障：并发标记为什么不漏标</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">013 §2.1</text>

  <defs>
    <marker id="g4Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
  </defs>

  <!-- 左：对象图 -->
  <rect x="20" y="44" width="400" height="248" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <rect x="40" y="64" width="150" height="48" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="115" y="83" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">GC Roots</text>
  <text x="115" y="100" font-size="7" fill="#4A4945" text-anchor="middle">栈 · 全局变量 · 寄存器</text>

  <rect x="140" y="152" width="100" height="44" rx="3" fill="#CFCCC2" stroke="#9B978C" stroke-width="1"/>
  <text x="190" y="171" font-size="8.8" font-weight="600" fill="#2B2A27" text-anchor="middle">A · 灰</text>
  <text x="190" y="186" font-size="6.8" fill="#4A4945" text-anchor="middle">已访问 · 子未扫完</text>

  <rect x="290" y="110" width="100" height="44" rx="3" fill="#6B6860" stroke="#6B6860" stroke-width="1"/>
  <text x="340" y="129" font-size="8.8" font-weight="600" fill="#FFFFFF" text-anchor="middle">B · 黑</text>
  <text x="340" y="144" font-size="6.8" fill="#E8E6E0" text-anchor="middle">扫描完 · 安全</text>

  <rect x="290" y="210" width="100" height="44" rx="3" fill="#6B6860" stroke="#6B6860" stroke-width="1"/>
  <text x="340" y="229" font-size="8.8" font-weight="600" fill="#FFFFFF" text-anchor="middle">D · 黑</text>
  <text x="340" y="244" font-size="6.8" fill="#E8E6E0" text-anchor="middle">扫描完 · 安全</text>

  <rect x="40" y="210" width="110" height="44" rx="3" fill="#FFFFFF" stroke="#D2948C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="95" y="229" font-size="8.8" font-weight="600" fill="#7A322B" text-anchor="middle">C · 白</text>
  <text x="95" y="244" font-size="6.8" fill="#7A322B" text-anchor="middle">根不可达 → 回收</text>

  <line x1="118" y1="112" x2="160" y2="148" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#g4Blue)"/>
  <line x1="242" y1="164" x2="286" y2="140" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#g4Blue)"/>
  <line x1="242" y1="182" x2="286" y2="222" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#g4Blue)"/>

  <text x="40" y="278" font-size="7.6" fill="#4A4945">标记：从根出发涂灰 → 逐个扫完涂黑 → 最后剩下的白 = 垃圾（C）</text>

  <!-- 右：三色含义 + STW -->
  <rect x="436" y="44" width="224" height="248" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <rect x="452" y="64" width="192" height="40" rx="3" fill="#FFFFFF" stroke="#D2948C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="548" y="88" font-size="8" fill="#7A322B" text-anchor="middle">白｜未访问 · 可能回收</text>
  <rect x="452" y="112" width="192" height="40" rx="3" fill="#CFCCC2" stroke="#9B978C" stroke-width="1"/>
  <text x="548" y="136" font-size="8" fill="#2B2A27" text-anchor="middle">灰｜已访问 · 子未扫完</text>
  <rect x="452" y="160" width="192" height="40" rx="3" fill="#6B6860" stroke="#6B6860" stroke-width="1"/>
  <text x="548" y="184" font-size="8" fill="#FFFFFF" text-anchor="middle">黑｜扫完 · 安全</text>

  <rect x="452" y="212" width="192" height="64" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="548" y="232" font-size="8.4" font-weight="600" fill="#1D5A45" text-anchor="middle">STW 只剩两次</text>
  <text x="548" y="248" font-size="7" fill="#1D5A45" text-anchor="middle">各几十微秒（Go 1.8+）</text>
  <text x="548" y="262" font-size="7" fill="#1D5A45" text-anchor="middle">标记与业务并发进行</text>

  <!-- 底部：问题与解法 -->
  <rect x="20" y="304" width="640" height="38" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1"/>
  <text x="32" y="320" font-size="8" fill="#7A322B">并发标记的漏洞：标记期间业务还在改指针——黑对象新指向一个白对象，这个白会被误回收（漏标）</text>
  <text x="32" y="335" font-size="7.4" font-weight="600" fill="#7A322B">黑 → 白 的新引用是危险方向</text>

  <rect x="20" y="352" width="640" height="32" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1"/>
  <text x="32" y="372" font-size="7.8" fill="#1D5A45">解法：写屏障——每次指针写入都记录变更，保证不漏标；混合写屏障把 STW 压到两次几十微秒</text>

  <text x="32" y="408" font-size="9" fill="#8C8980">调优入口：GOGC 触发频率、GOMEMLIMIT 软上限（容器按 limit 的 80% 设）；健康判据看 gctrace 的存活堆是否持续上涨。</text>

  </g>
</svg>
