  <text x="77" y="312" font-size="6.6" fill="#7A4A12" text-anchor="middle">G/M/P · 偷任务</text>
  <text x="77" y="325" font-size="6.6" fill="#7A4A12" text-anchor="middle">数据竞争</text>
  <rect x="132" y="280" width="98" height="60" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="181" y="298" font-size="7.6" font-weight="600" fill="#7A4A12" text-anchor="middle">013 GC 调优</text>
  <text x="181" y="312" font-size="6.6" fill="#7A4A12" text-anchor="middle">三色标记</text>
  <text x="181" y="325" font-size="6.6" fill="#7A4A12" text-anchor="middle">GOMEMLIMIT</text>
  <rect x="236" y="280" width="98" height="60" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="285" y="298" font-size="7.6" font-weight="600" fill="#7A4A12" text-anchor="middle">014 pprof 调优</text>
