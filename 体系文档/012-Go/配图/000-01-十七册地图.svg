<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 758.82" width="1200" height="758.82" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- 1200 宽大尺寸版：整体等比 scale(1.764706)，内部 680 坐标系未改动 -->
  <g transform="scale(1.7647058824)">

  <title>Go 板块十七册地图：基础线 → 进阶线 → 高阶线</title>
  <desc>Go 板块十七册分三条线：基础线会写，包括环境配置、语言概览、语法基础、复合类型与函数、方法接口与错误处理、标准库与并发第一课；进阶线会维护，包括类型系统与接口进阶、切片map底层与值语义、并发模式与channel进阶、错误处理进阶与测试基准、工程化与代码组织；高阶线会调优救火，包括GMP调度与内存模型、GC内存管理与调优、pprof与性能调优、并发高级泛型与反射、编译交付与可观测、事故复盘与源码阅读。</desc>

  <rect width="680" height="430" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">Go 十七册地图：三条能力线</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">000 全貌 · 配图</text>

  <!-- 基础线 -->
  <rect x="20" y="54" width="640" height="92" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="28" y="70" font-size="8" font-weight="600" fill="#8C8980">基础线 · 会写</text>
  <rect x="28" y="76" width="98" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="77" y="94" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">001 环境配置</text>
  <text x="77" y="108" font-size="6.6" fill="#4A4945" text-anchor="middle">SDK · 代理 · 速查</text>
  <text x="77" y="121" font-size="6.6" fill="#4A4945" text-anchor="middle">七个坑</text>
  <rect x="132" y="76" width="98" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="181" y="94" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">002 语言概览</text>
  <text x="181" y="108" font-size="6.6" fill="#4A4945" text-anchor="middle">五特性 · 四哲学</text>
  <text x="181" y="121" font-size="6.6" fill="#4A4945" text-anchor="middle">三语言对比</text>
  <rect x="236" y="76" width="98" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="285" y="94" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">003 语法基础</text>
  <text x="285" y="108" font-size="6.6" fill="#4A4945" text-anchor="middle">变量类型</text>
  <text x="285" y="121" font-size="6.6" fill="#4A4945" text-anchor="middle">流程控制</text>
  <rect x="340" y="76" width="98" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
