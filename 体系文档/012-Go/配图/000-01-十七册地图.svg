  <rect x="20" y="360" width="640" height="26" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="32" y="377" font-size="7.8" font-weight="600" fill="#7A4A12">★ 最快上手工线：001 → 003 → 004 → 006 → 照 006 §4 练习写一个工具，其余按需回查；005 全例的零件在此组装（「Python」005 同思路）</text>

  <text x="32" y="408" font-size="8.6" fill="#8C8980">分界：可观测三支柱出口 → 监控 007 / 日志 / 链路 002；静态二进制的容器交付 → 容器 002；三语言分工 → Python 000 §0.2。词汇查 00 术语表。</text>

