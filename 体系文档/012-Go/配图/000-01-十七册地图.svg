  <rect x="524" y="178" width="118" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="583" y="196" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">011 工程化</text>
  <text x="583" y="210" font-size="6.6" fill="#4A4945" text-anchor="middle">项目布局</text>
  <text x="583" y="223" font-size="6.6" fill="#4A4945" text-anchor="middle">依赖 · 构建</text>

