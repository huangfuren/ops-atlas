  <text x="389" y="108" font-size="6.6" fill="#4A4945" text-anchor="middle">切片 map struct</text>
  <text x="389" y="121" font-size="6.6" fill="#4A4945" text-anchor="middle">defer · 指针</text>
  <rect x="444" y="76" width="98" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="493" y="94" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">005 方法接口错误</text>
