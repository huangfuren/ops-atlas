  <text x="335" y="223" font-size="6.6" fill="#4A4945" text-anchor="middle">单向 channel</text>
  <rect x="400" y="178" width="118" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1"/>
  <text x="459" y="196" font-size="7.6" font-weight="600" fill="#1F4468" text-anchor="middle">010 错误进阶测试</text>
  <text x="459" y="210" font-size="6.6" fill="#4A4945" text-anchor="middle">包装链 · panic 纪律</text>
