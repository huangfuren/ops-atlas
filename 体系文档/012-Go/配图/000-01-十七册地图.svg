  <rect x="20" y="258" width="640" height="92" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="28" y="274" font-size="8" font-weight="600" fill="#8C8980">高阶线 · 会调优救火</text>
