<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>编译交叉交付：一份源码出多平台静态二进制</title>
  <desc>交叉编译靠三个环境变量：GOOS 选操作系统、GOARCH 选架构、CGO_ENABLED=0 切断 C 依赖。同一份源码产出各平台静态二进制，可直接 scp 或塞进 scratch 镜像。底部是两个必踩的坑与推荐命令、图例。</desc>

  <defs>
    <marker id="axGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">编译交叉交付：一份源码出多平台静态二进制</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">135 §1.2</text>

  <!-- 左：构建输入 -->
  <rect x="40" y="80" width="300" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#37474f">构建输入</text>

  <rect x="60" y="118" width="260" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="142" font-size="12.5" font-weight="bold" fill="#0d2f5c" text-anchor="middle">源码 + go.mod</text>
  <text x="190" y="164" font-size="11" fill="#0d2f5c" text-anchor="middle">依赖已 go mod tidy</text>

  <rect x="60" y="190" width="260" height="112" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="76" y="214" font-size="12" font-weight="bold" fill="#7f3f00">三个环境变量</text>
  <text x="76" y="238" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">CGO_ENABLED=0</text>
  <text x="76" y="262" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">GOOS=linux</text>
  <text x="76" y="286" font-size="11.5" fill="#7f3f00" font-family="ui-monospace,Menlo,Consolas,monospace">GOARCH=amd64</text>

  <text x="60" y="330" font-size="12" font-weight="bold" fill="#37474f" font-family="ui-monospace,Menlo,Consolas,monospace">-ldflags "-s -w"</text>
  <text x="60" y="352" font-size="11" fill="#616161">去符号表与 DWARF · 体积减 25~30%</text>

  <!-- 中：平台矩阵 -->
  <rect x="380" y="80" width="440" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="400" y="106" font-size="13" font-weight="bold" fill="#37474f">平台矩阵：GOOS × GOARCH</text>
  <text x="400" y="128" font-size="11" fill="#616161" font-family="ui-monospace,Menlo,Consolas,monospace">go tool dist list</text>

  <rect x="395" y="140" width="120" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="455" y="166" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">linux</text>
  <text x="455" y="186" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">amd64</text>
  <rect x="540" y="140" width="120" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="166" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">linux</text>
  <text x="600" y="186" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">arm64</text>
  <rect x="685" y="140" width="120" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="745" y="166" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">darwin</text>
  <text x="745" y="186" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">amd64</text>
  <rect x="395" y="212" width="120" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="455" y="238" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">darwin</text>
  <text x="455" y="258" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">arm64</text>
  <rect x="540" y="212" width="120" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="600" y="238" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">windows</text>
  <text x="600" y="258" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">amd64</text>
  <rect x="685" y="212" width="120" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="745" y="238" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">windows</text>
  <text x="745" y="258" font-size="12" fill="#37474f" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">arm64</text>

  <text x="400" y="300" font-size="11.5" fill="#37474f">绿格 = 运维交付最常用的两档；CGO=0 时一条命令跨平台，</text>
  <text x="400" y="322" font-size="11.5" fill="#37474f">CGO=1 需交叉工具链，多数场景不划算。</text>
  <text x="400" y="344" font-size="11.5" fill="#616161">产物命名约定：dist/app-$GOOS-$GOARCH；目标机架构先 uname -m 确认</text>
  <text x="400" y="366" font-size="11.5" font-weight="bold" fill="#1b5e20">同一份源码，六个文件，零运行时依赖</text>

  <!-- 右：交付形态 -->
  <rect x="860" y="80" width="300" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="880" y="106" font-size="13" font-weight="bold" fill="#37474f">交付形态</text>

  <rect x="880" y="118" width="260" height="66" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1010" y="142" font-size="12.5" font-weight="bold" fill="#123314" text-anchor="middle">静态二进制</text>
  <text x="1010" y="164" font-size="11" fill="#1b3d1e" text-anchor="middle">10~20MB · 无运行时 · scp 就能跑</text>

  <line x1="1010" y1="188" x2="1010" y2="204" stroke="#2e7d32" stroke-width="2" marker-end="url(#axGreen)"/>

  <rect x="880" y="208" width="260" height="66" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1010" y="232" font-size="12.5" font-weight="bold" fill="#123314" text-anchor="middle">scratch 镜像</text>
  <text x="1010" y="254" font-size="11" fill="#1b3d1e" text-anchor="middle">只拷二进制 + CA 证书 · 镜像约等于二进制大小</text>

  <line x1="1010" y1="278" x2="1010" y2="294" stroke="#2e7d32" stroke-width="2" marker-end="url(#axGreen)"/>

  <rect x="880" y="298" width="260" height="66" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1010" y="322" font-size="12.5" font-weight="bold" fill="#123314" text-anchor="middle">scp / 容器 / systemd</text>
  <text x="1010" y="344" font-size="11" fill="#1b3d1e" text-anchor="middle">无依赖地狱 · 回滚只换一个文件</text>

  <!-- 坑 -->
  <rect x="40" y="400" width="1120" height="64" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="424" font-size="12.5" font-weight="bold" fill="#7f0000">两个必踩的坑：① 忘拷 CA 证书 → HTTPS 全报 x509 错误；② 加 -w 去 DWARF → core dump 还原不出堆栈</text>
  <text x="60" y="448" font-size="12" fill="#7f0000">前者在 scratch 镜像里必现；后者只在崩溃分析时暴露——生产留一版带调试信息的产物</text>

  <!-- 推荐命令 -->
  <rect x="40" y="480" width="1120" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="507" font-size="12" fill="#1b5e20" font-family="ui-monospace,Menlo,Consolas,monospace">CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o app .</text>

  <!-- 尾注 -->
  <text x="40" y="554" font-size="11.5" fill="#616161">交叉编译不是「模拟运行」，是直接产出目标平台的机器码——所以能在 Windows 上构建 Linux 服务。</text>
  <text x="40" y="580" font-size="11.5" fill="#616161">slog 结构化日志与 OTel 出口见 135 §3——编译交付与可观测在同一册收口。</text>

  <!-- 图例 -->
  <rect x="40" y="600" width="1120" height="56" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="616" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="628" font-size="12" fill="#37474f">源码（输入）</text>
  <rect x="250" y="616" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="282" y="628" font-size="12" fill="#37474f">构建参数</text>
  <rect x="460" y="616" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="492" y="628" font-size="12" fill="#37474f">常用目标 / 交付形态</text>
  <rect x="730" y="616" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="762" y="628" font-size="12" fill="#37474f">其余平台</text>
  <rect x="890" y="616" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="922" y="628" font-size="12" fill="#37474f">坑</text>
  <rect x="990" y="616" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="1022" y="628" font-size="12" fill="#37474f">推荐命令</text>
</svg>
