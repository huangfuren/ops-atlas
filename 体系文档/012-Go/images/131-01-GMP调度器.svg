<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>GMP 调度器：M 必须绑 P 才能执行 G，work stealing 自动均衡</title>
  <desc>G 是 goroutine，M 是 OS 线程，P 持有本地运行队列。新 G 优先进当前 P 本地队列，满了转一半到全局队列；M 绑 P 取 G 执行，本地空了先偷其他 P 的一半，再取全局队列与 netpoll；sysmon 检测 G 运行超 10ms 强制让出。底部取 G 顺序、抢占、硬约束与图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="axOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
    <marker id="axRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">GMP 调度器：M 必须绑 P 才能执行 G，work stealing 自动均衡</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">131 §1.1–1.3</text>

  <!-- 顶行 -->
  <rect x="40" y="80" width="200" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="140" y="106" font-size="12.5" font-weight="bold" fill="#37474f" text-anchor="middle">新 goroutine</text>
  <text x="140" y="128" font-size="11" fill="#616161" text-anchor="middle">优先进当前 P 本地</text>

  <rect x="480" y="80" width="240" height="64" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="600" y="106" font-size="12.5" font-weight="bold" fill="#7f3f00" text-anchor="middle">全局队列 global runq</text>
  <text x="600" y="128" font-size="11" fill="#7f3f00" text-anchor="middle">本地满转一半进来；偷不到来取</text>

  <rect x="960" y="80" width="200" height="64" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1060" y="106" font-size="12.5" font-weight="bold" fill="#311b92" text-anchor="middle">netpoll</text>
  <text x="1060" y="128" font-size="11" fill="#311b92" text-anchor="middle">网络就绪唤醒的 G</text>

  <!-- P 行 -->
  <rect x="60" y="190" width="240" height="100" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="214" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">P · 本地队列（256）</text>
  <rect x="76" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="98" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="130" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="152" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="184" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="206" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="238" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="480" y="190" width="240" height="100" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="214" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">P · 本地队列（256）</text>
  <rect x="496" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="518" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="550" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="572" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="604" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="626" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="658" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="680" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>

  <rect x="960" y="190" width="240" height="100" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1080" y="214" font-size="12" font-weight="bold" fill="#0d2f5c" text-anchor="middle">P · 本地队列（256）</text>
  <rect x="976" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="998" y="248" font-size="11" fill="#0d2f5c" text-anchor="middle">G</text>
  <rect x="1030" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="1084" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="1138" y="226" width="44" height="34" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>

  <!-- M 行 -->
  <rect x="60" y="330" width="240" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="180" y="356" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">M · OS 线程</text>
  <rect x="140" y="368" width="80" height="20" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="180" y="383" font-size="11" fill="#123314" text-anchor="middle">运行 G</text>

  <rect x="480" y="330" width="240" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="356" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">M · OS 线程</text>
  <rect x="560" y="368" width="80" height="20" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="600" y="383" font-size="11" fill="#123314" text-anchor="middle">运行 G</text>

  <rect x="960" y="330" width="240" height="70" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1080" y="356" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">M · OS 线程</text>
  <rect x="1040" y="368" width="80" height="20" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="1080" y="383" font-size="11" fill="#123314" text-anchor="middle">运行 G</text>

  <!-- 绑定线 -->
  <line x1="180" y1="290" x2="180" y2="326" stroke="#607d8b" stroke-width="2"/>
  <text x="188" y="312" font-size="10" fill="#616161">绑</text>
  <line x1="600" y1="290" x2="600" y2="326" stroke="#607d8b" stroke-width="2"/>
  <text x="608" y="312" font-size="10" fill="#616161">绑</text>
  <line x1="1080" y1="290" x2="1080" y2="326" stroke="#607d8b" stroke-width="2"/>
  <text x="1088" y="312" font-size="10" fill="#616161">绑</text>

  <!-- 流动箭头 -->
  <line x1="150" y1="148" x2="172" y2="184" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="300" y1="186" x2="478" y2="132" stroke="#f9a825" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#axOrange)"/>
  <text x="380" y="158" font-size="10" fill="#7f3f00" text-anchor="middle">本地满 · 转一半</text>
  <line x1="600" y1="148" x2="600" y2="184" stroke="#f9a825" stroke-width="2" marker-end="url(#axOrange)"/>
  <line x1="1030" y1="148" x2="1032" y2="184" stroke="#607d8b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#axGray)"/>
  <line x1="476" y1="243" x2="308" y2="243" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#axRed)"/>
  <text x="392" y="234" font-size="11" font-weight="bold" fill="#c62828" text-anchor="middle">本地空 → 偷一半</text>

  <!-- 取 G 顺序 -->
  <rect x="40" y="430" width="1120" height="70" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="456" font-size="12.5" font-weight="bold" fill="#37474f">M 取 G 顺序：① 本地队列 → ② 偷其他 P 的一半 → ③ 全局队列 → ④ netpoll → ⑤ 都没有则 M 休眠</text>
  <text x="60" y="482" font-size="11.5" fill="#616161">M 休眠时线程挂起，P 归还空闲池等待复用——不占 CPU 也不丢 G</text>

  <!-- 抢占 -->
  <rect x="40" y="516" width="1120" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="543" font-size="12.5" fill="#7f3f00">抢占：sysmon 发现 G 运行超过 10ms → 发 SIGURG 强制让出（Go 1.14+ 异步抢占）——for{} 死循环不再饿死同 P 的 G</text>

  <!-- 硬约束 -->
  <rect x="40" y="576" width="1120" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="603" font-size="12.5" fill="#1b5e20">硬约束：M 必须绑一个 P 才能执行 G → 真正并行的 G 上限 = GOMAXPROCS（默认 = CPU 核数；容器里按 limit 设，见 131 §3 坑 1）</text>

  <!-- 尾注 -->
  <text x="40" y="650" font-size="11.5" fill="#616161">几万到几百万个 G，几十个 M 转起来——队列 + work stealing 把负载均衡内建进运行时，不用配线程池。</text>

  <!-- 图例 -->
  <rect x="40" y="668" width="1120" height="64" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="692" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="704" font-size="12" fill="#37474f">P（逻辑处理器 + 本地队列）</text>
  <rect x="400" y="692" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="432" y="704" font-size="12" fill="#37474f">M（OS 线程）</text>
  <rect x="640" y="692" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="672" y="704" font-size="12" fill="#37474f">全局队列</text>
  <rect x="860" y="692" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="892" y="704" font-size="12" fill="#37474f">netpoll</text>
  <rect x="1010" y="692" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="1042" y="704" font-size="12" fill="#37474f">纪律 / 通过条件</text>
</svg>
