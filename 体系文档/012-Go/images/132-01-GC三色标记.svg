<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>GC 三色标记 + 混合写屏障：并发标记为什么不漏标</title>
  <desc>三色抽象：白未访问可能回收，灰已访问子未扫完，黑扫描完安全。标记从 GC Roots 出发，剩下的白是垃圾。并发标记的问题：黑对象新指向白对象会被误回收，解法是写屏障。底部漏标问题、解法与调优入口、图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">GC 三色标记 + 混合写屏障：并发标记为什么不漏标</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">132 §2.1</text>

  <!-- 左：对象图 -->
  <rect x="40" y="80" width="680" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="70" y="104" width="220" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="180" y="128" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">GC Roots</text>
  <text x="180" y="148" font-size="11" fill="#0d2f5c" text-anchor="middle">栈 · 全局变量 · 寄存器</text>

  <rect x="200" y="220" width="170" height="64" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="285" y="246" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">A · 灰</text>
  <text x="285" y="268" font-size="11" fill="#546e7a" text-anchor="middle">已访问 · 子未扫完</text>

  <rect x="470" y="150" width="170" height="64" rx="6" fill="#546e7a" stroke="#546e7a" stroke-width="1.5"/>
  <text x="555" y="176" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B · 黑</text>
  <text x="555" y="198" font-size="11" fill="#eceff1" text-anchor="middle">扫描完 · 安全</text>

  <rect x="470" y="290" width="170" height="64" rx="6" fill="#546e7a" stroke="#546e7a" stroke-width="1.5"/>
  <text x="555" y="316" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">D · 黑</text>
  <text x="555" y="338" font-size="11" fill="#eceff1" text-anchor="middle">扫描完 · 安全</text>

  <rect x="70" y="300" width="110" height="54" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="324" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">C · 白</text>
  <text x="125" y="344" font-size="11" fill="#7f0000" text-anchor="middle">根不可达 → 回收</text>

  <line x1="200" y1="162" x2="256" y2="216" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="372" y1="234" x2="466" y2="192" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="372" y1="266" x2="466" y2="312" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <text x="60" y="374" font-size="11.5" fill="#37474f">标记：从根出发涂灰 → 逐个扫完涂黑 → 最后剩下的白 = 垃圾（C）</text>

  <!-- 右：三色含义 -->
  <rect x="740" y="80" width="420" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="760" y="100" width="380" height="48" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="950" y="130" font-size="12.5" fill="#7f0000" text-anchor="middle">白｜未访问 · 可能回收</text>
  <rect x="760" y="160" width="380" height="48" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
  <text x="950" y="190" font-size="12.5" fill="#37474f" text-anchor="middle">灰｜已访问 · 子未扫完</text>
  <rect x="760" y="220" width="380" height="48" rx="6" fill="#546e7a" stroke="#546e7a" stroke-width="1.5"/>
  <text x="950" y="250" font-size="12.5" fill="#ffffff" text-anchor="middle">黑｜扫完 · 安全</text>

  <rect x="760" y="284" width="380" height="76" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="950" y="310" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">STW 只剩两次</text>
  <text x="950" y="332" font-size="11.5" fill="#1b3d1e" text-anchor="middle">各几十微秒（Go 1.8+）</text>
  <text x="950" y="352" font-size="11.5" fill="#1b3d1e" text-anchor="middle">标记与业务并发进行</text>

  <!-- 漏标问题 -->
  <rect x="40" y="404" width="1120" height="64" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="428" font-size="12.5" fill="#7f0000">漏标风险：标记期间业务还在改指针——黑对象新指向一个白对象，这个白会被误回收（漏标）</text>
  <text x="60" y="452" font-size="12" font-weight="bold" fill="#7f0000">黑 → 白 的新引用是危险方向</text>

  <!-- 解法 -->
  <rect x="40" y="484" width="1120" height="44" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="511" font-size="12.5" fill="#123314">解法：写屏障——每次指针写入都记录变更，保证不漏标；混合写屏障把 STW 压到两次几十微秒</text>

  <!-- 尾注 -->
  <text x="40" y="560" font-size="11.5" fill="#616161">调优入口：GOGC 触发频率、GOMEMLIMIT 软上限（容器按 limit 的 80% 设）；健康判据看 gctrace 的存活堆是否持续上涨。</text>

  <!-- 图例 -->
  <rect x="40" y="580" width="1120" height="56" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="596" width="22" height="14" rx="3" fill="#546e7a" stroke="#546e7a" stroke-width="1"/>
  <text x="92" y="608" font-size="12" fill="#37474f">黑（扫描完）</text>
  <rect x="220" y="596" width="22" height="14" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
  <text x="252" y="608" font-size="12" fill="#37474f">灰（扫描中）</text>
  <rect x="380" y="596" width="22" height="14" rx="3" fill="#ffffff" stroke="#c62828" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="412" y="608" font-size="12" fill="#37474f">白（待回收）</text>
  <rect x="540" y="596" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="572" y="608" font-size="12" fill="#37474f">GC Roots（起点）</text>
  <rect x="760" y="596" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="792" y="608" font-size="12" fill="#37474f">STW / 解法</text>
  <rect x="930" y="596" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="962" y="608" font-size="12" fill="#37474f">漏标 / 陷阱</text>
</svg>
