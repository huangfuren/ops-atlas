<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>错误包装链：fmt.Errorf %w 与 errors.Is/As 解包</title>
  <desc>底层返回哨兵错误，中间层用 %w 包一层上下文形成链，顶层用 errors.Is 判断哨兵值、errors.As 提取自定义类型。底部是三条纪律与 Unwrap 实现说明、图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">错误包装链：%w 建链，Is / As 解包</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">115 §2</text>

  <!-- 底层 -->
  <rect x="40" y="80" width="1120" height="96" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="104" font-size="12" font-weight="bold" fill="#616161">底层（dao 层）——哨兵错误先声明，供上层 Is 判断</text>
  <rect x="60" y="114" width="1080" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="76" y="141" font-size="12" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">var ErrNotFound = errors.New("record not found")</text>

  <line x1="600" y1="176" x2="600" y2="196" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 中间层 -->
  <rect x="40" y="200" width="1120" height="96" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="224" font-size="12" font-weight="bold" fill="#616161">中间层（service）——%w 包一层上下文</text>
  <rect x="60" y="234" width="1080" height="44" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="76" y="261" font-size="12" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">return fmt.Errorf("query user %d: %w", uid, err)</text>

  <line x1="600" y1="296" x2="600" y2="316" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 顶层 -->
  <rect x="40" y="320" width="1120" height="96" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="344" font-size="12" font-weight="bold" fill="#616161">顶层（handler）——Is 判断 / As 提取</text>
  <rect x="60" y="354" width="525" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="76" y="381" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">errors.Is(err, ErrNotFound)  // true</text>
  <rect x="615" y="354" width="525" height="44" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="631" y="381" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">var e *MyErr; errors.As(err, &amp;e)</text>

  <!-- 三条纪律 -->
  <rect x="40" y="440" width="1120" height="96" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="466" font-size="13" font-weight="bold" fill="#7f3f00">三条纪律</text>
  <text x="60" y="492" font-size="12.5" fill="#5d4037">① 每层只包一次上下文（谁调用谁包），不要底层把上下文全拼完</text>
  <text x="60" y="516" font-size="12.5" fill="#5d4037">② %w 才能建链；用 %v 或 fmt.Println 打错误 = 链断了，Is / As 全失效　　③ 哨兵错误先声明，包内导出</text>

  <!-- 尾注 -->
  <text x="40" y="566" font-size="11.5" fill="#616161">链的底层实现：err 实现 Unwrap() 方法——包装一次包一层，errors.Is 循环 Unwrap 逐层比对。深入见 124 §1。</text>

  <!-- 图例 -->
  <rect x="40" y="584" width="1120" height="56" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="600" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="612" font-size="12" fill="#37474f">链上各层（错误数据）</text>
  <rect x="400" y="600" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="432" y="612" font-size="12" fill="#37474f">顶层判断（出口）</text>
  <rect x="700" y="600" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="732" y="612" font-size="12" fill="#37474f">纪律块</text>
</svg>
