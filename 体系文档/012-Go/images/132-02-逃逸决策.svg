<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>逃逸决策：变量去栈还是堆</title>
  <desc>编译器在编译期做逃逸分析：生命周期不超出栈帧就留在栈上，零 GC 成本；指针逃出函数、被 interface 或闭包捕获、发送到 channel、对象过大就逃逸到堆。右侧是常见逃逸原因速查，底部是优化方向与查看方式、图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">逃逸决策：变量去栈还是堆</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">132 §1.1</text>

  <!-- 左：决策路径 -->
  <rect x="40" y="80" width="680" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="70" y="104" width="240" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="190" y="128" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">局部变量 / 返回值</text>
  <text x="190" y="148" font-size="11" fill="#0d2f5c" text-anchor="middle">声明在函数内</text>

  <line x1="310" y1="132" x2="386" y2="132" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <rect x="390" y="104" width="300" height="56" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="540" y="128" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">编译期逃逸分析</text>
  <text x="540" y="148" font-size="11" fill="#0d2f5c" text-anchor="middle">不改变语义，只决定去向</text>

  <line x1="540" y1="160" x2="540" y2="180" stroke="#1565c0" stroke-width="2"/>
  <line x1="180" y1="180" x2="540" y2="180" stroke="#1565c0" stroke-width="2"/>
  <line x1="180" y1="180" x2="180" y2="196" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="540" y1="180" x2="540" y2="196" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <rect x="95" y="200" width="270" height="72" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="230" y="226" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">栈 · 不逃逸</text>
  <text x="230" y="248" font-size="11.5" fill="#1b3d1e" text-anchor="middle">函数返回即回收</text>
  <text x="230" y="266" font-size="11.5" fill="#1b3d1e" text-anchor="middle">零 GC 成本 · 极快</text>

  <rect x="395" y="200" width="270" height="72" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="530" y="226" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">堆 · 逃逸</text>
  <text x="530" y="248" font-size="11.5" fill="#7f3f00" text-anchor="middle">生命周期超出栈帧</text>
  <text x="530" y="266" font-size="11.5" fill="#7f3f00" text-anchor="middle">GC 管理 · 有分配成本</text>

  <text x="70" y="302" font-size="12.5" font-weight="bold" fill="#37474f">三个判据，命中任一即上堆：</text>
  <text x="70" y="326" font-size="12" fill="#37474f">① 指针逃出函数　② 被 interface / 闭包捕获　③ 发送到 channel 或对象过大</text>
  <text x="70" y="350" font-size="11.5" fill="#616161">逃逸是编译期结论，运行期不会在栈堆之间搬——看 -m 输出，别猜。</text>

  <!-- 右：常见逃逸原因 -->
  <rect x="740" y="80" width="420" height="300" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="760" y="106" font-size="13" font-weight="bold" fill="#37474f">常见逃逸原因</text>
  <text x="760" y="132" font-size="12" fill="#37474f">返回局部变量指针</text>
  <text x="1140" y="132" font-size="11" fill="#616161" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">return &amp;T{}</text>
  <line x1="760" y1="142" x2="1140" y2="142" stroke="#eceff1" stroke-width="1"/>
  <text x="760" y="164" font-size="12" fill="#37474f">存进 interface</text>
  <text x="1140" y="164" font-size="11" fill="#616161" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">fmt.Println(x)</text>
  <line x1="760" y1="174" x2="1140" y2="174" stroke="#eceff1" stroke-width="1"/>
  <text x="760" y="196" font-size="12" fill="#37474f">闭包捕获外部变量</text>
  <text x="1140" y="196" font-size="11" fill="#616161" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">func(){ use(x) }</text>
  <line x1="760" y1="206" x2="1140" y2="206" stroke="#eceff1" stroke-width="1"/>
  <text x="760" y="228" font-size="12" fill="#37474f">发送到 channel</text>
  <text x="1140" y="228" font-size="11" fill="#616161" text-anchor="end">跨协程共享</text>
  <line x1="760" y1="238" x2="1140" y2="238" stroke="#eceff1" stroke-width="1"/>
  <text x="760" y="260" font-size="12" fill="#37474f">变量过大超栈帧</text>
  <text x="1140" y="260" font-size="11" fill="#616161" text-anchor="end">大数组 / 大 struct</text>
  <line x1="760" y1="270" x2="1140" y2="270" stroke="#eceff1" stroke-width="1"/>
  <text x="760" y="292" font-size="12" fill="#37474f">返回 slice 的子切片</text>
  <text x="1140" y="292" font-size="11" fill="#616161" text-anchor="end">共享底层数组</text>
  <text x="760" y="322" font-size="11.5" fill="#616161">逃逸不等于内存泄漏，只意味着这次分配要 GC 兜底。</text>
  <text x="760" y="346" font-size="11.5" fill="#616161">先看频率，再看单次成本。</text>

  <!-- 优化方向 -->
  <rect x="40" y="400" width="1120" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="424" font-size="12.5" font-weight="bold" fill="#7f3f00">优化方向不是「消灭所有逃逸」，而是「减少高频路径上的分配」——热点上的每请求一次分配都值得改</text>
  <text x="60" y="448" font-size="12" fill="#5d4037">先 profile 找热点（133），再看热点函数的 -m 输出，最后才动代码；盲目改返回值形态常换来更差的 API</text>

  <!-- 查看方式 -->
  <rect x="40" y="480" width="1120" height="44" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="507" font-size="12.5" fill="#1b5e20">查看：<tspan font-family="ui-monospace,Menlo,Consolas,monospace">go build -gcflags='-m' ./...</tspan> 看是否逃逸，-m -m 看原因；生产判据看 gctrace 的存活堆是否持续上涨</text>

  <!-- 尾注 -->
  <text x="40" y="552" font-size="11.5" fill="#616161">栈是自动回收的快速通道，堆是 GC 的管辖范围；逃逸分析是编译器替你做的一次分配决策。</text>

  <!-- 图例 -->
  <rect x="40" y="572" width="1120" height="48" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="586" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="92" y="598" font-size="12" fill="#37474f">栈（不逃逸）</text>
  <rect x="300" y="586" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="332" y="598" font-size="12" fill="#37474f">堆（逃逸）</text>
  <rect x="540" y="586" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="572" y="598" font-size="12" fill="#37474f">分析入口（变量 / 编译器）</text>
  <rect x="860" y="586" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="892" y="598" font-size="12" fill="#37474f">查看方式 / 纪律</text>
</svg>
