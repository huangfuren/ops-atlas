<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>pprof 定位闭环：从症状到修复</title>
  <desc>定位闭环四步：看症状选 profile，开箱三件套采集，top/list/火焰图分析，修复后压测回归。右侧五种 profile 各自回答的问题。底部安全注记与图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">pprof 定位闭环：从症状到修复</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">133 §1</text>

  <!-- ① 症状 -->
  <rect x="40" y="80" width="700" height="84" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="104" font-size="13" font-weight="bold" fill="#37474f">① 症状</text>
  <rect x="60" y="114" width="150" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="135" y="137" font-size="12" fill="#7f0000" text-anchor="middle">CPU 高</text>
  <rect x="226" y="114" width="150" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="301" y="137" font-size="12" fill="#7f0000" text-anchor="middle">内存持续涨</text>
  <rect x="392" y="114" width="150" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="467" y="137" font-size="12" fill="#7f0000" text-anchor="middle">goroutine 涨</text>
  <rect x="558" y="114" width="150" height="36" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="633" y="137" font-size="12" fill="#7f0000" text-anchor="middle">锁竞争激烈</text>

  <line x1="390" y1="168" x2="390" y2="188" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- ② 采集 -->
  <rect x="40" y="192" width="700" height="104" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="218" font-size="13" font-weight="bold" fill="#0d2f5c">② 采集：开箱三件套</text>
  <text x="60" y="244" font-size="12" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">import _ "net/http/pprof"  +  127.0.0.1:6060</text>
  <text x="60" y="270" font-size="11" fill="#0d2f5c" font-family="ui-monospace,Menlo,Consolas,monospace">go tool pprof http://127.0.0.1:6060/debug/pprof/...</text>

  <line x1="390" y1="300" x2="390" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- ③ 分析 -->
  <rect x="40" y="324" width="700" height="128" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="60" y="350" font-size="13" font-weight="bold" fill="#7f3f00">③ 分析三招</text>
  <text x="60" y="376" font-size="12" fill="#7f3f00">top20——flat 高 = 真热点；cum 高 = 慢在调用链</text>
  <text x="60" y="402" font-size="12" fill="#7f3f00">list 函数名——逐行看耗时落点</text>
  <text x="60" y="428" font-size="12" fill="#7f3f00">火焰图——看最宽的一块（-http=:8081 打开）</text>

  <line x1="390" y1="456" x2="390" y2="476" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- ④ 修复 -->
  <rect x="40" y="480" width="700" height="60" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="60" y="505" font-size="13" font-weight="bold" fill="#123314">④ 修复 → 压测回归（133 §3）</text>
  <text x="60" y="528" font-size="12" fill="#1b3d1e">用基准验证优化真的有效——没有回归数据的优化不算数</text>

  <!-- 右：五种 profile -->
  <rect x="780" y="80" width="380" height="460" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="800" y="106" font-size="13" font-weight="bold" fill="#37474f">五种 profile 回答什么</text>

  <rect x="800" y="118" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="140" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">cpu</text>
  <text x="816" y="162" font-size="11.5" fill="#37474f">CPU 被谁吃了</text>

  <rect x="800" y="182" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="204" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">heap</text>
  <text x="816" y="226" font-size="11.5" fill="#37474f">内存被谁占了（默认看存活）</text>

  <rect x="800" y="246" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="268" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">goroutine</text>
  <text x="816" y="290" font-size="11.5" fill="#37474f">G 卡在哪、泄漏在哪</text>

  <rect x="800" y="310" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="332" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">block</text>
  <text x="816" y="354" font-size="11.5" fill="#37474f">谁在等锁 / channel · 等多久</text>

  <rect x="800" y="374" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="396" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">mutex</text>
  <text x="816" y="418" font-size="11.5" fill="#37474f">哪个锁竞争最激烈</text>

  <rect x="800" y="438" width="340" height="56" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="816" y="460" font-size="12" font-weight="bold" fill="#0d47a1" font-family="ui-monospace,Menlo,Consolas,monospace">trace</text>
  <text x="816" y="482" font-size="11.5" fill="#37474f">时间轴：调度 · GC · syscall</text>

  <text x="800" y="520" font-size="11.5" fill="#616161">block / mutex 默认采样率低，先调 Rate 再压测</text>

  <!-- 安全注记 -->
  <rect x="40" y="560" width="1120" height="44" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="587" font-size="12.5" fill="#7f0000">安全红线：pprof 端口只绑 127.0.0.1，绝不与业务端口一起对外暴露——profile 数据会泄露内存与调用细节</text>

  <!-- 尾注 -->
  <text x="40" y="634" font-size="11.5" fill="#616161">只看 flat 找热点，用 cum 找调用链——top 前 5 行累计超 70%，基本就定位了。</text>

  <!-- 图例 -->
  <rect x="40" y="650" width="1120" height="34" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="658" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="92" y="670" font-size="12" fill="#37474f">症状 / 安全红线</text>
  <rect x="320" y="658" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="352" y="670" font-size="12" fill="#37474f">采集步骤</text>
  <rect x="480" y="658" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="512" y="670" font-size="12" fill="#37474f">分析步骤</text>
  <rect x="640" y="658" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="672" y="670" font-size="12" fill="#37474f">修复 / 回归</text>
</svg>
