<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>切片三要素：指针 + len + cap，append 与共享陷阱的根源</title>
  <desc>切片头三个字段：ptr 指向底层数组、len 是长度、cap 是容量。append 容量够就原地写入，不够就搬新数组。下方两个陷阱：子切片共享底层数组改一个两个都变；append 搬家后指向分开互不影响。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
    <marker id="axRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="axGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">切片三要素：头 + 底层数组——append 与共享陷阱的根源</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">114 §1.2 · 122 §1.1</text>

  <!-- 面板 A -->
  <rect x="40" y="80" width="1120" height="212" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="104" font-size="12" fill="#37474f">append 后 len 2→3：容量够 → 原地写入不重新分配；容量不够 → 分配新数组搬家（见下方陷阱 B）</text>

  <rect x="70" y="120" width="260" height="152" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="200" y="144" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">切片头 slice header</text>
  <rect x="88" y="156" width="224" height="30" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="200" y="176" font-size="12" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">ptr</text>
  <rect x="88" y="192" width="224" height="30" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="200" y="212" font-size="12" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">len = 3</text>
  <rect x="88" y="228" width="224" height="30" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="200" y="248" font-size="12" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cap = 5</text>

  <line x1="334" y1="196" x2="432" y2="196" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>
  <text x="383" y="186" font-size="10" fill="#616161" text-anchor="middle">ptr 指向</text>

  <!-- 底层数组 5 格 -->
  <rect x="440" y="168" width="90" height="56" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="485" y="202" font-size="13" fill="#37474f" text-anchor="middle">0</text>
  <rect x="535" y="168" width="90" height="56" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="580" y="202" font-size="13" fill="#37474f" text-anchor="middle">0</text>
  <rect x="630" y="168" width="90" height="56" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="675" y="202" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">3</text>
  <rect x="725" y="168" width="90" height="56" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="770" y="202" font-size="13" fill="#616161" text-anchor="middle">·</text>
  <rect x="820" y="168" width="90" height="56" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <text x="865" y="202" font-size="13" fill="#616161" text-anchor="middle">·</text>
  <text x="485" y="244" font-size="11" fill="#616161" text-anchor="middle">[0]</text>
  <text x="580" y="244" font-size="11" fill="#616161" text-anchor="middle">[1]</text>
  <text x="675" y="244" font-size="11" fill="#616161" text-anchor="middle">[2]</text>
  <text x="770" y="244" font-size="11" fill="#616161" text-anchor="middle">[3]</text>
  <text x="865" y="244" font-size="11" fill="#616161" text-anchor="middle">[4]</text>

  <path d="M 440 162 L 440 156 L 725 156 L 725 162" fill="none" stroke="#388e3c" stroke-width="2"/>
  <text x="582" y="150" font-size="11" fill="#1b5e20" text-anchor="middle">len 3</text>
  <path d="M 440 232 L 440 240 L 915 240 L 915 232" fill="none" stroke="#607d8b" stroke-width="2" transform="translate(0,20)"/>
  <text x="677" y="272" font-size="11" fill="#37474f" text-anchor="middle">cap 5 · 点格 = 容量内未写入</text>

  <!-- 面板 B -->
  <rect x="40" y="312" width="1120" height="240" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>

  <rect x="70" y="332" width="520" height="192" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="330" y="358" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">陷阱 A：子切片与原切片共享底层数组</text>
  <text x="90" y="384" font-size="11" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">b := a[0:2]</text>
  <text x="90" y="406" font-size="12" fill="#7f0000">随后 b[0] = 99——改的是同一块内存</text>
  <rect x="110" y="424" width="60" height="32" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="140" y="445" font-size="12" fill="#7f0000" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">a</text>
  <rect x="110" y="466" width="60" height="32" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="140" y="487" font-size="12" fill="#7f0000" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">b</text>
  <rect x="280" y="440" width="220" height="40" rx="4" fill="#ffffff" stroke="#c62828" stroke-width="1"/>
  <text x="390" y="465" font-size="12" fill="#7f0000" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">[99 2 3]</text>
  <line x1="172" y1="440" x2="276" y2="452" stroke="#c62828" stroke-width="2" marker-end="url(#axRed)"/>
  <line x1="172" y1="482" x2="276" y2="466" stroke="#c62828" stroke-width="2" marker-end="url(#axRed)"/>
  <text x="90" y="522" font-size="12" font-weight="bold" fill="#7f0000">改 b[0]，a[0] 也变——一个数组两个头</text>

  <rect x="610" y="332" width="520" height="192" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="870" y="358" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">append 容量不够 → 搬新家，从此无关</text>
  <text x="630" y="384" font-size="11" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">b = append(b, 100)</text>
  <text x="630" y="406" font-size="12" fill="#123314">cap 不够 → 分配新数组，b 的 ptr 改指新家</text>
  <rect x="650" y="424" width="60" height="32" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="680" y="445" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">a</text>
  <rect x="650" y="466" width="60" height="32" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="680" y="487" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">b</text>
  <rect x="820" y="424" width="220" height="32" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="930" y="445" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">[99 2 3] 旧</text>
  <rect x="820" y="466" width="220" height="32" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="930" y="487" font-size="12" fill="#123314" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">[99 2 3 100 ·] 新</text>
  <line x1="712" y1="440" x2="816" y2="440" stroke="#2e7d32" stroke-width="2" marker-end="url(#axGreen)"/>
  <line x1="712" y1="482" x2="816" y2="482" stroke="#2e7d32" stroke-width="2" marker-end="url(#axGreen)"/>
  <text x="630" y="522" font-size="12" font-weight="bold" fill="#123314">b[0]=88 不再影响 a——指向已分开</text>

  <!-- 预分配 -->
  <rect x="40" y="576" width="1120" height="44" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="603" font-size="12.5" fill="#7f3f00">预分配：知道容量就写 make([]int, 0, n)——省掉反复搬家拷贝（扩容规则见 122 §1）</text>

  <!-- 尾注 -->
  <text x="40" y="650" font-size="11.5" fill="#616161">切片头不存数据——len/cap 与共享、扩容的所有行为都由这三个字段决定。</text>

  <!-- 图例 -->
  <rect x="40" y="664" width="1120" height="40" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="676" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="688" font-size="12" fill="#37474f">切片头（结构）</text>
  <rect x="320" y="676" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="352" y="688" font-size="12" fill="#37474f">陷阱：共享底层数组</text>
  <rect x="620" y="676" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="652" y="688" font-size="12" fill="#37474f">append 搬家（指向分开）</text>
</svg>
