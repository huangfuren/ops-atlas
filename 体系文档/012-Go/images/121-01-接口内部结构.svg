<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>接口值的内部结构：两个指针——nil 接口陷阱的根源</title>
  <desc>接口值是两个指针：eface 空接口是类型信息加数据指针，iface 非空接口是 itab 加数据指针，itab 内含接口类型、动态类型和方法表。右侧是 typed nil 陷阱：nil 指针赋给接口后接口不等于 nil。底部是结论与图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">接口值的内部结构：两个指针——nil 接口陷阱的根源</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">121 §2.1</text>

  <!-- 左：两个指针 -->
  <rect x="40" y="80" width="560" height="388" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="108" font-size="15" font-weight="bold" fill="#37474f">接口值 = 两个指针</text>

  <rect x="60" y="122" width="520" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="320" y="146" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">eface——空接口（interface{} / any）</text>
  <text x="320" y="168" font-size="11.5" fill="#0d2f5c" text-anchor="middle">_type 类型信息 ｜ data 数据指针</text>

  <rect x="60" y="194" width="520" height="60" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="320" y="218" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">iface——非空接口（io.Writer 等）</text>
  <text x="320" y="240" font-size="11.5" fill="#0d2f5c" text-anchor="middle">itab ｜ data 数据指针</text>

  <line x1="320" y1="254" x2="320" y2="272" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <rect x="60" y="276" width="520" height="118" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="320" y="300" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">itab 放大</text>
  <text x="80" y="326" font-size="12" fill="#7f3f00">inter——接口类型（静态，编译期已知）</text>
  <text x="80" y="350" font-size="12" fill="#7f3f00">_type——动态类型（运行时实际类型）</text>
  <text x="80" y="374" font-size="12" fill="#7f3f00">fun——方法表 → 动态派发查这里</text>

  <text x="60" y="424" font-size="11.5" fill="#616161">方法调用走 itab 方法表（动态派发），类型断言查 _type</text>
  <text x="60" y="448" font-size="11.5" fill="#616161">接口语义与运行时形状的对照见 121 §2</text>

  <!-- 右：typed nil -->
  <rect x="640" y="80" width="520" height="388" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="660" y="108" font-size="15" font-weight="bold" fill="#37474f">经典陷阱：typed nil</text>

  <rect x="660" y="122" width="480" height="128" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="680" y="148" font-size="12" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">var p *bytes.Buffer = nil</text>
  <text x="680" y="170" font-size="12" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">var w io.Writer = p</text>
  <text x="680" y="196" font-size="13" font-weight="bold" fill="#7f0000">w == nil 的结果是 false！</text>
  <text x="680" y="220" font-size="11.5" fill="#7f0000">itab 里类型信息已就位，只是 data 为 nil——此时 w 调方法会 panic</text>

  <rect x="660" y="266" width="480" height="128" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="680" y="292" font-size="13" font-weight="bold" fill="#123314">判 nil：类型 + 数据指针都为 nil</text>
  <text x="680" y="318" font-size="12" fill="#7f0000" font-family="ui-monospace,Menlo,Consolas,monospace">bad:  var e *MyErr = nil; return e</text>
  <text x="680" y="342" font-size="12" fill="#123314" font-family="ui-monospace,Menlo,Consolas,monospace">good: return nil</text>
  <text x="680" y="368" font-size="11.5" font-weight="bold" fill="#123314">推论：error 返回值绝不返回具体类型的 nil 指针</text>

  <text x="660" y="424" font-size="11.5" fill="#616161">接口非 nil 只看类型信息——typed nil 带着类型信息上路</text>
  <text x="660" y="448" font-size="11.5" fill="#616161">表现：日志里 err 非 nil 但值打出来是 &lt;nil&gt;</text>

  <!-- 结论块 -->
  <rect x="40" y="492" width="1120" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="518" font-size="12.5" font-weight="bold" fill="#7f3f00">接口是两个指针，不是一个值——「有没有实现接口」和「值是不是 nil」是两个独立的问题</text>
  <text x="60" y="542" font-size="12" fill="#5d4037">判空要同时看类型与数据：reflect.ValueOf(w).IsNil() 或在业务层约定返回裸 nil</text>

  <!-- 尾注 -->
  <text x="40" y="588" font-size="11.5" fill="#616161">坑位：接口与接收者的六坑见 121 §3；typed nil 是其中最高频的一坑。</text>

  <!-- 图例 -->
  <rect x="40" y="604" width="1120" height="56" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="620" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="632" font-size="12" fill="#37474f">接口结构（eface / iface）</text>
  <rect x="400" y="620" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="432" y="632" font-size="12" fill="#37474f">itab（类型 + 方法表）</text>
  <rect x="680" y="620" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="712" y="632" font-size="12" fill="#37474f">陷阱</text>
  <rect x="820" y="620" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="852" y="632" font-size="12" fill="#37474f">正确做法</text>
</svg>
