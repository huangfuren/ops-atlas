<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 1040" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>Go 板块十七册地图：基础线 → 进阶线 → 高阶线</title>
  <desc>Go 板块十七册分三条线：基础线会写（111~116），进阶线会维护（121~125），高阶线会调优救火（131~136）。底部是最快上手工线与跨板块出口、图例。</desc>

  <rect x="0" y="0" width="1960" height="1040" fill="#ffffff"/>

  <text x="60" y="54" font-size="20" font-weight="bold" fill="#263238">Go 十七册地图：三条能力线</text>
  <text x="1900" y="54" font-size="12" fill="#616161" text-anchor="end">012-Go · 003 全景</text>

  <!-- 基础线 -->
  <rect x="60" y="92" width="1840" height="212" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="124" font-size="17" font-weight="bold" fill="#0d47a1">基础线 · 会写（111–116）</text>
  <text x="1876" y="124" font-size="11.5" fill="#616161" text-anchor="end">环境到并发第一课，写工具的地基</text>

  <rect x="84" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="224" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">111 环境配置与工具链</text>
  <text x="224" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">SDK · 代理 · 速查</text>
  <text x="224" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">七个坑</text>
  <text x="224" y="252" font-size="11" fill="#0d2f5c" text-anchor="middle" font-weight="bold">上手线第 1 站</text>

  <rect x="396" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="536" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">112 语言概览与设计哲学</text>
  <text x="536" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">五特性 · 四哲学</text>
  <text x="536" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">三语言对比</text>

  <rect x="708" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="848" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">113 语法基础</text>
  <text x="848" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">变量类型 · 流程控制</text>
  <text x="848" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">新手坑</text>
  <text x="848" y="252" font-size="11" fill="#0d2f5c" text-anchor="middle" font-weight="bold">上手线第 2 站</text>

  <rect x="1020" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1160" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">114 复合类型与函数</text>
  <text x="1160" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">切片 map struct</text>
  <text x="1160" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">defer · 指针</text>
  <text x="1160" y="252" font-size="11" fill="#0d2f5c" text-anchor="middle" font-weight="bold">上手线第 3 站</text>

  <rect x="1332" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1472" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">115 方法接口与错误处理</text>
  <text x="1472" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">方法集 · 隐式实现</text>
  <text x="1472" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">错误包装</text>

  <rect x="1644" y="140" width="280" height="140" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="1784" y="166" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">116 标准库与并发第一课</text>
  <text x="1784" y="194" font-size="11.5" fill="#0d2f5c" text-anchor="middle">常用库</text>
  <text x="1784" y="218" font-size="11.5" fill="#0d2f5c" text-anchor="middle">goroutine 第一课</text>
  <text x="1784" y="252" font-size="11" fill="#0d2f5c" text-anchor="middle" font-weight="bold">上手线终点 · 照 §4 练</text>

  <!-- 进阶线 -->
  <rect x="60" y="324" width="1840" height="212" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="356" font-size="17" font-weight="bold" fill="#1b5e20">进阶线 · 会维护（121–125）</text>
  <text x="1876" y="356" font-size="11.5" fill="#616161" text-anchor="end">读得懂别人的代码，接得住线上问题</text>

  <rect x="84" y="372" width="332" height="140" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="250" y="398" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">121 类型系统与接口进阶</text>
  <text x="250" y="426" font-size="11.5" fill="#1b3d1e" text-anchor="middle">断言 · 嵌入 · itab</text>
  <text x="250" y="450" font-size="11.5" fill="#1b3d1e" text-anchor="middle">nil 接口陷阱</text>

  <rect x="448" y="372" width="332" height="140" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="614" y="398" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">122 切片 map 底层与值语义</text>
  <text x="614" y="426" font-size="11.5" fill="#1b3d1e" text-anchor="middle">扩容 · 共享数组</text>
  <text x="614" y="450" font-size="11.5" fill="#1b3d1e" text-anchor="middle">值语义</text>

  <rect x="812" y="372" width="332" height="140" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="978" y="398" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">123 并发模式与 channel 进阶</text>
  <text x="978" y="426" font-size="11.5" fill="#1b3d1e" text-anchor="middle">errgroup · 扇入扇出</text>
  <text x="978" y="450" font-size="11.5" fill="#1b3d1e" text-anchor="middle">单向 channel · 泄漏</text>

  <rect x="1176" y="372" width="332" height="140" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1342" y="398" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">124 错误处理进阶与测试基准</text>
  <text x="1342" y="426" font-size="11.5" fill="#1b3d1e" text-anchor="middle">包装链 · panic 纪律</text>
  <text x="1342" y="450" font-size="11.5" fill="#1b3d1e" text-anchor="middle">基准测试</text>

  <rect x="1540" y="372" width="332" height="140" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1706" y="398" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">125 工程化与代码组织</text>
  <text x="1706" y="426" font-size="11.5" fill="#1b3d1e" text-anchor="middle">项目布局</text>
  <text x="1706" y="450" font-size="11.5" fill="#1b3d1e" text-anchor="middle">依赖 · 构建</text>

  <!-- 高阶线 -->
  <rect x="60" y="556" width="1840" height="212" rx="8" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="588" font-size="17" font-weight="bold" fill="#311b92">高阶线 · 会调优救火（131–136）</text>
  <text x="1876" y="588" font-size="11.5" fill="#616161" text-anchor="end">出事的时候，这些人下得去手</text>

  <rect x="84" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="224" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">131 GMP 调度与内存模型</text>
  <text x="224" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">G/M/P · 偷任务</text>
  <text x="224" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">数据竞争</text>

  <rect x="396" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="536" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">132 GC 内存管理与调优</text>
  <text x="536" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">三色标记 · 逃逸</text>
  <text x="536" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">GOMEMLIMIT</text>

  <rect x="708" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="848" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">133 pprof 与性能调优</text>
  <text x="848" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">五种 profile</text>
  <text x="848" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">火焰图</text>

  <rect x="1020" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1160" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">134 并发高级泛型与反射</text>
  <text x="1160" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">单 chan · 约束</text>
  <text x="1160" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">unsafe 边界</text>

  <rect x="1332" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1472" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">135 编译交付与可观测</text>
  <text x="1472" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">交叉编译 · slog</text>
  <text x="1472" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">OTel 出口</text>

  <rect x="1644" y="604" width="280" height="140" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="1784" y="630" font-size="14" font-weight="bold" fill="#311b92" text-anchor="middle">136 事故复盘与源码阅读</text>
  <text x="1784" y="658" font-size="11.5" fill="#311b92" text-anchor="middle">六起事故</text>
  <text x="1784" y="682" font-size="11.5" fill="#311b92" text-anchor="middle">源码阅读</text>

  <!-- 最快上手工线 -->
  <rect x="60" y="792" width="1840" height="70" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="84" y="820" font-size="13" font-weight="bold" fill="#7f3f00">最快上手工线：111 → 113 → 114 → 116 → 照 116 §4 练习写一个工具，其余按需回查</text>
  <text x="84" y="846" font-size="12.5" fill="#5d4037">115 全例的零件在此组装（「Python」111 §0.2 同思路）；加粗「上手线」标记的四册就是最短路径</text>

  <!-- 跨板块出口 -->
  <rect x="60" y="882" width="1840" height="70" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="84" y="910" font-size="12.5" fill="#37474f">可观测三支柱出口 →「监控」117（打点）/「日志」（slog）/「链路」112（OTel 埋点）——详见 135 §3</text>
  <text x="84" y="936" font-size="12.5" fill="#37474f">静态二进制的容器交付 →「容器」112；三语言分工 →「Python」111 §0.2；词汇查 190 术语表</text>

  <!-- 图例 -->
  <rect x="60" y="972" width="1840" height="44" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="100" y="984" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="132" y="996" font-size="12" fill="#37474f">基础线 · 会写</text>
  <rect x="440" y="984" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="472" y="996" font-size="12" fill="#37474f">进阶线 · 会维护</text>
  <rect x="800" y="984" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="832" y="996" font-size="12" fill="#37474f">高阶线 · 会调优救火</text>
  <rect x="1200" y="984" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="1232" y="996" font-size="12" fill="#37474f">结论块 / 上手线</text>
</svg>
