<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>channel 运行模型与 select：缓冲、阻塞、多路复用</title>
  <desc>无缓冲 channel 双方就绪才交接；有缓冲 channel 满则发送阻塞、空则接收阻塞。select 同时等多个 channel，就绪的随机选一个，default 非阻塞，time.After 超时。底部四个坑与选型口诀、图例。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">channel 运行模型与 select</text>
  <text x="1160" y="48" font-size="12" fill="#616161" text-anchor="end">123 §2.5</text>

  <!-- 无缓冲 -->
  <rect x="40" y="80" width="540" height="192" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="106" font-size="13" font-weight="bold" fill="#37474f">无缓冲：<tspan font-family="ui-monospace,Menlo,Consolas,monospace">make(chan T)</tspan></text>
  <rect x="70" y="120" width="110" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="125" y="143" font-size="12" fill="#0d2f5c" text-anchor="middle">发送方</text>
  <rect x="440" y="120" width="110" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="495" y="143" font-size="12" fill="#0d2f5c" text-anchor="middle">接收方</text>
  <line x1="184" y1="138" x2="436" y2="138" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <text x="310" y="128" font-size="11" fill="#37474f" text-anchor="middle">双方都就绪才交接</text>
  <text x="60" y="188" font-size="12" fill="#c62828">发送后没人收 → 发送方永久阻塞</text>
  <text x="60" y="214" font-size="12" fill="#37474f">适合：同步交接点（信号、确认）</text>
  <text x="60" y="240" font-size="11.5" fill="#616161">交接 = 一次握手的「 rendezvous 」</text>

  <!-- 有缓冲 -->
  <rect x="620" y="80" width="540" height="192" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="640" y="106" font-size="13" font-weight="bold" fill="#37474f">有缓冲：<tspan font-family="ui-monospace,Menlo,Consolas,monospace">make(chan T, n)</tspan></text>
  <rect x="650" y="120" width="100" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="700" y="143" font-size="12" fill="#0d2f5c" text-anchor="middle">发送方</text>
  <rect x="774" y="124" width="40" height="28" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="818" y="124" width="40" height="28" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="862" y="124" width="40" height="28" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <rect x="906" y="124" width="40" height="28" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="860" y="170" font-size="11" fill="#616161" text-anchor="middle">缓冲区 n=4 · 满则阻塞</text>
  <rect x="1020" y="120" width="110" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="1075" y="143" font-size="12" fill="#0d2f5c" text-anchor="middle">接收方</text>
  <line x1="752" y1="138" x2="770" y2="138" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="948" y1="138" x2="1016" y2="138" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <text x="640" y="196" font-size="12" fill="#37474f">缓冲不满发送不阻塞，空则接收阻塞</text>
  <text x="640" y="222" font-size="12" fill="#37474f">适合：削峰、生产者消费者解耦</text>
  <text x="640" y="248" font-size="11.5" fill="#616161">缓冲只是排队，不改变「满了会堵」的事实</text>

  <!-- select -->
  <rect x="40" y="292" width="1120" height="176" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="60" y="318" font-size="13" font-weight="bold" fill="#37474f">select：等多路，就绪的随机选一个</text>
  <rect x="70" y="332" width="340" height="76" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="240" y="358" font-size="12" fill="#0d2f5c" text-anchor="middle">ch1（数据）</text>
  <text x="240" y="384" font-size="11" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">case v := &lt;-ch1:</text>
  <rect x="430" y="332" width="340" height="76" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="600" y="358" font-size="12" fill="#0d2f5c" text-anchor="middle">ch2（取消信号）</text>
  <text x="600" y="384" font-size="11" fill="#0d2f5c" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">case &lt;-ctx.Done():</text>
  <rect x="790" y="332" width="340" height="76" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="960" y="358" font-size="12" font-weight="bold" fill="#123314" text-anchor="middle">default / time.After</text>
  <text x="960" y="384" font-size="12" fill="#123314" text-anchor="middle">非阻塞 · 超时退出</text>
  <text x="60" y="440" font-size="12" fill="#37474f">无 default 且都没就绪 → select 阻塞；多个就绪 → 随机选一个（避免饿死）</text>

  <!-- 四个坑 -->
  <rect x="40" y="488" width="1120" height="120" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="514" font-size="13" font-weight="bold" fill="#7f0000">四个坑</text>
  <text x="60" y="540" font-size="12" fill="#7f0000">① 向 nil channel 收发 = 永久阻塞（未 make 就用）　　② close 后接收得到零值（用 ok 判断区分）</text>
  <text x="60" y="566" font-size="12" fill="#7f0000">③ close 只能由发送方调，接收方 close = panic　　④ 多个发送方 close 前，先约定唯一的关闭者</text>
  <text x="60" y="592" font-size="12" fill="#7f0000">⑤ time.After 在 for 循环里每轮新建 Timer——长循环用 NewTimer + Reset（123 §3 坑 3）</text>

  <!-- 尾注 -->
  <text x="40" y="636" font-size="11.5" fill="#616161">选型口诀：同步交接用无缓冲；解耦削峰用有缓冲；多路等任一用 select。channel 泄漏排查见 123 §3。</text>

  <!-- 图例 -->
  <rect x="40" y="652" width="1120" height="48" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="666" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="678" font-size="12" fill="#37474f">发送 / 接收方与 case</text>
  <rect x="360" y="666" width="22" height="14" rx="3" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="392" y="678" font-size="12" fill="#37474f">default / 超时出口</text>
  <rect x="620" y="666" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="652" y="678" font-size="12" fill="#37474f">坑块</text>
</svg>
