<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>JVM 内存区域与排障工具映射</title>
  <desc>左列 JVM 内存四区：堆（对象，-Xmx，GC 主战场）、元空间（类元数据，本地内存）、线程栈（每线程私有）、直接内存（NIO 堆外），每区标注对应工具。右列排障入口：jps 找 PID 与命令族、OOM 四型对症、容器 137 红线。底部是与 Go 板块的对照与日志监控衔接。数据来源：011-JVM内存与GC排障册正文。</desc>

  <rect x="0" y="0" width="1200" height="730" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">JVM 内存区域与排障工具映射</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">011 JVM 内存与 GC 排障 · 排障先分区</text>

  <!-- 左列：内存四区 -->
  <text x="40" y="80" font-size="13" font-weight="bold" fill="#263238">内存四区——报错信息指明区域，处理方式完全不同</text>

  <rect x="40" y="92" width="560" height="90" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="118" font-size="14" font-weight="bold" fill="#0d2f5c">堆 Heap——对象存放（<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">-Xmx / -Xms</tspan>）</text>
  <text x="60" y="142" font-size="11.5" fill="#0d2f5c">年轻代（Eden + Survivor）+ 老年代——GC 主战场</text>
  <text x="60" y="166" font-size="11" fill="#1565c0"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">jstat -gc</tspan> · <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">jmap -dump</tspan> · GC 日志</text>

  <rect x="40" y="196" width="560" height="90" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="222" font-size="14" font-weight="bold" fill="#0d2f5c">元空间 Metaspace——类元数据（本地内存）</text>
  <text x="60" y="246" font-size="11.5" fill="#0d2f5c">8.x 取代永久代；不受 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">-Xmx</tspan> 管，受 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">MaxMetaspaceSize</tspan> 管</text>
  <text x="60" y="270" font-size="11" fill="#c62828">OOM 症状：<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">OutOfMemoryError: Metaspace</tspan></text>

  <rect x="40" y="300" width="560" height="90" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="326" font-size="14" font-weight="bold" fill="#0d2f5c">线程栈 Thread Stack——每线程私有</text>
  <text x="60" y="350" font-size="11.5" fill="#0d2f5c">方法调用帧；<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">-Xss</tspan> 控制（默认 1MB）——线程数暴涨的账算这里</text>
  <text x="60" y="374" font-size="11" fill="#1565c0"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">jstack</tspan> · thread dump</text>

  <rect x="40" y="404" width="560" height="90" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="60" y="430" font-size="14" font-weight="bold" fill="#0d2f5c">直接内存 Direct Memory——NIO 堆外</text>
  <text x="60" y="454" font-size="11.5" fill="#0d2f5c">不受 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">-Xmx</tspan> 管，受 <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">MaxDirectMemorySize</tspan> 管——容器 OOM 常见暗雷</text>
  <text x="60" y="478" font-size="11" fill="#1565c0">观察：<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">-XX:NativeMemoryTracking=summary</tspan>（NMT）</text>

  <!-- 右列：排障入口 -->
  <text x="640" y="80" font-size="13" font-weight="bold" fill="#263238">排障入口——先看后动</text>

  <rect x="640" y="92" width="520" height="120" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="660" y="118" font-size="13" font-weight="bold" fill="#37474f">第一步永远是找进程：命令族四件套（011 §3）</text>
  <text x="660" y="144" font-size="11.5" fill="#37474f"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">jps</tspan> 找 PID → <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">jstat -gc</tspan> 看分代与 GC 频率</text>
  <text x="660" y="168" font-size="11.5" fill="#37474f"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">jmap</tspan> 抓堆 / 看直方图 → <tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">jstack</tspan> 抓线程栈</text>
  <text x="660" y="192" font-size="11" fill="#616161">GC 日志生产必开（开销极小）——判断「慢是不是 GC 引起」的第一证据</text>

  <rect x="640" y="228" width="520" height="170" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="660" y="254" font-size="13" font-weight="bold" fill="#37474f">OOM 四型——按报错区域对症（011 §4）</text>
  <text x="660" y="282" font-size="11.5" fill="#37474f">堆 OOM → dump 用 MAT 分析，对比找增长点</text>
  <text x="660" y="308" font-size="11.5" fill="#37474f">Metaspace OOM → 查类加载器泄漏（动态生成类）</text>
  <text x="660" y="334" font-size="11.5" fill="#37474f">unable to create native thread → 线程数 / ulimit / 栈大小</text>
  <text x="660" y="360" font-size="11.5" fill="#37474f">Direct buffer memory → 直接内存超限，核对 NMT</text>
  <text x="660" y="386" font-size="11" fill="#616161">重启解决一切 OOM 是误解——泄漏型过几天再来</text>

  <rect x="640" y="414" width="520" height="104" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="660" y="440" font-size="13" font-weight="bold" fill="#7f0000">容器红线：-Xmx 设成容器 limit 不安全（011 §5）</text>
  <text x="660" y="466" font-size="11.5" fill="#7f0000">堆外（元空间 + 直接内存 + 线程栈）叠加后超 limit → OOMKilled，退出码 137</text>
  <text x="660" y="492" font-size="11" fill="#c62828">做法：<tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">-Xmx</tspan> 不超过 limit 的 6~7 成，给堆外留余量；告警看容器级</text>

  <!-- 对照与衔接 -->
  <rect x="40" y="530" width="1120" height="76" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="64" y="556" font-size="13" font-weight="bold" fill="#5d4700">对照学（两国语言）：「Go」132 GC ↔ 本册 GC；「Go」133 pprof ↔ jstack / jmap——同一问题两种解法</text>
  <text x="64" y="582" font-size="12" fill="#5d4700">衔接：JVM 指标进 Prometheus →「监控」117（JMX exporter / Micrometer）；应用日志采集 →「日志」111 / 123（logback）</text>

  <!-- 尾注 -->
  <text x="40" y="632" font-size="11" fill="#616161">误解澄清：Java 慢 ≠ 加内存——先分清堆 / 元空间 / 泄漏，盲目加内存掩盖泄漏；dump 大打不开用 MAT 分块或先看 jmap -histo</text>
  <text x="40" y="654" font-size="11" fill="#616161">正常 GC 内存锯齿：每次 GC 后水位回落；只涨不落才是泄漏——基线对照才有判断力（011 §2）</text>

  <!-- 图例 -->
  <rect x="40" y="670" width="1120" height="44" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="684" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="696" font-size="11" fill="#37474f">内存区域</text>
  <rect x="220" y="684" width="22" height="14" rx="3" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <text x="252" y="696" font-size="11" fill="#37474f">排障入口 / OOM 对症</text>
  <rect x="470" y="684" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="502" y="696" font-size="11" fill="#37474f">容器红线 / OOM 症状</text>
  <rect x="700" y="684" width="22" height="14" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1"/>
  <text x="732" y="696" font-size="11" fill="#37474f">对照与衔接</text>
</svg>
