<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>自动化三级阶梯：流程化、脚本化、平台化，幂等是安全带</title>
  <desc>三级阶梯从左到右升高：第一级流程化把隐含步骤写成检查单，换人执行结果一致；第二级脚本化把重复步骤写成幂等的剧本与流水线，中断可重跑；第三级平台化组合成自助系统，使用者不需要懂内部步骤，判据是每周多次使用才值得建。跳级得到的是快速混乱。下方是幂等安全带四条工程要求与立项算术。数据来源：014-Toil 治理与自动化册正文。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">自动化三级：不跳级，每级有完成标志</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">幂等是安全带</text>

  <!-- 跳级警告 -->
  <rect x="40" y="80" width="300" height="130" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="190" y="110" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">跳级 = 快速混乱（反例）</text>
  <text x="60" y="140" font-size="11" fill="#7f0000">流程没想清楚就写脚本：</text>
  <text x="60" y="164" font-size="11" fill="#7f0000">自动化的混乱传播更快、更难归因</text>
  <text x="60" y="192" font-size="11" fill="#c62828">先纸上想通，再动手自动化</text>

  <!-- 三级阶梯 -->
  <rect x="380" y="180" width="240" height="200" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="500" y="212" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">① 流程化</text>
  <text x="500" y="240" font-size="12" fill="#0d2f5c" text-anchor="middle">隐含步骤 → 检查单 / 文档</text>
  <text x="500" y="268" font-size="11" fill="#1565c0" text-anchor="middle">标志：换人执行结果一致</text>
  <text x="500" y="294" font-size="10" fill="#757575" text-anchor="middle">例：发布检查单</text>
  <text x="500" y="316" font-size="10" fill="#757575" text-anchor="middle">（CICD 131 §7.9）</text>

  <rect x="660" y="120" width="240" height="260" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="780" y="152" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">② 脚本化</text>
  <text x="780" y="180" font-size="12" fill="#0d2f5c" text-anchor="middle">重复步骤 → 幂等剧本 / 流水线</text>
  <text x="780" y="208" font-size="11" fill="#1565c0" text-anchor="middle">标志：中断可重跑，二遍全 ok</text>
  <text x="780" y="234" font-size="10" fill="#757575" text-anchor="middle">例：Ansible playbook（121）</text>
  <text x="780" y="256" font-size="10" fill="#757575" text-anchor="middle">Jenkinsfile（112）</text>

  <rect x="940" y="60" width="220" height="320" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="1050" y="92" font-size="14" font-weight="bold" fill="#123314" text-anchor="middle">③ 平台化</text>
  <text x="1050" y="120" font-size="12" fill="#123314" text-anchor="middle">脚本组合成自助系统</text>
  <text x="1050" y="144" font-size="12" fill="#123314" text-anchor="middle">一键发布 · 自愈 · 审批内嵌</text>
  <text x="1050" y="172" font-size="11" fill="#388e3c" text-anchor="middle">标志：使用者不懂内部也能用</text>
  <text x="1050" y="198" font-size="10" fill="#757575" text-anchor="middle">例：流水线 + 审批 + 回滚</text>
  <text x="1050" y="220" font-size="10" fill="#757575" text-anchor="middle">（CICD 132）</text>
  <text x="1050" y="248" font-size="11" fill="#388e3c" text-anchor="middle">判据：每周多次使用才值得建</text>

  <line x1="620" y1="300" x2="656" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="900" y1="250" x2="936" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <text x="380" y="402" font-size="9.5" fill="#607d8b">先流程后脚本，再上平台</text>
  <text x="660" y="402" font-size="9.5" fill="#607d8b">每级稳定后才升下一级</text>

  <!-- 幂等安全带 -->
  <rect x="40" y="412" width="1120" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="60" y="442" font-size="13" font-weight="bold" fill="#7f3f00">幂等安全带四条（014 §4.4）——「重跑不出事」，CICD 121 §4.7 / 122 §5.8 的机制在此收拢为规范</text>
  <text x="60" y="470" font-size="12" fill="#7f3f00">① 脚本幂等（模块优先，shell 补 creates / changed_when）　② 危险操作有确认闸（--check 演练先行）</text>
  <text x="60" y="498" font-size="12" fill="#7f3f00">③ 变更有审计（谁在何时让机器改了什么，可查）　④ 自动化自身进监控（CICD 133 §9.9，坏掉比手工慢更危险）</text>

  <!-- 立项算术 -->
  <rect x="40" y="546" width="1120" height="70" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="60" y="574" font-size="12" font-weight="bold" fill="#37474f">立项算术（014 §4.2）：10 分钟琐事 × 每天 × 250 天 = 约 41 小时 / 年 ≈ 一个全职周</text>
  <text x="60" y="600" font-size="11" fill="#616161">toil 审计表（按月折算 × 自动化难度排序）是自动化立项陈述的第一页——数字让「就几分钟」无法被打发</text>

  <!-- 尾注 -->
  <text x="40" y="650" font-size="11" fill="#616161">第②级的幂等与第①级的流程化是前提——自动化一段混乱的流程，得到的是快速混乱</text>
  <text x="40" y="674" font-size="11" fill="#616161">toil 配额先于自动化：超出配额的琐事优先治理，而不是优先写脚本</text>

  <!-- 图例 -->
  <rect x="40" y="694" width="1120" height="46" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="710" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="722" font-size="11" fill="#37474f">一二级（基础）</text>
  <rect x="260" y="710" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="292" y="722" font-size="11" fill="#37474f">三级平台化（目标）</text>
  <rect x="480" y="710" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="512" y="722" font-size="11" fill="#37474f">反例（跳级）</text>
  <rect x="650" y="710" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="682" y="722" font-size="11" fill="#37474f">安全带 / 规范</text>
  <rect x="840" y="710" width="22" height="14" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="872" y="722" font-size="11" fill="#37474f">算术 / 立项依据</text>
</svg>
