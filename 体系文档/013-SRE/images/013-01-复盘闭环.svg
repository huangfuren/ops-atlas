<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 746" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>复盘闭环：从故障到「同类不再复发」</title>
  <desc>闭环从故障发生开始：四十八小时内完成七部分复盘，挖出可多个的机制根因；每条根因对应带认领人、死线、验证方式的行动项；行动项两类去向，技术修复回各板块落地，流程修复改检查单与发布策略（CICD 131）；完成率不低于八成才算健康，游戏日验证预案，下次同类故障被机制拦住。数据来源：013-故障复盘与改进册正文。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="axGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="axOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="746" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">复盘闭环：从故障到「同类不再复发」</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">blameless 是前提</text>

  <!-- 主链：故障 → 复盘 → 根因 -->
  <rect x="40" y="80" width="250" height="96" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="165" y="112" font-size="14" font-weight="bold" fill="#7f0000" text-anchor="middle">故障发生</text>
  <text x="165" y="140" font-size="11" fill="#7f0000" text-anchor="middle">影响面超阈值 / 反复发生</text>
  <text x="165" y="162" font-size="10" fill="#c62828" text-anchor="middle">小问题也值得轻量复盘</text>

  <line x1="290" y1="128" x2="356" y2="128" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <text x="323" y="118" font-size="9.5" fill="#607d8b" text-anchor="middle">48h 内</text>

  <rect x="360" y="80" width="330" height="96" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="525" y="108" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">七部分复盘</text>
  <text x="525" y="136" font-size="11" fill="#0d2f5c" text-anchor="middle">概要 · 影响 · 时间线 · 根因 ·</text>
  <text x="525" y="156" font-size="11" fill="#0d2f5c" text-anchor="middle">触发 · 响应评价 · 行动项</text>
  <text x="525" y="172" font-size="9.5" fill="#1565c0" text-anchor="middle">复盘文档全员可读（跨团队借鉴）</text>

  <line x1="690" y1="128" x2="756" y2="128" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <rect x="760" y="80" width="400" height="96" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="960" y="108" font-size="14" font-weight="bold" fill="#7f3f00" text-anchor="middle">根因：机制缺陷，可多个</text>
  <text x="960" y="136" font-size="11" fill="#7f3f00" text-anchor="middle">5-Why 每一问落到机制，不落到人</text>
  <text x="960" y="158" font-size="11" fill="#e65100" text-anchor="middle">停在「配置错了」= 没挖完</text>

  <!-- 根因 → 行动项 -->
  <line x1="960" y1="176" x2="960" y2="232" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <!-- 行动项 -->
  <rect x="760" y="236" width="400" height="120" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="960" y="268" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">行动项（三属性，缺一不算）</text>
  <text x="960" y="296" font-size="12" fill="#0d2f5c" text-anchor="middle">认领人到个人 · 死线 2~4 周</text>
  <text x="960" y="322" font-size="12" fill="#0d2f5c" text-anchor="middle">可验证的完成标志</text>
  <text x="960" y="346" font-size="10" fill="#1565c0" text-anchor="middle">「加强培训」不可验证 = 无效行动项</text>

  <!-- 两类去向 -->
  <line x1="760" y1="280" x2="500" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>
  <line x1="760" y1="310" x2="500" y2="392" stroke="#1565c0" stroke-width="2" marker-end="url(#axBlue)"/>

  <rect x="220" y="272" width="280" height="88" rx="6" fill="#fafafa" stroke="#607d8b" stroke-width="1.5"/>
  <text x="360" y="302" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">技术修复</text>
  <text x="360" y="330" font-size="11" fill="#616161" text-anchor="middle">加监控 / 补 runbook / 改架构</text>
  <text x="360" y="350" font-size="10" fill="#757575" text-anchor="middle">回各板块落地（监控 114 等）</text>

  <rect x="220" y="380" width="280" height="88" rx="6" fill="#fafafa" stroke="#607d8b" stroke-width="1.5"/>
  <text x="360" y="410" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">流程修复</text>
  <text x="360" y="438" font-size="11" fill="#616161" text-anchor="middle">检查单 / 发布策略 / 决策矩阵</text>
  <text x="360" y="458" font-size="10" fill="#757575" text-anchor="middle">回「CICD」131 §7.9 落地</text>

  <!-- 验证与闭环 -->
  <line x1="360" y1="468" x2="360" y2="524" stroke="#388e3c" stroke-width="2" marker-end="url(#axGreen)"/>
  <line x1="960" y1="356" x2="960" y2="524" stroke="#388e3c" stroke-width="2" marker-end="url(#axGreen)"/>
  <text x="972" y="450" font-size="9.5" fill="#607d8b">动作完成，进验证</text>

  <rect x="40" y="528" width="550" height="84" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="315" y="558" font-size="13" font-weight="bold" fill="#123314" text-anchor="middle">完成率 ≥ 80%：SRE 健康度指标（014 §4.5）</text>
  <text x="315" y="584" font-size="11" fill="#123314" text-anchor="middle">低于 60% = 复盘流于形式</text>
  <text x="315" y="604" font-size="10" fill="#388e3c" text-anchor="middle">行动项与 backlog 同权管理，不进「另册」</text>

  <rect x="610" y="528" width="550" height="84" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="885" y="558" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">游戏日验证：主动注入同类故障（013 §3.5）</text>
  <text x="885" y="584" font-size="11" fill="#7f3f00" text-anchor="middle">看机制是否真拦住了——验证过才算闭环</text>
  <text x="885" y="604" font-size="10" fill="#e65100" text-anchor="middle">目标明确 · 影响可控 · 观察者就位 · 复盘照常</text>

  <!-- 尾注 -->
  <text x="40" y="644" font-size="11" fill="#616161">检验标准：当值者能完整说出「我当时做了这个决定，基于当时我知道的信息」而不设防——做不到，先修文化再谈方法（013 §3.1）</text>
  <text x="40" y="668" font-size="11" fill="#616161">复盘会角色：主持人（非当事人）· 当事人（完整陈述）· 记录者；会上出行动项草稿，书面稿会后补全归档</text>

  <!-- 图例 -->
  <rect x="40" y="688" width="1120" height="46" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="704" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="92" y="716" font-size="11" fill="#37474f">故障（输入）</text>
  <rect x="240" y="704" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="272" y="716" font-size="11" fill="#37474f">复盘与行动项</text>
  <rect x="440" y="704" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="472" y="716" font-size="11" fill="#37474f">根因 / 游戏日验证</text>
  <rect x="670" y="704" width="22" height="14" rx="3" fill="#fafafa" stroke="#607d8b" stroke-width="1"/>
  <text x="702" y="716" font-size="11" fill="#37474f">修复去向（技术 / 流程）</text>
  <rect x="920" y="704" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="952" y="716" font-size="11" fill="#37474f">闭环健康度</text>
</svg>
