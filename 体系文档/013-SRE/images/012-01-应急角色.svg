<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>应急响应的角色与升级链：IC 指挥不亲手修</title>
  <desc>上区三个应急角色：IC 负责决策与分派但绝不亲手修；CL 定期向内外播报，无进展也播；领域专家接到明确任务动手并汇报。中区升级链四级：on-call 十五分钟无进展升级二级加领域专家，三十分钟无进展或影响扩大升级工程负责人接管指挥，重大业务影响升级管理层提供资源支持。下区决策权预先约定与运行度量。数据来源：012-待命与应急响应册正文。</desc>

  <defs>
    <marker id="axBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
    </marker>
    <marker id="axRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">应急角色与升级链：大故障的分水岭</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">IC 不亲手修</text>

  <!-- 三角色 -->
  <text x="40" y="86" font-size="14" font-weight="bold" fill="#263238">三个角色（可兼任，但 IC 与动手者必须分开）</text>

  <rect x="40" y="104" width="360" height="150" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="220" y="136" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">IC · 应急指挥</text>
  <text x="220" y="164" font-size="12" fill="#0d2f5c" text-anchor="middle">决策优先级 · 分派任务</text>
  <text x="220" y="188" font-size="12" fill="#0d2f5c" text-anchor="middle">宣布状态（排查 / 定位 / 恢复）</text>
  <text x="220" y="218" font-size="12.5" font-weight="bold" fill="#c62828" text-anchor="middle">铁律：不亲手修</text>
  <text x="220" y="240" font-size="10" fill="#1565c0" text-anchor="middle">IC 动手 = 没人看全局</text>

  <rect x="420" y="104" width="360" height="150" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="136" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">CL · 沟通负责</text>
  <text x="600" y="164" font-size="12" fill="#0d2f5c" text-anchor="middle">对内：定期播报进展</text>
  <text x="600" y="188" font-size="12" fill="#0d2f5c" text-anchor="middle">对外：按影响面公告</text>
  <text x="600" y="218" font-size="11" fill="#1565c0" text-anchor="middle">无进展也播：「仍在排查」</text>
  <text x="600" y="240" font-size="10" fill="#1565c0" text-anchor="middle">沉默比坏消息更伤信任</text>

  <rect x="800" y="104" width="360" height="150" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="980" y="136" font-size="14" font-weight="bold" fill="#0d2f5c" text-anchor="middle">COM · 领域专家</text>
  <text x="980" y="164" font-size="12" fill="#0d2f5c" text-anchor="middle">接到明确任务动手</text>
  <text x="980" y="188" font-size="12" fill="#0d2f5c" text-anchor="middle">完成后向 IC 汇报</text>
  <text x="980" y="218" font-size="11" fill="#1565c0" text-anchor="middle">DB / 网络 / 某服务……</text>
  <text x="980" y="240" font-size="10" fill="#1565c0" text-anchor="middle">不抢指挥，不各自为战</text>

  <!-- 升级链 -->
  <text x="40" y="296" font-size="14" font-weight="bold" fill="#263238">升级链：每一级有截止时间</text>

  <rect x="40" y="314" width="240" height="88" rx="6" fill="#fafafa" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="160" y="346" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">① on-call primary</text>
  <text x="160" y="372" font-size="11" fill="#616161" text-anchor="middle">确认 · 初步处置</text>
  <text x="160" y="392" font-size="10" fill="#757575" text-anchor="middle">默认担任临时 IC</text>

  <line x1="280" y1="358" x2="356" y2="358" stroke="#c62828" stroke-width="2" marker-end="url(#axRed)"/>
  <text x="318" y="348" font-size="9.5" fill="#c62828" text-anchor="middle">15min</text>

  <rect x="360" y="314" width="240" height="88" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="480" y="346" font-size="13" font-weight="bold" fill="#0d2f5c" text-anchor="middle">② secondary + 专家</text>
  <text x="480" y="372" font-size="11" fill="#0d2f5c" text-anchor="middle">加人 · 分头取证</text>
  <text x="480" y="392" font-size="10" fill="#1565c0" text-anchor="middle">COM 就位，分领域并行</text>

  <line x1="600" y1="358" x2="676" y2="358" stroke="#c62828" stroke-width="2" marker-end="url(#axRed)"/>
  <text x="638" y="348" font-size="9.5" fill="#c62828" text-anchor="middle">30min</text>

  <rect x="680" y="314" width="240" height="88" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="800" y="346" font-size="13" font-weight="bold" fill="#7f3f00" text-anchor="middle">③ 工程负责人</text>
  <text x="800" y="372" font-size="11" fill="#7f3f00" text-anchor="middle">接管正式 IC 指挥</text>
  <text x="800" y="392" font-size="10" fill="#e65100" text-anchor="middle">无进展或影响扩大即升级</text>

  <line x1="920" y1="358" x2="996" y2="358" stroke="#c62828" stroke-width="2" marker-end="url(#axRed)"/>
  <text x="958" y="348" font-size="9.5" fill="#c62828" text-anchor="middle">重大</text>

  <rect x="1000" y="314" width="160" height="88" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="1080" y="346" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">④ 管理层</text>
  <text x="1080" y="372" font-size="11" fill="#7f0000" text-anchor="middle">资源 · 对外公告</text>
  <text x="1080" y="392" font-size="10" fill="#c62828" text-anchor="middle">角色是支持不是指挥</text>

  <!-- 决策权纪律 -->
  <rect x="40" y="432" width="1120" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="60" y="460" font-size="12" font-weight="bold" fill="#7f3f00">决策权预先约定：回滚底线、停不停服务——写进发布检查单与决策矩阵（「CICD」131 §7.9），故障现场不辩论权力</text>
  <text x="60" y="486" font-size="11" fill="#7f3f00">管理层进故障群是资源支持，不是指挥——指挥权始终在 IC 手里（013 复盘时检验这条是否成立）</text>

  <!-- 尾注 -->
  <text x="40" y="540" font-size="11" fill="#616161">runbook 生命周期：告警创建时同步写（告警消息里放链接），复盘的新处置动作回写，告警删除时同删——过时的 runbook 比没有更危险</text>
  <text x="40" y="564" font-size="11" fill="#616161">度量：MTTA（确认时长）与 MTTR（恢复时长，R 的口径团队约定）按月看趋势——恶化时拆解：发现慢 / 决策慢 / 修复慢</text>
  <text x="40" y="588" font-size="11" fill="#616161">已建立的 TCP 连接类细节与 VIP 漂移类故障见「接入层」122；告警技术配置见「监控」114；runbook 素材在各板块排错册</text>

  <!-- 图例 -->
  <rect x="40" y="656" width="1120" height="48" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="672" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="684" font-size="11" fill="#37474f">应急角色 / 升级中段</text>
  <rect x="300" y="672" width="22" height="14" rx="3" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/>
  <text x="332" y="684" font-size="11" fill="#37474f">一级值守（起点）</text>
  <rect x="500" y="672" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="532" y="684" font-size="11" fill="#37474f">接管指挥</text>
  <rect x="660" y="672" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="692" y="684" font-size="11" fill="#37474f">重大升级 / 升级触发线</text>
  <rect x="920" y="672" width="22" height="14" rx="3" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <text x="952" y="684" font-size="11" fill="#37474f">纪律 / 通过条件</text>

  <!-- 底部留白检查线 -->
  <text x="40" y="732" font-size="11" fill="#757575">小故障（单人 10 分钟修复）不需要指挥体系——角色分工只在影响面大、跨团队、时间不可预测的大故障启用。</text>
  <text x="40" y="756" font-size="11" fill="#757575">IC 的产生：默认当值 on-call 担任，可按影响面升级到工程负责人。</text>
</svg>
