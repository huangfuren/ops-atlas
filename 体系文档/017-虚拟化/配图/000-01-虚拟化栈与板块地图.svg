<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 794.12" width="1200" height="794.12" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>虚拟化栈与板块两册地图</title>
  <desc>虚拟化栈四层：最底层物理硬件，其上是 hypervisor（左侧 ESXi 商业派，右侧 KVM/QEMU/libvirt 开源派），再上是虚拟机（内含客户 OS 与容器），最顶是运维管理层（vCenter 与 libvirt/virsh 两列对应）。下半是板块两册地图：001 VMware vSphere 运维与 002 KVM 运维，两册概念一一对应（vCenter 对 libvirt、vMotion 对 live migration、快照纪律相同）。底部提示容器跑在虚拟机里，两层防御。</desc>
  <g transform="scale(1.7647058824)">
  <rect width="680" height="450" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">虚拟化栈与两大流派地图</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">000 全貌 · 配图</text>

  <!-- 栈：四层 -->
  <rect x="20" y="50" width="430" height="60" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="34" y="72" font-size="8.6" font-weight="600" fill="#2B2A27">管理层</text>
  <text x="34" y="90" font-size="7.4" fill="#4A4945">vCenter（VMware）｜libvirt + virsh + virt-manager（KVM）——集群/模板/迁移的管家</text>

  <rect x="20" y="116" width="430" height="60" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="34" y="138" font-size="8.6" font-weight="600" fill="#1F4468">Hypervisor 层</text>
  <text x="34" y="156" font-size="7.4" fill="#4A4945">ESXi（商业裸金属）｜KVM 内核模块 + QEMU 设备模拟——类型 1 裸金属架构</text>

  <rect x="20" y="182" width="430" height="76" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="34" y="204" font-size="8.6" font-weight="600" fill="#7A4A12">虚拟机层 ★ 本板块</text>
  <text x="34" y="222" font-size="7.4" fill="#7A4A12">VM = 虚拟 CPU/内存/磁盘/网卡 + 客户 OS——与容器共享内核不同，VM 内核完整</text>
  <text x="34" y="240" font-size="7.4" fill="#7A4A12">guest OS 加固走「Linux」003；容器跑在 VM 里走「容器」板块</text>

  <rect x="20" y="264" width="430" height="46" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="34" y="284" font-size="8.6" font-weight="600" fill="#2B2A27">物理硬件层</text>
  <text x="34" y="300" font-size="7.4" fill="#4A4945">CPU/内存/存储（SAN/NVS）/网卡——NUMA 与 SR-IOV 影响性能</text>

  <!-- 两大流派对照 -->
  <rect x="470" y="50" width="190" height="260" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="565" y="72" font-size="8.6" font-weight="600" fill="#2B2A27" text-anchor="middle">两册两流派</text>
  <rect x="480" y="82" width="170" height="100" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="565" y="102" font-size="8.4" font-weight="600" fill="#1F4468" text-anchor="middle">001 VMware vSphere</text>
  <text x="565" y="118" font-size="7.2" fill="#4A4945" text-anchor="middle">企业存量王者</text>
  <text x="565" y="134" font-size="7.2" fill="#4A4945" text-anchor="middle">ESXi · vCenter · DRS/HA</text>
  <text x="565" y="150" font-size="7.2" fill="#4A4945" text-anchor="middle">VMDK · vMotion · vDS</text>
  <text x="565" y="166" font-size="7" fill="#8C8980" text-anchor="middle">商业全家桶，纪律为主</text>
  <rect x="480" y="192" width="170" height="100" rx="3" fill="#DFF3EC" stroke="#6BAF95" stroke-width="1.2"/>
  <text x="565" y="212" font-size="8.4" font-weight="600" fill="#1D5A45" text-anchor="middle">002 KVM</text>
  <text x="565" y="228" font-size="7.2" fill="#1D5A45" text-anchor="middle">开源与云的底座</text>
  <text x="565" y="244" font-size="7.2" fill="#1D5A45" text-anchor="middle">QEMU/libvirt · virsh</text>
  <text x="565" y="260" font-size="7.2" fill="#1D5A45" text-anchor="middle">qcow2 · 网桥 · 热迁移</text>
  <text x="565" y="276" font-size="7" fill="#8C8980" text-anchor="middle">公有云底层同源</text>

  <!-- 对照关系 -->
  <rect x="20" y="322" width="640" height="52" rx="3" fill="#FAF9F4" stroke="#E5E2D8" stroke-width="1"/>
  <text x="34" y="340" font-size="8" font-weight="600" fill="#2B2A27">概念一一对应（对照表在 00 术语表）</text>
  <text x="34" y="358" font-size="7.4" fill="#4A4945">vCenter ↔ libvirt ｜ vMotion ↔ live migration ｜ VMDK ↔ qcow2 ｜ vSwitch ↔ 网桥 ｜ DRS/HA ↔ 集群调度与故障转移——会一家，另一家按表迁移</text>

  <rect x="20" y="384" width="640" height="26" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="32" y="401" font-size="7.8" font-weight="600" fill="#7A4A12">★ 容器跑在虚拟机里是两层防御：hypervisor 隔离（本板块）+ namespace 隔离（容器板块）——排障先分层再定位</text>

  <text x="32" y="432" font-size="8.6" fill="#8C8980">分界：guest OS 内部 → Linux 001~009；云主机产品操作 → 云平台 002；容器与编排 → 容器板块。词汇查 00 术语表。</text>
  </g>
</svg>
