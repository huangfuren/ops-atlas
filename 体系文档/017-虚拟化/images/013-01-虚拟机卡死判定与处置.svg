<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title>虚拟机卡死判定与处置</title>
  <desc>左列判定五指标：CPU 打满、Guest Agent 失联、网络归零、磁盘 I/O 静默、数据盘写满；中间确认真卡死；右侧处置六步：优雅关机、僵死任务占锁、终止释放锁、强制下电、开机、三层复核；底部 RRD 走势还原因果链。数据来源：013-PVE运维册 §3.6，虚拟机卡死 API 处置全案教材化 2026-11-08。</desc>

  <defs>
    <marker id="axGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#263238">虚拟机卡死判定与处置</text>
  <text x="1160" y="48" font-size="11" fill="#757575" text-anchor="end">013 PVE 运维 §3.6 · API 优先</text>

  <!-- 左列：判定五指标 -->
  <text x="40" y="80" font-size="13" font-weight="bold" fill="#263238">判定五指标（对照日常基线）</text>

  <rect x="40" y="92" width="360" height="56" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="114" font-size="13" font-weight="bold" fill="#7f0000">CPU 打满</text>
  <text x="60" y="136" font-size="11.5" fill="#7f0000">8 vCPU 全占 vs 基线 0.27</text>

  <rect x="40" y="160" width="360" height="56" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="182" font-size="13" font-weight="bold" fill="#7f0000">Guest Agent 失联</text>
  <text x="60" y="204" font-size="11.5" fill="#7f0000"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">last_update</tspan> 冻结 = 失联</text>

  <rect x="40" y="228" width="360" height="56" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="250" font-size="13" font-weight="bold" fill="#7f0000">网络归零</text>
  <text x="60" y="272" font-size="11.5" fill="#7f0000"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">netin / netout</tspan> 掉到 0</text>

  <rect x="40" y="296" width="360" height="56" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="318" font-size="13" font-weight="bold" fill="#7f0000">磁盘 I/O 静默</text>
  <text x="60" y="340" font-size="11.5" fill="#7f0000">读风暴之后骤然安静</text>

  <rect x="40" y="364" width="360" height="56" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="60" y="386" font-size="13" font-weight="bold" fill="#7f0000">数据盘写满（前兆）</text>
  <text x="60" y="408" font-size="11.5" fill="#7f0000">100% 使用率——事后复盘的起点</text>

  <text x="40" y="446" font-size="11" fill="#616161">多条命中即按卡死处置，别等全部命中</text>

  <!-- 汇聚箭头 -->
  <line x1="400" y1="120" x2="416" y2="230" stroke="#607d8b" stroke-width="1.5"/>
  <line x1="400" y1="188" x2="416" y2="244" stroke="#607d8b" stroke-width="1.5"/>
  <line x1="400" y1="256" x2="416" y2="262" stroke="#607d8b" stroke-width="1.5"/>
  <line x1="400" y1="324" x2="416" y2="278" stroke="#607d8b" stroke-width="1.5"/>
  <line x1="400" y1="392" x2="416" y2="294" stroke="#607d8b" stroke-width="1.5"/>

  <!-- 判定胶囊 -->
  <rect x="420" y="232" width="128" height="60" rx="30" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="484" y="257" font-size="13" font-weight="bold" fill="#7f0000" text-anchor="middle">确认真卡死</text>
  <text x="484" y="277" font-size="11" fill="#7f0000" text-anchor="middle">判定先于操作</text>

  <line x1="548" y1="262" x2="566" y2="262" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <!-- 右列：处置六步 -->
  <text x="580" y="80" font-size="13" font-weight="bold" fill="#263238">处置顺序——强制下电先说后果，再动手</text>

  <rect x="580" y="92" width="580" height="50" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="114" font-size="13" font-weight="bold" fill="#0d2f5c">① 优雅关机 shutdown</text>
  <text x="600" y="134" font-size="11.5" fill="#0d2f5c">ACPI + Guest Agent——失联则无响应，进入 ②</text>

  <line x1="870" y1="142" x2="870" y2="152" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <rect x="580" y="156" width="580" height="50" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="600" y="178" font-size="13" font-weight="bold" fill="#7f0000">② 僵死任务占锁</text>
  <text x="600" y="198" font-size="11.5" fill="#7f0000">后续 stop 全部 lock 冲突失败——这是卡死处置的真正关卡</text>

  <line x1="870" y1="206" x2="870" y2="216" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <rect x="580" y="220" width="580" height="50" rx="6" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="600" y="242" font-size="13" font-weight="bold" fill="#311b92">③ 终止僵死任务释放锁</text>
  <text x="600" y="262" font-size="11.5" fill="#311b92">重试无用，先解锁再动</text>

  <line x1="870" y1="270" x2="870" y2="280" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <rect x="580" y="284" width="580" height="50" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="600" y="306" font-size="13" font-weight="bold" fill="#7f0000">④ stop 强制下电（最高危）</text>
  <text x="600" y="326" font-size="11.5" fill="#7f0000">未落盘数据丢失 · 下次开机 fsck · 业务负载被驱逐</text>

  <line x1="870" y1="334" x2="870" y2="344" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <rect x="580" y="348" width="580" height="50" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="370" font-size="13" font-weight="bold" fill="#0d2f5c">⑤ start 开机</text>
  <text x="600" y="390" font-size="11.5" fill="#0d2f5c"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10.5">exitstatus</tspan> OK 后进入复核</text>

  <line x1="870" y1="398" x2="870" y2="408" stroke="#607d8b" stroke-width="2" marker-end="url(#axGray)"/>

  <rect x="580" y="412" width="580" height="50" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="600" y="434" font-size="13" font-weight="bold" fill="#123314">⑥ 三层复核</text>
  <text x="600" y="454" font-size="11.5" fill="#123314">Agent 心跳恢复 → CPU 回基线 → 业务 Ready——三层齐了才算处置完</text>

  <!-- RRD 结论块 -->
  <rect x="40" y="490" width="1120" height="64" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="64" y="516" font-size="13" font-weight="bold" fill="#bf360c">复盘：24h RRD 走势还原因果链——读风暴 → 缓存挤掉 → CPU 拉升 → 网络归零</text>
  <text x="64" y="540" font-size="12" fill="#5d4037">VNC 控制台登录记录 = 人为操作线索；数据盘写满是起点，容量告警要前置（013 §6）</text>

  <!-- 尾注 -->
  <text x="40" y="578" font-size="11" fill="#616161">PVE 排障 API 优先（013 §3）：批量查询与脚本化处置比 Web 控制台可靠；找宿主机用 IP→VM 映射（013 §4）</text>
  <text x="40" y="600" font-size="11" fill="#616161">来源：虚拟机卡死 API 处置全案教材化 · 2026-11-08 · IP / 主机名均为文档段泛型</text>

  <!-- 图例 -->
  <rect x="40" y="616" width="1120" height="44" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1"/>
  <rect x="60" y="630" width="22" height="14" rx="3" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="92" y="642" font-size="11" fill="#37474f">常规步骤</text>
  <rect x="220" y="630" width="22" height="14" rx="3" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="252" y="642" font-size="11" fill="#37474f">异常 / 高危操作 / 判定指标</text>
  <rect x="500" y="630" width="22" height="14" rx="3" fill="#d1c4e9" stroke="#5e35b1" stroke-width="1"/>
  <text x="532" y="642" font-size="11" fill="#37474f">解锁（中介步骤）</text>
  <rect x="700" y="630" width="22" height="14" rx="3" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="732" y="642" font-size="11" fill="#37474f">复核完成</text>
  <rect x="840" y="630" width="22" height="14" rx="3" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="872" y="642" font-size="11" fill="#37474f">结论块</text>
</svg>
