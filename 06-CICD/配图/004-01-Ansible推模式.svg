<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>Ansible 推模式：控制节点 SSH 推送模块，被管端无 agent</title>
  <desc>控制节点上只有 playbook 和 inventory，执行时通过 SSH 把模块代码推到每台被管节点，用 Python 跑完收回结果，不留任何常驻进程。被管节点只要求 SSH 和 Python。推模式带来单一出处：谁在什么时候改了什么，答案永远在控制节点的执行记录里；代价是几千台规模时全量推送耗时。</desc>

  <rect width="680" height="350" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">Ansible 推模式：无 agent，SSH 直连</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">变更记录只有一个出处</text>

  <defs>
    <marker id="e4Blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="e4Gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A9A69C"/>
    </marker>
  </defs>

  <!-- 控制节点 -->
  <rect x="40" y="70" width="220" height="110" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.4"/>
  <text x="150" y="94" font-size="9.5" font-weight="600" fill="#1F4468" text-anchor="middle">控制节点（装 Ansible）</text>
  <text x="150" y="114" font-size="7.6" fill="#1F4468" text-anchor="middle">playbook · inventory · roles</text>
  <text x="150" y="132" font-size="7.6" fill="#1F4468" text-anchor="middle">--check --diff 演练 · serial 分批</text>
  <text x="150" y="152" font-size="7.4" fill="#8C8980" text-anchor="middle">变更的发起方与记录方</text>

  <!-- 推送箭头 -->
  <line x1="264" y1="100" x2="360" y2="100" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#e4Blue)"/>
  <text x="312" y="90" font-size="7.4" fill="#1F4468" text-anchor="middle">SSH 推送模块</text>
  <line x1="360" y1="120" x2="264" y2="120" stroke="#A9A69C" stroke-width="1" marker-end="url(#e4Gray)"/>
  <text x="312" y="134" font-size="7.4" fill="#8C8980" text-anchor="middle">收回结果 ok/changed</text>

  <!-- 被管节点 -->
  <rect x="364" y="70" width="280" height="110" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="504" y="92" font-size="9.5" font-weight="600" fill="#4A4945" text-anchor="middle">被管节点 × N</text>
  <text x="504" y="112" font-size="7.6" fill="#4A4945" text-anchor="middle">要求：SSH 可达 + Python 3</text>
  <text x="504" y="130" font-size="7.6" fill="#1D5A45" text-anchor="middle">没有 agent · 不开额外端口 · 无常驻进程</text>
  <text x="504" y="150" font-size="7.4" fill="#8C8980" text-anchor="middle">模块代码推过来 → 执行 → 即焚</text>

  <!-- 对比注记 -->
  <rect x="40" y="196" width="604" height="56" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1"/>
  <text x="52" y="216" font-size="8.4" font-weight="600" fill="#4A4945">推模式的两个直接推论（004 §4.1）</text>
  <text x="52" y="234" font-size="7.8" fill="#4A4945">① 上手快：有 SSH 就有 Ansible，不存在"先铺 agent"的工程　② 攻击面小：被管端不开新端口</text>
  <text x="52" y="248" font-size="7.8" fill="#8C8980">代价：大规模全量推送耗时、实时性不如 agent 型——配置变更本就不要求毫秒级实时</text>

  <rect x="40" y="264" width="604" height="30" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="283" font-size="8.2" fill="#7A4A12">提权用 become（sudo 白名单），最小权限——提权失败发生在中途，重跑即可收敛（幂等），但先在一台机器全流程跑通</text>

  <text x="32" y="330" font-size="9" fill="#8C8980">执行输出两种颜色就是全部语义：ok = 已是目标状态没动，changed = 这次真改了——"机器不一致"从翻配置变成看颜色（004 §4.5）。</text>
</svg>
