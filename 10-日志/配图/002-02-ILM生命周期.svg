<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>ILM 索引生命周期：hot 滚动、warm 降盘、delete 到期清理</title>
  <desc>索引从创建进入 hot 阶段：接收写入与高频查询，满一天或单分片三十吉字节就 rollover 出新索引；七天后进入 warm 阶段，挪到慢盘、缩副本；三十天后进入 delete 阶段由 ILM 自动删除。保留期的天数是业务方签过字的数字，卡住的阶段用 ILM explain 排查。</desc>

  <rect width="680" height="300" fill="#FFFFFF"/>
  <text x="32" y="30" font-size="13.5" font-weight="600" fill="#2B2A27">ILM：索引的一生自动流转</text>
  <text x="648" y="30" font-size="9" fill="#8C8980" text-anchor="end">保留期 = 业务签字的数</text>

  <defs>
    <marker id="g2bBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7FA6D0"/>
    </marker>
    <marker id="g2bRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#D2948C"/>
    </marker>
  </defs>

  <!-- hot -->
  <rect x="40" y="56" width="150" height="88" rx="3" fill="#FAE6E4" stroke="#D2948C" stroke-width="1.2"/>
  <text x="115" y="78" font-size="9" font-weight="600" fill="#7A322B" text-anchor="middle">hot（热）</text>
  <text x="115" y="96" font-size="7.4" fill="#7A322B" text-anchor="middle">接收写入 + 高频查询</text>
  <text x="115" y="112" font-size="7.4" fill="#7A322B" text-anchor="middle">快盘 · 副本齐全</text>
  <text x="115" y="132" font-size="7" fill="#8C8980" text-anchor="middle">rollover：满 1 天或单分片 30GB</text>

  <!-- warm -->
  <rect x="220" y="56" width="150" height="88" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1.2"/>
  <text x="295" y="78" font-size="9" font-weight="600" fill="#7A4A12" text-anchor="middle">warm（温）</text>
  <text x="295" y="96" font-size="7.4" fill="#7A4A12" text-anchor="middle">只读 · 挪慢盘</text>
  <text x="295" y="112" font-size="7.4" fill="#7A4A12" text-anchor="middle">可缩副本（有 HA 意识）</text>
  <text x="295" y="132" font-size="7" fill="#8C8980" text-anchor="middle">min_age: 7d</text>

  <!-- cold -->
  <rect x="400" y="56" width="120" height="88" rx="3" fill="#E4EEF9" stroke="#7FA6D0" stroke-width="1.2"/>
  <text x="460" y="78" font-size="9" font-weight="600" fill="#1F4468" text-anchor="middle">cold（冷）</text>
  <text x="460" y="96" font-size="7.4" fill="#4A4945" text-anchor="middle">偶查 · 可冻结</text>
  <text x="460" y="112" font-size="7.4" fill="#4A4945" text-anchor="middle"> searchable snapshot</text>
  <text x="460" y="132" font-size="7" fill="#8C8980" text-anchor="middle">min_age: 30d（可选阶段）</text>

  <!-- delete -->
  <rect x="550" y="56" width="94" height="88" rx="3" fill="#F4F2EC" stroke="#CFCCC2" stroke-width="1.2"/>
  <text x="597" y="78" font-size="9" font-weight="600" fill="#4A4945" text-anchor="middle">delete</text>
  <text x="597" y="96" font-size="7.4" fill="#4A4945" text-anchor="middle">自动删除</text>
  <text x="597" y="112" font-size="7.4" fill="#4A4945" text-anchor="middle">空间释放</text>
  <text x="597" y="132" font-size="7" fill="#8C8980" text-anchor="middle">min_age: 30d</text>

  <line x1="190" y1="100" x2="216" y2="100" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#g2bBlue)"/>
  <line x1="370" y1="100" x2="396" y2="100" stroke="#7FA6D0" stroke-width="1.2" marker-end="url(#g2bBlue)"/>
  <line x1="520" y1="100" x2="546" y2="100" stroke="#D2948C" stroke-width="1.2" marker-end="url(#g2bRed)"/>
  <text x="203" y="92" font-size="6.8" fill="#8C8980" text-anchor="middle">age</text>
  <text x="383" y="92" font-size="6.8" fill="#8C8980" text-anchor="middle">age</text>
  <text x="533" y="92" font-size="6.8" fill="#8C8980" text-anchor="middle">到期</text>

  <!-- 底部要点 -->
  <rect x="40" y="160" width="604" height="44" rx="3" fill="#FBEEDA" stroke="#D9A458" stroke-width="1"/>
  <text x="52" y="180" font-size="8.4" font-weight="600" fill="#7A4A12">运维三件事：模板先建（mapping 不踩坑）→ 策略挂上每个模板 → 定期 GET logs-*/_ilm/explain 看卡住的阶段</text>
  <text x="52" y="196" font-size="7.8" fill="#7A4A12">数字（1d/30GB/30d）是示例——保留期必须业务方签字，滚动粒度决定分片总量（002 §2.9 第 4 坑）</text>

  <text x="32" y="240" font-size="9" fill="#8C8980">成本杠杆按级递增：关 DEBUG（005）→ 缩保留期 → warm 挪慢盘 → 冷数据出集群进对象存储——扩容永远最后（000 §0.6）。</text>
  <text x="32" y="264" font-size="9" fill="#8C8980">磁盘 95% 只读锁的根因治理也落在这里：临时解锁（002 §2.7）之后，把 ILM 的 delete 阶段收紧才是根治。</text>
  <text x="32" y="288" font-size="9" fill="#8C8980">Loki 对照：等价机制是 compactor 的 retention（004 §4.7）——两条路线都要有「到期自动清」的执行器。</text>
</svg>
